# appId stays com.mantu.asktoto through the Métis rebrand ON PURPOSE: macOS TCC grants (mic/screen)
# and updater identity are keyed to it — changing it would reset permissions and orphan existing
# installs. Everything user-visible says Métis; this internal id is never shown.
appId: com.mantu.asktoto
productName: Métis
# Strip OneDrive/Finder xattrs from the packed app before signing — codesign hard-rejects them
# ("resource fork … detritus not allowed"); this repo lives in CloudStorage so they're everywhere.
afterPack: scripts/after-pack.mjs
copyright: © 2026 Mantu · Métis — built by Tony Walteur
# App icon: build/icon.png (1024² Métis goddess mark) → electron-builder derives mac .icns + win .ico automatically.
# Code signing is env-driven (see SIGNING.md):
#   mac/win:  CSC_LINK (path/base64 of the .p12) + CSC_KEY_PASSWORD
#   notarize: APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
# NOTE (local dev builds only): do NOT add `mac.identity` or override `directories.output` here.
#   - identity: this yml is shared with CI (build.yml/release.yml), which has no signing cert —
#     pinning an identity name that doesn't exist in CI's keychain would hard-fail electron-builder there.
#   - directories.output: CI's build.yml uploads artifacts from `release/*` (see .github/workflows/build.yml);
#     changing the default here would silently break that upload step on every PR.
#   Local rebuilds that need keychain-safe signing + an OneDrive-free output dir should use
#   `npm run dist:local`, which passes both as one-off `-c` CLI overrides instead (see package.json).
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!out/**/*.map'
  - '!**/*.d.ts'
  # IMPORTANT — the `out/**/*` line above is what restricts app.asar to the built app: without a
  # POSITIVE (allowlist) pattern here, electron-builder walks the whole project root and packs
  # release/, resources/, src/, etc. into the archive (13+ GB). Any platform-specific `files:` block
  # (mac/win, below) MUST repeat `out/**/*` + `package.json`, because platform patterns feed a separate
  # matcher — a platform list of only `!` excludes reverts that matcher to `**/*` and re-bloats the asar.
  # node-llama JavaScript stays in ASAR. Never ship source/local builds or CUDA/wrong-architecture packages.
  - '!node_modules/@node-llama-cpp/*-cuda/**'
  - '!node_modules/@node-llama-cpp/*-cuda-ext/**'
  - '!node_modules/@node-llama-cpp/linux-*/**'
  - '!node_modules/@node-llama-cpp/mac-x64/**'
  - '!node_modules/@node-llama-cpp/win-arm64/**'
  - '!node_modules/node-llama-cpp/llama/localBuilds/**'
  # Prebuilt-only runtime: remove compiler inputs while retaining the runtime release metadata,
  # package metadata, and grammars that node-llama reads from the installed module.
  - '!node_modules/node-llama-cpp/llama/addon/**'
  - '!node_modules/node-llama-cpp/llama/cmake/**'
  - '!node_modules/node-llama-cpp/llama/gpuInfo/**'
  - '!node_modules/node-llama-cpp/llama/patches/**'
  - '!node_modules/node-llama-cpp/llama/profiles/**'
  - '!node_modules/node-llama-cpp/llama/toolchains/**'
  - '!node_modules/node-llama-cpp/llama/xpack/**'
  - '!node_modules/node-llama-cpp/llama/gitRelease.bundle'
  - '!node_modules/node-llama-cpp/llama/CMakeLists.txt'
  - '!node_modules/node-llama-cpp/llama/.clang-format'
asar:
  # Disable package-level preferUnplugged expansion; explicit rules below are the complete native boundary.
  smartUnpack: false
# Native addons (.node) must live outside the asar to be loadable at runtime. sherpa-onnx-node (Parakeet
# engine) + its per-platform binary packages are unpacked here so they ship + load in the installed app.
asarUnpack:
  - '**/node_modules/sherpa-onnx-node/**'
  - '**/node_modules/sherpa-onnx-*/**'
  # Keep worker/core ESM in app.asar. node-llama resolves only these reviewed native bins via .unpacked.
  - '**/node_modules/@node-llama-cpp/mac-arm64-metal/bins/**'
  - '**/node_modules/@node-llama-cpp/win-x64/bins/**'
  - '**/node_modules/@node-llama-cpp/win-x64-vulkan/bins/**'
extraResources:
  # Mantu Intelligence dashboard — static build of the intelligence/ workspace, loaded in its own
  # window (src/main/intelligence.ts). Populated by `npm run build:intelligence` before packaging.
  - from: intelligence/dist
    to: intelligence
  - from: build/managed-config.example.json
    to: managed-config.example.json
  - from: build/managed-config.enterprise.example.json
    to: managed-config.enterprise.example.json
  - from: build/icon.png
    to: icon.png
  - from: resources/graphify_runner.py
    to: graphify_runner.py
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  # Selected-only local text + vision payload. Cache/candidates are never packaged.
  - from: resources/local-ai/payload
    to: local-ai
  # Bundled ASR model weights — served via asr-model:// protocol (zero runtime download).
  # Populated by `npm run fetch-models` before packaging.
  - from: resources/models
    to: models
    # The 1.5 GiB WebGPU Whisper tier is an opt-in development/benchmark asset. Parakeet is the
    # primary on-device engine and whisper-base remains bundled as an offline fallback; shipping both
    # models puts a release above the GitHub asset safety gate with no import-path benefit.
    filter:
      - '**/*'
      - '!onnx-community/whisper-large-v3-turbo/**'
  - from: resources/asr
    to: asr
  # Self-built LGPL FFmpeg sidecar used only for bounded-memory import decode. Target-specific binaries
  # live under their platform/arch subfolder; runtime never falls back to an arbitrary PATH executable.
  - from: resources/ffmpeg
    to: ffmpeg
  - from: resources/ort
    to: ort
mac:
  files:
    # Repeat the allowlist positives (see top-level files note): platform `files` feed a separate
    # matcher; a list of only `!` excludes would revert it to `**/*` and pack the whole repo into asar.
    - out/**/*
    - package.json
    - '!node_modules/sherpa-onnx-win-*/**'
    - '!node_modules/sherpa-onnx-linux-*/**'
    - '!node_modules/sherpa-onnx-darwin-x64/**'
  category: public.app-category.productivity
  # ASCII artifact names (see the win note below): the .app displays as Métis, the .dmg/.zip assets
  # and latest-mac.yml URLs stay accent-free.
  artifactName: Metis-${version}.${ext}
  target:
    - dmg
    - zip
  # Pinned llama.cpp `llama-server` sidecar that powers Métis Local (on-device suggest/summary/vision) —
  # mac binary only (win ships its own build below via win.extraResources), so a mac package never
  # carries the other platform's ~150 MB of dead-weight binaries. Populated by `npm run fetch:llama`
  # (scripts/fetch-llama-server.mjs) before packaging; local-runtime.ts resolves it at
  # process.resourcesPath/llama/mac in a packaged build. No separate mac signing entry is needed:
  # hardenedRuntime + entitlements below make electron-builder sign every executable/dylib it finds
  # inside the packed .app, including this one — the same mechanism that already covers the ffmpeg
  # sidecar above. electron-builder merges this list with the top-level extraResources.
  extraResources:
    - from: resources/llama/mac
      to: llama/mac
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  # osx-sign otherwise attempts to codesign model/font/archive data after classifying every file.
  # Keep Mach-O code (.node/.dylib/.so, helpers, frameworks, FFmpeg) outside this data-only list.
  signIgnore:
    - "\\.(?:asar|bin|dat|gguf|icns|jpeg|jpg|nib|onnx|pak|png|wasm|wav|woff2)$"
  extendInfo:
    # APFS stores the Métis executable/helper filenames in NFD. Electron compares helper paths
    # byte-for-byte before launching GPU/renderer processes, so the internal bundle name must use
    # that same normalization. CFBundleDisplayName stays NFC and user-visible as "Métis".
    CFBundleName: "Me\u0301tis"
    CFBundleDisplayName: "Métis"
    NSMicrophoneUsageDescription: Métis transcribes audio on-device to give you live AI suggestions.
    NSScreenCaptureUsageDescription: Métis captures system audio and your screen so the AI can help.
    LSUIElement: true
mas:
  # Mac App Store builds are opt-in: run `npm run release:mas`.
  # The default direct channel stays dmg/zip so enterprise customers keep the full feature set and
  # electron-updater. App Store builds are sandboxed and get updates through Apple.
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  extendInfo:
    NSMicrophoneUsageDescription: Métis transcribes audio on-device to give you live AI suggestions.
    NSScreenCaptureUsageDescription: Métis captures system audio and your screen so the AI can help.
    LSUIElement: true
masDev:
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
dmg:
  title: Métis ${version}
win:
  # Keep internal PE/installation paths ASCII-safe; productName and shortcuts remain user-visible Métis.
  executableName: Metis
  files:
    # Repeat the allowlist positives (see top-level files note) so the platform matcher stays an
    # allowlist and does not pack the whole repo into asar.
    - out/**/*
    - package.json
    - '!node_modules/sherpa-onnx-darwin-*/**'
    - '!node_modules/sherpa-onnx-linux-*/**'
    - '!node_modules/sherpa-onnx-win-ia32/**'
  icon: build/icon.png
  publisherName: Mantu
  target:
    - nsis      # → Metis-Setup-<version>.exe (installer)
    - portable  # → Metis-Portable-<version>.exe (no-install single exe)
  # Pinned llama.cpp `llama-server` sidecar (win build only — vulkan + cpu variants; see mac.extraResources
  # for why this is platform-scoped). Populated by `npm run fetch:llama` before packaging; local-runtime.ts
  # resolves it at process.resourcesPath/llama/win/<vulkan|cpu> in a packaged build. electron-builder merges
  # this list with the top-level extraResources.
  extraResources:
    - from: resources/llama/win
      to: llama/win
  # ASCII artifact/store ids on purpose: é in an .exe filename or AppX identity invites codepage,
  # globbing, and store-validation trouble. The installed app still displays as Métis (shortcutName).
  artifactName: Metis-Setup-${version}.${ext}
  # Must stay true: electron-updater checks the downloaded update's Authenticode signature before install.
  # Inert today (no real publish.url is configured), but false would let a compromised release pipeline
  # push an unsigned/mismatched .exe that installs with only a TLS+sha512 check. Flip only if you fully
  # understand the tradeoff — do not disable this to work around a signing setup problem.
  verifyUpdateCodeSignature: true
  # Authenticode signing: set WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD env (or use Azure Trusted Signing).
  # rfc3161TimeStampServer left at electron-builder default.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Métis
portable:
  # electron-updater has no portable-EXE support: this build never auto-updates (see docs/INSTALL.md).
  artifactName: Metis-Portable-${version}.${ext}
appx:
  artifactName: Metis-${version}.${ext}
  applicationId: Metis
  identityName: Mantu.Metis
  publisher: CN=Mantu
  publisherDisplayName: Mantu
  backgroundColor: transparent
# ─── Auto-update feed (electron-updater is wired in src/main/updater.ts) ───────────────────
# FLOW: push a v* tag → CI (release.yml) builds + publishes to the public AskToto-Releases repo →
# every installed app finds the new version on launch, downloads in the background, installs on quit.
# CODE SIGNING is required for the updater to trust artifacts (see SIGNING.md):
#   mac/win      → CSC_LINK (path or base64 of the .p12) + CSC_KEY_PASSWORD
#                  (win can instead use WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD / Azure Trusted Signing)
#   mac notarize → APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
# Unsigned macOS zip updates will be rejected by Gatekeeper on install.
publish:
  # Updates are served from the PUBLIC AskToto-Releases repo's GitHub Releases — the app *code* repo stays
  # private, only the built binaries + latest-mac.yml are published there. The installed app checks this repo
  # on launch, downloads the new version in the background, and installs it on quit (perfect zero-click UX).
  # To cut a release: create the public repo once (gh repo create mysticalsin/AskToto-Releases --public),
  # set GH_TOKEN (a PAT with `repo` scope), then run `npm run release`.
  # NOTE (Métis rebrand): the feed repo keeps its old name — every installed app polls THIS repo by name,
  # so renaming it would strand them. To migrate later: rename the GitHub repo (redirects cover the gap),
  # then update owner/repo here in the release AFTER the one that ships the rename.
  provider: github
  owner: mysticalsin
  repo: AskToto-Releases
  # Without this line electron-builder creates DRAFT releases — and electron-updater resolves versions
  # from the public releases feed, which never contains drafts: every install would poll forever and
  # find nothing. `release` publishes the moment CI finishes; the v* tag push is the human approval gate.
  releaseType: release
  # channel: latest        # (default) bump to `beta`/`alpha` for pre-release rings if you add them.
