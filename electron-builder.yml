appId: com.mantu.asktoto
productName: AskToto
copyright: © 2026 Mantu · AskToto — built by Tony Walteur
# App icon: build/icon.png (1024² Mantu M) → electron-builder derives mac .icns + win .ico automatically.
# Code signing is env-driven (see SIGNING.md):
#   mac/win:  CSC_LINK (path/base64 of the .p12) + CSC_KEY_PASSWORD
#   notarize: APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!out/**/*.map'
  - '!**/*.d.ts'
asar: true
extraResources:
  - from: build/managed-config.example.json
    to: managed-config.example.json
  - from: build/icon.png
    to: icon.png
  - from: resources/graphify_runner.py
    to: graphify_runner.py
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: AskToto transcribes audio on-device to give you live AI suggestions.
    NSScreenCaptureUsageDescription: AskToto captures system audio and your screen so the AI can help.
    NSAppleEventsUsageDescription: AskToto detects when a meeting starts (Zoom/Teams/Meet) to auto-start.
    LSUIElement: true
dmg:
  title: AskToto ${version}
win:
  icon: build/icon.png
  publisherName: Mantu
  target:
    - nsis      # → AskToto-Setup-<version>.exe (installer)
    - portable  # → AskToto-Portable-<version>.exe (no-install single exe)
  artifactName: AskToto-Setup-${version}.${ext}
  verifyUpdateCodeSignature: false
  # Authenticode signing: set WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD env (or use Azure Trusted Signing).
  # rfc3161TimeStampServer left at electron-builder default.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: AskToto
portable:
  artifactName: AskToto-Portable-${version}.${ext}
appx:
  artifactName: AskToto-${version}.${ext}
  applicationId: AskToto
  identityName: Mantu.AskToto
  publisher: CN=Mantu
  publisherDisplayName: Mantu
  backgroundColor: transparent
# ─── Auto-update feed (electron-updater is wired in src/main/updater.ts) ───────────────────
# PRODUCTION SETUP (do this before cutting a public release — `npm run check:release` enforces it):
#   1. Replace `url` below with the HTTPS host that will serve the updater manifests + artifacts:
#        mac  → latest-mac.yml  +  AskToto-${version}-mac.zip  +  AskToto-${version}.dmg
#        win  → latest.yml      +  AskToto-Setup-${version}.exe (nsis)
#      Any static HTTPS origin works: S3 + CloudFront, Azure Blob + CDN, GitHub Releases proxy, nginx.
#      MUST be HTTPS (electron-updater rejects plain http) and MUST keep the `REPLACE-WITH` token gone.
#   2. Publish: `npm run dist` (mac) / `dist:win` builds + uploads. Upload ALL artifacts AND the
#      generated *.yml manifests to the same `url` path so the client can resolve the next version.
#   3. CODE SIGNING is required for the updater to trust artifacts (see SIGNING.md + header above):
#        mac/win   → CSC_LINK (path or base64 of the .p12) + CSC_KEY_PASSWORD
#                    (win can instead use WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD / Azure Trusted Signing)
#        mac notarize → APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
#      Unsigned macOS zip updates will be rejected by Gatekeeper on install.
# Until `url` is set, updater.ts detects the `REPLACE-WITH` token in app-update.yml and skips auto-update.
publish:
  # Updates are served from the PUBLIC AskToto-Releases repo's GitHub Releases — the app *code* repo stays
  # private, only the built binaries + latest-mac.yml are published there. The installed app checks this repo
  # on launch, downloads the new version in the background, and installs it on quit (perfect zero-click UX).
  # To cut a release: create the public repo once (gh repo create mysticalsin/AskToto-Releases --public),
  # set GH_TOKEN (a PAT with `repo` scope), then run `npm run release`.
  provider: github
  owner: mysticalsin
  repo: AskToto-Releases
  # channel: latest        # (default) bump to `beta`/`alpha` for pre-release rings if you add them.
