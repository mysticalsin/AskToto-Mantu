# appId stays com.mantu.asktoto through the Métis rebrand ON PURPOSE: macOS TCC grants (mic/screen)
# and updater identity are keyed to it — changing it would reset permissions and orphan existing
# installs. Everything user-visible says Métis; this internal id is never shown.
appId: com.mantu.asktoto
# productName MUST stay ASCII "Metis". On macOS, electron-builder derives the child-process HELPER
# bundle names from it — "<productName> Helper (GPU/Renderer/Plugin).app". The é in "Métis Helper" is
# stored NFD-decomposed on disk while Chromium builds the helper path NFC-composed, so on the macOS 26+
# (Tahoe) betas the browser process cannot launch its own GPU/renderer helper and dies at startup with
# EXC_BREAKPOINT/SIGTRAP (~85-100% of launches; intermittent, packaged-only, no launch flag mitigates).
# The app still displays as "Métis" everywhere via mac.extendInfo.CFBundleDisplayName below — same
# pattern already used for the Windows shortcutName. Verified 2026-07-11: ASCII "Metis Helper" → 10/10
# clean launches on this machine; "Métis Helper" → 0/10. Do NOT revert this to "Métis".
productName: Metis
# Strip OneDrive/Finder xattrs from the packed app before signing — codesign hard-rejects them
# ("resource fork … detritus not allowed"); this repo lives in CloudStorage so they're everywhere.
afterPack: scripts/after-pack.mjs
copyright: © 2026 Mantu · Métis — built by Tony Walteur
# App icon: build/icon.png (1024² Métis goddess mark) → electron-builder derives mac .icns + win .ico automatically.
# Code signing is env-driven (see SIGNING.md):
#   mac/win:  CSC_LINK (path/base64 of the .p12) + CSC_KEY_PASSWORD
#   notarize: APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
# NOTE (local dev builds only): do NOT add `mac.identity` or override `directories.output` here.
#   - identity: this yml is shared with CI (build.yml/release.yml), which has no signing cert —
#     pinning an identity name that doesn't exist in CI's keychain would hard-fail electron-builder there.
#   - directories.output: CI's build.yml uploads artifacts from `release/*` (see .github/workflows/build.yml);
#     changing the default here would silently break that upload step on every PR.
#   Local rebuilds that need keychain-safe signing + an OneDrive-free output dir should use
#   `npm run dist:local`, which passes both as one-off `-c` CLI overrides instead (see package.json).
directories:
  output: release
  buildResources: build
# electron-builder 26 validates cached Electron archives through @electron/get. Pin the reviewed
# upstream checksums here so local/offline builds do not need to fetch SHASUMS256.txt before they
# can reuse the cache. A future Electron bump must update these pins deliberately.
electronDownload:
  force: false
  checksums:
    electron-v39.8.10-darwin-arm64.zip: f7e3ed2cc34dd2eba3f2a95234b576fe8082d35fb133e482102c08105f298572
    electron-v39.8.10-win32-x64.zip: 4478410a35a8399b7745085096695a37877f176755182a71e27eddc245cd98d5
files:
  - out/**/*
  - package.json
  # Dust 1.2.6 bundles an MCP server SDK that its compiled DustAPI client never imports. Exclude that
  # unused server-only tree so its stale transitive advisories are not present in either installer.
  - '!node_modules/@dust-tt/client/node_modules/@modelcontextprotocol/sdk{,/**/*}'
  - '!node_modules/@dust-tt/client/node_modules/express-rate-limit{,/**/*}'
  - '!node_modules/@dust-tt/client/node_modules/ip-address{,/**/*}'
  - '!out/**/*.map'
  # MQA-270 (B6): Vite emits a second copy of the 20.6 MB ORT wasm into out/renderer/assets, and it is
  # verifiably dead in production — whisper.worker.ts sets wasmPaths to 'asr-model://ort/' whenever the
  # bundled ASR is in use (always, in a packaged build), which serves the copy in resources/ort/ that
  # check-packaged-runtime pins. The dev branch uses the HF CDN. Neither path can reach this file, yet it
  # rode inside app.asar anyway. resources/ort/ is the live copy — never exclude that one.
  - '!out/renderer/assets/ort-wasm-*.wasm'
  - '!**/*.d.ts'
asar: true
# Native addons (.node) must live outside the asar to be loadable at runtime. sherpa-onnx-node (Parakeet
# engine) + its per-platform binary packages are unpacked here so they ship + load in the installed app.
# onnxruntime-node + sharp are @huggingface/transformers' own Node-backend native deps (main/whisper-import.ts,
# imported recordings' Whisper engine) — same requirement, same fix.
asarUnpack:
  - '**/node_modules/sherpa-onnx-node/**'
  - '**/node_modules/sherpa-onnx-*/**'
  - '**/node_modules/onnxruntime-node/**'
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
extraResources:
  # Mantu Intelligence dashboard — static build of the intelligence/ workspace, loaded in its own
  # window (src/main/intelligence.ts). Populated by `npm run build:intelligence` before packaging.
  - from: intelligence/dist
    to: intelligence
  - from: build/managed-config.example.json
    to: managed-config.example.json
  - from: build/managed-config.enterprise.example.json
    to: managed-config.enterprise.example.json
  - from: build/icon.png
    to: icon.png
  - from: resources/graphify_runner.py
    to: graphify_runner.py
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  # The Qwen WEIGHTS are deliberately NOT packaged. At ~728 MB they dominated the installer, and a
  # universal (Intel + Apple Silicon) package carrying them would exceed GitHub's 2 GB per-asset
  # release limit. src/main/llm/local-model-download.ts fetches them once on first run into userData,
  # from a pinned immutable upstream revision, and rejects anything whose size or sha256 does not match
  # the values in local-models.ts. The licence text still ships — it is an Apache-2.0 obligation that
  # does not depend on when the weights arrive.
  - from: resources/local-llm/LICENSE.QWEN3.5-APACHE-2.0.txt
    to: local-llm/LICENSE.QWEN3.5-APACHE-2.0.txt
  # Bundled ASR model weights — served via asr-model:// protocol (zero runtime download).
  # Populated by `npm run fetch-models` before packaging.
  - from: resources/models
    to: models
    # The 1.6 GiB WebGPU Whisper tier is excluded because it CANNOT ship: 1.6 GiB of weights on top of a
    # 0.77 GiB installer is 2.37 GiB, over GitHub's hard 2 GiB per-asset limit (check-release.mjs gates at
    # 1.9 GiB). Parakeet remains the primary on-device engine and whisper-base the bundled offline floor.
    #
    # This comment used to end "with no import-path benefit". That was false, and the falsehood is what
    # kept the consequence unexamined (MQA-246): whisper-asr-host.ts lists this exact model FIRST in
    # MODEL_TIERS, so excluding it means every IMPORT — on every platform, not just macOS — silently
    # decodes with the floor model. The degradation is now disclosed to the user rather than denied here,
    # but disclosure is not the fix. The fix is the same one MQA-146 applied to the LLM weights for the
    # same 2 GiB reason: fetch on first use, size- and SHA-256-pinned. Tracked as MQA-247.
    filter:
      - '**/*'
      - '!onnx-community/whisper-large-v3-turbo/**'
  - from: resources/asr
    to: asr
  # Self-built LGPL FFmpeg sidecar used only for bounded-memory import decode. Target-specific binaries
  # live under their platform/arch subfolder; runtime never falls back to an arbitrary PATH executable.
  - from: resources/ffmpeg
    to: ffmpeg
  - from: resources/ort
    to: ort
  - from: resources/runtime-assets-manifest.json
    to: runtime-assets-manifest.json
  # Locked conversation-mode skills + shared humanizer. Hashed in src/shared/mode-skills.lock.json.
  # Main verifies SHA-256 on load; a tampered file fails the ask out loud.
  - from: skills
    to: skills
  # Optional, disclosed installer-embedded Cloudflare proxy key (docs/CLOUDFLARE.md, src/main/
  # embedded-cloudflare-key.ts). build/cloudflare-embed/ is a real, always-present directory (tracked via
  # .gitkeep) that is EMPTY on a normal build — electron-builder copies whatever it finds, so packaging
  # never fails when there's nothing to embed. An operator who wants a fresh install to reach the default
  # Cloudflare provider with zero paste-a-key setup sets METIS_PROXY_KEY at build time; the predist/prebuild
  # step scripts/embed-cloudflare-key.mjs then writes an ENCRYPTED (AES-256-GCM) blob key.json here — the
  # plaintext token is never written to disk. scripts/check-embedded-cloudflare-key.mjs gates every chain so
  # the embed is never accidental (needs METIS_EMBED_CLOUDFLARE_KEY=1) and proves no plaintext token leaks
  # into the package. The blob is OBFUSCATION, not secrecy — extractable with effort; see docs/CLOUDFLARE.md.
  - from: build/cloudflare-embed
    to: cloudflare-embed
mac:
  category: public.app-category.productivity
  # electron-builder treats a target-specific `files` override as the complete app allowlist. Keep the
  # same minimal source set here while excluding the Windows Sherpa package before the asar header is
  # written; otherwise a shared checkout can pull in ignored worktrees and leave dangling references.
  files:
    - out/**/*
    - package.json
    - '!node_modules/@dust-tt/client/node_modules/@modelcontextprotocol/sdk{,/**/*}'
    - '!node_modules/@dust-tt/client/node_modules/express-rate-limit{,/**/*}'
    - '!node_modules/@dust-tt/client/node_modules/ip-address{,/**/*}'
    - '!node_modules/sherpa-onnx-win-*{,/**/*}'
    # BOTH mac Sherpa addons stay in the allowlist on purpose. @electron/universal aborts the lipo
    # merge if any Mach-O exists in one sub-build and not the other, and it offers no opt-out for
    # files outside the asar — so a universal package requires each sub-build to carry both arches,
    # not just its own. after-pack.mjs's foreign-arch pruning is therefore suppressed for universal
    # builds (ASKTOTO_MAC_ARCHES); the merged .app legitimately ships both, and local-runtime.ts /
    # sherpa-onnx-node select the right one by process.arch at load time.
    - '!out/**/*.map'
    - '!**/*.d.ts'
  # ASCII everywhere on disk (see the productName + win notes): the .app bundle is Metis.app, its helper
  # bundles are "Metis Helper*.app" (required — see productName), and the .dmg/.zip assets + latest-mac.yml
  # URLs stay accent-free. The app still DISPLAYS as Métis via extendInfo.CFBundleDisplayName.
  artifactName: Metis-${version}.${ext}
  target:
    - dmg
    - zip
  # Architecture is passed on the command line (`electron-builder --mac --universal`) by every mac chain
  # in package.json, not pinned per-target here — the same reason mac.identity and directories.output are
  # kept out of this shared yml (see the note at the top). --universal builds arm64 and x64 separately and
  # lipos them, so every native sidecar must be provisioned for BOTH arches first; the check:ffmpeg /
  # check:sherpa / check:llama / check-mac-helper gates in those chains are what enforce that.
  # Pinned llama.cpp `llama-server` sidecar that powers Métis Local (on-device suggest/summary/vision) —
  # mac binaries only (win ships its own build below via win.extraResources), so a mac package never
  # carries the other platform's ~150 MB of dead-weight binaries. This tree holds BOTH mac arches
  # (llama/mac/arm64 + llama/mac/x64): the mac target is universal, so one .app serves Intel and Apple
  # Silicon, and upstream publishes per-arch archives rather than one fat binary. Populated by
  # `npm run fetch:llama` (scripts/fetch-llama-server.mjs) before packaging; local-runtime.ts resolves
  # process.resourcesPath/llama/mac/<process.arch> in a packaged build. No separate mac signing entry is needed:
  # hardenedRuntime + entitlements below make electron-builder sign every executable/dylib it finds
  # inside the packed .app, including this one — the same mechanism that already covers the ffmpeg
  # sidecar above. electron-builder merges this list with the top-level extraResources.
  extraResources:
    - from: resources/llama/mac
      to: llama/mac
    # metis-mac-helper Swift sidecar (Vision OCR + NSWorkspace frontmost watcher for background screen
    # context) — built by scripts/build-mac-helper.mjs, guarded by scripts/check-mac-helper.mjs in every
    # mac packaging chain. mac-helper.ts resolves it at process.resourcesPath/mac-helper. Signed by the
    # same hardenedRuntime pass that covers llama-server/ffmpeg. The mas target inherits this list.
    - from: resources/mac-helper
      to: mac-helper
    # Portable official Node so the managed Dust CLI can load keytar (Electron-as-node cannot).
    # Populated by scripts/fetch-managed-node.mjs mac before pack. The user never installs Node.
    - from: resources/managed-node/darwin-arm64
      to: managed-node/darwin-arm64
    - from: resources/managed-node/darwin-x64
      to: managed-node/darwin-x64
  # @electron/universal lipos any Mach-O that DIFFERS between the two sub-builds, and aborts on one
  # that is byte-identical in both unless it matches this pattern (upstream's name is misleading — the
  # rule is "identical across builds, so skip lipo", not "must be x64"). Every prebuilt native payload
  # here is exactly that: shipped once per arch under its own path, identical in both halves, and
  # selected at runtime rather than merged. metis-mac-helper needs no entry — it is already a fat
  # binary, which @electron/universal detects and skips on its own.
  x64ArchFiles: '**/{@img,onnxruntime-node,sherpa-onnx-darwin-arm64,sherpa-onnx-darwin-x64,ffmpeg,llama}/**'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  extendInfo:
    # Keep the é in the DISPLAY name only — menu bar, dock, About and Finder all show "Métis" while the
    # on-disk bundle + helper dirs stay ASCII "Metis" (set from productName). Do NOT add CFBundleName
    # here: Electron resolves the helper bundle path from CFBundleName at runtime, so it must match the
    # ASCII "Metis Helper" dirs electron-builder creates. See the productName note at the top of this file.
    CFBundleDisplayName: Métis
    NSMicrophoneUsageDescription: Métis transcribes audio on-device to give you live AI suggestions.
    NSScreenCaptureUsageDescription: Métis captures system audio and your screen so the AI can help.
    NSAudioCaptureUsageDescription: Métis captures meeting audio from your screen so it can transcribe the other side of a call.
    # Apple Speech ASR engine (opt-in, on-device via SFSpeechRecognizer) — required or the OS kills the
    # app the moment the mac-helper sidecar calls requestAuthorization. Only shown if the user picks
    # "Apple Speech" in Settings → Audio; Parakeet/Whisper never touch this permission.
    NSSpeechRecognitionUsageDescription: Métis transcribes meeting audio on-device using Apple Speech so it can caption who said what.
    LSUIElement: true
mas:
  # Mac App Store builds are opt-in: run `npm run release:mas`.
  # The default direct channel stays dmg/zip so enterprise customers keep the full feature set and
  # electron-updater. App Store builds are sandboxed and get updates through Apple.
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  extendInfo:
    # See mac.extendInfo above: ASCII bundle/helper names, accented display name only.
    CFBundleDisplayName: Métis
    NSMicrophoneUsageDescription: Métis transcribes audio on-device to give you live AI suggestions.
    NSScreenCaptureUsageDescription: Métis captures system audio and your screen so the AI can help.
    NSAudioCaptureUsageDescription: Métis captures meeting audio from your screen so it can transcribe the other side of a call.
    NSSpeechRecognitionUsageDescription: Métis transcribes meeting audio on-device using Apple Speech so it can caption who said what.
    LSUIElement: true
masDev:
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
dmg:
  title: Métis ${version}
  # A three-item layout, not the default two. Métis is not Apple-notarized, so on macOS 15+ dragging
  # the app across and double-clicking it dead-ends at "Apple could not verify Métis is free of
  # malware" with no Control-click → Open escape any more. `Install Metis.command` does the copy,
  # clears com.apple.quarantine (recursively — the nested Metis Helper bundles carry their own tags),
  # re-verifies the signature and launches the app. docs/INSTALL.md documents it, and documented it
  # before it existed; this is the file that claim refers to.
  # The path is deliberately RELATIVE: dmg-builder rejects an absolute dmg.contents path outside the
  # workspace root, and resolves a relative one against the project directory it is invoked from.
  window:
    width: 560
    height: 400
  contents:
    # No `path` on the first entry — dmg-builder substitutes the packaged .app (its documented
    # backward-compatibility behaviour), which keeps this working if productName ever changes.
    - x: 140
      y: 170
      type: file
    - x: 420
      y: 170
      type: link
      path: /Applications
    - x: 280
      y: 320
      type: file
      path: build/install-metis.command
      name: Install Metis.command
win:
  icon: build/icon.png
  # Do not hardcode a guessed publisher name. For signed builds electron-builder derives the exact
  # common name from the Authenticode certificate and writes it into the updater configuration.
  # The release workflow independently compares that certificate to WIN_CSC_EXPECTED_SUBJECT.
  target:
    - nsis      # → Metis-Setup-<version>.exe (installer)
    - portable  # → Metis-Portable-<version>.exe (no-install single exe)
  # Pinned llama.cpp `llama-server` sidecar (win build only — vulkan + cpu variants; see mac.extraResources
  # for why this is platform-scoped). Populated by `npm run fetch:llama` before packaging; local-runtime.ts
  # resolves it at process.resourcesPath/llama/win/<vulkan|cpu> in a packaged build. electron-builder merges
  # this list with the top-level extraResources.
  extraResources:
    - from: resources/llama/win
      to: llama/win
    # Portable official Node so the managed Dust CLI can load keytar (Electron-as-node cannot).
    # Populated by scripts/fetch-managed-node.mjs before pack. The user never installs Node.
    - from: resources/managed-node/win-x64
      to: managed-node/win-x64
    # VC++ runtime for keytar's native addon. Set up Dust / the next NSIS pack runs this silently
    # if the addon cannot load — not a user homework step.
    - from: resources/vcredist
      to: vcredist
  # ASCII artifact/store ids on purpose: é in an .exe filename or AppX identity invites codepage,
  # globbing, and store-validation trouble. The installed app still displays as Métis (shortcutName).
  artifactName: Metis-Setup-${version}.${ext}
  # Must stay true: electron-updater checks the downloaded update's Authenticode signature before install.
  # Inert today (no real publish.url is configured), but false would let a compromised release pipeline
  # push an unsigned/mismatched .exe that installs with only a TLS+sha512 check. Flip only if you fully
  # understand the tradeoff — do not disable this to work around a signing setup problem.
  verifyUpdateCodeSignature: true
  # Authenticode signing: set WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD env (or use Azure Trusted Signing).
  # rfc3161TimeStampServer left at electron-builder default.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Métis
portable:
  # electron-updater has no portable-EXE support: this build never auto-updates (see docs/INSTALL.md).
  artifactName: Metis-Portable-${version}.${ext}
appx:
  artifactName: Metis-${version}.${ext}
  applicationId: Metis
  identityName: Mantu.Metis
  publisher: CN=Mantu
  publisherDisplayName: Mantu
  backgroundColor: transparent
# ─── Auto-update feed (electron-updater is wired in src/main/updater.ts) ───────────────────
# FLOW: push a v* tag → CI (release.yml) builds + publishes to this public GitHub Releases page →
# every installed app finds the new version on launch, downloads in the background, installs on quit.
# CODE SIGNING is required for the updater to trust artifacts (see SIGNING.md):
#   mac/win      → CSC_LINK (path or base64 of the .p12) + CSC_KEY_PASSWORD
#                  (win can instead use WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD / Azure Trusted Signing)
#   mac notarize → APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
# Unsigned macOS zip updates will be rejected by Gatekeeper on install.
publish:
  # Releases are served from the PUBLIC Metis-Releases feed so the app can auto-update anonymously while
  # the AskToto-Mantu SOURCE repo stays private. electron-updater bakes this owner/repo into app-update.yml
  # and fetches the latest.yml/latest-mac.yml + installers from it — that repo must be public and must be
  # where release.yml (or a manual `gh release`) uploads the signed assets.
  provider: github
  owner: mysticalsin
  repo: Metis-Releases
  # Without this line electron-builder creates DRAFT releases — and electron-updater resolves versions
  # from the public releases feed, which never contains drafts: every install would poll forever and
  # find nothing. `release` publishes the moment CI finishes; the v* tag push is the human approval gate.
  releaseType: release
  # channel: latest        # (default) bump to `beta`/`alpha` for pre-release rings if you add them.
