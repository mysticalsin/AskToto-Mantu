# PRODUCT: Métis for Windows (Electron .exe). Dispatch: release/latest.yml -> electron-updater. See docs/PLATFORM-MAP.md.
# Windows-only display-name overlay. The base productName must remain ASCII so Chromium can resolve
# macOS helper bundle paths reliably. Windows can show the accented brand while its executable stays
# ASCII for filesystem, updater, and enterprise-deployment compatibility.
extends: ./electron-builder.yml
productName: Métis
# Keep the Windows app directory allowlist explicit in the child config. electron-builder treats a
# nested `win.files` override as a target-only pattern and can otherwise fall back to `**/*`, pulling
# OneDrive worktrees, video files, and ignored local model caches into app.asar. The foreign Darwin
# Sherpa package is excluded before the asar header is written; afterPack then verifies the target.
files:
  - out/**/*
  - package.json
  - '!node_modules/@dust-tt/client/node_modules/@modelcontextprotocol/sdk{,/**/*}'
  - '!node_modules/@dust-tt/client/node_modules/express-rate-limit{,/**/*}'
  - '!node_modules/@dust-tt/client/node_modules/ip-address{,/**/*}'
  - '!node_modules/sherpa-onnx-darwin-*{,/**/*}'
  # sharp installs its native binaries per-host: building on macOS leaves darwin packages in
  # node_modules that a Windows install can never load; predist:win force-installs the win32-x64
  # pair (same pattern as check-sherpa-platform's addon provisioning) and these keep the darwin
  # copies out of the Windows installer.
  - '!node_modules/@img/sharp-darwin-*{,/**/*}'
  - '!node_modules/@img/sharp-libvips-darwin-*{,/**/*}'
  - '!out/**/*.map'
  - '!**/*.d.ts'
win:
  executableName: Metis
