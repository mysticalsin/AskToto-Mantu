# XcodeGen spec — generates AskToto.xcodeproj.
#   brew install xcodegen   (once)
#   cd ios && xcodegen generate && open AskToto.xcodeproj
# Then set your Team in Signing & Capabilities and Run on a device/simulator (iOS 17+).
name: AskToto
options:
  bundleIdPrefix: com.mantu.asktoto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # ← set your Apple Developer Team ID
    GENERATE_INFOPLIST_FILE: NO
targets:
  AskToto:
    type: application
    platform: iOS
    sources:
      - path: AskToto
    info:
      path: AskToto/Info.plist
      properties:
        CFBundleDisplayName: AskToto
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: AskToto transcribes the room so it can take notes and suggest what to say.
        NSSpeechRecognitionUsageDescription: AskToto turns what's said in the room into live notes on your device.
        NSCameraUsageDescription: AskToto reads a photo of a whiteboard, slide or document to help you with it.
        NSPhotoLibraryUsageDescription: AskToto reads an image you pick so the AI can help with what's on it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mantu.asktoto
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
