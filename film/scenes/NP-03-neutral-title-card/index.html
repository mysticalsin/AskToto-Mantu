<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=3840, height=2160" />
    <title>NP-03 Neutral title card</title>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"
      integrity="sha256-wXS/zlOnKUGNV6ithiXnJHx5OiL++OKFHjz6PenNgoA="
      crossorigin="anonymous"
    ></script>
    <style>
      html,
      body {
        margin: 0;
        background: #0a0a0a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: sans-serif;
      }
      #scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 56px;
      }
      #title {
        margin: 0;
        color: #f4f4f5;
        font-size: 200px;
        font-weight: 600;
      }
      #rule {
        width: 640px;
        height: 8px;
        border-radius: 4px;
        background: #6366f1;
        transform-origin: center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="np-03-neutral-title-card"
      data-start="0"
      data-duration="3"
      data-fps="30"
      data-width="3840"
      data-height="2160"
    >
      <div id="scene">
        <h1 id="title">Métis</h1>
        <div id="rule"></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true })
      tl.fromTo('#title', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power2.out' }, 0.1)
      tl.fromTo('#rule', { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: 'power3.out' }, 0.4)
      window.__timelines = window.__timelines || {}
      window.__timelines['np-03-neutral-title-card'] = tl
    </script>
  </body>
</html>
