<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=3840, height=2160" />
    <title>NP-01 Opening title</title>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"
      integrity="sha256-wXS/zlOnKUGNV6ithiXnJHx5OiL++OKFHjz6PenNgoA="
      crossorigin="anonymous"
    ></script>
    <style>
      html,
      body {
        margin: 0;
        background: #0a0a0a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: sans-serif;
      }
      #scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 64px;
      }
      #glow {
        position: absolute;
        width: 1800px;
        height: 1800px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.4), rgba(99, 102, 241, 0) 70%);
      }
      #mark,
      #wordmark,
      #tagline {
        position: relative;
      }
      #mark {
        width: 240px;
        height: 240px;
      }
      #wordmark {
        margin: 0;
        color: #f4f4f5;
        font-size: 260px;
        font-weight: 600;
      }
      #tagline {
        margin: 0;
        color: #a1a1aa;
        font-size: 84px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="np-01-opening-title"
      data-start="0"
      data-duration="4"
      data-fps="30"
      data-width="3840"
      data-height="2160"
    >
      <div id="scene">
        <div id="glow"></div>
        <svg id="mark" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="42" fill="none" stroke="#f4f4f5" stroke-width="6" />
          <circle cx="50" cy="50" r="14" fill="#6366f1" />
        </svg>
        <h1 id="wordmark">Métis</h1>
        <p id="tagline">A meeting copilot for your desktop</p>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true })
      tl.fromTo('#glow', { scale: 0.7, opacity: 0.2 }, { scale: 1.1, opacity: 1, duration: 3.9, ease: 'none' }, 0)
      tl.fromTo('#mark', { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: 'power3.out' }, 0.1)
      tl.fromTo('#wordmark', { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: 'power3.out' }, 0.5)
      tl.fromTo('#tagline', { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.1)
      window.__timelines = window.__timelines || {}
      window.__timelines['np-01-opening-title'] = tl
    </script>
  </body>
</html>
