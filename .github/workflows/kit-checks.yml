name: Kit checks

# Runs the skill-registry check and the Hindsight package validator against a kit copy. The kit itself
# lives outside this repository. The program repository copies this workflow and must add a `push` and
# `pull_request` trigger with a `paths:` filter on its kit v5 folder (defaulting both inputs to the kit
# registry file and the kit skill folder), then confirm both steps pass.
on:
  workflow_dispatch:
    inputs:
      registry:
        description: Path to the kit skill registry JSON, relative to the repository root
        required: true
        type: string
      kit_dir:
        description: Path to the Hindsight kit package directory, relative to the repository root
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kit-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-registry:
    name: Skill registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: One entry, auto_install and auto_capture false
        env:
          REGISTRY: ${{ inputs.registry }}
        run: node scripts/kit/check-skill-registry.mjs --registry "$REGISTRY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Hindsight package validator
        env:
          KIT_DIR: ${{ inputs.kit_dir }}
        run: python3 "$KIT_DIR/check_hindsight_package.py" "$KIT_DIR"
