name: Runtime llama native candidates
run-name: Runtime llama native candidates (${{ github.sha }})

on:
  pull_request:
    paths:
      - .github/workflows/runtime-llama-candidate.yml
      - package.json
      - package-lock.json
      - resources/runtime-schema/**
      - resources/local-llm/**
      - scripts/fetch-llama-server.mjs
      - scripts/fetch-local-model.mjs
      - scripts/local-model-assets.mjs
      - scripts/lib/macho-architecture.mjs
      - scripts/runtime-payload/**
      - src/main/llm/local-models.ts
  push:
    branches:
      - m2/M2-0475-runtime-artifact-publisher
    paths:
      - .github/workflows/runtime-llama-candidate.yml
      - package.json
      - package-lock.json
      - resources/runtime-schema/**
      - resources/local-llm/**
      - scripts/fetch-llama-server.mjs
      - scripts/fetch-local-model.mjs
      - scripts/local-model-assets.mjs
      - scripts/lib/macho-architecture.mjs
      - scripts/runtime-payload/**
      - src/main/llm/local-models.ts

permissions:
  contents: read

concurrency:
  group: runtime-llama-candidate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  native-llama-inference:
    name: Native llama inference (${{ matrix.target }})
    if: github.repository == 'mysticalsin/AskToto-Mantu'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
            llama-target: mac
          - target: darwin-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
            llama-target: mac
          - target: win32-x64
            runner: windows-latest
            platform: win32
            arch: x64
            llama-target: win
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - name: Verify native target and install exact lock without lifecycle scripts
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "${EXPECTED_ARCH}:${RUNNER_ARCH}" in
            arm64:ARM64|x64:X64) ;;
            *) echo 'RUNTIME_LLAMA_HOST_ARCH_MISMATCH'; exit 1 ;;
          esac
          test "$(node -p 'process.platform')" = "$EXPECTED_PLATFORM"
          test "$(node -p 'process.arch')" = "$EXPECTED_ARCH"
          npm ci --ignore-scripts --no-audit --no-fund
          echo "RUNTIME_NPM_VERSION=$(npm --version)" >> "$GITHUB_ENV"
      - name: Exercise the closed WASM directory inventory mapping
        run: node scripts/runtime-payload/check-directory-closure.mjs
      - name: Install the locked Electron runtime for exact ABI facts
        run: node node_modules/electron/install.js
      - name: Fetch pinned llama runtime and Qwen inference model
        run: |
          set -euo pipefail
          fetch_log="$RUNNER_TEMP/runtime-llama-fetch.log"
          node scripts/fetch-llama-server.mjs '${{ matrix.llama-target }}' >"$fetch_log" 2>&1 || {
            echo 'RUNTIME_LLAMA_NATIVE_FETCH_FAILED'
            exit 1
          }
          node scripts/fetch-local-model.mjs >>"$fetch_log" 2>&1 || {
            echo 'RUNTIME_LLAMA_MODEL_FETCH_FAILED'
            exit 1
          }
          node scripts/check-local-model.mjs >>"$fetch_log" 2>&1 || {
            echo 'RUNTIME_LLAMA_MODEL_PIN_CHECK_FAILED'
            exit 1
          }
      - name: Run native CPU inference and create the closed candidate inventory
        env:
          RUNTIME_EXPECTED_PLATFORM: ${{ matrix.platform }}
          RUNTIME_EXPECTED_ARCH: ${{ matrix.arch }}
          RUNTIME_CANDIDATE_OUTPUT: ${{ runner.temp }}/runtime-llama-${{ matrix.target }}
        run: node scripts/runtime-payload/create-llama-runtime-candidate.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-llama-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-llama-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  qwen-model-payload:
    name: Build the portable Qwen model and license candidate
    if: >-
      github.repository == 'mysticalsin/AskToto-Mantu' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/m2/M2-0475-runtime-artifact-publisher'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install the frozen lock without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record the locked package manager version
        run: echo "RUNTIME_NPM_VERSION=$(npm --version)" >> "$GITHUB_ENV"
      - name: Fetch and verify both pinned Qwen model files
        run: |
          set -euo pipefail
          model_log="$RUNNER_TEMP/runtime-qwen-model-fetch.log"
          node scripts/fetch-local-model.mjs >"$model_log" 2>&1 || {
            echo 'RUNTIME_QWEN_MODEL_FETCH_FAILED'
            exit 1
          }
          node scripts/check-local-model.mjs >>"$model_log" 2>&1 || {
            echo 'RUNTIME_QWEN_MODEL_PIN_CHECK_FAILED'
            exit 1
          }
      - name: Build the closed model and Apache notice payload
        env:
          RUNTIME_CANDIDATE_OUTPUT: ${{ runner.temp }}/runtime-qwen-model
        run: node scripts/runtime-payload/create-qwen-model-candidate.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-llama-model-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-qwen-model/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  attest-native-llama-candidates:
    name: Attest native llama and Qwen model subjects
    needs: [native-llama-inference, qwen-model-payload]
    if: >-
      github.repository == 'mysticalsin/AskToto-Mantu' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/m2/M2-0475-runtime-artifact-publisher'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download exact same-run candidate outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: runtime-llama-*-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-llama-candidates
          merge-multiple: false
      - name: Verify exact candidate names, target summaries, and subject digests
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/runtime-llama-candidates
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 win32-x64; do
            dir="$CANDIDATE_ROOT/runtime-llama-$target-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT"
            entrypoint=runtime/llama-server
            if [ "$target" = win32-x64 ]; then entrypoint=runtime/llama-server.exe; fi
            test "$(find "$dir" -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "candidate.json runtime-inference.json runtime.llama-server-$target.inventory.json runtime.llama-server-$target.tar.gz "
            test "$(jq -r '.target.platform + "-" + .target.arch' "$dir/candidate.json")" = "$target"
            test "$(jq -r '.inferencePassed' "$dir/runtime-inference.json")" = true
            test "$(jq -r '.cpuOnly' "$dir/runtime-inference.json")" = true
            jq -e '.nativeFilesVerified | type == "number" and . > 0' "$dir/runtime-inference.json" >/dev/null
            test "$(jq -r '.modelIncludedInArchive' "$dir/runtime-inference.json")" = false
            test "$(jq -r '.licenseCoverageComplete' "$dir/runtime-inference.json")" = false
            test "$(jq -r '.artifactId' "$dir/candidate.json")" = "runtime.llama-server-$target"
            test "$(jq -r '.kind' "$dir/candidate.json")" = runtime
            test "$(jq -r '.componentId' "$dir/candidate.json")" = runtime.llama-server
            archive="runtime.llama-server-$target.tar.gz"
            inventory="runtime.llama-server-$target.inventory.json"
            test "$(jq -r '.archive.path' "$dir/candidate.json")" = "$archive"
            test "$(jq -r '.inventory.path' "$dir/candidate.json")" = "$inventory"
            test "$(jq -r '.artifactId' "$dir/$inventory")" = "runtime.llama-server-$target"
            test "$(jq -r '.kind' "$dir/$inventory")" = runtime
            test "$(jq -r '.componentId' "$dir/$inventory")" = runtime.llama-server
            test "$(jq -r '.target.platform + "-" + .target.arch' "$dir/$inventory")" = "$target"
            test "$(jq -r '.target.platform + "-" + .target.arch' "$dir/candidate.json")" = "$(jq -r '.target.platform + "-" + .target.arch' "$dir/$inventory")"
            test "$(jq -r '.entrypoints["llama-server"]' "$dir/$inventory")" = "$entrypoint"
            test "$(jq -r '.source.commit' "$dir/$inventory")" = "$GITHUB_SHA"
            test "$(jq -r '.source.workflowPath' "$dir/$inventory")" = .github/workflows/runtime-llama-candidate.yml
            test "$(jq -r '.source.runId' "$dir/$inventory")" = "$GITHUB_RUN_ID"
            test "$(jq -r '.source.attempt' "$dir/$inventory")" = "$GITHUB_RUN_ATTEMPT"
            test "$(jq -r '.source.ref' "$dir/$inventory")" = "$GITHUB_REF"
            test "$(jq -r '.source.runnerEnvironment' "$dir/$inventory")" = github-hosted
            test "$(jq -r '.payloadBytes' "$dir/candidate.json")" = "$(jq '[.files[].bytes] | add' "$dir/$inventory")"
            test "$(sha256sum "$dir/$archive" | cut -d' ' -f1)" = "$(jq -r '.archive.sha256' "$dir/candidate.json")"
            test "$(sha256sum "$dir/$inventory" | cut -d' ' -f1)" = "$(jq -r '.inventory.sha256' "$dir/candidate.json")"
          done
          model_dir="$CANDIDATE_ROOT/runtime-llama-model-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT"
          test "$(find "$model_dir" -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "candidate.json model.qwen3.5-0.8b.inventory.json model.qwen3.5-0.8b.tar.gz "
          test "$(jq -r '.kind' "$model_dir/candidate.json")" = model
          test "$(jq -r '.artifactId' "$model_dir/candidate.json")" = model.qwen3.5-0.8b
          test "$(jq -r '.target.platform + "/" + .target.arch' "$model_dir/candidate.json")" = any/any
          test "$(jq -r '.models[0].id' "$model_dir/model.qwen3.5-0.8b.inventory.json")" = qwen3.5-0.8b
          test "$(jq -r '.models[0].root' "$model_dir/model.qwen3.5-0.8b.inventory.json")" = models/qwen3.5-0.8b
          test "$(jq -r '.models[0].members | sort | join(" ")' "$model_dir/model.qwen3.5-0.8b.inventory.json")" = "models/qwen3.5-0.8b/mmproj.gguf models/qwen3.5-0.8b/model.gguf"
          test "$(jq -r '.source.commit' "$model_dir/model.qwen3.5-0.8b.inventory.json")" = "$GITHUB_SHA"
          test "$(jq -r '.source.workflowPath' "$model_dir/model.qwen3.5-0.8b.inventory.json")" = .github/workflows/runtime-llama-candidate.yml
          test "$(jq -r '.source.workflowCommit' "$model_dir/model.qwen3.5-0.8b.inventory.json")" = "$GITHUB_WORKFLOW_SHA"
          test "$(jq -r '.source.runId' "$model_dir/model.qwen3.5-0.8b.inventory.json")" = "$GITHUB_RUN_ID"
          test "$(jq -r '.source.attempt' "$model_dir/model.qwen3.5-0.8b.inventory.json")" = "$GITHUB_RUN_ATTEMPT"
          test "$(jq -r '.source.ref' "$model_dir/model.qwen3.5-0.8b.inventory.json")" = "$GITHUB_REF"
          test "$(jq -r '.source.runnerEnvironment' "$model_dir/model.qwen3.5-0.8b.inventory.json")" = github-hosted
          test "$(jq -r '.payloadBytes' "$model_dir/candidate.json")" = "$(jq '[.files[].bytes] | add' "$model_dir/model.qwen3.5-0.8b.inventory.json")"
          test "$(jq -r '.payloadBytes' "$model_dir/candidate.json")" = 763771056
          test "$(jq -r '[.licenses[] | select(.package == \"Qwen3.5-0.8B-GGUF\" and .spdx == \"Apache-2.0\")] | length' "$model_dir/model.qwen3.5-0.8b.inventory.json")" = 1
          test "$(jq -r '[.upstream[] | select(.revision == \"6ab461498e2023f6e3c1baea90a8f0fe38ab64d0\" and .digest.algorithm == \"sha256\")] | length' "$model_dir/model.qwen3.5-0.8b.inventory.json")" = 2
          test "$(sha256sum "$model_dir/model.qwen3.5-0.8b.tar.gz" | cut -d' ' -f1)" = "$(jq -r '.archive.sha256' "$model_dir/candidate.json")"
          test "$(sha256sum "$model_dir/model.qwen3.5-0.8b.inventory.json" | cut -d' ' -f1)" = "$(jq -r '.inventory.sha256' "$model_dir/candidate.json")"
      - id: provenance_darwin_arm64
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            ${{ runner.temp }}/runtime-llama-candidates/runtime-llama-darwin-arm64-${{ github.sha }}-${{ github.run_attempt }}/runtime.llama-server-darwin-arm64.tar.gz
            ${{ runner.temp }}/runtime-llama-candidates/runtime-llama-darwin-arm64-${{ github.sha }}-${{ github.run_attempt }}/runtime.llama-server-darwin-arm64.inventory.json
          push-to-registry: false
          show-summary: false
      - id: provenance_darwin_x64
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            ${{ runner.temp }}/runtime-llama-candidates/runtime-llama-darwin-x64-${{ github.sha }}-${{ github.run_attempt }}/runtime.llama-server-darwin-x64.tar.gz
            ${{ runner.temp }}/runtime-llama-candidates/runtime-llama-darwin-x64-${{ github.sha }}-${{ github.run_attempt }}/runtime.llama-server-darwin-x64.inventory.json
          push-to-registry: false
          show-summary: false
      - id: provenance_win32_x64
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            ${{ runner.temp }}/runtime-llama-candidates/runtime-llama-win32-x64-${{ github.sha }}-${{ github.run_attempt }}/runtime.llama-server-win32-x64.tar.gz
            ${{ runner.temp }}/runtime-llama-candidates/runtime-llama-win32-x64-${{ github.sha }}-${{ github.run_attempt }}/runtime.llama-server-win32-x64.inventory.json
          push-to-registry: false
          show-summary: false
      - id: provenance_qwen_model
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            ${{ runner.temp }}/runtime-llama-candidates/runtime-llama-model-${{ github.sha }}-${{ github.run_attempt }}/model.qwen3.5-0.8b.tar.gz
            ${{ runner.temp }}/runtime-llama-candidates/runtime-llama-model-${{ github.sha }}-${{ github.run_attempt }}/model.qwen3.5-0.8b.inventory.json
          push-to-registry: false
          show-summary: false
      - name: Retain the exact bundle beside each candidate
        env:
          BUNDLE_ARM64: ${{ steps.provenance_darwin_arm64.outputs.bundle-path }}
          BUNDLE_X64: ${{ steps.provenance_darwin_x64.outputs.bundle-path }}
          BUNDLE_WIN: ${{ steps.provenance_win32_x64.outputs.bundle-path }}
          BUNDLE_MODEL: ${{ steps.provenance_qwen_model.outputs.bundle-path }}
          CANDIDATE_ROOT: ${{ runner.temp }}/runtime-llama-candidates
        run: |
          set -euo pipefail
          test -s "$BUNDLE_ARM64"
          test -s "$BUNDLE_X64"
          test -s "$BUNDLE_WIN"
          test -s "$BUNDLE_MODEL"
          cp -- "$BUNDLE_ARM64" "$CANDIDATE_ROOT/runtime-llama-darwin-arm64-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT/runtime.llama-server-darwin-arm64.sigstore.bundle.json"
          cp -- "$BUNDLE_X64" "$CANDIDATE_ROOT/runtime-llama-darwin-x64-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT/runtime.llama-server-darwin-x64.sigstore.bundle.json"
          cp -- "$BUNDLE_WIN" "$CANDIDATE_ROOT/runtime-llama-win32-x64-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT/runtime.llama-server-win32-x64.sigstore.bundle.json"
          cp -- "$BUNDLE_MODEL" "$CANDIDATE_ROOT/runtime-llama-model-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT/model.qwen3.5-0.8b.sigstore.bundle.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-attested-llama-candidates-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-llama-candidates/runtime-llama-*-${{ github.sha }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
