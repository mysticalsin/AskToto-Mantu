name: Windows CDP matrix source diagnostics (temporary)
run-name: Diagnostic only - Windows CDP matrix source

# Temporary PR-only diagnostic. Remove before merge; never an acceptance or release gate.
on:
  pull_request:
    paths:
      - .github/workflows/windows-cdp-matrix-diagnostics.yml
      - scripts/qa/windows-cdp-env-matrix.mjs

permissions:
  contents: read

jobs:
  identify:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'mysticalsin/AskToto-Mantu' &&
      github.event.pull_request.head.repo.full_name == 'mysticalsin/AskToto-Mantu' &&
      github.head_ref == 'codex/metis-windows-cdp-env-matrix-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Show the one new Biome correctness finding in the synthetic diagnostic source
        shell: bash
        run: |
          set +e
          npx --yes @biomejs/biome@2.3.10 lint --max-diagnostics=5 scripts/qa/windows-cdp-env-matrix.mjs
          result=$?
          set -e
          if [ "$result" -gt 1 ]; then
            echo '::error::Biome did not return a usable diagnostic result.'
            exit 1
          fi
      - name: Show the exact TypeScript diagnostic in the same source
        shell: bash
        run: |
          set +e
          ./node_modules/.bin/tsc --noEmit -p tsconfig.tests.json --pretty false > "$RUNNER_TEMP/matrix-tsc.txt" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 1 ] && [ "$result" -ne 2 ]; then
            echo '::error::TypeScript did not reproduce the expected diagnostic failure.'
            exit 1
          fi
          if ! grep -E '^scripts/qa/windows-cdp-env-matrix\.mjs\([0-9]+,[0-9]+\): error TS[0-9]+:' "$RUNNER_TEMP/matrix-tsc.txt"; then
            echo '::error::The diagnostic moved outside the expected synthetic source.'
            exit 1
          fi
          echo '::notice::Diagnostic-only observation; Build and Test remains failing.'
