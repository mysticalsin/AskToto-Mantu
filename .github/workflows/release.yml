name: Release

# Publishes signed builds to the public AskToto-Releases repo on a version tag push (v1.2.3).
# macOS: electron-builder only WARNS and ships unsigned/non-notarized when the Apple secrets are absent
# (app-builder-lib only throws for MAS builds — see codeSign/macCodeSign.js reportError()), so the
# release-macos job hard-fails BEFORE building if those secrets are missing, rather than silently
# publishing an unsigned build straight to AskToto-Releases. Windows signing is intentionally optional
# (see scripts/ship-setup.sh) — an unsigned .exe still installs and runs, SmartScreen just warns — so
# release-windows has no such gate and no-ops safely when WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD are absent.
on:
  push:
    tags:
      - 'v*'

jobs:
  release-macos:
    name: macOS release
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Hard gate: a v* tag with these secrets missing must fail the job, not publish an unsigned build.
      # electron-builder does not throw when it can't find a signing identity for a non-MAS build — it
      # logs "skipped macOS application code signing" and continues (app-builder-lib/codeSign/
      # macCodeSign.js reportError()), and `--publish always` has no idea signing was skipped.
      - name: Require signing secrets before releasing
        run: |
          missing=()
          [ -z "$CSC_LINK" ] && missing+=(CSC_LINK)
          [ -z "$CSC_KEY_PASSWORD" ] && missing+=(CSC_KEY_PASSWORD)
          [ -z "$APPLE_ID" ] && missing+=(APPLE_ID)
          [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] && missing+=(APPLE_APP_SPECIFIC_PASSWORD)
          [ -z "$APPLE_TEAM_ID" ] && missing+=(APPLE_TEAM_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing release secret(s): ${missing[*]}. See docs/SIGNING.md / scripts/ship-setup.sh — refusing to publish an unsigned macOS release."
            exit 1
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Same model cache as build.yml (~1.3 GB fetched by predist -> scripts/fetch-models.mjs).
      - uses: actions/cache@v4
        with:
          path: |
            resources/models
            resources/asr
            resources/ort
          key: asr-models-${{ runner.os }}-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Positively verify the published artifact is actually signed + notarized rather than trusting
      # electron-builder's exit code (scripts/verify-signing.mjs, wired in per docs/SIGNING.md's
      # "Signature gate" section). Runs after publish, so it's a confirmation/alarm, not a preventer —
      # the secrets gate above is what stops an unsigned build from ever reaching AskToto-Releases.
      - run: node scripts/verify-signing.mjs --require-notarized

  release-windows:
    name: Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Same model cache as build.yml / release-macos (~1.3 GB fetched by predist:win -> fetch-models.mjs).
      - uses: actions/cache@v4
        with:
          path: |
            resources/models
            resources/asr
            resources/ort
          key: asr-models-${{ runner.os }}-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
