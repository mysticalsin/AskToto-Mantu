name: Release

# Publishes only verified customer installers to this repository's public GitHub Releases page on a
# version tag push (v1.2.3). macOS requires Developer ID signing plus notarization and Windows requires
# trusted Authenticode signing. Missing signing inputs fail the workflow before artifacts can reach the
# public draft/publish stage; local ad-hoc builds remain a separate, non-public developer workflow.
on:
  push:
    tags:
      - "v*"

# A retry for the same tag must never race another run while both mutate the same draft release.
concurrency:
  group: metis-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-quality:
    name: Release source gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be current main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Release tags must point to the current origin/main commit."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Same reason as build.yml quality: bar-toolbar.layout.test.ts needs Chromium on the runner.
      - name: Install Playwright Chromium
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=critical

  release-macos:
    name: macOS release
    needs: release-quality
    runs-on: macos-latest
    # Notarization blocks on Apple's queue, which is usually minutes but has had documented multi-hour
    # degradations; 45 min was tight enough that a slow queue killed the job with no partial-progress
    # recovery (retry re-downloads/rebuilds from scratch). 90 min gives the notarization wait real room
    # without materially delaying detection of a genuinely stuck job.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # First step, before any build work starts: a tag that doesn't match package.json's version would
      # make electron-builder publish onto/overwrite an existing release instead of creating a new one -
      # see scripts/check-version-parity.mjs for the full failure mode.
      - name: Verify tag matches package.json version
        run: node scripts/check-version-parity.mjs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      # Restore the reviewed LGPL ffmpeg decoder binary (the manifest/license stay tracked in git) from
      # the ffmpeg-sidecar-v1 release in this repo. Cache the target binary directory so a
      # warm runner doesn't hit the GitHub API on every run; fall back to `gh release download` (built-in
      # GITHUB_TOKEN, read-only, scoped to this repo) on a cache miss.
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: resources/ffmpeg/darwin-arm64
          key: ffmpeg-sidecar-v1-darwin-arm64-${{ hashFiles('resources/ffmpeg/manifest.json') }}
      - name: Provision ffmpeg sidecar (darwin-arm64)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p resources/ffmpeg/darwin-arm64
          if ! gh release download ffmpeg-sidecar-v1 --repo "$GITHUB_REPOSITORY" \
               --pattern 'ffmpeg-darwin-arm64' \
               --dir resources/ffmpeg --clobber; then
            echo "::warning::Could not download the ffmpeg-sidecar-v1 release assets - falling through to the hard gate below."
          elif [ -f resources/ffmpeg/ffmpeg-darwin-arm64 ]; then
            mv resources/ffmpeg/ffmpeg-darwin-arm64 resources/ffmpeg/darwin-arm64/ffmpeg
            chmod +x resources/ffmpeg/darwin-arm64/ffmpeg
            # A freshly downloaded, unsigned Mach-O is quarantined by the OS, and Gatekeeper then
            # kills it on exec - which is exactly what check-ffmpeg-sidecar.mjs does to read the
            # licence banner. Safe to strip: that same script verifies the file against the reviewed
            # sha256 in resources/ffmpeg/manifest.json before it is ever executed, so trust comes
            # from the hash, not from the OS. build.yml has carried this line since the gate landed.
            xattr -d com.apple.quarantine resources/ffmpeg/darwin-arm64/ffmpeg 2>/dev/null || true
          fi
      # Hard gate: fail loudly with the exact one-time seed command if provisioning above didn't produce a
      # binary, instead of predist's check-ffmpeg-sidecar.mjs throwing a raw ENOENT deep inside the build.
      - name: Require the ffmpeg sidecar to be present (darwin-arm64)
        run: |
          if [ ! -f "resources/ffmpeg/darwin-arm64/ffmpeg" ]; then
            echo "::error::Missing resources/ffmpeg/darwin-arm64/ffmpeg and the ffmpeg-sidecar-v1 release could not provision it."
            echo "::error::One-time seed (run once locally by a maintainer holding the reviewed binaries in resources/ffmpeg/):"
            echo "::error::  cp resources/ffmpeg/darwin-arm64/ffmpeg /tmp/ffmpeg-darwin-arm64 && cp resources/ffmpeg/darwin-x64/ffmpeg /tmp/ffmpeg-darwin-x64 && cp resources/ffmpeg/win32-x64/ffmpeg.exe /tmp/ffmpeg-win32-x64.exe && gh release create ffmpeg-sidecar-v1 /tmp/ffmpeg-darwin-arm64 /tmp/ffmpeg-darwin-x64 /tmp/ffmpeg-win32-x64.exe --repo $GITHUB_REPOSITORY --title 'ffmpeg sidecar v1' --notes 'Reviewed LGPL-only ffmpeg binaries for CI provisioning (tracked manifest.json contains SHA256s).'"
            exit 1
          fi
      # The Intel half of the universal build. Deliberately a SECOND cache entry with its own id and
      # key rather than another path on the arm64 one: with a shared id, an arm64 cache hit would skip
      # this download too, and the gate below would then fail a job that was one step from complete.
      - uses: actions/cache@v4
        id: ffmpeg-cache-x64
        with:
          path: resources/ffmpeg/darwin-x64
          key: ffmpeg-sidecar-v1-darwin-x64-${{ hashFiles('resources/ffmpeg/manifest.json') }}
      - name: Provision ffmpeg sidecar (darwin-x64)
        if: steps.ffmpeg-cache-x64.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p resources/ffmpeg/darwin-x64
          if ! gh release download ffmpeg-sidecar-v1 --repo "$GITHUB_REPOSITORY" \
               --pattern 'ffmpeg-darwin-x64' \
               --dir resources/ffmpeg --clobber; then
            echo "::warning::Could not download the ffmpeg-sidecar-v1 release assets - falling through to the hard gate below."
          elif [ -f resources/ffmpeg/ffmpeg-darwin-x64 ]; then
            mv resources/ffmpeg/ffmpeg-darwin-x64 resources/ffmpeg/darwin-x64/ffmpeg
            chmod +x resources/ffmpeg/darwin-x64/ffmpeg
            # Same quarantine strip, same justification as the arm64 step above: the download is
            # unsigned and quarantined, and trust comes from the reviewed sha256, not from Gatekeeper.
            xattr -d com.apple.quarantine resources/ffmpeg/darwin-x64/ffmpeg 2>/dev/null || true
          fi
      # Hard gate for the second arch. Not optional and not droppable: package.json's predist checks
      # `mac x64` as well as `mac arm64`, and check-packaged-runtime.mjs --arches=arm64,x64 hashes both
      # out of the finished universal .app, so a missing Intel binary would only move the failure to the
      # far side of 40 minutes of packaging.
      - name: Require the ffmpeg sidecar to be present (darwin-x64)
        run: |
          if [ ! -f "resources/ffmpeg/darwin-x64/ffmpeg" ]; then
            echo "::error::Missing resources/ffmpeg/darwin-x64/ffmpeg and the ffmpeg-sidecar-v1 release could not provision it."
            echo "::error::This binary is cross-compiled on Apple Silicon by scripts/build-ffmpeg-sidecar-mac.sh x64 (needs nasm and Rosetta 2 on that Mac) - see resources/ffmpeg/manifest.json and docs/ENTERPRISE_RELEASE.md."
            echo "::error::One-time seed (run once locally by a maintainer holding the reviewed binaries in resources/ffmpeg/):"
            echo "::error::  cp resources/ffmpeg/darwin-arm64/ffmpeg /tmp/ffmpeg-darwin-arm64 && cp resources/ffmpeg/darwin-x64/ffmpeg /tmp/ffmpeg-darwin-x64 && cp resources/ffmpeg/win32-x64/ffmpeg.exe /tmp/ffmpeg-win32-x64.exe && gh release create ffmpeg-sidecar-v1 /tmp/ffmpeg-darwin-arm64 /tmp/ffmpeg-darwin-x64 /tmp/ffmpeg-win32-x64.exe --repo $GITHUB_REPOSITORY --title 'ffmpeg sidecar v1' --notes 'Reviewed LGPL-only ffmpeg binaries for CI provisioning (tracked manifest.json contains SHA256s).'"
            echo "::error::Adding it to a release that already exists: gh release upload ffmpeg-sidecar-v1 /tmp/ffmpeg-darwin-x64 --clobber --repo $GITHUB_REPOSITORY"
            exit 1
          fi
      - name: Require Developer ID signing and notarization secrets before releasing
        run: node scripts/check-release-secrets.mjs mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      # Same model cache as build.yml (~1.3 GB fetched by predist -> scripts/fetch-models.mjs).
      - uses: actions/cache@v4
        with:
          path: |
            resources/models
            resources/asr
            resources/ort
            resources/llama
            resources/local-llm
          key: runtime-assets-${{ runner.os }}-${{ hashFiles('scripts/fetch-models.mjs', 'resources/runtime-assets-manifest.json') }}-${{ hashFiles('scripts/fetch-llama-server.mjs') }}-${{ hashFiles('scripts/fetch-local-model.mjs', 'scripts/local-model-assets.mjs') }}
      # Release scripts fetch and verify every runtime asset before packaging. The compact Qwen default
      # is embedded; only explicitly selected larger models retain a reviewed optional download path.
      - run: npm run release:build:mac
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Standard installers use the licensed operator relay. Provider credentials remain on the
          # server; encrypted blobs in an installer are extractable and must not contain a shared key.
      # Hard size gate before anything is published.
      - run: npm run check:release
        env:
          ASKTOTO_ARTIFACTS_DIR: release
      - name: Verify macOS signing
        run: node scripts/verify-signing.mjs --require-notarized
      - uses: actions/upload-artifact@v4
        with:
          name: metis-release-macos
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  release-windows:
    name: Windows release
    needs: release-quality
    runs-on: windows-latest
    timeout-minutes: 120
    # A GitHub environment (rather than a bare tag-push subject) gives azure/login's OIDC token a fixed
    # subject, repo:mysticalsin/AskToto-Mantu:environment:windows-signing, instead of one that changes
    # with every tag (refs/tags/<tag>). It also lets deployments be restricted to v* tags and reviewed.
    environment: windows-signing
    permissions:
      contents: read   # checkout + gh release download ffmpeg-sidecar-v1
      id-token: write  # azure/login OIDC, used only when WIN_SIGNING_MODE=azure
    env:
      WIN_SIGNING_MODE: ${{ vars.WIN_SIGNING_MODE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify tag matches package.json version
        shell: bash
        run: node scripts/check-version-parity.mjs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      # Restore the reviewed LGPL ffmpeg decoder binary (the manifest/license stay tracked in git) from
      # the ffmpeg-sidecar-v1 release in this repo. Cache the target binary directory so a
      # warm runner doesn't hit the GitHub API on every run; fall back to `gh release download` (built-in
      # GITHUB_TOKEN, read-only, scoped to this repo) on a cache miss.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: ffmpeg-cache
        with:
          path: resources/ffmpeg/win32-x64
          key: ffmpeg-sidecar-v1-win32-x64-${{ hashFiles('resources/ffmpeg/manifest.json') }}
      - name: Provision ffmpeg sidecar (win32-x64)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p resources/ffmpeg/win32-x64
          if ! gh release download ffmpeg-sidecar-v1 --repo "$GITHUB_REPOSITORY" \
               --pattern 'ffmpeg-win32-x64.exe' \
               --dir resources/ffmpeg --clobber; then
            echo "::warning::Could not download the ffmpeg-sidecar-v1 release assets - falling through to the hard gate below."
          elif [ -f resources/ffmpeg/ffmpeg-win32-x64.exe ]; then
            mv resources/ffmpeg/ffmpeg-win32-x64.exe resources/ffmpeg/win32-x64/ffmpeg.exe
          fi
      # Hard gate: the platform binary remains outside git while its reviewed manifest/license are tracked;
      # fail here with the exact one-time seed command, before burning build/signing
      # time, instead of failing deep inside `npm run release:win`.
      - name: Require the ffmpeg sidecar to be present
        shell: bash
        run: |
          if [ ! -f "resources/ffmpeg/win32-x64/ffmpeg.exe" ]; then
            echo "::error::Missing resources/ffmpeg/win32-x64/ffmpeg.exe and the ffmpeg-sidecar-v1 release could not provision it."
            echo "::error::One-time seed (run once locally by a maintainer holding the reviewed binaries in resources/ffmpeg/):"
            echo "::error::  cp resources/ffmpeg/darwin-arm64/ffmpeg /tmp/ffmpeg-darwin-arm64 && cp resources/ffmpeg/darwin-x64/ffmpeg /tmp/ffmpeg-darwin-x64 && cp resources/ffmpeg/win32-x64/ffmpeg.exe /tmp/ffmpeg-win32-x64.exe && gh release create ffmpeg-sidecar-v1 /tmp/ffmpeg-darwin-arm64 /tmp/ffmpeg-darwin-x64 /tmp/ffmpeg-win32-x64.exe --repo $GITHUB_REPOSITORY --title 'ffmpeg sidecar v1' --notes 'Reviewed LGPL-only ffmpeg binaries for CI provisioning (tracked manifest.json contains SHA256s).'"
            exit 1
          fi
      # Fail-closed mode gate, and the ONLY place WIN_SIGNING_MODE is interpreted (scripts/lib/windows-signing-mode.mjs).
      # Missing, invalid or ambiguous (inputs for both modes present) or incomplete-for-the-chosen-mode
      # means refusing to publish an unsigned Windows release. See docs/SIGNING.md.
      - name: Require signing inputs before releasing
        run: node scripts/check-release-secrets.mjs win
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WIN_CSC_LINK: ${{ vars.WIN_SIGNING_MODE == 'pfx' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ vars.WIN_SIGNING_MODE == 'pfx' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_EXPECTED_SUBJECT: ${{ secrets.WIN_CSC_EXPECTED_SUBJECT }}
          WIN_AZURE_SIGNING_ENDPOINT: ${{ vars.WIN_AZURE_SIGNING_ENDPOINT }}
          WIN_AZURE_SIGNING_ACCOUNT: ${{ vars.WIN_AZURE_SIGNING_ACCOUNT }}
          WIN_AZURE_CERT_PROFILE: ${{ vars.WIN_AZURE_CERT_PROFILE }}
          WIN_AZURE_PUBLISHER_NAME: ${{ vars.WIN_AZURE_PUBLISHER_NAME }}
          WIN_AZURE_IDENTITY_EKU: ${{ vars.WIN_AZURE_IDENTITY_EKU }}
          WIN_UPDATE_PUBLISHER_NAMES: ${{ vars.WIN_UPDATE_PUBLISHER_NAMES }}
      # Fail-fast probes, run BEFORE setup-node/npm ci/the model cache/the ~1 hour build: a broken signing
      # identity is caught here in minutes instead of after the build (see docs/SIGNING.md, design §4).
      - name: Probe PFX signing identity chain (no build, no signing)
        if: vars.WIN_SIGNING_MODE == 'pfx'
        run: node scripts/windows-signing-identity-preflight.mjs --release-gate
        env:
          WIN_CSC_LINK: ${{ vars.WIN_SIGNING_MODE == 'pfx' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ vars.WIN_SIGNING_MODE == 'pfx' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_EXPECTED_SUBJECT: ${{ secrets.WIN_CSC_EXPECTED_SUBJECT }}
      - name: Install the pinned Microsoft Artifact Signing module
        if: vars.WIN_SIGNING_MODE == 'azure'
        run: node scripts/artifact-signing-module.mjs install
      - name: Azure login for the signing probe (OIDC)
        if: vars.WIN_SIGNING_MODE == 'azure'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.WIN_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WIN_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WIN_AZURE_SUBSCRIPTION_ID }}
      - name: Probe Azure signing with one canary signature (no app build)
        if: vars.WIN_SIGNING_MODE == 'azure'
        run: node scripts/windows-signing-azure-probe.mjs --release-gate
        env:
          WIN_AZURE_SIGNING_ENDPOINT: ${{ vars.WIN_AZURE_SIGNING_ENDPOINT }}
          WIN_AZURE_SIGNING_ACCOUNT: ${{ vars.WIN_AZURE_SIGNING_ACCOUNT }}
          WIN_AZURE_CERT_PROFILE: ${{ vars.WIN_AZURE_CERT_PROFILE }}
          WIN_CSC_EXPECTED_SUBJECT: ${{ secrets.WIN_CSC_EXPECTED_SUBJECT }}
          WIN_AZURE_IDENTITY_EKU: ${{ vars.WIN_AZURE_IDENTITY_EKU }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      # Same model cache as build.yml / release-macos (~1.3 GB fetched by predist:win -> fetch-models.mjs).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            resources/models
            resources/asr
            resources/ort
            resources/llama
            resources/local-llm
          key: runtime-assets-${{ runner.os }}-${{ hashFiles('scripts/fetch-models.mjs', 'resources/runtime-assets-manifest.json') }}-${{ hashFiles('scripts/fetch-llama-server.mjs') }}-${{ hashFiles('scripts/fetch-local-model.mjs', 'scripts/local-model-assets.mjs') }}
      # A build step this far from the probes' azure/login is 60+ minutes away by the time it signs;
      # refresh the OIDC-derived az CLI session immediately beforehand rather than reuse the probe's.
      - name: Refresh Azure login immediately before the signing build
        if: vars.WIN_SIGNING_MODE == 'azure'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.WIN_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WIN_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WIN_AZURE_SUBSCRIPTION_ID }}
      # Release scripts fetch and verify every runtime asset before packaging. The compact Qwen default
      # is embedded; only explicitly selected larger models retain a reviewed optional download path.
      - run: npm run release:build:win
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WIN_CSC_LINK: ${{ vars.WIN_SIGNING_MODE == 'pfx' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ vars.WIN_SIGNING_MODE == 'pfx' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_EXPECTED_SUBJECT: ${{ secrets.WIN_CSC_EXPECTED_SUBJECT }}
          WIN_AZURE_SIGNING_ENDPOINT: ${{ vars.WIN_AZURE_SIGNING_ENDPOINT }}
          WIN_AZURE_SIGNING_ACCOUNT: ${{ vars.WIN_AZURE_SIGNING_ACCOUNT }}
          WIN_AZURE_CERT_PROFILE: ${{ vars.WIN_AZURE_CERT_PROFILE }}
          WIN_AZURE_PUBLISHER_NAME: ${{ vars.WIN_AZURE_PUBLISHER_NAME }}
          WIN_UPDATE_PUBLISHER_NAMES: ${{ vars.WIN_UPDATE_PUBLISHER_NAMES }}
          # Standard installers authenticate through the licensed operator relay; no shared provider
          # API credential is passed into this build or embedded in its artifacts. Azure OIDC credentials
          # (AZURE_CLIENT_ID/TENANT_ID/CLIENT_SECRET/…) are deliberately never set as env here: they would
          # also reach the packaged app this same build launches (check-packaged-launch.mjs), which reads
          # AZURE_CLIENT_ID as live SSO config. azure/login above receives them only as action `with:` inputs.
      # Same pre-publication size gate as release-macos.
      - run: npm run check:release
        env:
          ASKTOTO_ARTIFACTS_DIR: release
      - name: Verify Windows signing
        run: node scripts/verify-signing.mjs
        env:
          WIN_SIGNING_MODE: ${{ vars.WIN_SIGNING_MODE }}
          WIN_CSC_EXPECTED_SUBJECT: ${{ secrets.WIN_CSC_EXPECTED_SUBJECT }}
          WIN_AZURE_IDENTITY_EKU: ${{ vars.WIN_AZURE_IDENTITY_EKU }}
      - name: Prove installs of this release will accept the next identically signed update
        run: node scripts/check-update-publisher.mjs release
        env:
          WIN_UPDATE_PUBLISHER_NAMES: ${{ vars.WIN_UPDATE_PUBLISHER_NAMES }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: metis-release-windows
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  # Publish only after notarized Electron macOS + signed Windows installers both pass.
  # Assets first land on an invisible draft; the draft becomes public only after the complete set
  # is verified in that same release.
  release-verify:
    name: Publish verified Mac + Windows release
    needs: [release-macos, release-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: metis-release-macos
          path: release-bundle/macos
      - uses: actions/download-artifact@v4
        with:
          name: metis-release-windows
          path: release-bundle/windows
      - name: Resolve publish repo
        id: publish-repo
        run: |
          owner=$(grep -oE '^\s*owner:\s*\S+' electron-builder.yml | awk '{print $2}')
          repo=$(grep -oE '^\s*repo:\s*\S+' electron-builder.yml | awk '{print $2}')
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
      - name: Verify bundle, upload to draft, then publish atomically
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ steps.publish-repo.outputs.owner }}/${{ steps.publish-repo.outputs.repo }}"
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          shopt -s nullglob

          required_files=(
            "release-bundle/macos/Metis-${version}.dmg"
            "release-bundle/macos/Metis-${version}.dmg.blockmap"
            "release-bundle/macos/Metis-${version}.zip"
            "release-bundle/macos/Metis-${version}.zip.blockmap"
            "release-bundle/macos/latest-mac.yml"
            "release-bundle/windows/Metis-Setup-${version}.exe"
            "release-bundle/windows/Metis-Setup-${version}.exe.blockmap"
            "release-bundle/windows/Metis-Portable-${version}.exe"
            "release-bundle/windows/latest.yml"
          )
          for file in "${required_files[@]}"; do
            [ -f "$file" ] || { echo "::error::Missing required release asset: $file"; exit 1; }
          done

          node scripts/check-update-metadata.mjs \
            release-bundle/macos/latest-mac.yml \
            release-bundle/windows/latest.yml

          mapfile -t files < <(
            find release-bundle/macos release-bundle/windows -mindepth 1 -maxdepth 1 -type f -print | LC_ALL=C sort
          )
          [ "${#files[@]}" -eq "${#required_files[@]}" ] || {
            echo "::error::Release bundle contains missing or unexpected files."
            printf '  %s\n' "${files[@]}"
            exit 1
          }
          expected_assets=$(printf '%s\n' "${files[@]##*/}" | LC_ALL=C sort)
          required_assets=$(printf '%s\n' "${required_files[@]##*/}" | LC_ALL=C sort)
          [ "$expected_assets" = "$required_assets" ] || {
            echo "::error::Release bundle does not exactly match the allowed asset set for $tag."
            diff -u <(printf '%s\n' "$required_assets") <(printf '%s\n' "$expected_assets") || true
            exit 1
          }

          assert_draft() {
            local draft
            draft=$(gh release view "$tag" --repo "$repo" --json isDraft --jq '.isDraft')
            [ "$draft" = "true" ] || {
              echo "::error::Refusing to mutate public release $tag on $repo."
              exit 1
            }
          }

          set +e
          lookup=$(gh api "repos/$repo/releases/tags/$tag" --jq '.draft' 2>&1)
          lookup_status=$?
          set -e
          if [ "$lookup_status" -eq 0 ]; then
            [ "$lookup" = "true" ] || { echo "::error::Refusing to overwrite public release $tag"; exit 1; }
            # A failed prior run can leave stale assets in its draft. Delete only the confirmed draft;
            # retain the tag, then recreate a clean draft so no unreviewed asset can survive a retry.
            assert_draft
            gh release delete "$tag" --repo "$repo" --yes
          elif ! grep -qi 'HTTP 404' <<<"$lookup"; then
            echo "::error::Could not safely determine whether $tag already exists on $repo."
            echo "$lookup"
            exit 1
          fi

          notes="Métis desktop installers: Developer ID-signed and notarized macOS, plus Authenticode-signed Windows."
          gh release create "$tag" --repo "$repo" --draft --title "Métis $tag" --notes "$notes"

          # Recheck immediately before both remote mutations. Tag-scoped workflow concurrency prevents
          # another Actions retry from entering this critical section at the same time.
          assert_draft
          gh release upload "$tag" "${files[@]}" --repo "$repo"

          actual_assets=$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          [ "$actual_assets" = "$expected_assets" ] || {
            echo "::error::Draft release asset set differs from the reviewed local bundle."
            diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$actual_assets") || true
            exit 1
          }

          assert_draft
          # --latest is load-bearing, not belt-and-braces. GitHub resolves /releases/latest as the most
          # recent non-prerelease by created_at, and EVERY release on Metis-Releases shares
          # created_at=2026-07-18T14:54:45Z because all seven tags point at the same commit. The sort key
          # is degenerate and the tie-break is undocumented. Both update paths read that one pointer —
          # updater.ts's About check hits api.github.com/.../releases/latest, and electron-updater's
          # GitHubProvider hits github.com/.../releases/latest — so pin it explicitly.
          gh release edit "$tag" --repo "$repo" --draft=false --latest
          published=$(gh release view "$tag" --repo "$repo" --json isDraft --jq '.isDraft')
          [ "$published" = "false" ] || { echo "::error::Release $tag did not become public."; exit 1; }
          echo "Published complete Mac + Windows release $tag on $repo with an exact ${#files[@]}-asset set."
