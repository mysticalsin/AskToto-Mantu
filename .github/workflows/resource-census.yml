name: Resource census
run-name: ${{ inputs.candidate_run != '' && format('Resource census candidate-{0}', inputs.candidate_run) || format('Resource census release {0}', inputs.release_tag) }}

# Manual evidence lane. It installs either a published release artifact or exact qa-candidate bytes selected
# by sha256, then measures the same hosted resource census states on macOS and Windows.
on:
  workflow_dispatch:
    inputs:
      release_repo:
        description: Repository that publishes the packaged release artifacts and SHA256SUMS
        required: true
        default: mysticalsin/Metis-Releases
        type: string
      release_tag:
        description: Release tag to measure when candidate_run is empty
        required: true
        default: v1.9.6-unsigned
        type: string
      candidate_run:
        description: qa-candidate.yml workflow_dispatch run id to measure instead of release_tag
        required: false
        default: ''
        type: string
      mac_sha256:
        description: Expected sha256 of the candidate macOS DMG
        required: false
        default: ''
        type: string
      win_sha256:
        description: Expected sha256 of the candidate Windows Setup
        required: false
        default: ''
        type: string
      baseline_run:
        description: Optional resource-census.yml run id to compare against, report-only
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: resource-census-${{ github.ref }}-${{ inputs.candidate_run != '' && format('candidate-{0}', inputs.candidate_run) || inputs.release_tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: Resource census (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Resolve artifact source
        id: source
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          LEG_SHA256: ${{ inputs.mac_sha256 }}
          MAC_SHA256: ${{ inputs.mac_sha256 }}
          WIN_SHA256: ${{ inputs.win_sha256 }}
          RELEASE_REPO: ${{ inputs.release_repo }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          sha_re='^[0-9a-f]{64}$'
          if [ -n "$CANDIDATE_RUN" ] || [ -n "$MAC_SHA256" ] || [ -n "$WIN_SHA256" ]; then
            if [ -z "$CANDIDATE_RUN" ]; then
              echo "::error::candidate sha256 inputs require candidate_run."; exit 1
            fi
            if ! [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]; then
              echo "::error::candidate_run must be a numeric workflow run id."; exit 1
            fi
            if ! [[ "$LEG_SHA256" =~ $sha_re ]]; then
              echo "::error::mac_sha256 is required for candidate source and must be 64 lowercase hexadecimal characters."; exit 1
            fi
            echo "source=candidate" >> "$GITHUB_OUTPUT"
            echo "label=candidate-$CANDIDATE_RUN" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$RELEASE_REPO" ] || [ -z "$RELEASE_TAG" ]; then
              echo "::error::release source requires release_repo and release_tag."; exit 1
            fi
            echo "source=release" >> "$GITHUB_OUTPUT"
            echo "label=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the packaged release artifact
        id: artifact
        if: steps.source.outputs.source == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ inputs.release_repo }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p release-artifact release-sums census-output
          gh release download "$RELEASE_TAG" --repo "$RELEASE_REPO" --pattern 'Metis-*.dmg' --dir release-artifact --clobber
          gh release download "$RELEASE_TAG" --repo "$RELEASE_REPO" --pattern 'SHA256SUMS*' --dir release-sums --clobber
          node scripts/qa/verify-sha256sums.mjs release-artifact release-sums/SHA256SUMS* | tee census-output/SHA256SUMS.txt
          artifact=$(find release-artifact -maxdepth 1 -name 'Metis-*.dmg' -print -quit)
          echo "name=$(basename "$artifact")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(node --input-type=module -e "import { sha256File } from './scripts/qa/provenance.mjs'; console.log(await sha256File(process.argv[1]))" "$artifact")" >> "$GITHUB_OUTPUT"
          echo "commit=" >> "$GITHUB_OUTPUT"
          echo "build_run_id=" >> "$GITHUB_OUTPUT"
      - name: Download the candidate artifact
        id: candidate
        if: steps.source.outputs.source == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          INSTALLER_SHA256: ${{ inputs.mac_sha256 }}
        run: |
          mkdir -p assets provenance release-artifact census-output
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > candidate-run.json
          node scripts/qa/candidate-scenarios.mjs guard candidate-run.json "$CANDIDATE_RUN"
          gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" --name candidate-provenance --dir provenance
          gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" --name candidate-mac --dir assets
          node scripts/qa/provenance.mjs verify provenance/provenance.json assets mac
          node -e "const p=require('./provenance/provenance.json'); if (String(p.run.id) !== process.env.CANDIDATE_RUN) { console.error('::error::provenance.json belongs to another run.'); process.exit(1) }"
          installer=$(node scripts/qa/candidate-installer.mjs assets "$INSTALLER_SHA256" mac)
          case "$installer" in
            *.dmg) ;;
            *) echo "::error::resource-census macOS candidate source requires the DMG installer."; exit 1 ;;
          esac
          cp "$installer" "release-artifact/$(basename "$installer")"
          echo "name=$(basename "$installer")" >> "$GITHUB_OUTPUT"
          echo "sha256=$INSTALLER_SHA256" >> "$GITHUB_OUTPUT"
          echo "commit=$(node -p "require('./provenance/provenance.json').commit")" >> "$GITHUB_OUTPUT"
          echo "build_run_id=$(node -p "require('./provenance/provenance.json').run.id")" >> "$GITHUB_OUTPUT"
      - name: Install into runner temp
        run: |
          volume="$RUNNER_TEMP/resource-census-volume"
          target="$RUNNER_TEMP/resource-census-install"
          rm -rf "$volume" "$target" "$RUNNER_TEMP/resource-census-install-tmp"
          mkdir -p "$target"
          # The mount-and-copy runs with TMPDIR pointed at a dedicated directory whose peak size is the
          # temporary install footprint (macOS copies straight into the target, so this may be near zero).
          node scripts/qa/census/measure-install.mjs \
            --temp-dir "$RUNNER_TEMP/resource-census-install-tmp" \
            --output census-output/darwin-temp-peak.json \
            -- bash -c '
              set -e
              hdiutil attach -nobrowse -readonly -mountpoint "$1" "$3" > /dev/null
              app=$(find "$1" -maxdepth 1 -name "*.app" -print -quit)
              ditto "$app" "$2/Metis.app"
              hdiutil detach "$1" > /dev/null
            ' _ "$volume" "$target" release-artifact/Metis-*.dmg
      - name: Measure install footprint
        env:
          SOURCE_LABEL: ${{ steps.source.outputs.label }}
        run: |
          node scripts/bench-asr-ttfc.mjs > census-output/bench-asr-ttfc.log 2>&1
          node scripts/qa/census/footprint.mjs \
            --artifact release-artifact/Metis-*.dmg \
            --install-root "$RUNNER_TEMP/resource-census-install/Metis.app" \
            --temp-peak census-output/darwin-temp-peak.json \
            --release-tag "$SOURCE_LABEL" \
            --ttfc-output census-output/bench-asr-ttfc.log \
            --output census-output/darwin-footprint.json
      - name: Build representative synthetic profile
        run: |
          # Read resource-census-profile.json from the path profile.mjs prints, so a Windows RUNNER_TEMP
          # cannot diverge between where the script writes and where this step reads.
          node scripts/qa/census/profile.mjs "$RUNNER_TEMP/metis-census-profile" | tee census-output/profile.log
          manifest=$(sed -n 's/^\[census-profile\] manifest //p' census-output/profile.log)
          test -n "$manifest"
          cp "$manifest" census-output/profile-manifest.json
      - name: Build parked hide synthetic profile
        run: |
          node scripts/qa/census/profile.mjs --layout hide "$RUNNER_TEMP/metis-census-parked-profile" | tee census-output/parked-profile.log
          manifest=$(sed -n 's/^\[census-profile\] manifest //p' census-output/parked-profile.log)
          test -n "$manifest"
          cp "$manifest" census-output/parked-profile-manifest.json
      - name: Record local TTFT proof
        # Hosted runners are CPU-only and slow for local inference: the proof's PASS/FAIL/TIMEOUT outcome is
        # recorded in the census artifact but must never gate the resource census steps below.
        continue-on-error: true
        timeout-minutes: 20
        env:
          ASKTOTO_USERDATA: ${{ runner.temp }}/metis-census-profile
        run: node scripts/prove-local-ttft.mjs > census-output/prove-local-ttft.log 2>&1
      - name: Measure hosted census states
        env:
          METIS_QA_PROFILE: ${{ runner.temp }}/metis-census-profile
        run: |
          for state in cold-start settled-idle; do
            args=(
              scripts/qa/census/run.mjs
              --state "$state"
              --seconds 300
              --app "$RUNNER_TEMP/resource-census-install/Metis.app"
              --output "census-output/darwin-$state.json"
            )
            # A proof that died before printing its header leaves nothing to record; the census still runs.
            if grep -q 'prove-local-ttft: ' census-output/prove-local-ttft.log; then
              args+=(--ttft-output census-output/prove-local-ttft.log)
            fi
            if [ "$state" = settled-idle ]; then
              args+=(
                --trace-scenario parked-bar-orb
                --trace-scenario backdrop-filter
                --trace-scenario threejs-obsidian-orb
              )
            fi
            node "${args[@]}"
          done
          METIS_QA_PROFILE="$RUNNER_TEMP/metis-census-parked-profile" node scripts/qa/census/run.mjs \
            --state parked-idle \
            --seconds 300 \
            --app "$RUNNER_TEMP/resource-census-install/Metis.app" \
            --output census-output/darwin-parked-idle.json
      - name: Compare with baseline run
        if: always() && inputs.baseline_run != '' && steps.source.outputs.source != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: |
          mkdir -p baseline-run
          gh run download "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" --dir baseline-run
          baseline=$(find baseline-run -maxdepth 1 -type d -name 'resource-census-macos-*' -print -quit)
          test -n "$baseline"
          node scripts/qa/census/delta.mjs --baseline "$baseline" --candidate census-output --output census-output/resource-census-delta.json --summary census-output/resource-census-delta.md
          cat census-output/resource-census-delta.md >> "$GITHUB_STEP_SUMMARY"
      - name: Record run identity and file digests
        if: always()
        env:
          SOURCE: ${{ steps.source.outputs.source }}
          SOURCE_LABEL: ${{ steps.source.outputs.label }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name || steps.candidate.outputs.name }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 || steps.candidate.outputs.sha256 }}
          BUILD_RUN_ID: ${{ steps.artifact.outputs.build_run_id || steps.candidate.outputs.build_run_id }}
          SOURCE_COMMIT: ${{ steps.artifact.outputs.commit || steps.candidate.outputs.commit }}
        run: |
          node --input-type=module -e "
            import { totalmem } from 'node:os';
            import { writeFileSync } from 'node:fs';
            const record = {
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT,
              source: process.env.SOURCE,
              sourceLabel: process.env.SOURCE_LABEL,
              releaseTag: process.env.RELEASE_TAG,
              build_run_id: process.env.BUILD_RUN_ID || null,
              commit: process.env.SOURCE_COMMIT || null,
              artifactFileName: process.env.ARTIFACT_NAME || null,
              artifact_sha256: process.env.ARTIFACT_SHA256 || null,
              hostFloorOverride: false,
              hostMemoryBytes: totalmem()
            };
            writeFileSync('census-output/run-identity.json', JSON.stringify(record, null, 2) + '\n');
          "
          (cd census-output && shasum -a 256 $(ls | grep -v '^FILES.sha256$') > FILES.sha256)
          cat census-output/run-identity.json census-output/FILES.sha256
          echo "LEAD_ACTION: file the hosted-runner measured records from this run ID and the artifact sha256 above; rows that need physical QA hardware or an outside account stay BLOCKED_EXTERNAL with their unblock step."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.source.outputs.source != ''
        with:
          name: resource-census-macos-${{ steps.source.outputs.label }}
          path: census-output/
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Resource census (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Resolve artifact source
        id: source
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          LEG_SHA256: ${{ inputs.win_sha256 }}
          MAC_SHA256: ${{ inputs.mac_sha256 }}
          WIN_SHA256: ${{ inputs.win_sha256 }}
          RELEASE_REPO: ${{ inputs.release_repo }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          sha_re='^[0-9a-f]{64}$'
          if [ -n "$CANDIDATE_RUN" ] || [ -n "$MAC_SHA256" ] || [ -n "$WIN_SHA256" ]; then
            if [ -z "$CANDIDATE_RUN" ]; then
              echo "::error::candidate sha256 inputs require candidate_run."; exit 1
            fi
            if ! [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]; then
              echo "::error::candidate_run must be a numeric workflow run id."; exit 1
            fi
            if ! [[ "$LEG_SHA256" =~ $sha_re ]]; then
              echo "::error::win_sha256 is required for candidate source and must be 64 lowercase hexadecimal characters."; exit 1
            fi
            echo "source=candidate" >> "$GITHUB_OUTPUT"
            echo "label=candidate-$CANDIDATE_RUN" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$RELEASE_REPO" ] || [ -z "$RELEASE_TAG" ]; then
              echo "::error::release source requires release_repo and release_tag."; exit 1
            fi
            echo "source=release" >> "$GITHUB_OUTPUT"
            echo "label=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the packaged release artifact
        id: artifact
        if: steps.source.outputs.source == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ inputs.release_repo }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p release-artifact release-sums census-output
          gh release download "$RELEASE_TAG" --repo "$RELEASE_REPO" --pattern 'Metis-Setup-*.exe' --dir release-artifact --clobber
          gh release download "$RELEASE_TAG" --repo "$RELEASE_REPO" --pattern 'SHA256SUMS*' --dir release-sums --clobber
          node scripts/qa/verify-sha256sums.mjs release-artifact release-sums/SHA256SUMS* | tee census-output/SHA256SUMS.txt
          artifact=$(find release-artifact -maxdepth 1 -name 'Metis-Setup-*.exe' -print -quit)
          echo "name=$(basename "$artifact")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(node --input-type=module -e "import { sha256File } from './scripts/qa/provenance.mjs'; console.log(await sha256File(process.argv[1]))" "$artifact")" >> "$GITHUB_OUTPUT"
          echo "commit=" >> "$GITHUB_OUTPUT"
          echo "build_run_id=" >> "$GITHUB_OUTPUT"
      - name: Download the candidate artifact
        id: candidate
        if: steps.source.outputs.source == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          INSTALLER_SHA256: ${{ inputs.win_sha256 }}
        run: |
          mkdir -p assets provenance release-artifact census-output
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > candidate-run.json
          node scripts/qa/candidate-scenarios.mjs guard candidate-run.json "$CANDIDATE_RUN"
          gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" --name candidate-provenance --dir provenance
          gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" --name candidate-win --dir assets
          node scripts/qa/provenance.mjs verify provenance/provenance.json assets win
          node -e "const p=require('./provenance/provenance.json'); if (String(p.run.id) !== process.env.CANDIDATE_RUN) { console.error('::error::provenance.json belongs to another run.'); process.exit(1) }"
          installer=$(node scripts/qa/candidate-installer.mjs assets "$INSTALLER_SHA256" win)
          cp "$installer" "release-artifact/$(basename "$installer")"
          echo "name=$(basename "$installer")" >> "$GITHUB_OUTPUT"
          echo "sha256=$INSTALLER_SHA256" >> "$GITHUB_OUTPUT"
          echo "commit=$(node -p "require('./provenance/provenance.json').commit")" >> "$GITHUB_OUTPUT"
          echo "build_run_id=$(node -p "require('./provenance/provenance.json').run.id")" >> "$GITHUB_OUTPUT"
      - name: Install into runner temp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'resource-census-install'
          $scratch = Join-Path $env:RUNNER_TEMP 'resource-census-install-tmp'
          foreach ($path in $target, $scratch) { if (Test-Path $path) { Remove-Item $path -Recurse -Force } }
          New-Item -ItemType Directory -Path $target | Out-Null
          $setup = Get-Item release-artifact/Metis-Setup-*.exe
          # NSIS unpacks into %TEMP% and deletes it before exiting, so TEMP/TMP point at a dedicated
          # directory whose peak size, polled during the install, is the temporary install footprint.
          node scripts/qa/census/measure-install.mjs --temp-dir $scratch --output census-output/win32-temp-peak.json -- $setup.FullName /S "/D=$target"
          if ($LASTEXITCODE -ne 0) { throw "Setup exited with $LASTEXITCODE." }
      - name: Measure install footprint
        env:
          SOURCE_LABEL: ${{ steps.source.outputs.label }}
        run: |
          node scripts/bench-asr-ttfc.mjs > census-output/bench-asr-ttfc.log 2>&1
          node scripts/qa/census/footprint.mjs \
            --artifact release-artifact/Metis-Setup-*.exe \
            --install-root "$RUNNER_TEMP/resource-census-install" \
            --temp-peak census-output/win32-temp-peak.json \
            --release-tag "$SOURCE_LABEL" \
            --ttfc-output census-output/bench-asr-ttfc.log \
            --output census-output/win32-footprint.json
      - name: Build representative synthetic profile
        run: |
          # Read the manifest from the path profile.mjs prints, so a Windows RUNNER_TEMP cannot diverge
          # between where the script writes and where this step reads.
          node scripts/qa/census/profile.mjs "$RUNNER_TEMP/metis-census-profile" | tee census-output/profile.log
          manifest=$(sed -n 's/^\[census-profile\] manifest //p' census-output/profile.log)
          test -n "$manifest"
          cp "$manifest" census-output/profile-manifest.json
      - name: Build parked hide synthetic profile
        run: |
          node scripts/qa/census/profile.mjs --layout hide "$RUNNER_TEMP/metis-census-parked-profile" | tee census-output/parked-profile.log
          manifest=$(sed -n 's/^\[census-profile\] manifest //p' census-output/parked-profile.log)
          test -n "$manifest"
          cp "$manifest" census-output/parked-profile-manifest.json
      - name: Measure hosted census states
        env:
          METIS_QA_PROFILE: ${{ runner.temp }}/metis-census-profile
        run: |
          for state in cold-start settled-idle; do
            node scripts/qa/census/run.mjs \
              --state "$state" \
              --seconds 300 \
              --app "$RUNNER_TEMP/resource-census-install/Metis.exe" \
              --output "census-output/win32-$state.json"
          done
          METIS_QA_PROFILE="$RUNNER_TEMP/metis-census-parked-profile" node scripts/qa/census/run.mjs \
            --state parked-idle \
            --seconds 300 \
            --app "$RUNNER_TEMP/resource-census-install/Metis.exe" \
            --output census-output/win32-parked-idle.json
      - name: Compare with baseline run
        if: always() && inputs.baseline_run != '' && steps.source.outputs.source != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: |
          mkdir -p baseline-run
          gh run download "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" --dir baseline-run
          baseline=$(find baseline-run -maxdepth 1 -type d -name 'resource-census-windows-*' -print -quit)
          test -n "$baseline"
          node scripts/qa/census/delta.mjs --baseline "$baseline" --candidate census-output --output census-output/resource-census-delta.json --summary census-output/resource-census-delta.md
          cat census-output/resource-census-delta.md >> "$GITHUB_STEP_SUMMARY"
      - name: Record run identity and file digests
        if: always()
        env:
          SOURCE: ${{ steps.source.outputs.source }}
          SOURCE_LABEL: ${{ steps.source.outputs.label }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name || steps.candidate.outputs.name }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 || steps.candidate.outputs.sha256 }}
          BUILD_RUN_ID: ${{ steps.artifact.outputs.build_run_id || steps.candidate.outputs.build_run_id }}
          SOURCE_COMMIT: ${{ steps.artifact.outputs.commit || steps.candidate.outputs.commit }}
        run: |
          node --input-type=module -e "
            import { totalmem } from 'node:os';
            import { writeFileSync } from 'node:fs';
            const record = {
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT,
              source: process.env.SOURCE,
              sourceLabel: process.env.SOURCE_LABEL,
              releaseTag: process.env.RELEASE_TAG,
              build_run_id: process.env.BUILD_RUN_ID || null,
              commit: process.env.SOURCE_COMMIT || null,
              artifactFileName: process.env.ARTIFACT_NAME || null,
              artifact_sha256: process.env.ARTIFACT_SHA256 || null,
              hostFloorOverride: false,
              hostMemoryBytes: totalmem()
            };
            writeFileSync('census-output/run-identity.json', JSON.stringify(record, null, 2) + '\n');
          "
          (cd census-output && sha256sum $(ls | grep -v '^FILES.sha256$') > FILES.sha256)
          cat census-output/run-identity.json census-output/FILES.sha256
          echo "LEAD_ACTION: file the hosted-runner measured records from this run ID and the artifact sha256 above; rows that need physical QA hardware or an outside account stay BLOCKED_EXTERNAL with their unblock step."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.source.outputs.source != ''
        with:
          name: resource-census-windows-${{ steps.source.outputs.label }}
          path: census-output/
          if-no-files-found: error
          retention-days: 30
