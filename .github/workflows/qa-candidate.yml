name: QA candidate

# Builds one candidate once (M2-0187): every shipped macOS and Windows installer plus the macOS
# QA-identity variant, from one named commit of main or release/1.9.x, in one run. It records provenance (sha256 per
# installer, commit, run, runner image, Node, Electron and electron-builder versions, builder config
# hashes), then verifies, installs and launches every installer by sha256. Packaged gates elsewhere
# consume these bytes by sha256, and promote-candidate.yml publishes the same bytes. This workflow never
# signs with a Developer ID, publishes, or pushes a tag.
#
# A pull request that changes the lane's own files runs it as a self-test. Such a run builds the PR's
# merge commit and can never be promoted.
run-name: ${{ github.event_name == 'pull_request' && format('QA candidate self-test (PR {0})', github.event.pull_request.number) || format('QA candidate {0}', inputs.commit) }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: the dispatched branch's current commit (main or release/1.9.x; full 40-character SHA)
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/qa-candidate.yml
      - build/qa-identity.electron-builder.yml
      - scripts/qa/provenance.mjs
      - scripts/qa/release-line.mjs
      - scripts/qa/st-1.mjs
      - scripts/qa/lib/st-1-core.mjs
      - scripts/qa/meeting/**
      - src/main/qa-capture-source.ts
      # The boot path ST-1 measures (M2-0433), so every fix slice on it gets a QA self-test.
      - src/main/boot-tray.ts
      - src/main/boot-window-rendering.ts
      - src/main/lifecycle/first-show.ts
      - src/main/lifecycle/boot-work.ts

permissions:
  contents: read

concurrency:
  group: qa-candidate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: Check what this run may build
    if: github.repository == 'mysticalsin/AskToto-Mantu'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The public release feed: the same repository promote-candidate.yml publishes to.
      FEED: mysticalsin/Metis-Releases
    steps:
      - name: Only main and release/1.9.x build candidates
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/release/1.9.x) ;;
            *)
              echo "::error::$GITHUB_REF may not build a candidate. Dispatch on refs/heads/main or refs/heads/release/1.9.x."
              exit 1 ;;
          esac
      - name: The named commit is the dispatched ref's head
        if: github.event_name == 'workflow_dispatch'
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ "$COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF is at $GITHUB_SHA and the named commit differs. Dispatch again naming the current head of $GITHUB_REF."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      # A dispatch fails on a problem. A pull request only warns, so the glue runs before the cut depends on it.
      - name: The version is legal for this ref and unused on the feed
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.ref }}
          REPORT_ONLY: ${{ github.event_name == 'pull_request' }}
        run: |
          feed_failed() {
            if [ "$REPORT_ONLY" = true ]; then
              echo "::warning::$1 failed, so the version was not checked against the feed."
              exit 0
            fi
            echo "::error::$1 failed. The feed could not be read, so this run does not build."
            exit 1
          }
          feed_dir="$RUNNER_TEMP/feed"
          mkdir -p "$feed_dir"
          gh api "repos/$FEED/git/matching-refs/tags" --paginate --jq '.[].ref | sub("^refs/tags/"; "")' > "$feed_dir/tags.txt" \
            || feed_failed "gh api repos/$FEED/git/matching-refs/tags"
          gh api "repos/$FEED/releases?per_page=100" --paginate --jq '.[] | select(.draft | not) | .tag_name' > "$feed_dir/releases.txt" \
            || feed_failed "gh api repos/$FEED/releases"
          flags=()
          if [ "$REPORT_ONLY" = true ]; then flags+=(--report-only); fi
          node scripts/qa/release-line.mjs check --ref "$CHECK_REF" --package package.json \
            --tags "$feed_dir/tags.txt" --releases "$feed_dir/releases.txt" "${flags[@]}"
      # Hotfixes build on the promoted base, so a branch that lost it can never ship as its successor.
      - name: The branch contains the promoted 1.9.7 commit
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/1.9.x'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.9.7 --repo "$FEED" --pattern provenance.json --dir "$RUNNER_TEMP/base" \
            || { echo "::error::gh release download v1.9.7 --repo $FEED failed. The promoted base could not be read."; exit 1; }
          base=$(jq -r .commit "$RUNNER_TEMP/base/provenance.json")
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The v1.9.7 provenance.json on $FEED names no 40-character commit."
            exit 1
          fi
          git merge-base --is-ancestor "$base" "$GITHUB_SHA" \
            || { echo "::error::$GITHUB_REF at $GITHUB_SHA does not contain the promoted v1.9.7 commit $base."; exit 1; }

  build-mac:
    name: Build ${{ matrix.variant }}
    needs: guard
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          - variant: mac
            script: dist
          - variant: mac-qa-identity
            script: dist:qa-identity
    steps:
      - name: Build once
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "::error::A candidate is built once. Dispatch a new run; its bytes are a new candidate."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # predist's check-ffmpeg-sidecar.mjs verifies each binary against resources/ffmpeg/manifest.json
      # before running it, so trust comes from that hash, not from the download or from Gatekeeper.
      - name: Provision the reviewed ffmpeg sidecars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ffmpeg-sidecar-v1 --repo "$GITHUB_REPOSITORY" --pattern 'ffmpeg-darwin-*' --dir resources/ffmpeg
          for arch in arm64 x64; do
            mkdir -p "resources/ffmpeg/darwin-$arch"
            mv "resources/ffmpeg/ffmpeg-darwin-$arch" "resources/ffmpeg/darwin-$arch/ffmpeg"
            chmod +x "resources/ffmpeg/darwin-$arch/ffmpeg"
            xattr -d com.apple.quarantine "resources/ffmpeg/darwin-$arch/ffmpeg" 2>/dev/null || true
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      # Same key as build.yml. fetch-models.mjs reuses cached files only after its exact manifest gate.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            resources/models
            resources/asr
            resources/ort
            resources/llama
            resources/local-llm
          key: runtime-assets-${{ runner.os }}-${{ hashFiles('scripts/fetch-models.mjs', 'resources/runtime-assets-manifest.json') }}-${{ hashFiles('scripts/fetch-llama-server.mjs') }}-${{ hashFiles('scripts/fetch-local-model.mjs', 'scripts/local-model-assets.mjs') }}
      # A stable identity keeps one designated requirement across candidates, so TCC grants persist.
      # Without the secret the candidate is ad-hoc signed, and provenance says so.
      - name: Import the stable QA signing identity
        id: identity
        env:
          QA_MAC_SIGNING: ${{ secrets.QA_MAC_SIGNING }}
        run: |
          if [ -z "$QA_MAC_SIGNING" ]; then
            echo "::warning::QA_MAC_SIGNING is not set: this candidate is ad-hoc signed, so TCC grants will not carry over to the next candidate."
            exit 0
          fi
          password=$(jq -r .password <<<"$QA_MAC_SIGNING")
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          echo "::add-mask::$keychain_password"
          keychain="$RUNNER_TEMP/qa-identity.keychain-db"
          jq -r .p12_base64 <<<"$QA_MAC_SIGNING" | base64 --decode > "$RUNNER_TEMP/qa-identity.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/qa-identity.p12" -k "$keychain" -P "$password" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/qa-identity.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identities=$(security find-identity -p codesigning "$keychain")
          if grep -q '"Developer ID' <<<"$identities"; then
            echo "::error::QA_MAC_SIGNING holds a Developer ID identity. The QA lane never signs with Developer ID."
            exit 1
          fi
          fingerprint=$(grep -Eo '[0-9A-F]{40}' <<<"$identities" | sort -u)
          if [ -z "$fingerprint" ] || [ "$(wc -l <<<"$fingerprint")" -ne 1 ]; then
            echo "::error::QA_MAC_SIGNING must hold exactly one code-signing identity."
            exit 1
          fi
          echo "ASKTOTO_MAC_SIGN_IDENTITY=$fingerprint" >> "$GITHUB_ENV"
      - name: Build the ${{ matrix.variant }} installers
        run: npm run ${{ matrix.script }}
      - name: Refuse any installer over GitHub's per-asset limit
        run: npm run check:release
        env:
          ASKTOTO_ARTIFACTS_DIR: release
      - name: Stage and hash the installers
        run: node scripts/qa/provenance.mjs stage ${{ matrix.variant }} release candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-${{ matrix.variant }}
          path: candidate/assets/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.variant }}
          path: candidate/build-${{ matrix.variant }}.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
      - name: Remove the QA keychain
        if: always() && steps.identity.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.identity.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN"

  build-win:
    name: Build win
    needs: guard
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Build once
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "::error::A candidate is built once. Dispatch a new run; its bytes are a new candidate."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Provision the reviewed ffmpeg sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ffmpeg-sidecar-v1 --repo "$GITHUB_REPOSITORY" --pattern 'ffmpeg-win32-x64.exe' --dir resources/ffmpeg
          mkdir -p resources/ffmpeg/win32-x64
          mv resources/ffmpeg/ffmpeg-win32-x64.exe resources/ffmpeg/win32-x64/ffmpeg.exe
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            resources/models
            resources/asr
            resources/ort
            resources/llama
            resources/local-llm
          key: runtime-assets-${{ runner.os }}-${{ hashFiles('scripts/fetch-models.mjs', 'resources/runtime-assets-manifest.json') }}-${{ hashFiles('scripts/fetch-llama-server.mjs') }}-${{ hashFiles('scripts/fetch-local-model.mjs', 'scripts/local-model-assets.mjs') }}
      # No signing secret reaches this job, so electron-builder leaves both installers unsigned.
      - name: Build the win installers
        run: npm run dist:win
      - name: Refuse any installer over GitHub's per-asset limit
        run: npm run check:release
        env:
          ASKTOTO_ARTIFACTS_DIR: release
      - name: Stage and hash the installers
        run: node scripts/qa/provenance.mjs stage win release candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-win
          path: candidate/assets/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-win
          path: candidate/build-win.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  provenance:
    name: Record provenance
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-*
          path: builds
          merge-multiple: true
      - name: Assemble provenance.json and SHA256SUMS.txt
        run: |
          node scripts/qa/provenance.mjs assemble builds provenance
          { echo "### Candidate $GITHUB_RUN_ID"; echo '```'; cat provenance/SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-provenance
          path: provenance/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  smoke-mac:
    name: Install and launch ${{ matrix.variant }} by sha256
    needs: provenance
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      matrix:
        variant: [mac, mac-qa-identity]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-provenance
          path: provenance
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-${{ matrix.variant }}
          path: assets
      - name: Verify every byte against the provenance
        run: node scripts/qa/provenance.mjs verify provenance/provenance.json assets ${{ matrix.variant }}
      - name: Install each installer, check its signature, launch it
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          expected=$(jq -r --arg v "$VARIANT" '.builds[] | select(.variant == $v) | .signing.certificate_sha1 // "ad-hoc"' provenance/provenance.json)
          run_id=$(jq -r '.run.id' provenance/provenance.json)
          mkdir -p launch-reports
          for installer in assets/*; do
            name=$(basename "$installer")
            sha=$(jq -r --arg v "$VARIANT" --arg n "$name" '.builds[] | select(.variant == $v) | .assets[] | select(.name == $n) | .sha256' provenance/provenance.json)
            target="$RUNNER_TEMP/installed"
            rm -rf "$target" && mkdir -p "$target"
            case "$installer" in
              *.dmg)
                volume="$RUNNER_TEMP/volume"
                hdiutil attach -nobrowse -readonly -mountpoint "$volume" "$installer" > /dev/null
                bundle=$(cd "$volume" && ls -d *.app)
                ditto "$volume/$bundle" "$target/$bundle"
                hdiutil detach "$volume" > /dev/null ;;
              *.zip) ditto -x -k "$installer" "$target" ;;
            esac
            app=$(find "$target" -maxdepth 1 -name '*.app' -print -quit)
            if [ "$expected" = ad-hoc ]; then
              # Capture codesign's output before grepping it: under `set -o pipefail`, `grep -q` can exit
              # the pipe early and make codesign die of SIGPIPE, which would fail this check even when
              # the signature is correct.
              details=$(codesign -dv "$app" 2>&1)
              grep -qx 'Signature=adhoc' <<<"$details" \
                || { echo "::error::$installer is not ad-hoc signed, but its provenance says it is."; exit 1; }
            else
              rm -rf "$RUNNER_TEMP/certificate" && mkdir "$RUNNER_TEMP/certificate"
              codesign -d --extract-certificates="$RUNNER_TEMP/certificate/c" "$app"
              [ "$(shasum -a 1 "$RUNNER_TEMP/certificate/c0" | cut -d' ' -f1)" = "$expected" ] \
                || { echo "::error::$installer is not signed with the QA certificate its provenance records."; exit 1; }
            fi
            ASKTOTO_MAC_LAUNCH_GATE=1 node scripts/check-packaged-launch.mjs "$app" \
              --report "launch-reports/$name.launch.json" \
              --installer "$name" \
              --artifact-sha256 "$sha" \
              --candidate-run "$run_id" \
              --signature "$expected"
          done
      - name: Require a PASS report per installer, bound to the provenance sha256
        if: always()
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          status=0
          for installer in assets/*; do
            name=$(basename "$installer")
            sha=$(jq -r --arg v "$VARIANT" --arg n "$name" '.builds[] | select(.variant == $v) | .assets[] | select(.name == $n) | .sha256' provenance/provenance.json)
            jq -e --arg n "$name" --arg h "$sha" '.installer == $n and .verdict == "PASS" and .artifact_sha256 == $h' "launch-reports/$name.launch.json" > /dev/null \
              || { echo "::error::$name has no PASS launch report bound to its provenance sha256."; status=1; }
          done
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: candidate-launch-${{ matrix.variant }}
          path: launch-reports/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  smoke-win:
    name: Install and launch win by sha256
    needs: provenance
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-provenance
          path: provenance
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-win
          path: assets
      - name: Verify every byte against the provenance
        run: node scripts/qa/provenance.mjs verify provenance/provenance.json assets win
      - name: Install the Setup silently and launch it, then launch the Portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $provenance = Get-Content provenance/provenance.json -Raw | ConvertFrom-Json
          $runId = $provenance.run.id
          $assets = ($provenance.builds | Where-Object { $_.variant -eq 'win' }).assets
          New-Item -ItemType Directory -Force launch-reports | Out-Null
          $signatures = @{}
          foreach ($exe in Get-ChildItem assets -Filter *.exe) {
            $status = (Get-AuthenticodeSignature $exe.FullName).Status
            if ($status -ne 'NotSigned') { throw "$($exe.Name) is signed; Windows candidates are unsigned." }
            $signatures[$exe.Name] = [string]$status
          }
          $target = Join-Path $env:RUNNER_TEMP 'installed'
          $setup = Get-Item assets/Metis-Setup-*.exe
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Setup exited with $($install.ExitCode)." }
          # One report per promotable installer: the Setup's is the launch of what it installed.
          $portable = Get-Item assets/Metis-Portable-*.exe
          $launches = @(
            @{ Installer = $setup; Exe = (Join-Path $target 'Metis.exe') },
            @{ Installer = $portable; Exe = $portable.FullName }
          )
          foreach ($launch in $launches) {
            $name = $launch.Installer.Name
            $sha = ($assets | Where-Object { $_.name -eq $name }).sha256
            node scripts/check-packaged-launch.mjs $launch.Exe --report "launch-reports/$name.launch.json" --installer $name --artifact-sha256 $sha --candidate-run $runId --signature ($signatures[$name])
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Require a PASS report per installer, bound to the provenance sha256
        if: always()
        shell: pwsh
        run: |
          $provenance = Get-Content provenance/provenance.json -Raw | ConvertFrom-Json
          $assets = ($provenance.builds | Where-Object { $_.variant -eq 'win' }).assets
          $failed = $false
          foreach ($asset in $assets) {
            $path = "launch-reports/$($asset.name).launch.json"
            $report = if (Test-Path $path) { Get-Content $path -Raw | ConvertFrom-Json } else { $null }
            if ($null -eq $report -or $report.installer -ne $asset.name -or $report.verdict -ne 'PASS' -or $report.artifact_sha256 -ne $asset.sha256) {
              Write-Output "::error::$($asset.name) has no PASS launch report bound to its provenance sha256."
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: candidate-launch-win
          path: launch-reports/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  # Report-only per owner decision OD-24; M2-0433 makes it blocking again once ST-1 passes strictly (OD-21).
  st1-mac-fifo:
    name: ST-1 fifo stall row (macOS)
    needs: provenance
    runs-on: macos-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-provenance
          path: provenance
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-mac-qa-identity
          path: assets
      - name: Verify every byte against the provenance
        run: node scripts/qa/provenance.mjs verify provenance/provenance.json assets mac-qa-identity
      - name: Measure packaged stall resilience
        continue-on-error: true
        run: |
          mkdir -p st1-report
          installer=$(find assets -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$installer" ]; then
            echo "::error::candidate-mac-qa-identity did not contain a zip installer for ST-1."
            exit 1
          fi
          node scripts/qa/st-1.mjs \
            --installer "$installer" \
            --provenance provenance/provenance.json \
            --fixtures fifo \
            --minutes 5 \
            --out st1-report/st-1-macos-fifo.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: st-1-macos-fifo
          path: st1-report/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  # Report-only: the same candidate and measurement with no fixture, so a block the fifo row shows can be
  # told apart from a block that happens at every launch. Its verdict never fails the run.
  st1-mac-control:
    name: ST-1 control (no fixtures)
    needs: provenance
    runs-on: macos-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-provenance
          path: provenance
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-mac-qa-identity
          path: assets
      - name: Verify every byte against the provenance
        run: node scripts/qa/provenance.mjs verify provenance/provenance.json assets mac-qa-identity
      - name: Measure the packaged app with no fixture
        continue-on-error: true
        run: |
          mkdir -p st1-report
          installer=$(find assets -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$installer" ]; then
            echo "::error::candidate-mac-qa-identity did not contain a zip installer for ST-1."
            exit 1
          fi
          node scripts/qa/st-1.mjs \
            --installer "$installer" \
            --provenance provenance/provenance.json \
            --fixtures none \
            --minutes 5 \
            --out st1-report/st-1-macos-none.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: st-1-macos-control
          path: st1-report/
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  # Blocking: a candidate whose QA capture source does not engage cannot satisfy the 1 h meeting scenario's
  # acceptance evidence. Runs this run's QA-identity bytes on a fresh profile with a WAV as the microphone.
  capture-file-smoke-mac:
    name: File-fed capture smoke (macOS QA identity)
    needs: provenance
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-provenance
          path: provenance
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-mac-qa-identity
          path: assets
      - name: Verify every byte against the provenance
        run: node scripts/qa/provenance.mjs verify provenance/provenance.json assets mac-qa-identity
      - name: Feed a WAV as the microphone, Listen, Stop, read the saved meeting
        run: |
          installer=$(find assets -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$installer" ]; then
            echo "::error::candidate-mac-qa-identity did not contain a zip installer."
            exit 1
          fi
          node scripts/qa/meeting/file-capture-smoke.mjs --installer "$installer" --out capture-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: capture-file-smoke-mac
          path: capture-report/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  # Report-only measurement (M2-0516), never a gate and never ST-1 evidence: short launches (--purpose
  # window-construction, st1Evidence: false) that build the boot window under each QA-identity rendering variant,
  # in both chromes, twice, interleaved, all on this one runner so the numbers compare. A first-run profile builds
  # the opaque exclusive onboarding window; an onboarded bar profile builds the transparent overlay. Each report's
  # bootStages carries createWindow.construct (with the chrome and variant built), createWindow.navigate and
  # createWindow.firstShow.
  st1-mac-window:
    name: ST-1 window construction per variant and chrome (report-only)
    needs: provenance
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-provenance
          path: provenance
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-mac-qa-identity
          path: assets
      - name: Verify every byte against the provenance
        run: node scripts/qa/provenance.mjs verify provenance/provenance.json assets mac-qa-identity
      - name: Measure the window constructor per variant and chrome
        continue-on-error: true
        run: |
          mkdir -p st1-report onboarded-profile
          installer=$(find assets -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$installer" ]; then
            echo "::error::candidate-mac-qa-identity did not contain a zip installer for ST-1."
            exit 1
          fi
          # The durable settings of a user who finished onboarding with the bar layout (plain JSON is a supported read path).
          printf '{"onboardingDone":true,"onboardingDoneAt":%s000,"recordingConsent":true,"overlayLayout":"bar","autoHideOverlay":false}\n' "$(date +%s)" > onboarded-profile/settings.json
          for repeat in 1 2; do
            for variant in shipped spellcheck-off paint-when-hidden prewarm-spellchecker prewarm-view; do
              for chrome in opaque transparent; do
                template=()
                if [ "$chrome" = transparent ]; then template=(--profile-template onboarded-profile); fi
                run="window-$variant-$chrome-$repeat"
                node scripts/qa/st-1.mjs \
                  --installer "$installer" \
                  --provenance provenance/provenance.json \
                  --fixtures none \
                  "${template[@]}" \
                  --minutes 0.5 \
                  --purpose window-construction \
                  --window-variant "$variant" \
                  --report-dir "st1-report/$run" \
                  --out "st1-report/$run/$run.json" \
                  || echo "::warning::$run ended without PASS; its report says why."
              done
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: st-1-macos-window
          path: st1-report/
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  st1-windows-external:
    name: ST-1-W external unblock record
    needs: provenance
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-provenance
          path: provenance
      - name: Record the Windows ST-1-W unblock step
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force st1-report | Out-Null
          @'
          {
            "harness": "ST-1-W",
            "verdict": "BLOCKED_EXTERNAL",
            "reason": "Requires a managed Windows QA laptop or hosted account with real cloud-provider dataless placeholders.",
            "unblockStep": "Run scripts/qa/st-1.mjs against the verified candidate installer on the managed Windows QA laptop with --fixtures dataless, --cloud-dir pointing at evicted placeholder files, --main-log pointing at the candidate main log, --minutes 5, and upload the JSON report.",
            "provenanceArtifact": "candidate-provenance"
          }
          '@ | Set-Content -NoNewline st1-report/st-1-windows-blocked.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: st-1-windows-blocked
          path: st1-report/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
