name: Runtime candidate provenance readback

on:
  push:
    branches:
      - m2/M2-0475-runtime-artifact-publisher
      - m2/runtime-candidate-readback-four-root
    paths:
      - .github/workflows/runtime-candidate-readback.yml
      - package.json
      - package-lock.json
      - resources/runtime-catalog.json
      - resources/runtime-trust/**
      - scripts/runtime-payload/**

permissions:
  contents: read

jobs:
  verify-retained-llama-candidate:
    name: Verify retained native and model candidate provenance
    if: github.repository == 'mysticalsin/AskToto-Mantu'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install frozen verifier dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check bounded duplicate-aware JSON and closed inventory fixtures
        run: node --test scripts/runtime-payload/verify-retained-candidate-readback.test.mjs
      - name: Check maintained Sigstore DER claim parsing boundaries
        run: node scripts/runtime-payload/check-sigstore-claim-der.mjs
      - name: Confirm exact retained workflow run and artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api repos/mysticalsin/AskToto-Mantu/actions/runs/38626866933 >"$RUNNER_TEMP/runtime-run-metadata.json" 2>/dev/null; then
            echo 'RUNTIME_READBACK_RUN_METADATA_UNAVAILABLE'
            exit 1
          fi
          jq -e '
            .id == 38626866933 and
            .event == "push" and
            .status == "completed" and
            .conclusion == "success" and
            .head_sha == "613d7886504f608766022fa740b1ed7297e17b16" and
            .head_branch == "m2/M2-0475-runtime-artifact-publisher" and
            .run_attempt == 1 and
            .path == ".github/workflows/runtime-llama-candidate.yml" and
            .head_repository.id == 1282463398 and
            .head_repository.full_name == "mysticalsin/AskToto-Mantu"
          ' "$RUNNER_TEMP/runtime-run-metadata.json" >/dev/null || {
            echo 'RUNTIME_READBACK_RUN_METADATA_MISMATCH'
            exit 1
          }
          if ! gh api repos/mysticalsin/AskToto-Mantu/actions/runs/38626866933/artifacts >"$RUNNER_TEMP/runtime-artifact-metadata.json" 2>/dev/null; then
            echo 'RUNTIME_READBACK_ARTIFACT_METADATA_UNAVAILABLE'
            exit 1
          fi
          jq -e '
            [.artifacts[] | select(
              .id == 11924496850 and
              .name == "runtime-attested-llama-candidates-613d7886504f608766022fa740b1ed7297e17b16-1" and
              .size_in_bytes == 760446612 and
              .digest == "sha256:e4187aec2cba8e11735fab02d3f42f9952561478359960cff8d280f265de3568" and
              .workflow_run.id == 38626866933 and
              .workflow_run.head_sha == "613d7886504f608766022fa740b1ed7297e17b16" and
              .workflow_run.head_branch == "m2/M2-0475-runtime-artifact-publisher" and
              .workflow_run.repository_id == 1282463398 and
              .expired == false
            )] | length == 1
          ' "$RUNNER_TEMP/runtime-artifact-metadata.json" >/dev/null || {
            echo 'RUNTIME_READBACK_ARTIFACT_METADATA_MISMATCH'
            exit 1
          }
          echo 'RUNTIME_READBACK_FIXED_RUN_AND_ARTIFACT_METADATA_OK'
      - name: Download the exact retained candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          repository: mysticalsin/AskToto-Mantu
          run-id: '38626866933'
          artifact-ids: '11924496850'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/runtime-candidate-readback
          merge-multiple: true
      - name: Verify app-pinned trust root and all four signed payload roots
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          RUNTIME_CANDIDATE_READBACK: ${{ runner.temp }}/runtime-candidate-readback
        run: node scripts/runtime-payload/verify-retained-candidate-readback.mjs
