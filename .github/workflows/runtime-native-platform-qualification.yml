name: Runtime native and platform qualification

on:
  push:
    paths:
      - .github/workflows/runtime-native-platform-qualification.yml
      - package.json
      - package-lock.json
      - vitest.config.ts
      - scripts/fetch-llama-server.mjs
      - scripts/check-llama-sidecar.mjs
      - scripts/local-model-assets.mjs
      - scripts/fetch-local-model.mjs
      - scripts/check-local-model.mjs
      - scripts/verify-native-runtime-qualification-inputs.mjs
      - scripts/validate-native-platform-qualification.mjs
      - src/main/llm/local-runtime.ts
      - src/main/llm/local-runtime.test.ts
      - src/main/llm/local-runtime.native-qualification.test.ts
      - src/main/llm/local-models.ts
      - src/main/infra/process/supervisor.ts
      - src/main/features/components/speech-pack/runtime-archive.ts
      - src/main/features/components/speech-pack/runtime-archive.test.ts
      - src/main/features/components/speech-pack/runtime-archive.windows-pipe.test.ts
      - src/main/features/components/speech-pack/runtime-archive.windows-pipe-child.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-native-platform-qualification-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  native:
    name: Native runtime (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: darwin
            arch: arm64
          - label: macOS x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
          - label: Windows x64
            runner: windows-2022
            platform: win32
            arch: x64
    env:
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install repository test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Provision pinned native llama runtime
        run: |
          if [[ "$EXPECTED_PLATFORM" == darwin ]]; then
            node scripts/fetch-llama-server.mjs mac
            node scripts/check-llama-sidecar.mjs mac
          else
            node scripts/fetch-llama-server.mjs win
            node scripts/check-llama-sidecar.mjs win
          fi
      - name: Provision and check pinned Qwen model payload
        run: |
          node scripts/fetch-local-model.mjs
          node scripts/check-local-model.mjs
      - name: Verify host, archive, executable architecture and exact input digests
        run: NATIVE_INPUT_REPORT="$RUNNER_TEMP/native-inputs.json" node scripts/verify-native-runtime-qualification-inputs.mjs
      - name: Keep macOS supervision fallback classification explicit
        if: matrix.platform == 'darwin'
        run: |
          if [[ -e resources/mac-helper/metis-mac-helper ]]; then
            echo 'NATIVE_SUPERVISION=unqualified-helper-present' >&2
            exit 1
          fi
          echo 'NATIVE_SUPERVISION=direct-fallback-wrapper-missing'
      - name: Run required native integration and Windows pipe fixture
        id: native-tests
        env:
          NATIVE_CASE_REPORT: ${{ runner.temp }}/native-cases.json
        run: |
          files=(src/main/llm/local-runtime.native-qualification.test.ts)
          if [[ "$EXPECTED_PLATFORM" == win32 ]]; then
            files+=(src/main/features/components/speech-pack/runtime-archive.windows-pipe.test.ts)
          fi
          set -o pipefail
          ./node_modules/.bin/vitest run "${files[@]}" --reporter=json --outputFile="$RUNNER_TEMP/native-vitest.json" --testTimeout=60000 --dangerouslyIgnoreUnhandledErrors=false 2>&1 | tee "$RUNNER_TEMP/native-vitest.log"
      - name: Require exact, nonempty, all-pass reports
        if: always()
        env:
          NATIVE_TEST_STEP_OUTCOME: ${{ steps.native-tests.outcome }}
        run: |
          if [[ ! -s "$RUNNER_TEMP/native-vitest.json" || ! -s "$RUNNER_TEMP/native-inputs.json" || ! -s "$RUNNER_TEMP/native-vitest.log" || ! -s "$RUNNER_TEMP/native-cases.json" ]]; then
            echo 'NATIVE_QUALIFICATION_REPORT_MISSING' >&2
            exit 1
          fi
          node scripts/validate-native-platform-qualification.mjs "$RUNNER_TEMP/native-vitest.json" "$RUNNER_TEMP/native-inputs.json" "$RUNNER_TEMP/native-qualification.json" "$RUNNER_TEMP/native-cases.json"
      - name: Retain actual test, input and qualification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-native-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-vitest.json
            ${{ runner.temp }}/native-vitest.log
            ${{ runner.temp }}/native-cases.json
            ${{ runner.temp }}/native-inputs.json
            ${{ runner.temp }}/native-qualification.json
          if-no-files-found: warn
          retention-days: 14
