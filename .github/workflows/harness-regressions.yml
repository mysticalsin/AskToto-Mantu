name: Harness regression qualification

on:
  push:
    branches:
      - fix/windows-harness-regressions
    paths:
      - .github/workflows/harness-regressions.yml
      - src/main/index.ts
      - src/main/speaker-id-off-switch.test.ts
      - src/renderer/src/App.tsx
      - src/renderer/src/app-listen-identity.test.ts
      - src/renderer/src/lib/listen-startup-policy.ts
  pull_request:
    paths:
      - .github/workflows/harness-regressions.yml
      - src/main/index.ts
      - src/main/speaker-id-off-switch.test.ts
      - src/renderer/src/App.tsx
      - src/renderer/src/app-listen-identity.test.ts
      - src/renderer/src/lib/listen-startup-policy.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    name: Focused harness tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run both VM harness suites without retries
        env:
          METIS_CI_ROOT_REPORT: ${{ runner.temp }}/harness-regressions-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}.json
        run: |
          node node_modules/vitest/vitest.mjs run --config vitest.config.ts --maxWorkers=2 --retry=0 \
            src/main/speaker-id-off-switch.test.ts \
            src/renderer/src/app-listen-identity.test.ts
      - name: Verify complete focused test report
        if: always()
        env:
          REPORT: ${{ runner.temp }}/harness-regressions-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}.json
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs')
          const report = JSON.parse(readFileSync(process.env.REPORT, 'utf8'))
          const expected = new Map([
            ['src/main/speaker-id-off-switch.test.ts', 10],
            ['src/renderer/src/app-listen-identity.test.ts', 3]
          ])
          const results = report.testResults ?? []
          const files = results.map((item) => String(item.name).replaceAll('\\', '/'))
          const passed = report.numPassedTests
          const failed = report.numFailedTests
          const pending = report.numPendingTests
          const todo = report.numTodoTests
          const skipped = pending + todo
          const total = report.numTotalTests
          console.log(`head=${process.env.GITHUB_SHA} os=${process.env.RUNNER_OS} files=${files.length} passed=${passed} failed=${failed} skipped=${skipped} total=${total}`)
          const completeFiles = results.length === expected.size && [...expected].every(([file, count]) => {
            const matches = results.filter((item) => String(item.name).replaceAll('\\', '/').endsWith(file))
            return matches.length === 1 && matches[0].status === 'passed' &&
              Array.isArray(matches[0].assertionResults) && matches[0].assertionResults.length === count &&
              matches[0].assertionResults.every((assertion) => assertion.status === 'passed')
          })
          if (report.success !== true || !completeFiles ||
              ![passed, failed, pending, todo, total].every(Number.isSafeInteger) ||
              total !== 13 || passed !== total || failed !== 0 || skipped !== 0) {
            throw new Error('Focused harness report is incomplete or not fully green')
          }
          NODE
