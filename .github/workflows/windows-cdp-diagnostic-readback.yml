name: Windows CDP diagnostic readback
run-name: ${{ github.event_name == 'pull_request' && 'Windows CDP diagnostic readback (registration)' || 'Windows CDP diagnostic readback (one pinned report only)' }}

# Disposable evidence reader. Remove after one hosted observation, no later than 48 hours after the
# 2026-10-09 source run. Dispatch is disabled after 2026-10-11T18:00:00Z. This cannot accept
# onboarding, run an installer, publish a release, or replace the separate failed 15-second run.
on:
  pull_request:
    paths:
      - .github/workflows/windows-cdp-diagnostic-readback.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-cdp-diagnostic-readback
  cancel-in-progress: false

jobs:
  readback:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'mysticalsin/AskToto-Mantu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Validate and read back only the pinned fixed-enum diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qa/windows-cdp-diagnostic-readback.mjs
