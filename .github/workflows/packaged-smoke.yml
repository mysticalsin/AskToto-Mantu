name: Packaged smoke

# Builds the unsigned app on the hosted macOS and Windows runners with no repository secret (macOS
# carries electron-builder's ad-hoc signature, Windows is unsigned), installs it from the shipped
# installer into a fresh directory, and runs scripts/qa/packaged-smoke.mjs on a fresh profile: the app
# starts, its renderer reports ready, hosted-runner reopen routes produce reveal audit evidence, it quits
# cleanly through its own Quit path, and nothing it started is alive 5 s after it exits. Each job uploads a
# content-free report with the RV matrix and the tested installer's sha256.
#
# Runs when a PR into m2/integration is marked ready for review, on every push to m2/integration, and
# on demand for any branch once this file is on the default branch:
# gh workflow run packaged-smoke.yml --ref <branch>. Never on tags. Both hosted runners give the app a
# real window session, so no virtual display is needed.
on:
  pull_request:
    types: [ready_for_review]
    branches:
      - m2/integration
  push:
    branches:
      - m2/integration
    tags-ignore:
      - '**'
  workflow_dispatch:
    inputs:
      hk_m_cycles:
        description: 'HK-M cycles: 1 is the per-PR smoke, 20 rehearses the candidate proof (fails unless every row passes)'
        type: choice
        options:
          - '1'
          - '20'
        default: '1'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  mac:
    name: Packaged smoke (macOS)
    runs-on: macos-latest
    # Only the 20-cycle rehearsal (140 min HK-M step) needs more than the default 120 min.
    timeout-minutes: ${{ inputs.hk_m_cycles == '20' && 180 || 120 }}
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # predist's check-ffmpeg-sidecar.mjs verifies each binary against resources/ffmpeg/manifest.json
      # before running it, so trust comes from that hash, not from the download or from Gatekeeper.
      - name: Provision the reviewed ffmpeg sidecars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ffmpeg-sidecar-v1 --repo "$GITHUB_REPOSITORY" --pattern 'ffmpeg-darwin-*' --dir resources/ffmpeg
          for arch in arm64 x64; do
            mkdir -p "resources/ffmpeg/darwin-$arch"
            mv "resources/ffmpeg/ffmpeg-darwin-$arch" "resources/ffmpeg/darwin-$arch/ffmpeg"
            chmod +x "resources/ffmpeg/darwin-$arch/ffmpeg"
            xattr -d com.apple.quarantine "resources/ffmpeg/darwin-$arch/ffmpeg" 2>/dev/null || true
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      # Same key as build.yml and qa-candidate.yml. fetch-models.mjs reuses cached files only after its
      # exact manifest gate.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            resources/models
            resources/asr
            resources/ort
            resources/llama
            resources/local-llm
          key: runtime-assets-${{ runner.os }}-${{ hashFiles('scripts/fetch-models.mjs', 'resources/runtime-assets-manifest.json') }}-${{ hashFiles('scripts/fetch-llama-server.mjs') }}-${{ hashFiles('scripts/fetch-local-model.mjs', 'scripts/local-model-assets.mjs') }}
      - name: Build the unsigned app
        run: npm run dist
      - name: Install from the DMG into a fresh directory
        run: |
          mkdir -p smoke-report
          shasum -a 256 release/Metis-*.dmg > smoke-report/SHA256SUMS.txt
          volume="$RUNNER_TEMP/volume"
          hdiutil attach -nobrowse -readonly -mountpoint "$volume" release/Metis-*.dmg > /dev/null
          ditto "$volume/Metis.app" "$RUNNER_TEMP/smoke/Metis.app"
          hdiutil detach "$volume" > /dev/null
      # continue-on-error so a genuine sidecar-boot-reaper defect can never hide the RV/HIST rows below by
      # aborting the job early (INTEGRATION-SMOKE-RED-2026-09-28); it is still surfaced by the gate step
      # after the artifact upload, via steps.sidecar-reaper.outcome (unaffected by continue-on-error).
      - name: Prove sidecar boot reaper after SIGKILL
        id: sidecar-reaper
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/qa/sidecar-boot-reaper.mjs "$RUNNER_TEMP/smoke/Metis.app" smoke-report/sidecar-boot-reaper.json
      - name: Verify packaged macOS signature
        run: codesign --verify --deep --strict "$RUNNER_TEMP/smoke/Metis.app"
      # Behaviour proof of the shipped helper's `supervise` mode (setup-failure statuses, exit-status and stdio
      # pass-through, signal forwarding, group kill on parent death including a TERM-ignoring member).
      - name: Prove mac-helper supervise behaviour
        id: supervise-helper
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/qa/mac-helper-supervise.mjs "$RUNNER_TEMP/smoke/Metis.app/Contents/Resources/mac-helper/metis-mac-helper" smoke-report/mac-helper-supervise.json
      # continue-on-error for the same reason as sidecar-reaper above: HK-M's own report.result already
      # distinguishes a genuine owned-process leak ('fail') from a scenario this hosted runner cannot yet
      # trigger live ('blocked', e.g. a row whose bundled model or ffmpeg sidecar is missing on the
      # runner) — only the former should ever red the smoke lane. The gate step below
      # reads smoke-report/hk-m.json (not just the step outcome, since 'blocked' also exits non-zero) to
      # make that distinction. HK-M runs in its default 'shipped' supervision mode: the app's own default decides.
      - name: Prove HK-M supervised sidecar cleanup after SIGKILL
        id: hk-m
        continue-on-error: true
        timeout-minutes: ${{ inputs.hk_m_cycles == '20' && 140 || 25 }}
        # One SIGKILL per scenario under a 20 min wall-clock budget: hk-m.mjs prints a line per row and writes
        # its report (unreached rows NOT_RUN) even when cut off. The 20-cycle proof on the candidate runs in
        # hk-m-candidate.yml; a manual dispatch with hk_m_cycles=20 rehearses it on this run's own build with
        # the same 8100000 ms budget, below the 140 min step timeout so the report is still written.
        env:
          HK_M_CYCLES: ${{ inputs.hk_m_cycles == '20' && '20' || '1' }}
          HK_M_BUDGET_MS: ${{ inputs.hk_m_cycles == '20' && '8100000' || '1200000' }}
        run: node scripts/qa/hk-m.mjs "$RUNNER_TEMP/smoke/Metis.app" smoke-report/hk-m.json --cycles "$HK_M_CYCLES" --budget-ms "$HK_M_BUDGET_MS"
      # ADR-018 (M2-0039): this build's parked Hide overlay, real pointer from rest into the right-edge band, net
      # reveal latency p95 <= 150 ms. continue-on-error so the report is always uploaded; the gate step after the
      # upload fails the job on FAIL and warns on BLOCKED_EXTERNAL (a runner that cannot move the pointer).
      - name: Measure parked reveal latency (ADR-018)
        id: reveal-latency
        continue-on-error: true
        timeout-minutes: 10
        run: |
          node scripts/qa/census/profile.mjs "$RUNNER_TEMP/metis-reveal-profile" --overlay-layout hide
          node scripts/qa/census/reveal-latency.mjs --app "$RUNNER_TEMP/smoke/Metis.app" --profile "$RUNNER_TEMP/metis-reveal-profile" --output smoke-report/reveal-latency.json
      - name: Launch, exercise RV reopen routes, quit cleanly, and check that nothing survives
        id: smoke
        timeout-minutes: 10
        run: node scripts/qa/packaged-smoke.mjs "$RUNNER_TEMP/smoke/Metis.app" smoke-report/packaged-smoke.json
      # Report-only probe (M2-0472): does the one-click Repair command, /usr/bin/tccutil reset ScreenCapture
      # <own bundle id>, succeed as the runner user without sudo? Row A measures the installed app as it is;
      # row B (workflow_dispatch only) seeds a ScreenCapture row into this throwaway runner's system TCC
      # database with sudo first. The seed is test setup only: sudo never touches the tccutil call, and no
      # other service or bundle id is ever reset. The step cannot fail the job; the report is content-free.
      - name: Probe tccutil reset ScreenCapture without sudo (report only)
        id: tccutil-probe
        if: ${{ always() && !cancelled() && steps.smoke.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +eo pipefail
          rows="$RUNNER_TEMP/tccutil-rows.ndjson"
          : > "$rows"
          tcc_db="/Library/Application Support/com.apple.TCC/TCC.db"
          uid=$(id -u)
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/smoke/Metis.app/Contents/Info.plist" 2>/dev/null)

          emit() {
            ROW="$1" STATUS="$2" BEFORE="$3" AFTER="$4" CODE="$5" CLASS="$6" ERR="$7" REASON="$8" node -e '
              const e = process.env
              console.log(JSON.stringify({
                row: e.ROW,
                status: e.STATUS,
                entry_before: e.BEFORE || null,
                entry_after: e.AFTER || null,
                exit_code: e.CODE === "" ? null : Number(e.CODE),
                stderr_class: e.CLASS || null,
                stderr: e.ERR,
                reason: e.REASON || null
              }))' >> "$rows"
          }

          # true, false or unknown; an unreadable database is unknown, never false.
          tcc_has() {
            n=$($1 sqlite3 -readonly "$tcc_db" "SELECT count(*) FROM access WHERE service='kTCCServiceScreenCapture' AND client='$bundle';" 2>/dev/null)
            case "$n" in 0) echo false ;; [1-9]*) echo true ;; *) echo unknown ;; esac
          }

          reset_once() {
            err=$(/usr/bin/tccutil reset ScreenCapture "$bundle" 2>&1 >/dev/null)
            code=$?
            if [ "$code" -eq 0 ]; then class=success
            elif printf '%s' "$err" | grep -q 'No such bundle'; then class=no-such-bundle
            elif printf '%s' "$err" | grep -q 'Failed to reset'; then class=failed
            else class=other; fi
            err=$(printf '%s' "$err" | sed -e "s|$bundle|<bundle>|g" -e 's|/[^ ]*|<path>|g' | tr '\n' ' ' | cut -c1-200)
          }

          sip_status=$(csrutil status 2>/dev/null)
          case "$sip_status" in *enabled*) sip=enabled ;; *disabled*) sip=disabled ;; *) sip=unknown ;; esac

          if ! printf '%s' "$bundle" | grep -Eq '^[A-Za-z0-9.-]+$'; then
            emit A BLOCKED_EXTERNAL '' '' '' '' '' 'bundle id unreadable from the installed Info.plist'
          elif [ "$uid" -eq 0 ]; then
            emit A BLOCKED_EXTERNAL '' '' '' '' '' 'runner user is root, so a non-sudo reset cannot be measured'
          else
            before=$(tcc_has)
            reset_once
            emit A MEASURED "$before" "$(tcc_has)" "$code" "$class" "$err" ''

            if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
              emit B NOT_RUN '' '' '' '' '' 'seeded row runs on workflow_dispatch only'
            else
              sudo sqlite3 "$tcc_db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('kTCCServiceScreenCapture','$bundle',0,2,4,1);" 2>/dev/null
              if [ "$(tcc_has sudo)" != "true" ]; then
                emit B BLOCKED_EXTERNAL '' '' '' '' '' "system TCC database not writable (csrutil: $sip)"
              else
                reset_once
                emit B MEASURED true "$(tcc_has sudo)" "$code" "$class" "$err" ''
                sudo sqlite3 "$tcc_db" "DELETE FROM access WHERE service='kTCCServiceScreenCapture' AND client='$bundle';" 2>/dev/null
              fi
            fi
          fi

          MACOS=$(sw_vers -productVersion) SIP="$sip" UID_IS_ROOT=$([ "$uid" -eq 0 ] && echo true || echo false) ROWS_FILE="$rows" node -e '
            const fs = require("fs")
            const e = process.env
            const rows = fs.readFileSync(e.ROWS_FILE, "utf8").split("\n").filter(Boolean).map((line) => JSON.parse(line))
            fs.writeFileSync("smoke-report/tccutil-probe.json", JSON.stringify({
              schema: "metis.tccutil-probe.v1",
              macos: e.MACOS,
              sip: e.SIP,
              uid_is_root: e.UID_IS_ROOT === "true",
              rows
            }, null, 2) + "\n")
            console.log(rows.map((r) => `${r.row}=${r.status} before=${r.entry_before} after=${r.entry_after} exit=${r.exit_code} class=${r.stderr_class}`).join("; "))' > "$RUNNER_TEMP/tccutil-summary.txt"
          echo "::notice title=tccutil probe::$(cat "$RUNNER_TEMP/tccutil-summary.txt")"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && !cancelled() && (steps.sidecar-reaper.outcome != 'skipped' || steps.supervise-helper.outcome != 'skipped' || steps.hk-m.outcome != 'skipped' || steps.reveal-latency.outcome != 'skipped' || steps.smoke.outcome != 'skipped') }}
        with:
          name: packaged-smoke-macos
          path: smoke-report/
          if-no-files-found: error
          retention-days: 14
      - name: Fail the job if the sidecar boot reaper proof itself failed (not a BLOCKED_EXTERNAL row)
        if: always() && steps.sidecar-reaper.outcome == 'failure'
        run: exit 1
      - name: Fail the job if the mac-helper supervise behaviour proof failed
        if: always() && steps.supervise-helper.outcome == 'failure'
        run: exit 1
      - name: Fail the job if HK-M found a genuine owned-process leak (not a BLOCKED_EXTERNAL row)
        if: always() && steps.hk-m.outcome == 'failure'
        run: |
          result=$(node -e "console.log(JSON.parse(require('fs').readFileSync('smoke-report/hk-m.json','utf8')).result)")
          if [ "$result" = "fail" ]; then
            echo "HK-M reported a genuine owned-process cleanup failure (see smoke-report/hk-m.json)" >&2
            exit 1
          fi
          echo "::warning title=HK-M blocked::HK-M result=$result — not a live pass of every row; see smoke-report/hk-m.json for the exact unblock steps."
      - name: Fail the job if parked reveal latency failed (not a BLOCKED_EXTERNAL report)
        if: always() && steps.reveal-latency.outcome == 'failure'
        run: node scripts/qa/census/reveal-latency-gate.mjs smoke-report/reveal-latency.json
      # A rehearsal must be 100/100: fails on result=fail, result=blocked and any NOT_RUN row, and the job
      # summary names the cycle count. (bash runs with pipefail, so a failing node fails the step.)
      - name: Fail the HK-M rehearsal unless every row passed
        if: always() && inputs.hk_m_cycles == '20'
        run: |
          echo "### HK-M rehearsal: 20 cycles" >> "$GITHUB_STEP_SUMMARY"
          node -e "
            const r = JSON.parse(require('fs').readFileSync('smoke-report/hk-m.json', 'utf8'))
            const rows = r.rows || []
            const passed = rows.filter((row) => row.status === 'PASS').length
            const notRun = rows.filter((row) => row.status === 'NOT_RUN').length
            console.log('result=' + r.result + ', ' + passed + '/' + rows.length + ' rows PASS, ' + notRun + ' NOT_RUN')
            process.exit(r.result === 'pass' && notRun === 0 ? 0 : 1)
          " | tee -a "$GITHUB_STEP_SUMMARY"

  windows:
    name: Packaged smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Provision the reviewed ffmpeg sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ffmpeg-sidecar-v1 --repo "$GITHUB_REPOSITORY" --pattern 'ffmpeg-win32-x64.exe' --dir resources/ffmpeg
          mkdir -p resources/ffmpeg/win32-x64
          mv resources/ffmpeg/ffmpeg-win32-x64.exe resources/ffmpeg/win32-x64/ffmpeg.exe
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            resources/models
            resources/asr
            resources/ort
            resources/llama
            resources/local-llm
          key: runtime-assets-${{ runner.os }}-${{ hashFiles('scripts/fetch-models.mjs', 'resources/runtime-assets-manifest.json') }}-${{ hashFiles('scripts/fetch-llama-server.mjs') }}-${{ hashFiles('scripts/fetch-local-model.mjs', 'scripts/local-model-assets.mjs') }}
      # No signing secret reaches this job, so electron-builder leaves the installers unsigned.
      - name: Build the unsigned installers
        run: npm run dist:win
      - name: Record the installer's sha256
        run: |
          mkdir -p smoke-report
          sha256sum release/Metis-Setup-*.exe > smoke-report/SHA256SUMS.txt
      - name: Install the Setup silently into a fresh directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-Item release/Metis-Setup-*.exe
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$env:RUNNER_TEMP\smoke" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Setup exited with $($install.ExitCode)." }
      # continue-on-error so a genuine sidecar-boot-reaper defect can never hide the RV/HIST rows below by
      # aborting the job early (INTEGRATION-SMOKE-RED-2026-09-28); it is still surfaced by the gate step
      # after the artifact upload, via steps.sidecar-reaper.outcome (unaffected by continue-on-error).
      - name: Prove sidecar boot reaper after hard kill
        id: sidecar-reaper
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/qa/sidecar-boot-reaper.mjs "$RUNNER_TEMP/smoke/Metis.exe" smoke-report/sidecar-boot-reaper.json
      # ADR-018 (M2-0039): same measurement and gate as the mac job.
      - name: Measure parked reveal latency (ADR-018)
        id: reveal-latency
        continue-on-error: true
        timeout-minutes: 10
        run: |
          node scripts/qa/census/profile.mjs "$RUNNER_TEMP/metis-reveal-profile" --overlay-layout hide
          node scripts/qa/census/reveal-latency.mjs --app "$RUNNER_TEMP/smoke/Metis.exe" --profile "$RUNNER_TEMP/metis-reveal-profile" --output smoke-report/reveal-latency.json
      - name: Launch, exercise RV reopen routes, quit cleanly, and check that nothing survives
        id: smoke
        timeout-minutes: 10
        run: node scripts/qa/packaged-smoke.mjs "$RUNNER_TEMP/smoke/Metis.exe" smoke-report/packaged-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && !cancelled() && (steps.sidecar-reaper.outcome != 'skipped' || steps.reveal-latency.outcome != 'skipped' || steps.smoke.outcome != 'skipped') }}
        with:
          name: packaged-smoke-windows
          path: smoke-report/
          if-no-files-found: error
          retention-days: 14
      - name: Fail the job if the sidecar boot reaper proof itself failed (not a BLOCKED_EXTERNAL row)
        if: always() && steps.sidecar-reaper.outcome == 'failure'
        run: exit 1
      - name: Fail the job if parked reveal latency failed (not a BLOCKED_EXTERNAL report)
        if: always() && steps.reveal-latency.outcome == 'failure'
        run: node scripts/qa/census/reveal-latency-gate.mjs smoke-report/reveal-latency.json
