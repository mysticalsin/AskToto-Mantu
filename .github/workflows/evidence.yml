name: Evidence

# Verifies evidence records pasted into a pull request body: a LOCALLY_TESTED record must name a green
# Build & Test run on this PR's head commit, and a fix's red-before run must be a failed run on an
# ancestor commit. A PR body without a record makes no claim and passes (M2-0002, ADR-017).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read

concurrency:
  group: evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  record:
    name: Evidence record
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Check refactor classification
        id: refactor
        run: node scripts/refactor/check-pr-classification.mjs --pr-event "$GITHUB_EVENT_PATH"
      - name: Test the refactor governance tools
        run: node --test scripts/refactor/verify-move.test.mjs
      - name: Verify pure-move refactor
        if: steps.refactor.outputs.classification == 'pure-move'
        run: node scripts/refactor/verify-move.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
      - name: Upload refactor reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: refactor-governance
          path: out/refactor/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify the evidence records in the PR body
        run: node scripts/evidence/check.mjs --pr-event "$GITHUB_EVENT_PATH"
        env:
          GITHUB_TOKEN: ${{ github.token }}
