name: Windows 1.9.6 to 1.9.7 profile preservation

# Hosted-only acceptance using an immutable public baseline release and one exact provenance-bound
# QA candidate run. This lane never builds, signs, publishes, deploys, or contacts a provider/service.
on:
  push:
    branches: [qa/1.9.7-upgrade-preservation]
    paths:
      - .github/workflows/profile-upgrade-preservation.yml
      - scripts/qa/profile-upgrade.mjs
      - scripts/qa/profile-upgrade.test.ts
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful workflow_dispatch run ID of qa-candidate.yml for the 1.9.7 bytes to test
        required: true
        type: string
      candidate_commit:
        description: Exact approved 40-character commit for the candidate and this dispatch ref
        required: true
        type: string
      candidate_ref:
        description: Exact approved branch ref for the candidate and this dispatch ref
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: profile-upgrade-preservation-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  windows-profile-upgrade:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Check the report and provenance contract
        run: npx vitest run scripts/qa/profile-upgrade.test.ts
      - name: Download and verify the published 1.9.6 baseline
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-artifact, release-sums | Out-Null
          gh release download v1.9.6-unsigned --repo mysticalsin/Metis-Releases --pattern 'Metis-Setup-1.9.6.exe' --dir release-artifact --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the published 1.9.6 Setup installer.' }
          gh release download v1.9.6-unsigned --repo mysticalsin/Metis-Releases --pattern 'SHA256SUMS*' --dir release-sums --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the published baseline SHA256SUMS file.' }
          $sums = Get-ChildItem release-sums/SHA256SUMS*
          if ($sums.Count -ne 1) { throw 'Expected exactly one published SHA256SUMS file.' }
          node scripts/qa/verify-sha256sums.mjs release-artifact $sums[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Published baseline SHA256SUMS verification failed.' }
          $setup = Get-Item release-artifact/Metis-Setup-1.9.6.exe
          $sha = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne '77a532f3c33a0be6f9315e7e0df02c2420c25a297e90c5fa6baff18f84193df8') { throw 'Baseline installer bytes differ from the pinned release digest.' }
      - name: Download and verify the exact hosted 1.9.7 candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          APPROVED_COMMIT: ${{ inputs.candidate_commit }}
          APPROVED_REF: ${{ inputs.candidate_ref }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:APPROVED_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'Approved candidate commit must be an explicit 40-character SHA.' }
          if ($env:APPROVED_COMMIT -ne $env:DISPATCH_SHA) { throw 'Dispatch ref SHA differs from the explicitly approved candidate commit.' }
          if ($env:APPROVED_REF -ne $env:DISPATCH_REF) { throw 'Dispatch branch differs from the explicitly approved candidate ref.' }
          if ($env:APPROVED_REF -notin @('main', 'release/1.9.x')) { throw 'Approved candidate ref must be main or release/1.9.x.' }
          New-Item -ItemType Directory -Force -Path candidate-provenance, candidate-win | Out-Null
          gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN" | Set-Content candidate-run.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Candidate Actions run lookup failed.' }
          gh run download $env:CANDIDATE_RUN --repo $env:GITHUB_REPOSITORY --name candidate-provenance --dir candidate-provenance
          if ($LASTEXITCODE -ne 0) { throw 'Candidate provenance artifact is unavailable.' }
          gh run download $env:CANDIDATE_RUN --repo $env:GITHUB_REPOSITORY --name candidate-win --dir candidate-win
          if ($LASTEXITCODE -ne 0) { throw 'Candidate Windows installer artifact is unavailable.' }
          node scripts/qa/provenance.mjs verify candidate-provenance/provenance.json candidate-win win
          if ($LASTEXITCODE -ne 0) { throw 'Candidate installer did not match its provenance.' }
          node scripts/qa/profile-upgrade.mjs verify-candidate candidate-run.json candidate-provenance/provenance.json $env:CANDIDATE_RUN $env:APPROVED_COMMIT $env:APPROVED_REF candidate-identity.json
          if ($LASTEXITCODE -ne 0) { throw 'Candidate run identity or 1.9.7 Setup provenance is invalid.' }
          $identity = Get-Content candidate-identity.json -Raw | ConvertFrom-Json
          node scripts/qa/candidate-installer.mjs candidate-win $identity.sha256 win | Set-Content candidate-installer-path.txt -NoNewline
          if ($LASTEXITCODE -ne 0) { throw 'No candidate Setup matches the provenance sha256.' }
          Copy-Item candidate-run.json upgrade-run.json
          New-Item -ItemType Directory -Force -Path upgrade-output/candidate-provenance | Out-Null
          Copy-Item candidate-provenance/provenance.json upgrade-output/candidate-provenance/provenance.json
          Copy-Item upgrade-run.json upgrade-output/candidate-run.json
          "CANDIDATE_RUN=$($identity.run_id)" | Add-Content $env:GITHUB_ENV
          "CANDIDATE_ATTEMPT=$($identity.attempt)" | Add-Content $env:GITHUB_ENV
          "CANDIDATE_COMMIT=$($identity.commit)" | Add-Content $env:GITHUB_ENV
          "CANDIDATE_REF=$($identity.ref)" | Add-Content $env:GITHUB_ENV
      - name: Create synthetic profile and perform the in-place upgrade
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = (Get-Item release-artifact/Metis-Setup-1.9.6.exe).FullName
          $candidate = (Get-Content candidate-installer-path.txt -Raw).Trim()
          $candidate = (Resolve-Path $candidate).Path
          $installRoot = Join-Path $env:RUNNER_TEMP 'metis-upgrade-install'
          $runnerRoot = Join-Path $env:RUNNER_TEMP 'metis-upgrade-qa'
          $report = Join-Path $env:GITHUB_WORKSPACE 'upgrade-output/upgrade-report.json'
          node scripts/qa/profile-upgrade.mjs run $baseline $candidate $env:CANDIDATE_RUN $env:CANDIDATE_ATTEMPT $env:CANDIDATE_COMMIT $env:CANDIDATE_REF $report $installRoot $runnerRoot
          if ($LASTEXITCODE -ne 0) { throw 'Hosted profile upgrade acceptance did not pass; inspect upgrade-output/upgrade-report.json.' }
          Get-Content $report | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload content-free upgrade report
        if: github.event_name == 'workflow_dispatch' && always() && hashFiles('upgrade-output/upgrade-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-profile-upgrade-${{ inputs.candidate_run }}
          path: upgrade-output/upgrade-report.json
          if-no-files-found: error
          retention-days: 30
