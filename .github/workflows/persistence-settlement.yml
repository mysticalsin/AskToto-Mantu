name: Persistence owned cleanup source RED

on:
  push:
    paths:
      - .github/workflows/persistence-settlement.yml
      - package.json
      - package-lock.json
      - vitest.config.ts
      - scripts/qa/persistence-settlement-unhandled-reporter.mjs
      - scripts/qa/check-persistence-settlement-report.mjs
      - src/main/persistence/bootstrap.ts
      - src/main/persistence/bootstrap-speech-owner.ts
      - src/main/persistence/bootstrap-settlement.ts
      - src/main/persistence/root-registry.ts
      - src/main/persistence/bootstrap-main-factory.integration.test.ts
      - src/main/persistence/root-registry.test.ts
      - src/main/infra/process/meeting-speech-host.ts
      - src/main/meeting-speech-worker.ts
      - src/main/features/meetings/incremental-meeting-journal.ts
      - src/main/features/meetings/incremental-record-receipt.ts
      - src/main/auth-speech-lease.ts
      - src/main/settings-authority-history.ts
      - src/main/settings-observation.ts
      - src/main/persistence/resource-policy.ts
      - resources/persistence-profiles.v1.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persistence-settlement-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test-first:
    name: R06/R07 owned cleanup causal RED
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PERSISTENCE_SETTLEMENT_TARGET: ubuntu-latest
      PERSISTENCE_SETTLEMENT_PHASE: settlement-red-owned-cleanup
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Create a fresh, exclusively owned report directory before install
        run: |
          set -euo pipefail
          SETTLEMENT_REPORT_DIR="$RUNNER_TEMP/persistence-settlement-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$SETTLEMENT_REPORT_DIR"
          test ! -e "$SETTLEMENT_REPORT_DIR/vitest.json"
          test ! -e "$SETTLEMENT_REPORT_DIR/unhandled.json"
          test ! -e "$SETTLEMENT_REPORT_DIR/receipt.json"
          echo "SETTLEMENT_REPORT_DIR=$SETTLEMENT_REPORT_DIR" >> "$GITHUB_ENV"
          echo "VITEST_REPORT_PATH=$SETTLEMENT_REPORT_DIR/vitest.json" >> "$GITHUB_ENV"
          echo "VITEST_LOG_PATH=$SETTLEMENT_REPORT_DIR/vitest.log" >> "$GITHUB_ENV"
          echo "UNHANDLED_REPORT_PATH=$SETTLEMENT_REPORT_DIR/unhandled.json" >> "$GITHUB_ENV"
          echo "SETTLEMENT_RECEIPT_PATH=$SETTLEMENT_REPORT_DIR/receipt.json" >> "$GITHUB_ENV"
          echo "REPORT_STARTED_AT_MS=$(date -u +%s%3N)" >> "$GITHUB_ENV"
      - name: Install the frozen Node 22 test dependencies
        run: npm ci --no-audit --no-fund
      - name: Run the exact factory and root-registry suites with actual exit and JSON
        run: |
          set +e
          NO_COLOR=1 FORCE_COLOR=0 ./node_modules/.bin/vitest run \
            src/main/persistence/bootstrap-main-factory.integration.test.ts \
            src/main/persistence/root-registry.test.ts \
            --retry=0 \
            --reporter=default \
            --reporter=json \
            --reporter=./scripts/qa/persistence-settlement-unhandled-reporter.mjs \
            --outputFile="$VITEST_REPORT_PATH" \
            > "$SETTLEMENT_REPORT_DIR/vitest.log" 2>&1
          test_exit=$?
          set -e
          echo "VITEST_EXIT_CODE=$test_exit" >> "$GITHUB_ENV"
          echo "Vitest actual exit: $test_exit"
      - name: Print bounded settlement report diagnostics
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const safeText = (value, limit = 180) => String(value)
            .replace(/[\u0000-\u001f\u007f]/g, ' ')
            .replace(/(?:[A-Za-z]:)?[/\\](?:[^\s:]+[/\\])+[^\s:]*/g, '<path>')
            .replace(/\s+/g, ' ')
            .slice(0, limit)
          const integer = (value) => Number.isSafeInteger(value) && value >= 0 ? value : 'missing'
          const smallCount = (value) => Number.isSafeInteger(value) && value >= 0 && value <= 8 ? value : 'missing'
          const status = (value) => ['passed', 'failed', 'pending', 'todo'].includes(value) ? value : 'unknown'
          const outcomeStatus = (value) => ['fulfilled', 'rejected'].includes(value) ? value : 'unknown'
          const allowedCases = new Set(['F02', 'O01', 'O02', 'O03', 'O04', 'O05', 'O06', 'F05', 'F06', 'F07', 'F08', 'F10', 'R04', 'R05', 'R06', 'R07'])
          const counters = [
            'numTotalTests', 'numPassedTests', 'numFailedTests', 'numPendingTests',
            'numTodoTests', 'numTotalTestSuites', 'numPendingTestSuites',
            'numPassedTestSuites', 'numFailedTestSuites', 'numUnhandledErrors'
          ]
          const readBounded = (file, limit) => {
            const info = fs.statSync(file)
            if (!info.isFile() || info.size <= 0 || info.size > limit) throw new Error('invalid-size')
            return fs.readFileSync(file, 'utf8')
          }
          const projectEvidence = (record) => {
            const result = { caseId: record.caseId }
            const numeric = [
              'keySettlementAttemptsBeforeSuccessor', 'keySettlementAttemptsAfterDisposal',
              'writerCloseAttemptsBeforeSuccessor', 'writerCloseAttemptsAfterDisposal',
              'rootCloseAttemptsBeforeSuccessor', 'rootCloseAttemptsAfterDisposal',
              'writerCloseAttemptsBeforeDisposal', 'writerCloseAttemptsAfterDisposal',
              'failedOpenCloseAttempts', 'closeAttempts', 'maxHeldRoots',
              'controlCanonicalDispatches', 'bootstrapCanonicalCalls', 'bootstrapCanonicalDispatches',
              'workerStartsBeforeAppend', 'workerStartsAfterAppend', 'canonicalDispatches',
              'dispatchesBeforeStaleCall', 'dispatchesAfterStaleCall'
            ]
            const booleans = [
              'successorAdmitted', 'gatewayRejected', 'reopenedCapability',
              'heldOriginalAdmitted', 'heldReopenedAdmitted',
              'failedOriginalAdmitted', 'failedReopenedAdmitted',
              'readyProfile', 'openedRealJournal', 'journalOwnerBeforeControl', 'journalOwnerAfterControl',
              'recordInputsEqual', 'policyInputsEqual', 'controlReceiptValid', 'copiedReceiptRejected',
              'controlBindingIdentitySame', 'controlOwnerTokenIdentitySame', 'controlCallbackIdentitySame',
              'controlPhysicalExit', 'controlReceiptDiscarded', 'candidateFalseInFactory',
              'ownerCurrentAfterPublication', 'ownerFalseAfterRetire',
              'ownerFalseAfterDispose', 'oldOwnerFalseWhilePending', 'newActionBlocked',
              'noReplacementBeforeExit', 'physicalExitHeld', 'physicalExitReleased', 'sameProfileObject',
              'oldOwnerFalseAfterRefresh', 'freshOwnerCurrent', 'heldActualReply', 'settingsChangedAndRestored',
              'oldOwnerFalseAfterRestore', 'oldReceiptAccepted', 'durableRevisionUnchanged', 'recordCountUnchanged',
              'bindingCaptured', 'serviceCaptured', 'ownerFalseAtReplacement', 'ownerFalseAfterRestoration',
              'frontierUnchanged', 'ownerCurrentBeforeFault', 'ownerFalseAtFault', 'ownerFalseAfterRestore',
              'originalPrincipalRestored', 'originalAuthEpochChanged'
            ]
            for (const key of numeric) if (key in record) result[key] = integer(record[key])
            for (const key of booleans) if (typeof record[key] === 'boolean') result[key] = record[key]
            if (['missing', 'present'].includes(record.ownerPredicate)) result.ownerPredicate = record.ownerPredicate
            if (['fulfilled', 'rejected', 'pending'].includes(record.controlDisposal)) result.controlDisposal = record.controlDisposal
            if (['NONE', 'UNCONFIGURED', 'CANCELLED', 'WORKER_FAILED', 'OTHER'].includes(record.bootstrapHostError)) {
              result.bootstrapHostError = record.bootstrapHostError
            }
            if (['durable', 'duplicate', 'refused'].includes(record.appendStatus)) result.appendStatus = record.appendStatus
            if (record.appendReason === null || record.appendReason === 'UNAVAILABLE') result.appendReason = record.appendReason
            for (const key of ['journalOutcome', 'successorOutcome', 'disposalOutcome', 'openingOutcome']) {
              const value = record[key]
              if (!value || typeof value !== 'object') continue
              const outcome = { status: outcomeStatus(value.status) }
              if (typeof value.errorName === 'string') outcome.errorName = safeText(value.errorName, 60)
              if (typeof value.errorMessage === 'string') outcome.errorMessage = safeText(value.errorMessage)
              if (Array.isArray(value.aggregateMessages)) outcome.aggregateMessages = value.aggregateMessages.slice(0, 3).map((item) => safeText(item))
              result[key] = outcome
            }
            for (const key of ['appendStatus', 'oldJournalStatus'])
              if (['durable', 'duplicate', 'refused'].includes(record[key])) result[key] = record[key]
            for (const key of ['appendReason', 'oldJournalReason'])
              if (record[key] === null || record[key] === 'UNAVAILABLE' || record[key] === 'STALE_OWNER') result[key] = record[key]
            for (const key of ['hostError', 'staleHostError'])
              if (['NONE', 'UNCONFIGURED', 'CANCELLED', 'WORKER_FAILED', 'OTHER'].includes(record[key])) result[key] = record[key]
            if (['present', 'missing'].includes(record.ownerPredicate)) result.ownerPredicate = record.ownerPredicate
            if (Array.isArray(record.clockCases)) result.clockCases = record.clockCases.slice(0, 4).map((item) => {
              const bounded = {}
              for (const key of ['caseId', 'initialAppendStatus', 'staleHostError'])
                if (typeof item?.[key] === 'string') bounded[key] = safeText(item[key], 60)
              for (const key of ['ownerCurrentBeforeFault', 'bindingCaptured', 'ownerFalseAtFault', 'ownerFalseAfterRestore'])
                if (typeof item?.[key] === 'boolean') bounded[key] = item[key]
              for (const key of ['dispatchesBeforeFault', 'dispatchesAfterFault'])
                if (key in (item ?? {})) bounded[key] = integer(item[key])
              return bounded
            })
            if (record.caseId === 'F10') {
              for (const name of ['confirmedClose', 'failedClose']) {
                const subcase = record[name]
                if (!subcase || typeof subcase !== 'object') continue
                result[name] = {
                  realOpenObserved: subcase.realOpenObserved === true,
                  writeHandleMatchesOpen: subcase.writeHandleMatchesOpen === true,
                  closeHandleMatchesOpen: subcase.closeHandleMatchesOpen === true,
                  writeFaultCount: integer(subcase.writeFaultCount),
                  writerLeaseFulfillments: integer(subcase.writerLeaseFulfillments),
                  keyWrapsBeforePostSuccessor: integer(subcase.keyWrapsBeforePostSuccessor),
                  openingStatusWhileCloseHeld: ['pending', 'fulfilled', 'rejected'].includes(subcase.openingStatusWhileCloseHeld) ? subcase.openingStatusWhileCloseHeld : 'unknown',
                  openingOutcome: { status: outcomeStatus(subcase.openingOutcome?.status) },
                  openingAggregateMessages: Array.isArray(subcase.openingAggregateMessages) ? subcase.openingAggregateMessages.slice(0, 4).map((item) => safeText(item, 100)) : [],
                  originalRootClosesWhileWriterHeld: integer(subcase.originalRootClosesWhileWriterHeld),
                  originalRootClosesBeforePostSuccessor: integer(subcase.originalRootClosesBeforePostSuccessor),
                  postSuccessorOutcome: { status: outcomeStatus(subcase.postSuccessorOutcome?.status) },
                  postSuccessorAdmitted: subcase.postSuccessorAdmitted === true,
                  writerClosesAfterDisposal: integer(subcase.writerClosesAfterDisposal),
                  disposalOutcome: { status: outcomeStatus(subcase.disposalOutcome?.status) },
                  disposalMemoized: subcase.disposalMemoized === true
                }
              }
            }
            if (record.caseId === 'R06' && Array.isArray(record.cases)) {
              result.cases = record.cases.slice(0, 4).map((item) => ({
                id: ['returned-owned', 'returned-foreign', 'prereturn-owned', 'prereturn-foreign'].includes(item?.id) ? item.id : 'unknown',
                boundary: {
                  exclusive: item?.boundary?.exclusive === true,
                  writeCalls: smallCount(item?.boundary?.writeCalls),
                  writeFaults: smallCount(item?.boundary?.writeFaults),
                  leases: smallCount(item?.boundary?.leases),
                  sameHandle: item?.boundary?.sameHandle === true,
                  named: ['owned', 'foreign-inode'].includes(item?.boundary?.named) ? item.boundary.named : 'unknown'
                },
                entry: {
                  foreignSurvived: item?.entry?.foreignSurvived === null ? null : item?.entry?.foreignSurvived === true,
                  originalSurvived: item?.entry?.originalSurvived === null ? null : item?.entry?.originalSurvived === true,
                  lockAbsent: item?.entry?.lockAbsent === true
                },
                settlement: {
                  status: outcomeStatus(item?.settlement?.status),
                  originalError: item?.settlement?.originalError === true,
                  cleanupError: item?.settlement?.cleanupError === true,
                  aggregate: Array.isArray(item?.settlement?.aggregate) && item.settlement.aggregate.length === 2 && item.settlement.aggregate[0] === 'write' && item.settlement.aggregate[1] === 'cleanup' ? ['write', 'cleanup'] : [],
                  repeat: ['fulfilled', 'same-rejection', 'not-applicable'].includes(item?.settlement?.repeat) ? item.settlement.repeat : 'unknown',
                  closes: Array.isArray(item?.settlement?.closes) ? item.settlement.closes.slice(0, 2).map(smallCount) : [],
                  confirmed: smallCount(item?.settlement?.confirmed),
                  extraIo: smallCount(item?.settlement?.extraIo)
                },
                root: {
                  heldProbe: ['descriptor-limit', 'admitted', 'other'].includes(item?.root?.heldProbe) ? item.root.heldProbe : 'other',
                  status: outcomeStatus(item?.root?.status),
                  sameCleanupError: item?.root?.sameCleanupError === null ? null : item?.root?.sameCleanupError === true,
                  repeat: ['fulfilled', 'same-rejection'].includes(item?.root?.repeat) ? item.root.repeat : 'unknown',
                  closes: Array.isArray(item?.root?.closes) ? item.root.closes.slice(0, 2).map(smallCount) : [],
                  extraIo: smallCount(item?.root?.extraIo),
                  postProbe: ['descriptor-limit', 'admitted', 'other'].includes(item?.root?.postProbe) ? item.root.postProbe : 'other',
                  successorSettled: item?.root?.successorSettled === null ? null : item?.root?.successorSettled === true
                }
              }))
            }
            if (record.caseId === 'R07') {
              for (const name of ['confirmedClose', 'failedClose']) {
                const item = record[name]
                if (!item || typeof item !== 'object') continue
                result[name] = {
                  captured: item.captured === true,
                  sameHandle: item.sameHandle === true,
                  maxRoots: smallCount(item.maxRoots),
                  openingAtHold: ['pending', 'fulfilled', 'rejected'].includes(item.openingAtHold) ? item.openingAtHold : 'unknown',
                  heldProbe: ['descriptor-limit', 'admitted', 'other'].includes(item.heldProbe) ? item.heldProbe : 'other',
                  publicAtHold: Array.isArray(item.publicAtHold) ? item.publicAtHold.slice(0, 2).map((value) => ['pending', 'fulfilled', 'rejected'].includes(value) ? value : 'unknown') : [],
                  closeAttempts: Array.isArray(item.closeAttempts) ? item.closeAttempts.slice(0, 3).map(smallCount) : [],
                  confirmed: smallCount(item.confirmed),
                  openingOriginalError: item.openingOriginalError === true,
                  openingCleanupError: item.openingCleanupError === true,
                  openingAggregate: Array.isArray(item.openingAggregate) && item.openingAggregate.length === 2 && item.openingAggregate[0] === 'bind' && item.openingAggregate[1] === 'close' ? ['bind', 'close'] : [],
                  publicOutcomes: Array.isArray(item.publicOutcomes) ? item.publicOutcomes.slice(0, 4).map(outcomeStatus) : [],
                  samePublicError: item.samePublicError === true,
                  firstCloseError: item.firstCloseError === true,
                  repeatExtraIo: smallCount(item.repeatExtraIo),
                  postProbe: ['descriptor-limit', 'admitted', 'other'].includes(item.postProbe) ? item.postProbe : 'other',
                  successorSettled: item.successorSettled === null ? null : item.successorSettled === true
                }
              }
            }
            for (const key of ['aggregateMessages', 'rejectionMessages']) {
              if (Array.isArray(record[key])) result[key] = record[key].slice(0, 4).map((item) => safeText(item))
            }
            return result
          }

          let report
          try {
            report = JSON.parse(readBounded(process.env.VITEST_REPORT_PATH, 16 * 1024 * 1024))
            if (!report || typeof report !== 'object') throw new Error('invalid-report')
          } catch {
            console.log('SETTLEMENT_DIAGNOSTIC_ERROR report=missing-malformed-or-oversize')
          }
          if (report) {
            const counts = Object.fromEntries(counters.map((key) => [key, integer(report[key])]))
            console.log(`SETTLEMENT_DIAGNOSTIC_COUNTS ${JSON.stringify(counts)}`)
            let shown = 0
            for (const suite of Array.isArray(report.testResults) ? report.testResults.slice(0, 2) : []) {
              const file = ['bootstrap-main-factory.integration.test.ts', 'root-registry.test.ts'].find((name) =>
                typeof suite.name === 'string' && suite.name.replaceAll('\\', '/').endsWith(`/${name}`))
              if (!file) continue
              for (const assertion of Array.isArray(suite.assertionResults) ? suite.assertionResults.slice(0, 23) : []) {
                if (shown++ >= 23) break
                const title = typeof assertion.title === 'string' ? safeText(assertion.title, 160) : 'missing'
                console.log(`SETTLEMENT_DIAGNOSTIC_CASE file=${file} status=${status(assertion.status)} title=${title}`)
                if (status(assertion.status) === 'failed' && Array.isArray(assertion.failureMessages) && assertion.failureMessages[0]) {
                  const firstLine = String(assertion.failureMessages[0]).split(/\r?\n/, 1)[0]
                  const identity = /^(?:AssertionError|Error|TypeError|RangeError|ReferenceError|AggregateError)(?::\s*(.*))?$/.exec(firstLine)
                  console.log(`SETTLEMENT_DIAGNOSTIC_FIRST_ERROR file=${file} title=${title} name=${identity ? firstLine.split(':', 1)[0] : 'unknown'} message=${safeText(identity?.[1] || firstLine)}`)
                }
              }
              if (shown > 23) break
            }
          }

          let log
          try {
            log = readBounded(process.env.VITEST_LOG_PATH, 4 * 1024 * 1024)
          } catch {
            console.log('SETTLEMENT_DIAGNOSTIC_ERROR log=missing-malformed-or-oversize')
          }
          if (log) {
            let evidenceCount = 0
            let evidenceErrorPrinted = false
            for (const line of log.split(/\r?\n/)) {
              const marker = 'PERSISTENCE_SETTLEMENT_EVIDENCE '
              const index = line.indexOf(marker)
              if (index < 0 || evidenceCount >= 16) continue
              const payload = line.slice(index + marker.length).trim()
              if (payload.length > 4096) {
                if (!evidenceErrorPrinted) console.log('SETTLEMENT_DIAGNOSTIC_ERROR evidence=oversize')
                evidenceErrorPrinted = true
                continue
              }
              try {
                const record = JSON.parse(payload)
                if (!record || !allowedCases.has(record.caseId)) continue
                console.log(`SETTLEMENT_DIAGNOSTIC_EVIDENCE ${JSON.stringify(projectEvidence(record))}`)
                evidenceCount++
              } catch {
                if (!evidenceErrorPrinted) console.log('SETTLEMENT_DIAGNOSTIC_ERROR evidence=malformed')
                evidenceErrorPrinted = true
              }
            }
            console.log(`SETTLEMENT_DIAGNOSTIC_EVIDENCE_COUNT ${evidenceCount}`)
          }
          NODE
      - name: Validate exact owner witnesses and nine named settlement failures
        run: node scripts/qa/check-persistence-settlement-report.mjs
      - name: Retain the raw run, JSON and EXPECTED_SETTLEMENT_RED_OWNED_CLEANUP receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: persistence-settlement-red-owned-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/persistence-settlement-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
