name: Runtime activation qualification

on:
  push:
    paths:
      - .github/workflows/runtime-activation-qualification.yml
      - .github/workflows/runtime-native-platform-qualification.yml
      - electron-builder.yml
      - electron.vite.config.ts
      - package.json
      - package-lock.json
      - vitest.config.ts
      - scripts/runtime-mapped-qualification.mjs
      - scripts/runtime-mapped-qualification.test.ts
      - scripts/architecture-baseline.json
      - scripts/check-architecture.mjs
      - scripts/check-architecture.test.ts
      - scripts/design/**
      - scripts/qa/**
      - scripts/fetch-llama-server.mjs
      - scripts/check-llama-sidecar.mjs
      - scripts/local-model-assets.mjs
      - scripts/fetch-local-model.mjs
      - scripts/check-local-model.mjs
      - scripts/verify-native-runtime-qualification-inputs.mjs
      - scripts/validate-native-platform-qualification.mjs
      - src/main/**
      - src/preload/**
      - src/renderer/**
      - src/shared/**
      - native/**
      - resources/llama/**
      - resources/local-llm/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-activation-qualification-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  contracts:
    name: Runtime mapped validator contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Initialize isolated gate report directory
        run: |
          node -e "const fs=require('node:fs');const p=require('node:path');const d=p.resolve(process.env.RUNNER_TEMP,'runtime-mapped-gate-${{ github.run_id }}-${{ github.run_attempt }}');fs.mkdirSync(d,{recursive:false});fs.appendFileSync(process.env.GITHUB_ENV,'GATE_REPORT_DIR='+d+require('node:os').EOL)"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact source checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run finite source and composite validator contracts
        id: gate-tests
        run: |
          set +e
          node node_modules/vitest/vitest.mjs run scripts/runtime-mapped-qualification.test.ts --maxWorkers=2 --dangerouslyIgnoreUnhandledErrors=false --reporter=default --reporter=json --outputFile="$GATE_REPORT_DIR/gate-vitest.json" 2>&1 | tee "$GATE_REPORT_DIR/gate-vitest.log"
          statuses=("${PIPESTATUS[@]}")
          process_exit=${statuses[0]}
          tee_exit=${statuses[1]}
          result=$process_exit
          if [[ "$result" == 0 && "$tee_exit" != 0 ]]; then result=$tee_exit; fi
          node -e "require('node:fs').writeFileSync(process.env.GATE_REPORT_DIR+'/gate-exit.json',JSON.stringify({processExit:Number(process.argv[1]),teeExit:Number(process.argv[2]),outcome:Number(process.argv[1])===0&&Number(process.argv[2])===0?'success':'failure'})+'\\n',{flag:'wx'})" "$process_exit" "$tee_exit"
          exit "$result"
      - name: Require the frozen 48-case contract suite
        if: always()
        env:
          GATE_TEST_OUTCOME: ${{ steps.gate-tests.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const root = process.env.GATE_REPORT_DIR
          const report = JSON.parse(readFileSync(`${root}/gate-vitest.json`, 'utf8'))
          const exit = JSON.parse(readFileSync(`${root}/gate-exit.json`, 'utf8'))
          const valid = process.env.GATE_TEST_OUTCOME === 'success' && exit.outcome === 'success' && exit.processExit === 0 && exit.teeExit === 0 && report.success === true && report.numTotalTests === 48 && report.numPassedTests === 48 && report.numFailedTests === 0 && report.numPendingTests === 0 && report.numTodoTests === 0 && report.numTotalTestSuites > 0 && report.numPassedTestSuites === report.numTotalTestSuites && report.numFailedTestSuites === 0 && report.numPendingTestSuites === 0 && (report.unhandledErrors === undefined || (Array.isArray(report.unhandledErrors) && report.unhandledErrors.length === 0)) && report.testResults?.length === 1 && report.testResults[0].assertionResults?.length === 48 && report.testResults[0].assertionResults.every((test) => test.status === 'passed')
          console.log(JSON.stringify({ expectedCases: 48, actualCases: report.testResults?.[0]?.assertionResults?.length, passed: report.numPassedTests, skipped: report.numPendingTests + report.numTodoTests }))
          if (!valid) throw new Error('RUNTIME_MAPPED_CONTRACT_SUITE_REJECTED')
          NODE

  source:
    name: Mapped source qualification (${{ matrix.lane }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: linux
            runner: ubuntu-latest
            platform: linux
            arch: x64
          - lane: windows
            runner: windows-latest
            platform: win32
            arch: x64
          - lane: macos
            runner: macos-15
            platform: darwin
            arch: arm64
    steps:
      - name: Initialize isolated source report directory
        run: |
          node -e "const fs=require('node:fs');const p=require('node:path');const d=p.resolve(process.env.RUNNER_TEMP,'runtime-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}');fs.mkdirSync(d,{recursive:false});fs.appendFileSync(process.env.GITHUB_ENV,'SOURCE_REPORT_DIR='+d+require('node:os').EOL)"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact SHA and record actual host
        env:
          SOURCE_LANE: ${{ matrix.lane }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          actual_head=$(git rev-parse HEAD)
          test "$actual_head" = "$GITHUB_SHA"
          node -e "const fs=require('node:fs');const p=require('node:path');const d={head:process.argv[1],platform:process.platform,arch:process.arch};if(d.platform!==process.env.EXPECTED_PLATFORM||d.arch!==process.env.EXPECTED_ARCH)throw new Error('source host mismatch');fs.appendFileSync(process.env.GITHUB_ENV,'ACTUAL_HEAD='+d.head+'\\nACTUAL_PLATFORM='+d.platform+'\\nACTUAL_ARCH='+d.arch+'\\n')" "$actual_head"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install repository test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Chromium for CSS assertions
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: Run exact mapped source inventory
        id: source-tests
        env:
          SOURCE_LANE: ${{ matrix.lane }}
        run: |
          files=(
            scripts/check-architecture.test.ts
            scripts/design/design-capture.test.ts
            src/main/features/components/speech-pack/download.test.ts
            src/main/features/components/speech-pack/runtime-admission.test.ts
            src/main/features/components/speech-pack/runtime-archive.test.ts
            src/main/features/components/speech-pack/runtime-lease.test.ts
            src/main/features/components/speech-pack/runtime-resource-protocol.test.ts
            src/main/features/components/speech-pack/runtime-staged-verifier.test.ts
            src/main/features/components/speech-pack/runtime-tar.test.ts
            src/main/features/components/speech-pack/runtime-trust.test.ts
            src/main/infra/process/supervisor.test.ts
            src/main/infra/storage/runtime-owned-files.test.ts
            src/main/llm/local-runtime.concurrency.test.ts
            src/main/llm/local-runtime.test.ts
            src/main/parakeet-client.test.ts
            src/main/speaker-embedding-client.test.ts
            src/main/whisper-import.test.ts
            src/main/speaker-session-wiring.test.ts
            src/main/asr-bundled-ensure.test.ts
            src/main/asr-model-manifest.test.ts
          )
          if [[ "$SOURCE_LANE" != windows ]]; then files+=(src/main/features/components/speech-pack/runtime-archive.posix-fifo.test.ts); fi
          set +e
          node node_modules/vitest/vitest.mjs run --maxWorkers=2 --dangerouslyIgnoreUnhandledErrors=false --reporter=default --reporter=json --outputFile="$SOURCE_REPORT_DIR/source-vitest.json" "${files[@]}" 2>&1 | tee "$SOURCE_REPORT_DIR/source-vitest.log"
          statuses=("${PIPESTATUS[@]}")
          process_exit=${statuses[0]}
          tee_exit=${statuses[1]}
          result=$process_exit
          if [[ "$result" == 0 && "$tee_exit" != 0 ]]; then result=$tee_exit; fi
          node -e "require('node:fs').writeFileSync(process.env.SOURCE_REPORT_DIR+'/source-exit.json',JSON.stringify({processExit:Number(process.argv[1]),exitCode:Number(process.argv[1]),teeExit:Number(process.argv[2]),outcome:Number(process.argv[1])===0&&Number(process.argv[2])===0?'success':'failure'})+'\\n',{flag:'wx'})" "$process_exit" "$tee_exit"
          echo "SOURCE_TEST_EXIT=$process_exit" >> "$GITHUB_ENV"
          exit "$result"
      - name: Validate exact mapped source inventory and host binding
        if: always()
        env:
          SOURCE_TEST_STEP_OUTCOME: ${{ steps.source-tests.outcome }}
          SOURCE_LANE: ${{ matrix.lane }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          if [[ ! -s "$SOURCE_REPORT_DIR/source-vitest.json" || ! -s "$SOURCE_REPORT_DIR/source-vitest.log" || ! -s "$SOURCE_REPORT_DIR/source-exit.json" ]]; then
            echo 'RUNTIME_MAPPED_SOURCE_REPORT_MISSING' >&2
            exit 1
          fi
          node scripts/runtime-mapped-qualification.mjs source "$SOURCE_REPORT_DIR/source-vitest.json" "$SOURCE_REPORT_DIR/source-vitest.log" "$SOURCE_REPORT_DIR/source-qualification.json"
      - name: Upload raw source report and qualification envelope
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-source-${{ matrix.lane }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          if-no-files-found: warn
          retention-days: 14

  native:
    name: Required native platform qualification
    uses: ./.github/workflows/runtime-native-platform-qualification.yml
    permissions:
      contents: read

  aggregate:
    name: Same-head mapped composite evidence
    if: always()
    needs: [contracts, source, native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Stop aggregate when any required lane did not succeed
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$CONTRACTS_RESULT" = success
          test "$SOURCE_RESULT" = success
          test "$NATIVE_RESULT" = success
      - name: Initialize composite evidence directory
        run: |
          node -e "const fs=require('node:fs');const p=require('node:path');const d=p.resolve(process.env.RUNNER_TEMP,'runtime-composite-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}');fs.mkdirSync(d,{recursive:false});fs.mkdirSync(p.join(d,'bundles'),{recursive:false});fs.appendFileSync(process.env.GITHUB_ENV,'COMPOSITE_REPORT_DIR='+d+require('node:os').EOL)"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert aggregate checkout SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Download current run artifacts without flattening
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/runtime-composite-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/bundles
          merge-multiple: false
      - name: Bind six exact bundles to this SHA, run and attempt
        run: |
          node -e "const fs=require('node:fs');const p=require('node:path');const d=p.join(process.env.COMPOSITE_REPORT_DIR,'bundles');const n=process.env.GITHUB_SHA;const ids=['linux','windows','macos'].map(x=>'runtime-source-'+x+'-'+n+'-'+process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT).concat([['darwin','arm64'],['darwin','x64'],['win32','x64']].map(([x,a])=>'runtime-native-'+x+'-'+a+'-'+n+'-'+process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT)).sort();const actual=fs.readdirSync(d,{withFileTypes:true}).filter(x=>x.isDirectory()).map(x=>x.name).sort();if(JSON.stringify(ids)!==JSON.stringify(actual))throw new Error('exact six current-run artifact bundles required');fs.writeFileSync(p.join(d,'manifest.json'),JSON.stringify({sourceSha:n,runId:process.env.GITHUB_RUN_ID,attempt:Number(process.env.GITHUB_RUN_ATTEMPT)})+'\\n',{flag:'wx'})"
      - name: Recompute raw digests and write aggregate only after all validation
        if: always()
        run: node scripts/runtime-mapped-qualification.mjs aggregate "$COMPOSITE_REPORT_DIR/bundles" "$COMPOSITE_REPORT_DIR/RUNTIME_MAPPED_COMPOSITE_PASS.json"
      - name: Retain complete source/native inputs and composite summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-composite-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-composite-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
