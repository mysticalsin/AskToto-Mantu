name: M2-0119 services compose profile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - services/**
      - .github/workflows/m2-0119-services.yml

permissions:
  contents: read

concurrency:
  group: m2-0119-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Bring up services/compose.yml and check health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Bring up the profile
        run: docker compose -f services/compose.yml up -d --wait --wait-timeout 240
      - name: Postgres has a working vector extension
        run: |
          docker compose -f services/compose.yml exec -T postgres \
            psql -U metis -d hindsight -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;' \
            -c "SELECT '[1,2,3]'::vector <-> '[1,2,4]'::vector AS distance;"
      - name: Hindsight answers its health contract
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 http://127.0.0.1:8888/health
      - name: Hindsight persists a bank in Postgres
        run: |
          curl --fail --silent --show-error -X PUT \
            -H 'Content-Type: application/json' -d '{"name":"compose-contract"}' \
            http://127.0.0.1:8888/v1/default/banks/compose-contract
          curl --fail --silent --show-error http://127.0.0.1:8888/v1/default/banks \
            | grep --quiet compose-contract
          docker compose -f services/compose.yml exec -T postgres \
            psql -U metis -d hindsight -v ON_ERROR_STOP=1 -tA \
            -c "SELECT count(*) FROM banks WHERE bank_id = 'compose-contract';" \
            | grep --quiet '^1$'
      - name: Record resolved images and logs
        if: always()
        run: |
          mkdir -p out/m2-0119-services
          docker compose -f services/compose.yml images --format json > out/m2-0119-services/images.json || true
          docker compose -f services/compose.yml config --images | xargs -r -n1 docker image inspect --format '{{index .RepoDigests 0}}' > out/m2-0119-services/digests.txt || true
          docker compose -f services/compose.yml logs --no-color > out/m2-0119-services/logs.txt || true
      - name: Tear down
        if: always()
        run: docker compose -f services/compose.yml down -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m2-0119-services-${{ github.run_attempt }}
          path: out/m2-0119-services/
          if-no-files-found: error
          retention-days: 30
