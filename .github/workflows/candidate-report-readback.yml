name: Candidate report readback
run-name: ${{ github.event_name == 'pull_request' && 'Candidate report readback (registration)' || 'Candidate report readback (diagnostic only; original FAIL unchanged)' }}

on:
  pull_request:
    paths:
      - .github/workflows/candidate-report-readback.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: candidate-report-readback
  cancel-in-progress: false

jobs:
  readback:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'mysticalsin/AskToto-Mantu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Read only pinned failed Windows report
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qa/candidate-report-readback.mjs
