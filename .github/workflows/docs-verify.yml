name: Docs verify

# M2-0172. Checks that the docs describe what ships: every relative link in docs/, README.md and AGENTS.md
# resolves, and every command block marked verify or verify-dry in README.md, AGENTS.md and docs/runbooks/
# is resolved against the checked-out commit (verify blocks are also executed; they are read-only Node
# gates that need no install). Runs no repository test, builds nothing and publishes nothing. The report
# is uploaded as an artifact.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - docs/**
      - README.md
      - AGENTS.md
      - package.json
      - scripts/docs/**
      - .github/workflows/docs-verify.yml

permissions:
  contents: read

concurrency:
  group: docs-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Links and commands
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Link check over docs/, README.md and AGENTS.md
        run: node scripts/docs/check-links.mjs
      - name: Verify the marked commands against this commit
        run: node scripts/docs/verify-commands.mjs --commit "$(git rev-parse HEAD)" --out out/docs-verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: docs-verify
          path: out/docs-verify/
          if-no-files-found: ignore
          retention-days: 14
