name: Windows QA

# Manual evidence lane for M2-0029. Downloads candidate-win from a qa-candidate.yml run (M2-0187), verifies
# the Setup installer against the sha256 the lead names, installs it on a hosted Windows runner, and runs HK-W: 20 cycles that hard-kill only Metis.exe (Stop-Process -Id) and
# census every owned descendant 5 s later. It also verifies the GetProcessTimes start-time path used by
# the sidecar registry. Uploads content-free JSON only. Optionally compiles native/win-supervise (unsigned,
# artifact only). It never builds the app, signs, publishes, tags, or changes release.yml.
# Runs only from main, so the candidate is always an installer a qa-candidate.yml run built and hashed.
# The capabilities suite is a content-free probe of the hosted runner (OS, hardware, UIA, SendInput, tray, hotkey,
# audio endpoint, dxdiag, OneDrive env). It has no checkout, runs no repository code and uses no credentials.
#   gh workflow run windows-qa.yml --ref main -f suite=hk-w -f candidate_run=<run id> -f sha256=<Setup sha256>
#   gh workflow run windows-qa.yml --ref main -f suite=capabilities
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        required: true
        default: hk-w
        type: choice
        options:
          - hk-w
          - capabilities
      candidate_run:
        description: qa-candidate.yml run id whose candidate-win artifact is measured (suite hk-w only)
        required: false
        type: string
      sha256:
        description: sha256 of that run's Metis-Setup-*.exe (see its SHA256SUMS.txt) (suite hk-w only)
        required: false
        type: string
      cycles:
        description: Hard-kill cycles
        required: true
        default: '20'
        type: string
      build_supervise:
        description: Also compile native/win-supervise (only when HK-W reports descendants-survive)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-qa-${{ github.ref }}-${{ inputs.suite }}-${{ inputs.candidate_run }}
  cancel-in-progress: false

jobs:
  hk-w:
    name: HK-W (Windows)
    if: inputs.suite == 'hk-w' && github.repository == 'mysticalsin/AskToto-Mantu' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require the candidate inputs before any download
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_SHA256: ${{ inputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_RUN -notmatch '^[0-9]+$') { throw 'candidate_run must be a numeric run id.' }
          if ($env:CANDIDATE_SHA256 -notmatch '^[0-9A-Fa-f]{64}$') { throw 'sha256 must be 64 hex characters.' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Download the candidate, verify its sha256, and install it
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_SHA256: ${{ inputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_RUN -notmatch '^[0-9]+$') { throw 'candidate_run must be a numeric run id.' }
          New-Item -ItemType Directory -Force -Path release-artifact, hk-w-output | Out-Null
          $workflow = gh run view $env:CANDIDATE_RUN --repo $env:GITHUB_REPOSITORY --json workflowName --jq .workflowName
          if ($workflow -ne 'QA candidate') { throw "Run $($env:CANDIDATE_RUN) is '$workflow', not a QA candidate run." }
          gh run download $env:CANDIDATE_RUN --repo $env:GITHUB_REPOSITORY --name candidate-win --dir release-artifact
          if ($LASTEXITCODE -ne 0) { throw 'Could not download candidate-win.' }
          $setupPath = node scripts/qa/candidate-installer.mjs release-artifact $env:CANDIDATE_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'The downloaded installer does not match the named sha256.' }
          $setup = Get-Item $setupPath
          "$($env:CANDIDATE_SHA256.Trim().ToLower())  $($setup.Name)" | Set-Content hk-w-output/SHA256SUMS.txt
          $target = Join-Path $env:RUNNER_TEMP 'hk-w-install'
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          New-Item -ItemType Directory -Path $target | Out-Null
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Setup exited with $($install.ExitCode)." }
      - name: HK-W hard-kill cycles
        run: >
          ./scripts/qa/hk-w.ps1
          -App "$env:RUNNER_TEMP\hk-w-install\Metis.exe"
          -OutDir hk-w-output
          -Cycles ${{ inputs.cycles }}
          -PrewarmScript scripts/qa/hk-w-prewarm.mjs
      - name: Summarize the verdict
        run: |
          node scripts/qa/hk-w-report.mjs hk-w-output/hk-w.json hk-w-output/hk-w-summary.json
          Get-Content hk-w-output/hk-w-summary.json | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Compile supervise.exe (unsigned, artifact only)
        if: inputs.build_supervise
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cl /nologo /W4 /O2 /Fe:hk-w-output\supervise.exe native\win-supervise\supervise.c"
          if ($LASTEXITCODE -ne 0) { throw 'cl failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: hk-w-windows-${{ inputs.candidate_run }}
          path: hk-w-output/
          if-no-files-found: error
          retention-days: 30

  capabilities:
    name: Capabilities probe (Windows)
    if: inputs.suite == 'capabilities' && github.repository == 'mysticalsin/AskToto-Mantu' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Probe the runner
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'windows-qa-capabilities'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $caps = Join-Path $out 'capabilities.txt'
          Set-Content -Path $caps -Value "probe_started_utc: $([DateTime]::UtcNow.ToString('o'))"
          # Every probe catches its own exception so one failure never hides the others.
          function Probe([string]$Key, [scriptblock]$Body) {
            try { $value = (& $Body | Out-String).Trim() }
            catch { $value = "ERROR: $($_.Exception.GetType().Name): $($_.Exception.Message)" }
            Add-Content -Path $caps -Value "${Key}: $($value -replace '\s*\r?\n\s*', ' ')"
          }
          Probe 'runner.name' { $env:RUNNER_NAME }
          Probe 'runner.os' { "$($env:RUNNER_OS) $($env:RUNNER_ARCH)" }
          Probe 'image.os' { $env:ImageOS }
          Probe 'image.version' { $env:ImageVersion }
          Probe 'os.caption' { (Get-CimInstance Win32_OperatingSystem).Caption }
          Probe 'os.build' { (Get-CimInstance Win32_OperatingSystem).BuildNumber }
          Probe 'cpu.name' { (Get-CimInstance Win32_Processor | Select-Object -First 1).Name }
          Probe 'cpu.logical_cores' { [Environment]::ProcessorCount }
          Probe 'memory.total_gb' { [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1) }
          Probe 'gpu.adapters' { (Get-CimInstance Win32_VideoController | ForEach-Object { $_.Name }) -join '; ' }
          Probe 'audio.devices' { (Get-CimInstance Win32_SoundDevice | ForEach-Object { $_.Name }) -join '; ' }
          Probe 'user.interactive' { [Environment]::UserInteractive }
          Probe 'session.id' { (Get-Process -Id $PID).SessionId }
          Probe 'uia.automation_element_available' {
            Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
            $null -ne [System.Windows.Automation.AutomationElement]::RootElement
          }
          Probe 'uia.invoke_action' {
            Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
            $root = [System.Windows.Automation.AutomationElement]::RootElement
            $children = $root.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition)
            $found = 0
            foreach ($child in $children) {
              $pattern = $null
              if ($child.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern, [ref]$pattern)) { $found++ }
            }
            "top_level_elements=$($children.Count) invoke_pattern_elements=$found"
          }
          Add-Type -Namespace Qa -Name Native -MemberDefinition @'
          [StructLayout(LayoutKind.Sequential)] public struct KEYBDINPUT { public ushort wVk; public ushort wScan; public uint dwFlags; public uint time; public IntPtr dwExtraInfo; }
          [StructLayout(LayoutKind.Explicit, Size = 32)] public struct INPUT { [FieldOffset(0)] public uint type; [FieldOffset(8)] public KEYBDINPUT ki; }
          [DllImport("user32.dll", SetLastError = true)] public static extern uint SendInput(uint n, INPUT[] inputs, int size);
          [DllImport("user32.dll", SetLastError = true)] public static extern bool RegisterHotKey(IntPtr hWnd, int id, uint modifiers, uint vk);
          [DllImport("user32.dll", SetLastError = true)] public static extern bool UnregisterHotKey(IntPtr hWnd, int id);
          '@
          Probe 'sendinput.symbol_available' { $null -ne [Qa.Native].GetMethod('SendInput') }
          Probe 'sendinput.key_action' {
            # F24 key down then up: no application binds it.
            $down = New-Object Qa.Native+INPUT
            $down.type = 1
            $down.ki.wVk = 0x87
            $up = New-Object Qa.Native+INPUT
            $up.type = 1
            $up.ki.wVk = 0x87
            $up.ki.dwFlags = 2
            $size = [Runtime.InteropServices.Marshal]::SizeOf([type][Qa.Native+INPUT])
            $sent = [Qa.Native]::SendInput(2, [Qa.Native+INPUT[]]@($down, $up), $size)
            "events_sent=$sent last_error=$([Runtime.InteropServices.Marshal]::GetLastWin32Error())"
          }
          Probe 'tray.notify_icon_action' {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $icon = New-Object System.Windows.Forms.NotifyIcon
            try {
              $icon.Icon = [System.Drawing.SystemIcons]::Application
              $icon.Visible = $true
              "visible=$($icon.Visible)"
            } finally { $icon.Dispose() }
          }
          Probe 'global_hotkey.register_action' {
            # CTRL+ALT+F24 (MOD_CONTROL | MOD_ALT, VK_F24).
            $registered = [Qa.Native]::RegisterHotKey([IntPtr]::Zero, 1, 0x3, 0x87)
            $lastError = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
            if ($registered) { [void][Qa.Native]::UnregisterHotKey([IntPtr]::Zero, 1) }
            "registered=$registered last_error=$lastError"
          }
          Probe 'audio.default_capture_endpoint_action' {
            $capture = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\MMDevices\Audio\Capture'
            $active = @(Get-ChildItem $capture -ErrorAction Stop | Where-Object { (Get-ItemProperty $_.PSPath).DeviceState -eq 1 })
            "active_capture_endpoints=$($active.Count)"
          }
          Probe 'gpu.dxdiag_action' {
            $dxdiag = Join-Path $out 'dxdiag.txt'
            $proc = Start-Process -FilePath dxdiag -ArgumentList '/t', $dxdiag -PassThru
            if (-not $proc.WaitForExit(90000)) { $proc.Kill(); throw 'dxdiag did not finish within 90 s' }
            "exit_code=$($proc.ExitCode) file_present=$(Test-Path $dxdiag)"
          }
          Probe 'onedrive.env_present' { [bool]$env:OneDrive }
          Probe 'edr.assumed' { 'ASSUMED: no EDR agent on the hosted runner image; not measured' }
          Add-Content -Path $caps -Value "probe_finished_utc: $([DateTime]::UtcNow.ToString('o'))"
          Get-ChildItem -Path $out -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Path (Join-Path $out 'SHA256SUMS.txt')
          Get-Content $caps | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-qa-capabilities
          path: ${{ runner.temp }}/windows-qa-capabilities/
          if-no-files-found: error
          retention-days: 14
