name: Promote candidate

# Publishes the exact bytes of one successful qa-candidate run as an owner-channel prerelease on the
# source and release feed: prereleases, never Latest, with no latest*.yml or blockmaps, plus SHA256SUMS.txt
# and provenance.json. It never builds. It downloads the candidate's artifacts, proves every byte against
# the candidate's provenance and the promotion evidence, and checks GitHub's digest of every uploaded
# asset on both repositories before publishing either. The source metis-unsigned-v* tag cannot trigger
# release.yml's v* tag publisher, but may trigger ordinary Build, isolation and velocity checks.
# Publication is not atomic: partial/unknown delivery preserves both records for explicit review.
run-name: Promote candidate run ${{ inputs.candidate_run_id }} (publish ${{ inputs.publish }})

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Run ID of a successful qa-candidate run on main or release/1.9.x
        required: true
        type: string
      evidence:
        description: Evidence records (JSON Lines), one PASS record per promotable asset bound to that run's bytes; pass them with -F evidence=@file. Records naming a non-promotable asset, such as the QA-identity build, are refused.
        required: true
        type: string
      publish:
        description: Publish both prereleases. When false, both owned drafts are verified and then deleted
        required: true
        type: boolean
        default: false
      residuals:
        description: Residual risks and known limits (Markdown), rendered verbatim into the release body; pass it with -F residuals=@file. Required to publish and refused when empty; optional for a dry run. At most 10,000 characters, with no user-home path or email address.
        required: false
        type: string
        default: ''
      confirm_version:
        description: Required to publish; the candidate's version, exactly
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: promote-candidate
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The public release feed: electron-builder.yml publish.owner/repo and src/main/updater.ts.
  FEED: mysticalsin/Metis-Releases

jobs:
  promote:
    name: Promote the tested bytes
    if: github.repository == 'mysticalsin/AskToto-Mantu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Require the residual risks to publish
        env:
          PUBLISH: ${{ inputs.publish }}
          RESIDUALS: ${{ inputs.residuals }}
        run: |
          if [ "$PUBLISH" = true ] && [ -z "${RESIDUALS//[[:space:]]/}" ]; then
            echo "::error::To publish, pass the residuals input (-F residuals=@file); the release body must state the residual risks."; exit 1
          fi
      - name: Require a fully successful qa-candidate run on main or release/1.9.x
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          if ! [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::candidate_run_id must be a workflow run ID."; exit 1
          fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          jq -e '.path == ".github/workflows/qa-candidate.yml" and .event == "workflow_dispatch" and (.head_branch == "main" or .head_branch == "release/1.9.x") and .status == "completed" and .conclusion == "success"' <<<"$run" > /dev/null \
            || { echo "::error::Run $RUN_ID is not a completed, successful qa-candidate dispatch on main or release/1.9.x."; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" \
            | jq -e '.total_count > 0 and .total_count == (.jobs | length) and all(.jobs[]; .conclusion == "success")' > /dev/null \
            || { echo "::error::Every job of run $RUN_ID must have succeeded; a skipped gate is not a pass."; exit 1; }
          echo "commit=$(jq -r .head_sha <<<"$run")" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r .head_branch <<<"$run")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-provenance
          path: provenance
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      # A release/1.9.x candidate is promoted under the rule it was built under: 1.9.7-hotfix.N, never 1.9.7.
      - name: Check the candidate branch and version
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          feed_dir="$RUNNER_TEMP/feed"
          mkdir -p "$feed_dir"
          gh api "repos/$FEED/git/matching-refs/tags" --paginate --jq '.[].ref | sub("^refs/tags/"; "")' > "$feed_dir/tags.txt"
          gh api "repos/$FEED/releases?per_page=100" --paginate --jq '.[] | select(.draft | not) | .tag_name' > "$feed_dir/releases.txt"
          node scripts/qa/release-line.mjs candidate --branch "$BRANCH" --package provenance/provenance.json \
            --tags "$feed_dir/tags.txt" --releases "$feed_dir/releases.txt"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-mac
          path: downloads
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-win
          path: downloads
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Check the evidence and stage exactly the tested bytes
        id: stage
        env:
          EVIDENCE: ${{ inputs.evidence }}
          RESIDUALS: ${{ inputs.residuals }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.commit }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          printf '%s' "$EVIDENCE" > "$RUNNER_TEMP/evidence.jsonl"
          residuals_flag=()
          if [ -n "$RESIDUALS" ]; then
            printf '%s' "$RESIDUALS" > "$RUNNER_TEMP/residuals.md"
            residuals_flag=(--residuals-file "$RUNNER_TEMP/residuals.md")
          fi
          node scripts/qa/provenance.mjs prepare-release provenance/provenance.json "$RUNNER_TEMP/evidence.jsonl" downloads "$RUNNER_TEMP/promotion" \
            --candidate-run "$CANDIDATE_RUN" --candidate-commit "$CANDIDATE_COMMIT" --candidate-branch "$CANDIDATE_BRANCH" \
            "${residuals_flag[@]}"
          echo "version=$(jq -r .version provenance/provenance.json)" >> "$GITHUB_OUTPUT"
      - name: Confirm the candidate version
        env:
          PUBLISH: ${{ inputs.publish }}
          CONFIRM: ${{ inputs.confirm_version }}
          VERSION: ${{ steps.stage.outputs.version }}
        run: |
          if [ "$PUBLISH" = true ]; then
            [ "$CONFIRM" = "$VERSION" ] || { echo "::error::To publish, set confirm_version to exactly $VERSION."; exit 1; }
          fi
      # The existing publisher secret must have push visibility and write authority on BOTH fixed
      # repositories. Workflows write may also be required by GitHub for the exact source commit.
      - name: Verify both drafts and promote identical bytes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VERSION: ${{ steps.stage.outputs.version }}
          PUBLISH: ${{ inputs.publish }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.commit }}
          PROMOTION_DIRECTORY: ${{ runner.temp }}/promotion
          PROMOTION_RECEIPT: ${{ runner.temp }}/promotion-receipt.json
        run: |
          node scripts/qa/publish-dual-release.mjs
      # Closed identities/states only. No notes, token, raw responses, local paths or installer bytes.
      # This is best-effort retention, not guaranteed recovery if a hosted runner is lost.
      - name: Retain the closed promotion receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promotion-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-receipt.json
          if-no-files-found: warn
          retention-days: 7
