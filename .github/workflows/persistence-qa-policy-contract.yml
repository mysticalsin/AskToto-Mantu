name: Persistence QA policy contract qualification

on:
  push:
    paths:
      - .github/workflows/persistence-qa-policy-contract.yml
      - package.json
      - package-lock.json
      - vitest.config.ts
      - scripts/qa/run-persistence-qa-policy-validation.mjs
      - resources/persistence-profiles.v1.json
      - src/main/persistence/resource-policy-contract.ts
      - src/main/persistence/resource-policy.ts
      - src/main/persistence/resource-policy.test.ts
      - src/main/persistence/bootstrap.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persistence-qa-policy-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  qualify:
    name: Persistence QA policy contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Initialize owned report directory and failure JSON
        id: report_dir
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          case "$RUNNER_TEMP" in
            /) exit 1 ;;
            [A-Za-z]:|[A-Za-z]:/|[A-Za-z]:\\) exit 1 ;;
            /*|[A-Za-z]:/*|[A-Za-z]:\\*) ;;
            *) exit 1 ;;
          esac
          report_dir="$RUNNER_TEMP/persistence-qa-policy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_OS}"
          case "$report_dir" in
            "$RUNNER_TEMP"/*) ;;
            *) exit 1 ;;
          esac
          mkdir -p "$report_dir"
          printf '%s\n' '{"state":"failed","phase":"before-validation"}' > "$report_dir/qualification-status.json"
          printf 'PERSISTENCE_QA_POLICY_REPORT_DIR=%s\n' "$report_dir" >> "$GITHUB_ENV"
          printf 'path=%s\n' "$report_dir" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frozen test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run strict persistence QA policy contract tests
        run: node scripts/qa/run-persistence-qa-policy-validation.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.report_dir.outcome == 'success' && steps.report_dir.outputs.path != ''
        with:
          name: persistence-qa-policy-reports-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
          path: ${{ steps.report_dir.outputs.path }}
          if-no-files-found: error
          retention-days: 14
