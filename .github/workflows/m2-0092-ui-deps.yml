name: M2-0092 UI dependency qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - scripts/qualify-ui-deps.mjs
      - scripts/qualify-ui-deps.test.ts
      - .github/workflows/m2-0092-ui-deps.yml

permissions:
  contents: read

# Superseded PR runs are cancelled by the next push; dispatch runs have a run-unique group and are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    name: Qualify UI dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Record license, version, native-port and audit evidence
        run: node scripts/qualify-ui-deps.mjs --out out/m2-0092-ui-deps
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m2-0092-ui-deps-${{ github.run_attempt }}
          path: out/m2-0092-ui-deps/
          if-no-files-found: error
          retention-days: 30
