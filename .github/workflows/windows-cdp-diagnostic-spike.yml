name: Windows CDP diagnostic spike
run-name: ${{ github.event_name == 'pull_request' && 'Windows CDP diagnostic spike (registration)' || 'Windows CDP diagnostic spike (one pinned failed candidate)' }}

# Disposable, diagnostic-only infrastructure. Remove this workflow and its probe within 48 hours of its
# first hosted observation. Dispatch is additionally disabled after 2026-10-11T18:00:00Z. It cannot accept
# Windows onboarding, publish installers, alter the original failed report, or release Métis 2.0.
on:
  pull_request:
    paths:
      - .github/workflows/windows-cdp-diagnostic-spike.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-cdp-diagnostic-spike
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  guard:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'mysticalsin/AskToto-Mantu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Refuse dispatch after the spike window or against another candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d '2026-10-11T18:00:00Z' +%s)" ]; then
            echo '::error::The diagnostic spike has expired and must be removed.'
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/37771807736" > candidate-run.json 2>/dev/null; then
            echo '::error::The pinned candidate is unavailable.'
            exit 1
          fi
          if ! node scripts/qa/candidate-scenarios.mjs guard candidate-run.json 37771807736 >/dev/null 2>&1; then
            echo '::error::The pinned run failed the existing candidate guard.'
            exit 1
          fi
          if [ "$(jq -r .head_sha candidate-run.json)" != '2d4ebe7b6698f78abcb74dc426867d95d96e4268' ]; then
            echo '::error::The pinned run has a different producer commit.'
            exit 1
          fi

  probe:
    needs: guard
    if: github.event_name == 'workflow_dispatch' && needs.guard.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Download only the pinned candidate provenance and Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh run download 37771807736 --repo "$GITHUB_REPOSITORY" --name candidate-provenance --dir provenance >/dev/null 2>&1; then
            echo '::error::Pinned candidate provenance is unavailable.'
            exit 1
          fi
          if ! gh run download 37771807736 --repo "$GITHUB_REPOSITORY" --name candidate-win --dir assets >/dev/null 2>&1; then
            echo '::error::Pinned Windows artifact is unavailable.'
            exit 1
          fi
      - name: Verify provenance and select only the pinned Setup bytes
        id: installer
        run: |
          if ! node scripts/qa/provenance.mjs verify provenance/provenance.json assets win >/dev/null 2>&1; then
            echo '::error::Pinned candidate provenance verification failed.'
            exit 1
          fi
          installer=$(node scripts/qa/candidate-installer.mjs assets a5459e1f5137710b3f249a21ae372c13395f083a45319a0bd3f8fce7a44d6ff1 win 2>/dev/null) || {
            echo '::error::Pinned Setup bytes were not found.'
            exit 1
          }
          if [ "$(node -p "require('node:path').basename(process.argv[1])" "$installer")" != 'Metis-Setup-1.9.7.exe' ]; then
            echo '::error::Pinned Setup has the wrong filename.'
            exit 1
          fi
          echo 'path=assets/Metis-Setup-1.9.7.exe' >> "$GITHUB_OUTPUT"
      - name: Install the pinned Setup into a fresh directory
        id: install
        shell: pwsh
        env:
          INSTALLER: ${{ steps.installer.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $target = Join-Path $env:RUNNER_TEMP 'candidate-install'
            if (Test-Path $target) { throw 'not-fresh' }
            New-Item -ItemType Directory -Path $target | Out-Null
            $setup = (Resolve-Path $env:INSTALLER).Path
            $install = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$target" -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw 'setup-failed' }
            $app = Join-Path $target 'Metis.exe'
            if (-not (Test-Path $app)) { throw 'app-missing' }
            Add-Content -Path $env:GITHUB_OUTPUT -Value "app=$app"
          } catch {
            Write-Error 'Pinned Setup install failed without a usable owned app.' -ErrorAction Continue
            exit 1
          }
      - name: Observe exact owned process with unchanged 15-second boundary
        id: observation
        continue-on-error: true
        timeout-minutes: 3
        env:
          APP: ${{ steps.install.outputs.app }}
          INSTALLER: ${{ steps.installer.outputs.path }}
        run: node scripts/qa/windows-cdp-probe.mjs run --app "$APP" --installer "$INSTALLER"
      - name: Validate the only uploadable fixed-enum report
        id: scan
        if: always()
        continue-on-error: true
        run: node scripts/qa/windows-cdp-probe.mjs scan
      - name: Upload validated diagnostic only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.scan.outcome == 'success'
        with:
          name: windows-cdp-diagnostic-spike
          path: candidate-probe/cdp-probe.json
          if-no-files-found: error
          retention-days: 7
      - name: Fail unless observation and content-free gate completed
        if: always() && (steps.observation.outcome != 'success' || steps.scan.outcome != 'success')
        run: |
          echo '::error::Diagnostic observation or output validation failed; original candidate FAIL remains.'
          exit 1
