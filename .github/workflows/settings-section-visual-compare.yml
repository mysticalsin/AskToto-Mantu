name: Settings section visual compare

# M2-0071.4: compare every Settings section before/after on hosted runners only. The job uploads the
# content-free JSON report and PNGs; the private Opus review is filed from that artifact by the lead.
on:
  workflow_dispatch:
    inputs:
      before_ref:
        description: Baseline ref to compare against
        required: true
        type: string
      after_ref:
        description: Ref containing the Settings split
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/settings-section-visual-compare.yml
      - scripts/qa/settings-section-visual-compare.mjs
      - scripts/qa/settings-section-visual-compare.test.ts
      - package-lock.json
      - package.json
      - src/renderer/src/components/**
      - src/renderer/src/features/settings/**
      - src/renderer/src/styles/**
      - src/renderer/src/tokens.css
      - src/renderer/src/ui/**

permissions:
  contents: read

concurrency:
  group: settings-section-visual-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  compare:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Settings visual compare (macOS)
            os: macos-latest
            platform: mac
          - name: Settings visual compare (Windows)
            os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.platform == 'mac' && 180 || 140 }}
    steps:
      - name: Resolve comparison refs
        id: refs
        env:
          BEFORE_REF_INPUT: ${{ inputs.before_ref }}
          AFTER_REF_INPUT: ${{ inputs.after_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          before="${BEFORE_REF_INPUT:-$PR_BASE_SHA}"
          after="${AFTER_REF_INPUT:-$PR_HEAD_SHA}"
          if [ -z "$before" ] || [ -z "$after" ]; then
            echo "::error::before_ref and after_ref are required outside pull_request runs."
            exit 1
          fi
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.refs.outputs.before }}
          path: before
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.refs.outputs.after }}
          path: after
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: |
            before/package-lock.json
            after/package-lock.json

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            before/resources/models
            before/resources/asr
            before/resources/ort
            before/resources/llama
            before/resources/local-llm
            after/resources/models
            after/resources/asr
            after/resources/ort
            after/resources/llama
            after/resources/local-llm
          key: settings-visual-assets-${{ runner.os }}-${{ hashFiles('after/scripts/fetch-models.mjs', 'after/resources/runtime-assets-manifest.json', 'after/scripts/fetch-llama-server.mjs', 'after/scripts/fetch-local-model.mjs', 'after/scripts/local-model-assets.mjs') }}

      - name: Install dependencies
        run: |
          npm ci --prefix before
          npm ci --prefix after

      - name: Provision reviewed ffmpeg sidecars (macOS)
        if: matrix.platform == 'mac'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for checkout in before after; do
            gh release download ffmpeg-sidecar-v1 --repo "$GITHUB_REPOSITORY" --pattern 'ffmpeg-darwin-*' --dir "$checkout/resources/ffmpeg"
            for arch in arm64 x64; do
              mkdir -p "$checkout/resources/ffmpeg/darwin-$arch"
              mv "$checkout/resources/ffmpeg/ffmpeg-darwin-$arch" "$checkout/resources/ffmpeg/darwin-$arch/ffmpeg"
              chmod +x "$checkout/resources/ffmpeg/darwin-$arch/ffmpeg"
              xattr -d com.apple.quarantine "$checkout/resources/ffmpeg/darwin-$arch/ffmpeg" 2>/dev/null || true
            done
          done

      - name: Provision reviewed ffmpeg sidecar (Windows)
        if: matrix.platform == 'windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for checkout in before after; do
            gh release download ffmpeg-sidecar-v1 --repo "$GITHUB_REPOSITORY" --pattern 'ffmpeg-win32-x64.exe' --dir "$checkout/resources/ffmpeg"
            mkdir -p "$checkout/resources/ffmpeg/win32-x64"
            mv "$checkout/resources/ffmpeg/ffmpeg-win32-x64.exe" "$checkout/resources/ffmpeg/win32-x64/ffmpeg.exe"
          done

      - name: Build packaged apps (macOS)
        if: matrix.platform == 'mac'
        run: |
          npm --prefix before run dist
          npm --prefix after run dist
          mkdir -p "$RUNNER_TEMP/settings-visual/before" "$RUNNER_TEMP/settings-visual/after"
          volume="$RUNNER_TEMP/settings-visual/volume-before"
          hdiutil attach -nobrowse -readonly -mountpoint "$volume" before/release/Metis-*.dmg > /dev/null
          ditto "$volume/Metis.app" "$RUNNER_TEMP/settings-visual/before/Metis.app"
          hdiutil detach "$volume" > /dev/null
          volume="$RUNNER_TEMP/settings-visual/volume-after"
          hdiutil attach -nobrowse -readonly -mountpoint "$volume" after/release/Metis-*.dmg > /dev/null
          ditto "$volume/Metis.app" "$RUNNER_TEMP/settings-visual/after/Metis.app"
          hdiutil detach "$volume" > /dev/null

      - name: Build packaged apps (Windows)
        if: matrix.platform == 'windows'
        run: |
          npm --prefix before run dist:win
          npm --prefix after run dist:win

      - name: Compare every Settings section (macOS)
        if: matrix.platform == 'mac'
        run: |
          mkdir -p settings-visual-report
          node after/scripts/qa/settings-section-visual-compare.mjs \
            "$RUNNER_TEMP/settings-visual/before/Metis.app/Contents/MacOS/Metis" \
            "$RUNNER_TEMP/settings-visual/after/Metis.app/Contents/MacOS/Metis" \
            settings-visual-report

      - name: Compare every Settings section (Windows)
        if: matrix.platform == 'windows'
        run: |
          mkdir -p settings-visual-report
          node after/scripts/qa/settings-section-visual-compare.mjs \
            before/release/win-unpacked/Metis.exe \
            after/release/win-unpacked/Metis.exe \
            settings-visual-report

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && !cancelled()
        with:
          name: settings-section-visual-${{ matrix.platform }}
          path: settings-visual-report/
          if-no-files-found: error
          retention-days: 14

      - name: Record lead action
        if: always()
        run: |
          echo "LEAD_ACTION: dispatch settings-section-visual-compare for ${{ steps.refs.outputs.before }}/${{ steps.refs.outputs.after }} on ${{ matrix.os }}, review the uploaded section PNGs, file the evidence" | tee -a "$GITHUB_STEP_SUMMARY"
