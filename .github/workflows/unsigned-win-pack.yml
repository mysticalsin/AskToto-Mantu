name: Unsigned Windows pack

# Native windows-latest pack for a chosen git_ref (workflow_dispatch) or any push to
# cursor/windows-pack-* branches. Artifacts only — does not create/mutate a GitHub Release.
# Signing secrets are not consulted: CSC / WIN_CSC stay unused; check-release-secrets and
# verify-signing are not run. Launch + runtime gates DO run — this is the path that proves
# Metis.exe actually opens on Windows (unlike a Linux cross-pack).
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Branch or SHA to checkout and pack unsigned'
        required: true
        type: string
        default: main
  push:
    branches:
      - 'cursor/windows-pack-**'

jobs:
  unsigned-win-pack:
    name: Unsigned Windows pack
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.sha }}
          fetch-depth: 0

      # Same ffmpeg-sidecar-v1 provision as release.yml release-windows. windows-latest
      # already satisfies scripts/check-build-host.mjs win (process.platform === 'win32').
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: resources/ffmpeg/win32-x64
          key: ffmpeg-sidecar-v1-win32-x64-${{ hashFiles('resources/ffmpeg/manifest.json') }}
      - name: Provision ffmpeg sidecar (win32-x64)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p resources/ffmpeg/win32-x64
          if ! gh release download ffmpeg-sidecar-v1 --repo "$GITHUB_REPOSITORY" \
               --pattern 'ffmpeg-win32-x64.exe' \
               --dir resources/ffmpeg --clobber; then
            echo "::warning::Could not download the ffmpeg-sidecar-v1 release assets - falling through to the hard gate below."
          elif [ -f resources/ffmpeg/ffmpeg-win32-x64.exe ]; then
            mv resources/ffmpeg/ffmpeg-win32-x64.exe resources/ffmpeg/win32-x64/ffmpeg.exe
          fi
      - name: Require the ffmpeg sidecar to be present
        shell: bash
        run: |
          if [ ! -f "resources/ffmpeg/win32-x64/ffmpeg.exe" ]; then
            echo "::error::Missing resources/ffmpeg/win32-x64/ffmpeg.exe and the ffmpeg-sidecar-v1 release could not provision it."
            echo "::error::One-time seed (run once locally by a maintainer holding the reviewed binaries in resources/ffmpeg/):"
            echo "::error::  cp resources/ffmpeg/darwin-arm64/ffmpeg /tmp/ffmpeg-darwin-arm64 && cp resources/ffmpeg/darwin-x64/ffmpeg /tmp/ffmpeg-darwin-x64 && cp resources/ffmpeg/win32-x64/ffmpeg.exe /tmp/ffmpeg-win32-x64.exe && gh release create ffmpeg-sidecar-v1 /tmp/ffmpeg-darwin-arm64 /tmp/ffmpeg-darwin-x64 /tmp/ffmpeg-win32-x64.exe --repo $GITHUB_REPOSITORY --title 'ffmpeg sidecar v1' --notes 'Reviewed LGPL-only ffmpeg binaries for CI provisioning (tracked manifest.json contains SHA256s).'"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci

      # Same model / sidecar cache as release.yml. predist:win fetches these; it does not
      # call check-release-secrets or verify-signing.
      - uses: actions/cache@v4
        with:
          path: |
            resources/models
            resources/asr
            resources/ort
            resources/llama
            resources/local-llm
            resources/managed-node
          key: runtime-assets-${{ runner.os }}-${{ hashFiles('scripts/fetch-models.mjs', 'resources/runtime-assets-manifest.json') }}-${{ hashFiles('scripts/fetch-llama-server.mjs') }}-${{ hashFiles('scripts/fetch-local-model.mjs', 'scripts/local-model-assets.mjs') }}-${{ hashFiles('scripts/fetch-managed-node.mjs') }}

      - name: Provision Windows runtime assets
        run: npm run predist:win

      - name: Build intelligence extraResources
        run: npm run build:intelligence

      - name: Build renderer and main
        run: npm run build

      - name: Pack unsigned Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder --config electron-builder.win.yml --win --x64 --publish never

      - name: Runtime gate (Windows)
        run: node scripts/check-packaged-runtime.mjs win --post-sign

      - name: Launch gate (proves Metis.exe opens on Windows)
        run: node scripts/check-packaged-launch.mjs release/win-unpacked/Metis.exe

      - uses: actions/upload-artifact@v4
        with:
          name: metis-unsigned-windows
          if-no-files-found: error
          compression-level: 0
          path: |
            release/Metis-Setup-*.exe
            release/Metis-Portable-*.exe
            release/latest.yml
            release/*.blockmap
