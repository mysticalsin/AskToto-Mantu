name: Metis native draft durability RED (temporary)
run-name: ${{ github.event_name == 'pull_request' && 'Metis native draft durability RED (registration)' || 'Metis native draft durability RED' }}

# Disposable, synthetic TDD evidence only. Remove after one hosted observation and no later
# than 2026-10-11T18:00:00Z. A green workflow means the two pinned assertions failed as expected,
# not that native crash recovery, backup exclusion, or the app passed acceptance.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/metis-native-draft-red.yml

permissions:
  contents: read

concurrency:
  group: metis-native-draft-red
  cancel-in-progress: false

jobs:
  observe-red:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Refuse a foreign repository, event or branch
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" != workflow_dispatch ] || [ "$REPOSITORY" != mysticalsin/AskToto-Mantu ] || [ "$REF" != refs/heads/main ]; then
            echo 'native-draft-red:WRONG_DISPATCH'
            exit 1
          fi
      - name: Enforce the temporary workflow expiry
        shell: bash
        run: |
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$now" == '2026-10-11T18:00:00Z' || "$now" > '2026-10-11T18:00:00Z' ]]; then
            echo 'native-draft-red:EXPIRED'
            exit 1
          fi
      - name: Checkout the dispatched main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: base
          persist-credentials: false
      - name: Checkout the pinned test-only fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 921d07a3062b592354a07c186a979bab79dfc0c7
          path: fixture
          fetch-depth: 2
          persist-credentials: false
      - name: Refuse stale or mutated fixture inputs
        shell: bash
        run: |
          set -euo pipefail
          fixture_sha='921d07a3062b592354a07c186a979bab79dfc0c7'
          fixture_parent='e9e8942f9ff21a0827cc33fde688fdaface9b798'
          fixture_test='native-app/MetisKit/Tests/MetisKitTests/MeetingDraftDurabilityTests.swift'
          if [ "$(git -C base rev-parse HEAD 2>/dev/null)" != "$GITHUB_SHA" ]; then
            echo 'native-draft-red:BASE_MISMATCH'
            exit 1
          fi
          if [ "$(git -C fixture rev-parse HEAD 2>/dev/null)" != "$fixture_sha" ]; then
            echo 'native-draft-red:FIXTURE_MISMATCH'
            exit 1
          fi
          if [ "$(git -C fixture rev-parse HEAD^ 2>/dev/null)" != "$fixture_parent" ]; then
            echo 'native-draft-red:PARENT_MISMATCH'
            exit 1
          fi
          if [ "$(git -C fixture diff-tree --no-commit-id --name-only -r HEAD 2>/dev/null)" != "$fixture_test" ]; then
            echo 'native-draft-red:FIXTURE_SCOPE_MISMATCH'
            exit 1
          fi
          if [ "$(git -C base rev-parse HEAD:native-app/MetisKit)" != "$(git -C fixture rev-parse HEAD^:native-app/MetisKit)" ] ||
             ! cmp -s base/scripts/hermetic/run-swift-tests.sh fixture/scripts/hermetic/run-swift-tests.sh; then
            echo 'native-draft-red:CONTRACT_STALE'
            exit 1
          fi
          if [ -e "base/$fixture_test" ]; then
            echo 'native-draft-red:TEST_ALREADY_PRESENT'
            exit 1
          fi
          cp "fixture/$fixture_test" "base/$fixture_test"
          echo 'native-draft-red:FIXTURE_PINNED'
      - name: Classify only the two expected XCTest assertion failures
        working-directory: base
        shell: bash
        run: |
          set -uo pipefail
          output="$RUNNER_TEMP/native-draft-red-swift-test.log"
          trap 'rm -f "$output"' EXIT
          bash scripts/hermetic/run-swift-tests.sh native-app/MetisKit \
            --filter MeetingDraftDurabilityTests > "$output" 2>&1
          result=$?
          if [ "$result" -eq 1 ] &&
             grep -Fq 'A line must not be displayed before a durable draft acknowledges it' "$output" &&
             grep -Fq 'A streamed line must not be displayed before a durable draft acknowledges it' "$output" &&
             grep -Fq 'Executed 2 tests, with 2 failures' "$output"; then
            echo 'native-draft-red:EXPECTED_TWO_ASSERTIONS'
          else
            echo 'native-draft-red:UNEXPECTED_TEST_RESULT'
            exit 1
          fi
