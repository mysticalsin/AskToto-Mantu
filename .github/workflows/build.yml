name: Build & Test

on:
  # branches: ['**'] is LOAD-BEARING, not decorative: GitHub's documented push-filter semantics say a
  # push: block defining ONLY tags/tags-ignore never runs for branch pushes at all. Without this line,
  # branch CI is silently disabled repo-wide (bitten once — a main push produced zero runs). It also
  # keeps every branch covered: an empty check-suite reports "failure" rather than skipped, so filtering
  # to main/master would show phantom red X's on feature branches.
  # tags-ignore: v* tags already run the customer release.yml pipeline (running this verification-only
  # workflow too just doubles CI minutes); ffmpeg-sidecar-* tags only carry CI provisioning assets.
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
      - 'ffmpeg-sidecar-*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  quality:
    # Matrix over both host platforms is LOAD-BEARING. This job was ubuntu-only for the app's whole
    # history, so every Windows-gated test was a silent false-pass: nothing ever executed the win32
    # branches of the suite, and three POSIX-only assertions in check-ffmpeg-sidecar.test.ts sat broken
    # on main undetected because the only Windows job (build-windows) packages without running tests.
    # A Windows runner here is the gate that keeps win32 test breakage from reaching main again.
    name: Quality checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Windows runners are consistently slower at npm ci + the Electron build than ubuntu.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Anti-regression gate: every bug in docs/qa/BUG-LEDGER.md marked FIXED must be pinned by a
      # regression test that cites its MQA id, so a re-broken bug fails a named test instead of
      # silently shipping again. Runs before the suite — it is fast and its failure is unambiguous.
      - run: npm run check:bugs
      - run: npm run build
      - run: npm test

  security:
    name: Security & supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      # SCA gate: block on CRITICAL. npm still reports Dust's bundled MCP SDK metadata even though
      # postinstall removes that unused server tree and check-packaged-runtime verifies the finished
      # app.asar contains only the safe root express-rate-limit/ip-address versions. Escalate to high
      # once @dust-tt/client publishes a package without the stale bundled dependency metadata.
      - name: Dependency audit (block on critical)
        run: npm audit --audit-level=critical
      - name: Dependency audit (report high, non-blocking)
        run: npm audit --audit-level=high || true
      # Secret scan: fail if a key-shaped string is committed to source.
      #
      # The prefix list is not hand-picked: it is every prefix src/shared/providers.ts declares as a
      # `keyPattern`, folded into one dashed-prefix term (sk-<vendor>-) plus the non-sk prefixes. The old
      # literal list named only sk-ant- and sk-or-, so it could not match sk-kimi- — the format this
      # product embeds itself (src/main/cahe-embedded-key.ts, build/cahe-kimi.local.json) — and the gate
      # went green on the one credential it exists to stop. \b keeps the generic sk- term off ordinary
      # dashed words ("risk-management-…"). scripts/ci-secret-scan.contract.test.ts executes this exact
      # regex against those declared prefixes, so the two lists cannot drift apart again.
      #
      # Roots cover where keys actually live, not just src/: scripts/ (the .mjs build and release chain,
      # hence --include='*.mjs'), build/ (the Cahê key file), intelligence/src (a real source tree shipped
      # as extraResources), and both packaging overlays. Excluded: *.test.ts and scripts/qa, which plant
      # deliberately dead key-shaped fixtures to exercise the redaction and degrade paths — that is the
      # harness working, not a leak.
      - name: Secret scan
        run: |
          if grep -rInE '\b(nvapi-|sk-[A-Za-z0-9]+-|gsk_|xai-|AIza|eyJ|fw_|tgp_v1_)[A-Za-z0-9_-]{16,}' \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
            --include='*.json' --include='*.yml' \
            --exclude='*.test.ts' --exclude='*.test.tsx' --exclude-dir=qa \
            src scripts build intelligence/src .github \
            electron-builder.yml electron-builder.win.yml electron-builder.cahe.win.yml package.json 2>/dev/null; then
            echo "::error::Possible committed secret found"; exit 1
          fi
          echo "No committed secrets found."
      # SBOM (CycloneDX) for the supply-chain evidence package.
      - name: Generate SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.json || echo "SBOM step skipped"
      # Best-effort, like the two SBOM steps above it (`|| true`, `|| echo skipped`, if-no-files-found:
      # ignore). Without continue-on-error a GitHub *billing* condition fails the whole security job:
      # "Artifact storage quota has been hit" took this job red on main for multiple releases even though
      # the gates that actually matter — the critical-severity audit and the secret scan — both passed.
      # The SBOM is supply-chain EVIDENCE, not a gate; losing an upload must not mask the real verdict.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: ignore

  build-macos:
    name: macOS package
    needs: [quality, security]
    # COST GATE (added 2026-08-17). This job ran on every push to every branch, and a macOS runner bills
    # at 10x wall-clock against the Actions allowance — so a single feature-branch push could reserve up
    # to 900 quota-minutes here, plus 180 more on the Windows job below. On a private repo's monthly
    # allowance that is two or three pushes before everything stops: GitHub then refuses to start ANY
    # job with "The job was not started because an Actions budget is preventing further use", which is
    # exactly the state this repo was found in — quality and security failing in 3s with no runner
    # assigned, and both package jobs skipped, so no installer could be produced at all.
    #
    # Packaging still runs everywhere it earns its cost: pushes to main, pull requests into main (so a
    # branch is packaged before it merges, not after), and workflow_dispatch to package any branch on
    # demand. What it no longer does is repackage 3.2 GB of sidecars for every intermediate commit on a
    # work-in-progress branch. The cheap gates are untouched — quality (ubuntu + windows) and security
    # still run on every push, so branch feedback is unchanged.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Restore the reviewed LGPL ffmpeg decoder binary (the manifest/license stay tracked in git) from
      # the ffmpeg-sidecar-v1 release in this repo. Cache the target binary directory so a
      # warm runner doesn't hit the GitHub API on every run; fall back to `gh release download` (built-in
      # GITHUB_TOKEN, read-only, scoped to this repo) on a cache miss. Without this, predist's
      # check-ffmpeg-sidecar.mjs throws a raw ENOENT before the build even starts.
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: resources/ffmpeg/darwin-arm64
          key: ffmpeg-sidecar-v1-darwin-arm64-${{ hashFiles('resources/ffmpeg/manifest.json') }}
      - name: Provision ffmpeg sidecar (darwin-arm64)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p resources/ffmpeg/darwin-arm64
          if ! gh release download ffmpeg-sidecar-v1 --repo "$GITHUB_REPOSITORY" \
               --pattern 'ffmpeg-darwin-arm64' \
               --dir resources/ffmpeg --clobber; then
            echo "::warning::Could not download the ffmpeg-sidecar-v1 release assets - falling through to the hard gate below."
          elif [ -f resources/ffmpeg/ffmpeg-darwin-arm64 ]; then
            mv resources/ffmpeg/ffmpeg-darwin-arm64 resources/ffmpeg/darwin-arm64/ffmpeg
            chmod +x resources/ffmpeg/darwin-arm64/ffmpeg
            # A freshly downloaded, unsigned Mach-O is quarantined by the OS, and
            # Gatekeeper then kills it on exec. check-ffmpeg-sidecar.mjs runs the
            # binary to read its licence banner, so a quarantined sidecar fails the
            # gate. Stripping the attribute here is safe: the same script verifies
            # the file against the reviewed sha256 in resources/ffmpeg/manifest.json
            # before it is ever executed, so trust comes from the hash, not the OS.
            xattr -d com.apple.quarantine resources/ffmpeg/darwin-arm64/ffmpeg 2>/dev/null || true
          fi
      - name: Require the ffmpeg sidecar to be present (darwin-arm64)
        run: |
          if [ ! -f "resources/ffmpeg/darwin-arm64/ffmpeg" ]; then
            echo "::error::Missing resources/ffmpeg/darwin-arm64/ffmpeg and the ffmpeg-sidecar-v1 release could not provision it."
            echo "::error::One-time seed (run once locally by a maintainer holding the reviewed binaries in resources/ffmpeg/):"
            echo "::error::  cp resources/ffmpeg/darwin-arm64/ffmpeg /tmp/ffmpeg-darwin-arm64 && cp resources/ffmpeg/darwin-x64/ffmpeg /tmp/ffmpeg-darwin-x64 && cp resources/ffmpeg/win32-x64/ffmpeg.exe /tmp/ffmpeg-win32-x64.exe && gh release create ffmpeg-sidecar-v1 /tmp/ffmpeg-darwin-arm64 /tmp/ffmpeg-darwin-x64 /tmp/ffmpeg-win32-x64.exe --repo $GITHUB_REPOSITORY --title 'ffmpeg sidecar v1' --notes 'Reviewed LGPL-only ffmpeg binaries for CI provisioning (tracked manifest.json contains SHA256s).'"
            exit 1
          fi
      # The Intel half of the universal build. Deliberately a SECOND cache entry with its own id and
      # key rather than another path on the arm64 one: with a shared id, an arm64 cache hit would skip
      # this download too, and the gate below would then fail a job that was one step from complete.
      - uses: actions/cache@v4
        id: ffmpeg-cache-x64
        with:
          path: resources/ffmpeg/darwin-x64
          key: ffmpeg-sidecar-v1-darwin-x64-${{ hashFiles('resources/ffmpeg/manifest.json') }}
      - name: Provision ffmpeg sidecar (darwin-x64)
        if: steps.ffmpeg-cache-x64.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p resources/ffmpeg/darwin-x64
          if ! gh release download ffmpeg-sidecar-v1 --repo "$GITHUB_REPOSITORY" \
               --pattern 'ffmpeg-darwin-x64' \
               --dir resources/ffmpeg --clobber; then
            echo "::warning::Could not download the ffmpeg-sidecar-v1 release assets - falling through to the hard gate below."
          elif [ -f resources/ffmpeg/ffmpeg-darwin-x64 ]; then
            mv resources/ffmpeg/ffmpeg-darwin-x64 resources/ffmpeg/darwin-x64/ffmpeg
            chmod +x resources/ffmpeg/darwin-x64/ffmpeg
            # Same quarantine strip, same justification as the arm64 step above: the download is
            # unsigned and quarantined, and trust comes from the reviewed sha256, not from Gatekeeper.
            xattr -d com.apple.quarantine resources/ffmpeg/darwin-x64/ffmpeg 2>/dev/null || true
          fi
      # Hard gate for the second arch. Not optional and not droppable: package.json's predist checks
      # `mac x64` as well as `mac arm64`, and check-packaged-runtime.mjs --arches=arm64,x64 hashes both
      # out of the finished universal .app, so a missing Intel binary would only move the failure to the
      # far side of 40 minutes of packaging.
      - name: Require the ffmpeg sidecar to be present (darwin-x64)
        run: |
          if [ ! -f "resources/ffmpeg/darwin-x64/ffmpeg" ]; then
            echo "::error::Missing resources/ffmpeg/darwin-x64/ffmpeg and the ffmpeg-sidecar-v1 release could not provision it."
            echo "::error::This binary is cross-compiled on Apple Silicon by scripts/build-ffmpeg-sidecar-mac.sh x64 (needs nasm and Rosetta 2 on that Mac) - see resources/ffmpeg/manifest.json and docs/ENTERPRISE_RELEASE.md."
            echo "::error::One-time seed (run once locally by a maintainer holding the reviewed binaries in resources/ffmpeg/):"
            echo "::error::  cp resources/ffmpeg/darwin-arm64/ffmpeg /tmp/ffmpeg-darwin-arm64 && cp resources/ffmpeg/darwin-x64/ffmpeg /tmp/ffmpeg-darwin-x64 && cp resources/ffmpeg/win32-x64/ffmpeg.exe /tmp/ffmpeg-win32-x64.exe && gh release create ffmpeg-sidecar-v1 /tmp/ffmpeg-darwin-arm64 /tmp/ffmpeg-darwin-x64 /tmp/ffmpeg-win32-x64.exe --repo $GITHUB_REPOSITORY --title 'ffmpeg sidecar v1' --notes 'Reviewed LGPL-only ffmpeg binaries for CI provisioning (tracked manifest.json contains SHA256s).'"
            echo "::error::Adding it to a release that already exists: gh release upload ffmpeg-sidecar-v1 /tmp/ffmpeg-darwin-x64 --clobber --repo $GITHUB_REPOSITORY"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      # Bundled ASR models (~1.3 GB, fetched by predist -> scripts/fetch-models.mjs) are the same set of
      # files on every run unless that script's URLs change — cache them keyed on its hash so PR builds
      # don't re-download ~1.3 GB from HuggingFace/GitHub on every push. fetch-models.mjs reuses present
      # files only after the final exact manifest gate, so a warm cache avoids transfer without weakening integrity.
      # resources/llama (the pinned llama-server sidecar, ~10 MB, fetched by predist ->
      # scripts/fetch-llama-server.mjs) rides the same cache step — its own hashFiles() term means a pin
      # bump in that script busts only this entry, not the unrelated ASR model cache.
      - uses: actions/cache@v4
        with:
          path: |
            resources/models
            resources/asr
            resources/ort
            resources/llama
            resources/local-llm
          key: runtime-assets-${{ runner.os }}-${{ hashFiles('scripts/fetch-models.mjs', 'resources/runtime-assets-manifest.json') }}-${{ hashFiles('scripts/fetch-llama-server.mjs') }}-${{ hashFiles('scripts/fetch-local-model.mjs', 'scripts/local-model-assets.mjs') }}
      - run: npm run dist
        env:
          # dist applies a complete ad-hoc signature for runtime verification; it is not Developer ID
          # signed/notarized and must never be substituted for release.yml's customer artifacts.
          ASKTOTO_DISABLE_CP: '1'
      # Upload installers only — never release/* wholesale. The unpacked mac-arm64/ app dir pushed a
      # single run's artifact to ~6 GB and repeated runs blew the org's Actions storage quota, which
      # then failed every packaging job at the upload step. Installers + update metadata are all a PR
      # reviewer needs; 3-day retention because these are PR-verification builds, not releases.
      # continue-on-error for the same reason as the Windows job: the comment above records that the
      # quota "then failed every packaging job at the upload step", i.e. this has already bitten once.
      # The verification (predist gates -> build -> electron-builder -> check-packaged-runtime) is done
      # before this step; if-no-files-found: error still fails a build that produced no installer.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: metis-macos
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  build-windows:
    name: Windows package
    needs: [quality, security]
    # Same cost gate as build-macos above (see the reasoning there). Windows bills at 2x rather than 10x,
    # but it is the same 90-minute packaging job and the two together are what drained the allowance.
    # Kept in lockstep deliberately: if a push packages one platform it must package both, or a release
    # candidate could reach main verified on only one of the two targets it ships.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Restore the reviewed LGPL ffmpeg decoder binary (the manifest/license stay tracked in git) from
      # the ffmpeg-sidecar-v1 release in this repo. Cache the target binary directory so a
      # warm runner doesn't hit the GitHub API on every run; fall back to `gh release download` (built-in
      # GITHUB_TOKEN, read-only, scoped to this repo) on a cache miss. Without this, predist:win's
      # check-ffmpeg-sidecar.mjs throws a raw ENOENT before the build even starts.
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: resources/ffmpeg/win32-x64
          key: ffmpeg-sidecar-v1-win32-x64-${{ hashFiles('resources/ffmpeg/manifest.json') }}
      - name: Provision ffmpeg sidecar (win32-x64)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p resources/ffmpeg/win32-x64
          if ! gh release download ffmpeg-sidecar-v1 --repo "$GITHUB_REPOSITORY" \
               --pattern 'ffmpeg-win32-x64.exe' \
               --dir resources/ffmpeg --clobber; then
            echo "::warning::Could not download the ffmpeg-sidecar-v1 release assets - falling through to the hard gate below."
          elif [ -f resources/ffmpeg/ffmpeg-win32-x64.exe ]; then
            mv resources/ffmpeg/ffmpeg-win32-x64.exe resources/ffmpeg/win32-x64/ffmpeg.exe
          fi
      - name: Require the ffmpeg sidecar to be present
        shell: bash
        run: |
          if [ ! -f "resources/ffmpeg/win32-x64/ffmpeg.exe" ]; then
            echo "::error::Missing resources/ffmpeg/win32-x64/ffmpeg.exe and the ffmpeg-sidecar-v1 release could not provision it."
            echo "::error::One-time seed (run once locally by a maintainer holding the reviewed binaries in resources/ffmpeg/):"
            echo "::error::  cp resources/ffmpeg/darwin-arm64/ffmpeg /tmp/ffmpeg-darwin-arm64 && cp resources/ffmpeg/darwin-x64/ffmpeg /tmp/ffmpeg-darwin-x64 && cp resources/ffmpeg/win32-x64/ffmpeg.exe /tmp/ffmpeg-win32-x64.exe && gh release create ffmpeg-sidecar-v1 /tmp/ffmpeg-darwin-arm64 /tmp/ffmpeg-darwin-x64 /tmp/ffmpeg-win32-x64.exe --repo $GITHUB_REPOSITORY --title 'ffmpeg sidecar v1' --notes 'Reviewed LGPL-only ffmpeg binaries for CI provisioning (tracked manifest.json contains SHA256s).'"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      # Same model + llama-server cache as the macOS job — see the comments there. Paths are OS-agnostic
      # (plain model/binary files), keyed by runner.os anyway since GitHub scopes/evicts caches
      # independently per OS.
      - uses: actions/cache@v4
        with:
          path: |
            resources/models
            resources/asr
            resources/ort
            resources/llama
            resources/local-llm
          key: runtime-assets-${{ runner.os }}-${{ hashFiles('scripts/fetch-models.mjs', 'resources/runtime-assets-manifest.json') }}-${{ hashFiles('scripts/fetch-llama-server.mjs') }}-${{ hashFiles('scripts/fetch-local-model.mjs', 'scripts/local-model-assets.mjs') }}
      - run: npm run dist:win
      # AppX packaging only works on Windows runners (needs the Windows SDK). This verification job sets
      # no Windows certificate, so its EXE/AppX artifacts are unsigned and are not customer releases.
      - run: npm run dist:win:appx
      # Installers only, same rationale as the macOS job (win-unpacked/ was ~7.5 GB per run).
      # continue-on-error is about WHAT THIS JOB PROVES. Everything that verifies the package — the
      # predist asset gates, the build, electron-builder, check-packaged-runtime and
      # check-update-metadata — has already run and passed by the time we get here; the upload is
      # convenience distribution with a 3-day retention. A repo-wide "Artifact storage quota has been
      # hit" (a GitHub billing state that recalculates every 6-12h) would otherwise red-line this job,
      # and every future PR, for a reason that has nothing to do with the code. if-no-files-found: error
      # is deliberately KEPT, so a build that genuinely produced no installer still fails the job.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: metis-windows
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*.exe
            release/*.appx
            release/*.blockmap
            release/latest*.yml
            release-appx/*.appx
