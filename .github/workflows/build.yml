name: Build & Test

on:
  # branches: ['**'] is LOAD-BEARING, not decorative: GitHub's documented push-filter semantics say a
  # push: block defining ONLY tags/tags-ignore never runs for branch pushes at all. Without this line,
  # branch CI is silently disabled repo-wide (bitten once — a main push produced zero runs). It also
  # keeps every branch covered: an empty check-suite reports "failure" rather than skipped, so filtering
  # to main/master would show phantom red X's on feature branches.
  # tags-ignore: v* tags already run the signed release.yml pipeline (running this unsigned one too just
  # doubles CI minutes); ffmpeg-sidecar-* tags only carry CI provisioning assets (docs/ENTERPRISE_RELEASE.md).
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
      - 'ffmpeg-sidecar-*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  security:
    name: Security & supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      # SCA gate: block on CRITICAL. High advisories are reported (not hard-failed) because the current
      # highs are unreachable transitive deps under @dust-tt/client (express/router/path-to-regexp/qs —
      # AskToto runs no inbound HTTP/MCP server, so those code paths are never hit; tracked as R-05).
      # Escalate to --audit-level=high once @dust-tt/client ships a patched express.
      - name: Dependency audit (block on critical)
        run: npm audit --audit-level=critical
      - name: Dependency audit (report high, non-blocking)
        run: npm audit --audit-level=high || true
      # Secret scan: fail if a key-shaped string is committed to source (allow .env.example placeholders).
      # Test files are excluded — redact.test.ts intentionally contains fake key-shaped strings to verify
      # the redaction function actually catches them; that's the test working, not a leak.
      - name: Secret scan
        run: |
          if grep -rInE '(nvapi-|sk-ant-|sk-or-|gsk_|fw_|tgp_v1_)[A-Za-z0-9_-]{16,}' \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' --include='*.yml' \
            --exclude='*.test.ts' --exclude='*.test.tsx' \
            src .github electron-builder.yml 2>/dev/null; then
            echo "::error::Possible committed secret found"; exit 1
          fi
          echo "No committed secrets found."
      # SBOM (CycloneDX) for the supply-chain evidence package.
      - name: Generate SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.json || echo "SBOM step skipped"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: ignore

  build-macos:
    name: macOS package
    needs: [quality, security]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Restore the reviewed LGPL ffmpeg decoder sidecar (untracked in git - see
      # resources/ffmpeg/manifest.json) from the ffmpeg-sidecar-v1 release in this repo. Cache first so a
      # warm runner doesn't hit the GitHub API on every run; fall back to `gh release download` (built-in
      # GITHUB_TOKEN, read-only, scoped to this repo) on a cache miss. Without this, predist's
      # check-ffmpeg-sidecar.mjs throws a raw ENOENT before the build even starts.
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: resources/ffmpeg
          key: ffmpeg-sidecar-v1-darwin-arm64
      - name: Provision ffmpeg sidecar (darwin-arm64)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p resources/ffmpeg/darwin-arm64
          if ! gh release download ffmpeg-sidecar-v1 --repo "$GITHUB_REPOSITORY" \
               --pattern 'ffmpeg-darwin-arm64' --pattern 'manifest.json' --pattern 'LICENSE.LGPL-2.1.txt' \
               --dir resources/ffmpeg --clobber; then
            echo "::warning::Could not download the ffmpeg-sidecar-v1 release assets - falling through to the hard gate below."
          elif [ -f resources/ffmpeg/ffmpeg-darwin-arm64 ]; then
            mv resources/ffmpeg/ffmpeg-darwin-arm64 resources/ffmpeg/darwin-arm64/ffmpeg
            chmod +x resources/ffmpeg/darwin-arm64/ffmpeg
          fi
      - name: Require the ffmpeg sidecar to be present
        run: |
          if [ ! -f "resources/ffmpeg/darwin-arm64/ffmpeg" ]; then
            echo "::error::Missing resources/ffmpeg/darwin-arm64/ffmpeg and the ffmpeg-sidecar-v1 release could not provision it."
            echo "::error::One-time seed (run once locally by a maintainer holding the reviewed binaries in resources/ffmpeg/):"
            echo "::error::  cp resources/ffmpeg/darwin-arm64/ffmpeg /tmp/ffmpeg-darwin-arm64 && cp resources/ffmpeg/win32-x64/ffmpeg.exe /tmp/ffmpeg-win32-x64.exe && gh release create ffmpeg-sidecar-v1 /tmp/ffmpeg-darwin-arm64 /tmp/ffmpeg-win32-x64.exe resources/ffmpeg/manifest.json resources/ffmpeg/LICENSE.LGPL-2.1.txt --repo $GITHUB_REPOSITORY --title 'ffmpeg sidecar v1' --notes 'Reviewed LGPL-only ffmpeg binaries for CI provisioning (see manifest.json for SHA256s).'"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      # Bundled ASR models (~1.3 GB, fetched by predist -> scripts/fetch-models.mjs) are the same set of
      # files on every run unless that script's URLs change — cache them keyed on its hash so PR builds
      # don't re-download ~1.3 GB from HuggingFace/GitHub on every push. fetch-models.mjs already skips
      # any file that's present with non-zero size, so a warm cache makes predist a near no-op.
      # resources/llama (the pinned llama-server sidecar, ~10 MB, fetched by predist ->
      # scripts/fetch-llama-server.mjs) rides the same cache step — its own hashFiles() term means a pin
      # bump in that script busts only this entry, not the unrelated ASR model cache.
      - uses: actions/cache@v4
        with:
          path: |
            resources/models
            resources/asr
            resources/ort
            resources/llama
          key: asr-models-${{ runner.os }}-${{ hashFiles('scripts/fetch-models.mjs') }}-${{ hashFiles('scripts/fetch-llama-server.mjs') }}
      - name: Cache immutable local AI assets
        uses: actions/cache@v4
        with:
          path: resources/local-ai/cache
          key: local-ai-darwin-arm64-${{ hashFiles('resources/local-ai/candidates.json') }}
      - name: Fetch selected local AI assets
        run: npm run fetch:local-ai
      - name: Stage selected local AI payload (darwin-arm64)
        run: npm run stage:local-ai -- --platform darwin-arm64
      - name: Verify local AI payload offline (darwin-arm64)
        run: npm run check:local-ai -- --platform darwin-arm64
      - run: npm run dist -- --arm64
        env:
          # Signing is skipped on CI unless you add your Apple certs as secrets.
          ASKTOTO_DISABLE_CP: '1'
          # Task 12 promotes a benchmarked catalog selection to release approval. Branch builds may
          # package the current evaluation selection so native packaging remains continuously tested.
          METIS_ALLOW_EVALUATION_PAYLOAD: '1'
      # Upload installers only — never release/* wholesale. The unpacked mac-arm64/ app dir pushed a
      # single run's artifact to ~6 GB and repeated runs blew the org's Actions storage quota, which
      # then failed every packaging job at the upload step. Installers + update metadata are all a PR
      # reviewer needs; 3-day retention because these are PR-verification builds, not releases.
      - uses: actions/upload-artifact@v4
        with:
          name: asktoto-macos
          retention-days: 3
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  build-windows:
    name: Windows package
    needs: [quality, security]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Restore the reviewed LGPL ffmpeg decoder sidecar (untracked in git - see
      # resources/ffmpeg/manifest.json) from the ffmpeg-sidecar-v1 release in this repo. Cache first so a
      # warm runner doesn't hit the GitHub API on every run; fall back to `gh release download` (built-in
      # GITHUB_TOKEN, read-only, scoped to this repo) on a cache miss. Without this, predist:win's
      # check-ffmpeg-sidecar.mjs throws a raw ENOENT before the build even starts.
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: resources/ffmpeg
          key: ffmpeg-sidecar-v1-win32-x64
      - name: Provision ffmpeg sidecar (win32-x64)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p resources/ffmpeg/win32-x64
          if ! gh release download ffmpeg-sidecar-v1 --repo "$GITHUB_REPOSITORY" \
               --pattern 'ffmpeg-win32-x64.exe' --pattern 'manifest.json' --pattern 'LICENSE.LGPL-2.1.txt' \
               --dir resources/ffmpeg --clobber; then
            echo "::warning::Could not download the ffmpeg-sidecar-v1 release assets - falling through to the hard gate below."
          elif [ -f resources/ffmpeg/ffmpeg-win32-x64.exe ]; then
            mv resources/ffmpeg/ffmpeg-win32-x64.exe resources/ffmpeg/win32-x64/ffmpeg.exe
          fi
      - name: Require the ffmpeg sidecar to be present
        shell: bash
        run: |
          if [ ! -f "resources/ffmpeg/win32-x64/ffmpeg.exe" ]; then
            echo "::error::Missing resources/ffmpeg/win32-x64/ffmpeg.exe and the ffmpeg-sidecar-v1 release could not provision it."
            echo "::error::One-time seed (run once locally by a maintainer holding the reviewed binaries in resources/ffmpeg/):"
            echo "::error::  cp resources/ffmpeg/darwin-arm64/ffmpeg /tmp/ffmpeg-darwin-arm64 && cp resources/ffmpeg/win32-x64/ffmpeg.exe /tmp/ffmpeg-win32-x64.exe && gh release create ffmpeg-sidecar-v1 /tmp/ffmpeg-darwin-arm64 /tmp/ffmpeg-win32-x64.exe resources/ffmpeg/manifest.json resources/ffmpeg/LICENSE.LGPL-2.1.txt --repo $GITHUB_REPOSITORY --title 'ffmpeg sidecar v1' --notes 'Reviewed LGPL-only ffmpeg binaries for CI provisioning (see manifest.json for SHA256s).'"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      # Same model + llama-server cache as the macOS job — see the comments there. Paths are OS-agnostic
      # (plain model/binary files), keyed by runner.os anyway since GitHub scopes/evicts caches
      # independently per OS.
      - uses: actions/cache@v4
        with:
          path: |
            resources/models
            resources/asr
            resources/ort
            resources/llama
          key: asr-models-${{ runner.os }}-${{ hashFiles('scripts/fetch-models.mjs') }}-${{ hashFiles('scripts/fetch-llama-server.mjs') }}
      - name: Cache immutable local AI assets
        uses: actions/cache@v4
        with:
          path: resources/local-ai/cache
          key: local-ai-win32-x64-${{ hashFiles('resources/local-ai/candidates.json') }}
      - name: Fetch selected local AI assets
        run: npm run fetch:local-ai
      - name: Stage selected local AI payload (win32-x64)
        run: npm run stage:local-ai -- --platform win32-x64
      - name: Verify local AI payload offline (win32-x64)
        run: npm run check:local-ai -- --platform win32-x64
      - run: npm run dist:win -- --x64
        env:
          METIS_ALLOW_EVALUATION_PAYLOAD: '1'
      # AppX packaging only works on Windows runners (needs the Windows SDK). Signing is skipped on CI
      # unless you add your Windows cert as a secret via WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD (see
      # docs/SIGNING.md and release.yml — this build job itself never sets those, so it always ships
      # unsigned, same as the macOS job above).
      - run: npm run dist:win:appx -- --x64
        env:
          METIS_ALLOW_EVALUATION_PAYLOAD: '1'
      # Installers only, same rationale as the macOS job (win-unpacked/ was ~7.5 GB per run).
      - uses: actions/upload-artifact@v4
        with:
          name: asktoto-windows
          retention-days: 3
          path: |
            release/*.exe
            release/*.appx
            release/*.blockmap
            release/latest*.yml
