              }
            }
            if (caseResults.size !== 26) failDiagnostic('missing-case')
          }
          const stages = new Set(['transport-open','read-start','read-done','write-start','write-done','destroy-request','stream-end','stream-close','stream-error','native-close-start','native-close-done','file-open','file-close-start','file-close-done','settle-start','settle-fulfilled','settle-rejected','gate-held','gate-released','prototype-hook-armed','parent-input-end','parent-output-destroy','child-exit','fixture-refusal','aggregate-member','aggregate-overflow'])
          const roles = new Set(['reader3','writer4','profile-parent','profile','registry-root','writer-lock','probe','other','none'])
          const states = new Set(['not-started','pending','fulfilled','rejected'])
          const errors = new Set(['none','EPIPE','EBADF','ECANCELED','EIO','ERR_STREAM_DESTROYED','ERR_STREAM_PREMATURE_CLOSE','known-qa-refusal','known-profile-refusal','injected-close','aggregate','other'])
          const commands = new Set(['check','create-root','registry-negative','settle','hide-check','navigate-aba','duplicate-prepare','successor','stale-owner','create-root-held','change-userdata-resume','retire-during-preparation','registry-cleanup','hold-profile-preparation','release-profile-preparation','fail-profile-close','release-failed-close','create-root-physical-held','retire-window-resume','release-profile-physical-check','prepare','none'])
