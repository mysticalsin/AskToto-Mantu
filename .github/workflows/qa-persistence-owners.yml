          const observationKeys = ['schema','sequence','command','stage','role','handleOrdinal','state','error','ownClose','hookInvoked','teardown']
          const summaryKeys = ['settlement','settlementSamePromise','readerIo','writerIo','readerClose','writerClose','profileClose','destroyRequested','nativeClose','streamCloseObserved','parentInputEnd','parentOutputDestroy','perHandleClose','hookInvocationCount']
          const childKeys = ['caseId','childOrdinal','sourceHead','runId','runAttempt','target','node','observations','overflow','stderrBytes','stderrOverflow','unexpectedTerminalReports','settlementPromiseObservation','preTeardown','final','childExit']
          const emptySummary = () => ({settlement:'not-started',settlementSamePromise:null,readerIo:'not-started',writerIo:'not-started',readerClose:'not-started',writerClose:'not-started',profileClose:'not-started',destroyRequested:false,nativeClose:'not-started',streamCloseObserved:false,parentInputEnd:false,parentOutputDestroy:false,perHandleClose:Object.create(null),hookInvocationCount:0})
          const reduceSummary = (events, samePromise) => {
