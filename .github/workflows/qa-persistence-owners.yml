              const operation = stage === 'read-start' || stage === 'read-done' ? 'read' : stage === 'write-start' || stage === 'write-done' ? 'write' : stage === 'native-close-start' || stage === 'native-close-done' ? 'native-close' : stage === 'file-close-start' || stage === 'file-close-done' ? 'file-close' : null
              if (operation) {
