              for (const source of Array.isArray(prep.sources) ? prep.sources : []) if (source?.firstDivergence && state && (source.firstDivergence.atTick <= prep.startedTick || source.firstDivergence.atTick >= state.end?.tick)) errors.push('first-source-transition-outside-original-preparation')
            }
            if (replacementEvents.length !== 1 || caseEvents.length !== (value.caseOutcome === 'complete' ? 1 : 0)) errors.push('terminal-event-roster-invalid')
            const callerSeen = (callerRole, phase) => owners.has(`${callerRole}:${phase}`)
            for (const [callerRole, phase] of [['initial-speech','request'],['held-old-speech','request'],['reentrant-main','invalidation-status'],['explicit-status-main','post-sign-in-status'],['replacement-speech','request']]) if (!callerSeen(callerRole,phase)) errors.push('required-reached-role-missing')
            const roleEvent = (role, phase) => value.events.find((item) => ['preparation-begin','caller-join'].includes(item.kind) && item.role === role && item.phase === phase)
            const rolePrep = (role, phase) => prepByOrdinal.get(roleEvent(role, phase)?.ordinal)
            const roleEnd = (role, phase) => states.get(roleEvent(role, phase)?.ordinal)?.end
            const initialCall = roleEvent('initial-speech','request')
            const heldCall = roleEvent('held-old-speech','request')
            const reentrantCall = roleEvent('reentrant-main','invalidation-status')
            const explicitCall = roleEvent('explicit-status-main','post-sign-in-status')
            const replacementCall = roleEvent('replacement-speech','request')
            const initialEnd = roleEnd('initial-speech','request')
            const heldEnd = roleEnd('held-old-speech','request')
            const replacementEnd = roleEnd('replacement-speech','request')
            if (rolePrep('initial-speech','request')?.outcome !== 'fulfilled-present' || rolePrep('held-old-speech','request')?.outcome !== 'fulfilled-null') errors.push('original-initial-or-held-lease-outcome-invalid')
            if (!initialCall || !initialEnd || !heldCall || !heldEnd || !reentrantCall || !explicitCall || !replacementCall || !replacementEnd ||
                initialCall.kind !== 'preparation-begin' || heldCall.kind !== 'preparation-begin' || replacementCall.kind !== 'preparation-begin' ||
                !(initialEnd.sequence < heldCall.sequence && heldCall.sequence < reentrantCall.sequence && reentrantCall.sequence < explicitCall.sequence && explicitCall.sequence < heldEnd.sequence && heldEnd.sequence < replacementCall.sequence && replacementEnd.sequence < replacementEvents[0]?.sequence))
              errors.push('original-auth-case-caller-order-invalid')
            const initialRetirements = value.events.filter((item) => item.kind === 'currentness' && item.role === 'initial-speech' && item.phase === 'request' && item.status === 'retired' && item.ordinal === initialCall?.ordinal)
            if (!initialRetirements.some((item) => heldCall && reentrantCall && heldCall.sequence < item.sequence && item.sequence < reentrantCall.sequence) ||
                !initialRetirements.some((item) => heldEnd && replacementCall && heldEnd.sequence < item.sequence && item.sequence < replacementCall.sequence))
              errors.push('original-initial-lease-retirement-observation-missing')
            if (value.replacementAssertion === 'failed') {
              if (value.caseOutcome !== 'replacement-assertion-failed' || !Array.isArray(value.unreached) || JSON.stringify(value.unreached) !== JSON.stringify([{phase:'returned-account-status',reason:'replacement-assertion-failed'},{phase:'returned-account-speech',reason:'replacement-assertion-failed'}])) errors.push('replacement-failure-branch-invalid')
              if (callerSeen('returned-account-speech','return-account-status') || callerSeen('returned-account-speech','request')) errors.push('unreached-return-account-role-was-executed')
              if (authCase?.status !== 'failed' || authCase.replacementNullAssertionFailure !== true) errors.push('replacement-assertion-not-bound-to-actual-test-result')
              if (rolePrep('replacement-speech','request')?.outcome !== 'fulfilled-null') errors.push('replacement-null-assertion-disagrees-with-original-result')
            } else if (value.replacementAssertion === 'passed' && value.caseOutcome === 'complete') {
              if (JSON.stringify(value.unreached) !== '[]' || !callerSeen('returned-account-speech','return-account-status') || !callerSeen('returned-account-speech','request') || authCase?.status !== 'passed') errors.push('complete-positive-branch-not-bound-to-report')
              const returnedMainCall = roleEvent('returned-account-speech','return-account-status')
              const returnedSpeechCall = roleEvent('returned-account-speech','request')
              const returnedSpeechEnd = roleEnd('returned-account-speech','request')
              if (rolePrep('replacement-speech','request')?.outcome !== 'fulfilled-present' || rolePrep('returned-account-speech','request')?.outcome !== 'fulfilled-present' || !returnedMainCall || !returnedSpeechCall || !returnedSpeechEnd || !replacementEvents[0] || !caseEvents[0] ||
                  !(replacementEvents[0].sequence < returnedMainCall.sequence && returnedMainCall.sequence < returnedSpeechCall.sequence && returnedSpeechEnd.sequence < caseEvents[0].sequence)) errors.push('positive-replacement-or-returned-lease-outcome-invalid')
              const current = (role, after, before, status) => value.events.some((item) => item.kind === 'currentness' && item.role === role && item.phase === 'request' && item.ordinal === roleEvent(role,'request')?.ordinal && item.status === status && after < item.sequence && item.sequence < before)
              if (!current('replacement-speech',replacementEvents[0]?.sequence ?? Infinity,returnedMainCall?.sequence ?? -1,'current') ||
                  !current('initial-speech',returnedMainCall?.sequence ?? Infinity,returnedSpeechCall?.sequence ?? -1,'retired') ||
                  !current('replacement-speech',returnedMainCall?.sequence ?? Infinity,returnedSpeechCall?.sequence ?? -1,'retired') ||
                  !current('returned-account-speech',returnedSpeechEnd?.sequence ?? Infinity,caseEvents[0]?.sequence ?? -1,'current'))
                errors.push('positive-original-lease-currentness-ledger-incomplete')
            } else errors.push('replacement-assertion-outcome-invalid')
            if (value.events.filter((item) => item.kind === 'replacement-assertion').length !== 1) errors.push('replacement-assertion-event-missing-or-duplicate')
            if (value.collectorComplete !== true) errors.push('collector-completeness-claim-false')
            return [...new Set(errors)]
          }

          if (process.env.DIAGNOSTIC_MODE === 'enabled') {
            try {
              diagnosticBytes = boundedRead(process.env.DIAGNOSTIC_REPORT, 64 * 1024, 2)
              diagnosticSha256 = hash(diagnosticBytes)
              diagnostic = JSON.parse(diagnosticBytes.toString('utf8'))
              diagnosticErrors.push(...validateDiagnostic(diagnostic))
            } catch { diagnosticErrors.push('diagnostic-missing-malformed-or-out-of-bounds') }
          } else if (existsSync(process.env.DIAGNOSTIC_REPORT)) diagnosticErrors.push('disabled-lane-emitted-diagnostic')

          const exitCode = /^\d+$/.test(process.env.VITEST_EXIT ?? '') ? Number(process.env.VITEST_EXIT) : null
          if (!Number.isSafeInteger(exitCode) || exitCode < 0 || exitCode > 255)
            evidenceErrors.push('actual-vitest-cli-outcome-unavailable')
          if (!reportBytes || !reportSha256 || !logBytes || !defaultLogSha256)
            evidenceErrors.push('original-report-or-default-log-not-bound')
          if (!expectedRuntime || !inventory || inventory.actualTotal !== inventory.expectedTotal || sourceFiles.length !== 45 ||
              diagnosticSourceFiles.length !== 19 || sourceFiles.some((file) => sourceManifest[file]?.checkoutMatchesBlobOrCrlf !== true))
            evidenceErrors.push('provenance-or-inventory-prerequisite-invalid')
          const pinnedUnhandledFieldsAbsent = report !== null && !Object.hasOwn(report, 'numUnhandledErrors') && !Object.hasOwn(report, 'unhandledErrors')
          const evidence = {
            schema: 'metis-qa-persistence-source-evidence/v2',
            target: process.env.TARGET,
            diagnosticMode: process.env.DIAGNOSTIC_MODE,
            runId: process.env.RUN_ID,
            runAttempt: process.env.RUN_ATTEMPT,
            job: process.env.RUN_JOB,
            workflowSha: process.env.WORKFLOW_SHA,
            actualHead: sourceHead,
            runtime,
            sourceFiles,
            sourceManifest,
            selectedFiles: inventory?.selectedFiles ?? null,
            perFileResults: inventory?.perFile ?? null,
            vitestExitCode: exitCode,
            reportSha256,
            defaultLogSha256,
            diagnosticSha256,
            diagnosticCollectorComplete: diagnostic?.collectorComplete ?? null,
            diagnosticValidatedComplete: process.env.DIAGNOSTIC_MODE === 'enabled' ? diagnosticErrors.length === 0 && evidenceErrors.length === 0 : null,
            evidencePrerequisiteErrors: [...new Set(evidenceErrors)],
            diagnosticErrors,
            functionalErrors,
            authCase,
            unhandledErrors: {
              count: null,
              availability: pinnedUnhandledFieldsAbsent ? 'unavailable-in-pinned-vitest-json' : 'invalid-or-missing-json',
              strictCliExitCode: exitCode,
              defaultLogSha256
            },
            counts: report ? Object.fromEntries(countFields.map((key) => [key, report[key] ?? null])) : null,
            success: functionalErrors.length === 0 && diagnosticErrors.length === 0 && evidenceErrors.length === 0
          }
          let evidencePayload = JSON.stringify(evidence, null, 2) + '\n'
          if (Buffer.byteLength(evidencePayload, 'utf8') > 256 * 1024) {
            evidencePayload = JSON.stringify({
              schema: 'metis-qa-persistence-source-evidence/v2', target: process.env.TARGET,
              diagnosticMode: process.env.DIAGNOSTIC_MODE, runId: process.env.RUN_ID,
              runAttempt: process.env.RUN_ATTEMPT, job: process.env.RUN_JOB,
              workflowSha: process.env.WORKFLOW_SHA, actualHead: sourceHead,
              diagnosticValidatedComplete: false, success: false,
              evidencePrerequisiteErrors: ['evidence-overflow']
            }) + '\n'
            evidenceErrors.push('evidence-overflow')
          }
          writeFileSync(process.env.EVIDENCE, evidencePayload, { mode: 0o600 })
          boundedRead(process.env.EVIDENCE, 256 * 1024, 2)
          const uploadPaths = [process.env.EVIDENCE]
          if (reportBytes) uploadPaths.push(process.env.REPORT)
          if (logBytes) uploadPaths.push(process.env.DEFAULT_LOG)
          if (process.env.DIAGNOSTIC_MODE === 'enabled' && diagnosticBytes) uploadPaths.push(process.env.DIAGNOSTIC_REPORT)
          writeFileSync(process.env.GITHUB_OUTPUT, `upload_paths<<AUTH_DIAGNOSTIC_BOUNDED_FILES\n${uploadPaths.join('\n')}\nAUTH_DIAGNOSTIC_BOUNDED_FILES\n`, { flag: 'a' })
          if (functionalErrors.length || diagnosticErrors.length || evidenceErrors.length) process.exitCode = 1
          NODE
      - name: Retain bounded original report, default log and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-persistence-source-${{ matrix.target }}-${{ matrix.diagnostic }}
          path: ${{ steps.evidence.outputs.upload_paths }}
          if-no-files-found: error
          retention-days: 7
