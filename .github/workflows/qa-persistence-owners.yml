name: QA persistence run owners

on:
  push:
    paths:
      - .github/workflows/qa-persistence-owners.yml
      - vitest.qa-persistence-owners.config.ts
      - package.json
      - package-lock.json
      - src/main/persistence/qa-run-protocol.ts
      - src/main/persistence/qa-run-protocol.test.ts
      - src/main/persistence/qa-run-protocol.qa-case.ts
      - src/main/persistence/qa-run-owner.ts
      - src/main/persistence/qa-run-owner.qa-case.ts
      - src/main/persistence/qa-profile-root-owner.ts
      - src/main/persistence/qa-profile-root-owner.qa-case.ts
      - src/main/persistence/root-registry.ts
      - src/main/persistence/root-registry.qa-case.ts
      - src/main/persistence/native-key-intent.ts
      - src/main/persistence/native-key-intent.test.ts
      - src/main/persistence/qa-main-action-owner.ts
      - src/main/persistence/qa-main-action-owner.test.ts
      - src/main/persistence/bootstrap.ts
      - src/main/index.ts
      - src/main/auth-boundary-adapters.ts
      - src/main/auth-config.ts
      - src/main/auth-persistence-observation.test.ts
      - src/main/auth-persistence-observation.ts
      - src/main/auth-speech-boundary-readers.test.ts
      - src/main/auth-speech-boundary-readers.ts
      - src/main/auth-speech-boundary.ts
      - src/main/auth-speech-lease.test.ts
      - src/main/auth-speech-lease.ts
      - src/main/auth.test.ts
      - src/main/auth.ts
      - src/main/fresh-lean-speech-defaults.ts
      - src/main/fresh-lean-speech-defaults.test.ts
      - src/main/settings-auth-authority-frame.ts
      - src/main/settings-observation.test.ts
      - src/main/speech-desktop-boundary.ts
      - src/main/store.test.ts
      - src/main/store.ts
      - src/main/win-security.ts
      - src/main/win-security.test.ts
      - src/main/auth-authority-source-pins.ts
      - scripts/qa/fixtures/persistence-run-owner-support.ts
      - scripts/qa/fixtures/persistence-run-owner.child.ts
      - scripts/qa/fixtures/persistence-run-owner.electron-host.ts
      - scripts/qa/fixtures/auth-authority-diagnostic.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-persistence-owners-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  source-owners:
    name: Finite QA owner source fixtures (${{ matrix.target }} / ${{ matrix.diagnostic }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-shipping, os: ubuntu-latest, owner: false, diagnostic: disabled }
          - { target: windows-x64, os: windows-latest, owner: true, diagnostic: disabled }
          - { target: windows-x64, os: windows-latest, owner: true, diagnostic: enabled }
          - { target: macos-x64, os: macos-15-intel, owner: true, diagnostic: disabled }
          - { target: macos-x64, os: macos-15-intel, owner: true, diagnostic: enabled }
          - { target: macos-arm64, os: macos-14, owner: true, diagnostic: disabled }
          - { target: macos-arm64, os: macos-14, owner: true, diagnostic: enabled }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frozen test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the fixed finite fixture cohort and retain the actual default log
        id: run
        env:
          REPORT: ${{ runner.temp }}/qa-persistence-vitest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}-${{ matrix.diagnostic }}.json
          DEFAULT_LOG: ${{ runner.temp }}/qa-persistence-default-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}-${{ matrix.diagnostic }}.log
          DIAGNOSTIC_REPORT: ${{ runner.temp }}/qa-auth-authority-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}-${{ matrix.diagnostic }}.json
          OWNER_TARGET: ${{ matrix.owner }}
          DIAGNOSTIC_MODE: ${{ matrix.diagnostic }}
          TARGET: ${{ matrix.target }}
        run: |
          rm -f "$REPORT" "$DEFAULT_LOG" "$DIAGNOSTIC_REPORT"
          if [[ "$DIAGNOSTIC_MODE" == enabled ]]; then
            export METIS_AUTH_AUTHORITY_DIAGNOSTIC=enabled
            export METIS_AUTH_AUTHORITY_DIAGNOSTIC_REPORT="$DIAGNOSTIC_REPORT"
            export METIS_AUTH_AUTHORITY_SOURCE_HASHES="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const files = [
            '.github/workflows/qa-persistence-owners.yml',
            'vitest.qa-persistence-owners.config.ts',
            'package.json',
            'package-lock.json',
            'scripts/qa/fixtures/auth-authority-diagnostic.ts',
            'src/main/auth.test.ts',
            'src/main/auth-authority-source-pins.ts',
            'src/main/auth-boundary-adapters.ts',
            'src/main/auth-config.ts',
            'src/main/auth-speech-boundary-readers.ts',
            'src/main/auth-speech-boundary.ts',
            'src/main/auth-speech-lease.ts',
            'src/main/auth.ts',
            'src/main/fresh-lean-speech-defaults.ts',
            'src/main/settings-auth-authority-frame.ts',
            'src/main/settings-observation.ts',
            'src/main/speech-desktop-boundary.ts',
            'src/main/store.ts',
            'src/main/win-security.ts'
          ]
          const hashes = Object.fromEntries(files.map((file) => [file, createHash('sha256').update(readFileSync(file)).digest('hex')]))
          process.stdout.write(JSON.stringify(hashes))
          NODE
            )"
          else
            unset METIS_AUTH_AUTHORITY_DIAGNOSTIC METIS_AUTH_AUTHORITY_DIAGNOSTIC_REPORT METIS_AUTH_AUTHORITY_SOURCE_HASHES || true
          fi
          set +e
          NO_COLOR=1 FORCE_COLOR=0 npx vitest run --config vitest.qa-persistence-owners.config.ts --retry=0 --reporter=default --reporter=json --outputFile="$REPORT" >"$DEFAULT_LOG" 2>&1
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          echo "Vitest exit code: $result. Original report and default log retained for the bounded evidence gate."
          exit 0
      - name: Independently gate the exact reports, provenance, inventory and D0 trace
        id: evidence
        if: always()
        env:
          REPORT: ${{ runner.temp }}/qa-persistence-vitest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}-${{ matrix.diagnostic }}.json
          DEFAULT_LOG: ${{ runner.temp }}/qa-persistence-default-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}-${{ matrix.diagnostic }}.log
          DIAGNOSTIC_REPORT: ${{ runner.temp }}/qa-auth-authority-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}-${{ matrix.diagnostic }}.json
          EVIDENCE: ${{ runner.temp }}/qa-persistence-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}-${{ matrix.diagnostic }}.json
          OWNER_TARGET: ${{ matrix.owner }}
          DIAGNOSTIC_MODE: ${{ matrix.diagnostic }}
          VITEST_EXIT: ${{ steps.run.outputs.exit_code }}
          TARGET: ${{ matrix.target }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_JOB: ${{ github.job }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, statSync, existsSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          import { execFileSync } from 'node:child_process'

          const sourceFiles = [
            '.github/workflows/qa-persistence-owners.yml', 'vitest.qa-persistence-owners.config.ts', 'package.json', 'package-lock.json',
            'src/main/persistence/qa-run-protocol.ts', 'src/main/persistence/qa-run-protocol.test.ts', 'src/main/persistence/qa-run-protocol.qa-case.ts',
            'src/main/persistence/qa-run-owner.ts', 'src/main/persistence/qa-run-owner.qa-case.ts', 'src/main/persistence/qa-profile-root-owner.ts',
            'src/main/persistence/qa-profile-root-owner.qa-case.ts', 'src/main/persistence/root-registry.ts', 'src/main/persistence/root-registry.qa-case.ts',
            'src/main/persistence/native-key-intent.ts', 'src/main/persistence/native-key-intent.test.ts', 'src/main/persistence/qa-main-action-owner.ts',
            'src/main/persistence/qa-main-action-owner.test.ts', 'src/main/persistence/bootstrap.ts', 'src/main/index.ts', 'src/main/auth-boundary-adapters.ts',
            'src/main/auth-config.ts', 'src/main/auth-persistence-observation.test.ts', 'src/main/auth-persistence-observation.ts',
            'src/main/auth-speech-boundary-readers.test.ts', 'src/main/auth-speech-boundary-readers.ts', 'src/main/auth-speech-boundary.ts',
            'src/main/auth-speech-lease.test.ts', 'src/main/auth-speech-lease.ts', 'src/main/auth.test.ts', 'src/main/auth.ts',
            'src/main/fresh-lean-speech-defaults.ts', 'src/main/fresh-lean-speech-defaults.test.ts', 'src/main/settings-auth-authority-frame.ts',
            'src/main/settings-observation.ts', 'src/main/settings-observation.test.ts', 'src/main/speech-desktop-boundary.ts', 'src/main/store.test.ts',
            'src/main/store.ts', 'src/main/win-security.ts', 'src/main/win-security.test.ts', 'src/main/auth-authority-source-pins.ts',
            'scripts/qa/fixtures/persistence-run-owner-support.ts', 'scripts/qa/fixtures/persistence-run-owner.child.ts',
            'scripts/qa/fixtures/persistence-run-owner.electron-host.ts', 'scripts/qa/fixtures/auth-authority-diagnostic.ts'
          ]
          const diagnosticSourceFiles = [
            '.github/workflows/qa-persistence-owners.yml', 'vitest.qa-persistence-owners.config.ts', 'package.json', 'package-lock.json',
            'scripts/qa/fixtures/auth-authority-diagnostic.ts', 'src/main/auth.test.ts', 'src/main/auth-authority-source-pins.ts',
            'src/main/auth-boundary-adapters.ts', 'src/main/auth-config.ts', 'src/main/auth-speech-boundary-readers.ts', 'src/main/auth-speech-boundary.ts',
            'src/main/auth-speech-lease.ts', 'src/main/auth.ts', 'src/main/fresh-lean-speech-defaults.ts', 'src/main/settings-auth-authority-frame.ts',
            'src/main/settings-observation.ts', 'src/main/speech-desktop-boundary.ts', 'src/main/store.ts', 'src/main/win-security.ts'
          ]
          const nativeExpected = new Map([
            ['src/main/persistence/native-key-intent.test.ts', [12, '4a8c6d6a05f1b14208b66d1754231c90a3482feb861143bcc6297c5f8783e9af']],
            ['src/main/persistence/qa-run-protocol.test.ts', [3, '408d70eba15ab392e118da02e05b6891ee830b82c4d8776e1c63935b88e067fd']],
            ['src/main/persistence/qa-profile-root-owner.qa-case.ts', [8, '0840ed00b7af86421e44b7b71e9763dd8f19452eef103cb034742bbc8a92de4f']],
            ['src/main/persistence/qa-run-owner.qa-case.ts', [22, '9b638955c31dde22ee0ed9df14ce03ca539acafc93865ea0ed5bc05463e1bd68']],
            ['src/main/persistence/qa-run-protocol.qa-case.ts', [27, '2b96b62f1134f848384fa2c123fd81db0dea782361bf891793a671150a881fac']],
            ['src/main/persistence/root-registry.qa-case.ts', [4, 'ba5f1631adb5b372634f956680aaf69d2eca6b5911648cdad58eb9f663374cb3']],
            ['src/main/auth-persistence-observation.test.ts', [3, 'c9e233c08e086fbc67803166ad7ea454f2b5a580bd6db990dbb1bb98faddbe3c']],
            ['src/main/auth-speech-boundary-readers.test.ts', [6, '810edb5a1baf49c5b48f072c42e2b82238a7f32fe9b9af4478d8616384a228ed']],
            ['src/main/auth-speech-lease.test.ts', [7, '4ce76ae626b2c16fdb8f8303ec2e19c1d6c8867613b8686c61555ed24fc6bded']],
            ['src/main/auth.test.ts', [62, 'b5cdfe7e39fc15d89223097f1e7204f00afd4f76d9d0a60e24a8ce47fccba2aa']],
            ['src/main/fresh-lean-speech-defaults.test.ts', [15, '0ddd58bd921d4e6df5d745520d1835955902ce5214ab3e1763d07b83fb256ba0']],
            ['src/main/settings-observation.test.ts', [4, '01db2db1792a5d6443ef0844eb01570788ab23e3d366986767827135ec3c9f2c']],
            ['src/main/store.test.ts', [70, 'b8d5385088ce01893919f8d442027a09346a50dfbadbcf1d1e5cf098d6e66012']],
            ['src/main/win-security.test.ts', [39, '3ba1894a41cf2d9a23644fb22f2c464152b201d1a31c7db3054aa43807c4dc2a']],
            ['src/main/persistence/qa-main-action-owner.test.ts', [10, '9ed1670b14859aba44c94d944317b76089adb44f856111552df01e314c009b1e']]
          ])
          const linuxExpected = new Map([
            ['src/main/persistence/qa-run-protocol.test.ts', [3, '408d70eba15ab392e118da02e05b6891ee830b82c4d8776e1c63935b88e067fd']],
            ['src/main/persistence/native-key-intent.test.ts', [12, '4a8c6d6a05f1b14208b66d1754231c90a3482feb861143bcc6297c5f8783e9af']]
          ])
          // Pinned Vitest 4.1.11 getSuites includes each file and every nested suite.
          // These nested counts come from the frozen selected source inventory (native 41, Linux 2).
          const expectedNestedSuites = new Map([
            ['src/main/persistence/native-key-intent.test.ts', 1],
            ['src/main/persistence/qa-run-protocol.test.ts', 1],
            ['src/main/persistence/qa-profile-root-owner.qa-case.ts', 1],
            ['src/main/persistence/qa-run-owner.qa-case.ts', 1],
            ['src/main/persistence/qa-run-protocol.qa-case.ts', 1],
            ['src/main/persistence/root-registry.qa-case.ts', 1],
            ['src/main/auth-persistence-observation.test.ts', 1],
            ['src/main/auth-speech-boundary-readers.test.ts', 1],
            ['src/main/auth-speech-lease.test.ts', 1],
            ['src/main/auth.test.ts', 8],
            ['src/main/fresh-lean-speech-defaults.test.ts', 1],
            ['src/main/settings-observation.test.ts', 1],
            ['src/main/store.test.ts', 10],
            ['src/main/win-security.test.ts', 11],
            ['src/main/persistence/qa-main-action-owner.test.ts', 1]
          ])
          const countFields = ['numTotalTests','numPassedTests','numFailedTests','numPendingTests','numTodoTests','numTotalTestSuites','numPassedTestSuites','numFailedTestSuites','numPendingTestSuites']
          const hash = (value) => createHash('sha256').update(value).digest('hex')
          const functionalErrors = []
          const diagnosticErrors = []
          const evidenceErrors = []
          let report = null
          let diagnostic = null
          let reportBytes = null
          let logBytes = null
          let diagnosticBytes = null
          let reportSha256 = null
          let defaultLogSha256 = null
          let diagnosticSha256 = null
          let authCase = null
          let inventory = null
          const boundedRead = (path, maxBytes, minBytes) => {
            const metadata = statSync(path)
            if (!metadata.isFile() || metadata.size < minBytes || metadata.size > maxBytes) throw new Error('bounded-file-invalid')
            const data = readFileSync(path)
            if (data.byteLength !== metadata.size || data.byteLength < minBytes || data.byteLength > maxBytes) throw new Error('bounded-file-raced')
            return data
          }
          try {
            reportBytes = boundedRead(process.env.REPORT, 32 * 1024 * 1024, 2)
            reportSha256 = hash(reportBytes)
            report = JSON.parse(reportBytes.toString('utf8'))
          } catch { functionalErrors.push('vitest-report-missing-malformed-or-out-of-bounds') }
          try {
            logBytes = boundedRead(process.env.DEFAULT_LOG, 4 * 1024 * 1024, 1)
            defaultLogSha256 = hash(logBytes)
          } catch { functionalErrors.push('default-log-missing-malformed-or-out-of-bounds') }

          const targetMap = {
            'linux-shipping': { platform: 'linux', arch: 'x64', owner: false },
            'windows-x64': { platform: 'win32', arch: 'x64', owner: true },
            'macos-x64': { platform: 'darwin', arch: 'x64', owner: true },
            'macos-arm64': { platform: 'darwin', arch: 'arm64', owner: true }
          }
          const expectedRuntime = targetMap[process.env.TARGET]
          const runtime = { version: process.version, platform: process.platform, arch: process.arch }
          if (!expectedRuntime || process.version !== 'v22.22.3' || runtime.platform !== expectedRuntime.platform || runtime.arch !== expectedRuntime.arch)
            functionalErrors.push('actual-node-runtime-does-not-match-target')
          const sourceHead = (() => {
            try { return execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() }
            catch { return null }
          })()
          if (!sourceHead || sourceHead !== process.env.WORKFLOW_SHA) functionalErrors.push('git-head-does-not-match-workflow-sha')
          if (!process.env.RUN_ID || !process.env.RUN_ATTEMPT || !process.env.RUN_JOB) functionalErrors.push('run-attempt-or-job-binding-missing')

          const sourceManifest = Object.create(null)
          for (const file of sourceFiles) {
            try {
              const checkout = readFileSync(file)
              const blob = execFileSync('git', ['show', `${sourceHead}:${file}`])
              const checkoutText = checkout.toString('utf8')
              const blobText = blob.toString('utf8')
              const normalizedBlob = blobText.replace(/\r\n/g, '\n')
              const expectedCrlf = normalizedBlob.replace(/\n/g, '\r\n')
              const checkoutMatchesBlob = checkout.equals(blob) || checkoutText === expectedCrlf
              const hasCrLf = checkoutText.includes('\r\n')
              const hasLf = /(^|[^\r])\n/.test(checkoutText)
              sourceManifest[file] = {
                gitBlobSha256: hash(blob),
                checkoutSha256: hash(checkout),
                checkoutLineEndings: hasCrLf && hasLf ? 'mixed' : hasCrLf ? 'crlf' : hasLf ? 'lf' : 'none',
                checkoutMatchesBlobOrCrlf: checkoutMatchesBlob
              }
              if (!checkoutMatchesBlob) functionalErrors.push('checkout-bytes-do-not-match-git-blob-or-crlf-form')
            } catch {
              sourceManifest[file] = null
              functionalErrors.push('required-source-provenance-missing')
            }
          }
          if (sourceFiles.length !== 45) functionalErrors.push('source-roster-size-invalid')

          const expected = process.env.OWNER_TARGET === 'true' ? nativeExpected : linuxExpected
          const expectedFiles = [...expected.keys()]
          if (report) {
            if (typeof report !== 'object' || Array.isArray(report) || typeof report.success !== 'boolean')
              evidenceErrors.push('pinned-vitest-report-top-level-shape-invalid')
            if (countFields.some((key) => !Number.isSafeInteger(report[key]) || report[key] < 0)) functionalErrors.push('vitest-counters-missing-or-invalid')
            if (Object.hasOwn(report, 'numUnhandledErrors') || Object.hasOwn(report, 'unhandledErrors')) functionalErrors.push('pinned-unhandled-json-shape-changed')
            const expectedTotal = process.env.OWNER_TARGET === 'true' ? 292 : 15
            const expectedSuiteTotal = process.env.OWNER_TARGET === 'true' ? 56 : 4
            if (report.numTotalTests !== expectedTotal) functionalErrors.push('vitest-total-does-not-match-frozen-cohort')
            if (process.env.VITEST_EXIT !== '0' || report.success !== true || report.numPassedTests !== report.numTotalTests || report.numFailedTests !== 0 || report.numPendingTests !== 0 || report.numTodoTests !== 0 || report.numFailedTestSuites !== 0 || report.numPendingTestSuites !== 0 || report.numTotalTestSuites !== report.numPassedTestSuites + report.numFailedTestSuites + report.numPendingTestSuites)
              functionalErrors.push('strict-vitest-exit-or-count-gate-failed')
            if (!Array.isArray(report.testResults) || report.testResults.length !== expectedFiles.length) functionalErrors.push('selected-file-inventory-does-not-match-closed-roster')
            const observedCounts = Object.create(null)
            for (const file of expectedFiles) {
              const matches = Array.isArray(report.testResults) ? report.testResults.filter((item) => typeof item?.name === 'string' && item.name.replaceAll('\\', '/').endsWith('/' + file)) : []
              const expectedSpec = expected.get(file)
              if (!expectedSpec) functionalErrors.push('frozen-case-title-digest-missing')
              const [expectedCount, expectedTitleDigest] = expectedSpec ?? [null, null]
              const item = matches.length === 1 ? matches[0] : null
              const assertions = item && Array.isArray(item.assertionResults) ? item.assertionResults : null
              const titles = assertions && assertions.every((test) => typeof test.fullName === 'string') ? assertions.map((test) => test.fullName) : null
              const titleDigest = titles ? hash(Buffer.from(JSON.stringify(titles))) : null
              const count = assertions ? assertions.length : null
              observedCounts[file] = { count, titleDigest }
              if (!item || !assertions || count !== expectedCount || !expectedTitleDigest || titleDigest !== expectedTitleDigest)
                functionalErrors.push('file-count-title-inventory-mismatch')
              if (item && assertions && (item.status !== 'passed' || assertions.some((test) => test.status !== 'passed')))
                functionalErrors.push('file-or-case-functional-failure')
            }
            const allAssertionArraysPresent = Array.isArray(report.testResults) && report.testResults.every((item) => Array.isArray(item?.assertionResults))
            const actualTotal = allAssertionArraysPresent ? report.testResults.reduce((sum, item) => sum + item.assertionResults.length, 0) : null
            if (actualTotal !== report.numTotalTests) functionalErrors.push('per-file-counts-do-not-match-global-total')
            if (allAssertionArraysPresent) {
              const allowedCaseStatuses = new Set(['passed','failed','pending','skipped','todo'])
              const statuses = report.testResults.flatMap((item) => item.assertionResults.map((test) => test?.status))
              const nestedSuites = new Set()
              const failedNestedSuites = new Set()
              for (const file of expectedFiles) {
                const matches = report.testResults.filter((item) => typeof item?.name === 'string' && item.name.replaceAll('\\', '/').endsWith('/' + file))
                if (matches.length !== 1) continue
                const fileSuites = new Set()
                for (const test of matches[0].assertionResults) {
                  if (!Array.isArray(test?.ancestorTitles) || test.ancestorTitles.length === 0 ||
                      test.ancestorTitles.some((name) => typeof name !== 'string' || !name) ||
                      typeof test.title !== 'string' || test.fullName !== [...test.ancestorTitles, test.title].join(' ')) {
                    evidenceErrors.push('pinned-vitest-suite-ancestry-invalid')
                    continue
                  }
                  for (let depth = 1; depth <= test.ancestorTitles.length; depth += 1) {
                    const suite = JSON.stringify([file, ...test.ancestorTitles.slice(0, depth)])
                    fileSuites.add(suite)
                    nestedSuites.add(suite)
                    if (test.status === 'failed') failedNestedSuites.add(suite)
                  }
                }
                if (fileSuites.size !== expectedNestedSuites.get(file)) evidenceErrors.push('pinned-vitest-file-suite-inventory-invalid')
              }
              const failedFiles = report.testResults.filter((item) => item.status === 'failed').length
              const passedFiles = report.testResults.filter((item) => item.status === 'passed').length
              if (report.numTotalTestSuites !== expectedSuiteTotal ||
                  report.numTotalTestSuites !== expectedFiles.length + nestedSuites.size ||
                  report.numFailedTestSuites < failedFiles + failedNestedSuites.size ||
                  report.numPassedTestSuites < passedFiles)
                evidenceErrors.push('pinned-vitest-selected-suite-counters-inconsistent')
              if (report.testResults.some((item) => !['passed','failed'].includes(item?.status)) || statuses.some((status) => !allowedCaseStatuses.has(status)))
                evidenceErrors.push('pinned-vitest-file-or-case-status-invalid')
              const numberWithStatus = (status) => statuses.filter((item) => item === status).length
