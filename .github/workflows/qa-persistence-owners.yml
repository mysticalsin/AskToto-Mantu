name: QA persistence run owners

on:
  push:
    paths:
      - .github/workflows/qa-persistence-owners.yml
      - vitest.qa-persistence-owners.config.ts
      - package.json
      - package-lock.json
      - src/main/persistence/qa-run-protocol.ts
      - src/main/persistence/qa-run-protocol.test.ts
      - src/main/persistence/qa-run-protocol.qa-case.ts
      - src/main/persistence/qa-run-owner.ts
      - src/main/persistence/qa-run-owner.qa-case.ts
      - src/main/persistence/qa-profile-root-owner.ts
      - src/main/persistence/qa-profile-root-owner.qa-case.ts
      - src/main/persistence/root-registry.ts
      - src/main/persistence/root-registry.qa-case.ts
      - src/main/persistence/native-key-intent.ts
      - src/main/persistence/native-key-intent.test.ts
      - src/main/persistence/qa-main-action-owner.ts
      - src/main/persistence/qa-main-action-owner.test.ts
      - src/main/persistence/bootstrap.ts
      - src/main/index.ts
      - src/main/auth-boundary-adapters.ts
      - src/main/auth-config.ts
      - src/main/auth-persistence-observation.test.ts
      - src/main/auth-persistence-observation.ts
      - src/main/auth-speech-boundary-readers.test.ts
      - src/main/auth-speech-boundary-readers.ts
      - src/main/auth-speech-boundary.ts
      - src/main/auth-speech-lease.test.ts
      - src/main/auth-speech-lease.ts
      - src/main/auth.test.ts
      - src/main/auth.ts
      - src/main/fresh-lean-speech-defaults.ts
      - src/main/fresh-lean-speech-defaults.test.ts
      - src/main/settings-auth-authority-frame.ts
      - src/main/settings-observation.test.ts
      - src/main/speech-desktop-boundary.ts
      - src/main/store.test.ts
      - src/main/store.ts
      - src/main/win-security.ts
      - src/main/win-security.test.ts
      - src/main/auth-authority-source-pins.ts
      - scripts/qa/fixtures/persistence-run-owner-support.ts
      - scripts/qa/fixtures/persistence-run-owner.child.ts
      - scripts/qa/fixtures/persistence-run-owner.electron-host.ts
      - scripts/qa/fixtures/persistence-owner-diagnostic-reporter.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-persistence-owners-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  source-owners:
    name: Finite QA owner source fixtures (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-shipping, os: ubuntu-latest, owner: false }
          - { target: windows-x64, os: windows-latest, owner: true }
          - { target: macos-x64, os: macos-15-intel, owner: true }
          - { target: macos-arm64, os: macos-14, owner: true }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frozen test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Remove stale report and run the explicitly selected finite fixtures
        id: run
        env:
          REPORT: ${{ runner.temp }}/qa-persistence-vitest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}.json
          DIAGNOSTIC: ${{ runner.temp }}/qa-persistence-owner-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}.json
          DIAGNOSTIC_DIR: ${{ runner.temp }}/qa-persistence-owner-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          QA_OWNER_FRAMEWORK_REPORT_PATH: ${{ runner.temp }}/qa-persistence-owner-framework-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}.json
          OWNER_TARGET: ${{ matrix.owner }}
          QA_OWNER_DIAGNOSTIC_DIR: ${{ runner.temp }}/qa-persistence-owner-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          QA_OWNER_SOURCE_SHA: ${{ github.sha }}
          QA_OWNER_TARGET: ${{ matrix.target }}
        run: |
          rm -f "$REPORT" "$DIAGNOSTIC" "$QA_OWNER_FRAMEWORK_REPORT_PATH" "$QA_OWNER_FRAMEWORK_REPORT_PATH.pending"
          rm -rf "$DIAGNOSTIC_DIR"
          mkdir -m 700 -p "$DIAGNOSTIC_DIR"
          set +e
          if [[ "$OWNER_TARGET" == true ]]; then
            NO_COLOR=1 FORCE_COLOR=0 npx vitest run --config vitest.qa-persistence-owners.config.ts --retry=0 --reporter=default --reporter=json --reporter=./scripts/qa/fixtures/persistence-owner-diagnostic-reporter.mjs --outputFile="$REPORT"
          else
            NO_COLOR=1 FORCE_COLOR=0 npx vitest run --config vitest.qa-persistence-owners.config.ts --retry=0 --reporter=default --reporter=json --reporter=./scripts/qa/fixtures/persistence-owner-diagnostic-reporter.mjs --outputFile="$REPORT"
          fi
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Gate exact report inventory, counts and current source hashes
        if: always()
        env:
          REPORT: ${{ runner.temp }}/qa-persistence-vitest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}.json
          EVIDENCE: ${{ runner.temp }}/qa-persistence-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}.json
          DIAGNOSTIC: ${{ runner.temp }}/qa-persistence-owner-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}.json
          DIAGNOSTIC_DIR: ${{ runner.temp }}/qa-persistence-owner-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          FRAMEWORK_REPORT: ${{ runner.temp }}/qa-persistence-owner-framework-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}.json
          OWNER_TARGET: ${{ matrix.owner }}
          VITEST_EXIT: ${{ steps.run.outputs.exit_code }}
          TARGET: ${{ matrix.target }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_NODE: 22.22.3
        run: |
          node --input-type=module <<'NODE'
          import { constants, closeSync, fstatSync, lstatSync, openSync, opendirSync, readFileSync, readSync, writeFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          import { execFileSync } from 'node:child_process'
          const sourceFiles = [
            '.github/workflows/qa-persistence-owners.yml',
            'vitest.qa-persistence-owners.config.ts',
            'package.json',
            'package-lock.json',
            'src/main/persistence/qa-run-protocol.ts',
            'src/main/persistence/qa-run-protocol.test.ts',
            'src/main/persistence/qa-run-protocol.qa-case.ts',
            'src/main/persistence/qa-run-owner.ts',
            'src/main/persistence/qa-run-owner.qa-case.ts',
            'src/main/persistence/qa-profile-root-owner.ts',
            'src/main/persistence/qa-profile-root-owner.qa-case.ts',
            'src/main/persistence/root-registry.ts',
            'src/main/persistence/root-registry.qa-case.ts',
            'src/main/persistence/native-key-intent.ts',
            'src/main/persistence/native-key-intent.test.ts',
            'src/main/persistence/qa-main-action-owner.ts',
            'src/main/persistence/qa-main-action-owner.test.ts',
            'src/main/persistence/bootstrap.ts',
            'src/main/index.ts',
            'src/main/auth-boundary-adapters.ts',
            'src/main/auth-config.ts',
            'src/main/auth-persistence-observation.test.ts',
            'src/main/auth-persistence-observation.ts',
            'src/main/auth-speech-boundary-readers.test.ts',
            'src/main/auth-speech-boundary-readers.ts',
            'src/main/auth-speech-boundary.ts',
            'src/main/auth-speech-lease.test.ts',
            'src/main/auth-speech-lease.ts',
            'src/main/auth.test.ts',
            'src/main/auth.ts',
            'src/main/fresh-lean-speech-defaults.ts',
            'src/main/fresh-lean-speech-defaults.test.ts',
            'src/main/settings-auth-authority-frame.ts',
            'src/main/settings-observation.test.ts',
            'src/main/speech-desktop-boundary.ts',
            'src/main/store.test.ts',
            'src/main/store.ts',
            'src/main/win-security.ts',
            'src/main/win-security.test.ts',
            'src/main/auth-authority-source-pins.ts',
            'scripts/qa/fixtures/persistence-run-owner-support.ts',
            'scripts/qa/fixtures/persistence-run-owner.child.ts',
            'scripts/qa/fixtures/persistence-run-owner.electron-host.ts',
            'scripts/qa/fixtures/persistence-owner-diagnostic-reporter.mjs',
            'tsconfig.tests.json',
            'tsconfig.node.json',
            'src/main/settings-observation.ts',
            'src/main/qa-identity.ts'
          ]
          const expected = process.env.OWNER_TARGET === 'true'
            ? new Map([
                ['src/main/persistence/qa-run-protocol.qa-case.ts', 27],
                ['src/main/persistence/qa-run-owner.qa-case.ts', 22],
                ['src/main/persistence/qa-profile-root-owner.qa-case.ts', 8],
                ['src/main/persistence/root-registry.qa-case.ts', 4],
                ['src/main/persistence/qa-run-protocol.test.ts', 3],
                ['src/main/persistence/native-key-intent.test.ts', 12]
              ])
            : new Map([
                ['src/main/persistence/qa-run-protocol.test.ts', 3],
                ['src/main/persistence/native-key-intent.test.ts', 12]
              ])
          const coherenceFiles = process.env.OWNER_TARGET === 'true' ? [
            'src/main/auth.test.ts',
            'src/main/auth-speech-lease.test.ts',
            'src/main/auth-speech-boundary-readers.test.ts',
            'src/main/auth-persistence-observation.test.ts',
            'src/main/persistence/qa-main-action-owner.test.ts',
            'src/main/win-security.test.ts',
            'src/main/store.test.ts',
            'src/main/fresh-lean-speech-defaults.test.ts',
            'src/main/settings-observation.test.ts'
          ] : []
          const expectedFiles = [...expected.keys(), ...coherenceFiles]
          const boundedRead = (path, limit) => {
            const before = lstatSync(path)
            if (!before.isFile() || before.isSymbolicLink() || before.size < 1 || before.size > limit) throw new Error('bounded-read-refused')
            const fd = openSync(path, constants.O_RDONLY | (process.platform === 'win32' ? 0 : constants.O_NOFOLLOW))
            try {
              const opened = fstatSync(fd)
              if (!opened.isFile() || opened.size !== before.size || opened.dev !== before.dev || opened.ino !== before.ino) throw new Error('bounded-read-identity')
              const bytes = Buffer.alloc(opened.size)
              let offset = 0
              while (offset < bytes.length) {
                const count = readSync(fd, bytes, offset, bytes.length - offset, offset)
                if (count <= 0) throw new Error('bounded-read-short')
                offset += count
              }
              const after = fstatSync(fd)
              if (after.size !== opened.size || after.dev !== opened.dev || after.ino !== opened.ino) throw new Error('bounded-read-changed')
              return bytes
            } finally { closeSync(fd) }
          }
          try {
          const allowedFailures = new Set(['missing-shard','unexpected-shard','shard-identity','incomplete-shard','size-limit','write-failure','invalid-envelope','invalid-observation','binding-mismatch','source-hash-mismatch','child-bound','event-bound','sequence-mismatch','missing-case','terminal-invalid','overflow','framework-invalid'])
          const diagnosticFailures = new Set()
          const functionalFailures = []
          const failDiagnostic = (reason) => diagnosticFailures.add(reason)
          const exact = (value, keys) => value !== null && typeof value === 'object' && !Array.isArray(value) && Object.keys(value).length === keys.length && keys.every((key) => Object.hasOwn(value, key))
          const sha = (bytes) => createHash('sha256').update(bytes).digest('hex')
          let sourceHead = null
          try { sourceHead = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() }
          catch { functionalFailures.push('Checkout HEAD is unavailable.'); failDiagnostic('binding-mismatch') }
          if (sourceHead !== process.env.SOURCE_SHA || process.env.SOURCE_SHA !== process.env.GITHUB_SHA || !/^[a-f0-9]{40}$/.test(process.env.SOURCE_SHA ?? '') || !/^[1-9][0-9]*$/.test(process.env.RUN_ID ?? '') || !/^[1-9][0-9]*$/.test(process.env.RUN_ATTEMPT ?? '') || !Number.isSafeInteger(Number(process.env.RUN_ATTEMPT)) || !['linux-shipping','windows-x64','macos-x64','macos-arm64'].includes(process.env.TARGET) || process.version !== `v${process.env.EXPECTED_NODE}`) {
            functionalFailures.push('Hosted checkout, source SHA or Node pin differs.'); failDiagnostic('binding-mismatch')
          }
          const hashes = Object.fromEntries(sourceFiles.map((file) => {
            try { return [file, sha(readFileSync(file))] }
            catch { functionalFailures.push('A required source file is missing.'); failDiagnostic('source-hash-mismatch'); return [file, null] }
          }))
          let frameworkRaw = null
          let framework = null
          try { frameworkRaw = boundedRead(process.env.FRAMEWORK_REPORT, 16 * 1024); framework = JSON.parse(frameworkRaw.toString('utf8')) }
          catch { failDiagnostic('framework-invalid') }
          const frameworkKeys = ['schema','sourceHead','runId','runAttempt','target','node','reporterSha256','runEndObserved','runEndReason','runEndUnhandledCount','finalUnhandledCount','frameworkClosed','timedOut','complete']
          if (!exact(framework,frameworkKeys) || framework.schema !== 'metis-qa-owner-framework-evidence/v1' || framework.sourceHead !== sourceHead || framework.sourceHead !== process.env.SOURCE_SHA || framework.runId !== process.env.RUN_ID || framework.runAttempt !== Number(process.env.RUN_ATTEMPT) || framework.target !== process.env.TARGET || framework.node !== process.version || framework.node !== `v${process.env.EXPECTED_NODE}` || framework.reporterSha256 !== hashes['scripts/qa/fixtures/persistence-owner-diagnostic-reporter.mjs'] || framework.runEndObserved !== true || !['passed','failed'].includes(framework.runEndReason) || !Number.isSafeInteger(framework.runEndUnhandledCount) || framework.runEndUnhandledCount !== 0 || !Number.isSafeInteger(framework.finalUnhandledCount) || framework.finalUnhandledCount !== 0 || framework.frameworkClosed !== true || framework.timedOut !== false || framework.complete !== true) failDiagnostic('framework-invalid')
          let rawReport = null
          let report = null
          try { rawReport = boundedRead(process.env.REPORT, 8 * 1024 * 1024); report = JSON.parse(rawReport.toString('utf8')) }
          catch { functionalFailures.push('Vitest report is missing, malformed or outside the read bound.'); failDiagnostic('missing-case') }
          const countFields = ['numTotalTests','numPassedTests','numFailedTests','numPendingTests','numTodoTests','numTotalTestSuites','numPassedTestSuites','numFailedTestSuites','numPendingTestSuites']
          const expectedTotal = process.env.OWNER_TARGET === 'true' ? 292 : 15
          const reportFiles = report && typeof report === 'object' && !Array.isArray(report) && Array.isArray(report.testResults) ? report.testResults : []
          if (!report || countFields.some((key) => !Number.isSafeInteger(report[key]) || report[key] < 0) || report.numTotalTests !== expectedTotal) functionalFailures.push('Vitest counters or frozen total are invalid.')
          if (!report || process.env.VITEST_EXIT !== '0' || report.success !== true || report.numPassedTests !== report.numTotalTests || report.numFailedTests !== 0 || report.numPendingTests !== 0 || report.numTodoTests !== 0 || report.numFailedTestSuites !== 0 || report.numPendingTestSuites !== 0 || report.numPassedTestSuites <= 0 || report.numTotalTestSuites !== report.numPassedTestSuites + report.numFailedTestSuites + report.numPendingTestSuites) functionalFailures.push('Vitest failed, skipped a case or returned inconsistent totals.')
          if (reportFiles.length !== expectedFiles.length || reportFiles.some((item) => !item || typeof item !== 'object' || Array.isArray(item))) functionalFailures.push('Selected file inventory is malformed.')
          for (const file of expectedFiles) {
            const matches = reportFiles.filter((item) => item && typeof item === 'object' && typeof item.name === 'string' && item.name.replaceAll('\\','/').endsWith('/' + file))
            const selected = matches[0]
            if (matches.length !== 1 || !selected || selected.status !== 'passed' || !Array.isArray(selected.assertionResults) || selected.assertionResults.length === 0 || (expected.has(file) && selected.assertionResults.length !== expected.get(file)) || (Array.isArray(selected.assertionResults) && selected.assertionResults.some((test) => !test || test.status !== 'passed'))) functionalFailures.push('A required case file failed or differs from its frozen selection.')
          }
          const assertionCount = reportFiles.reduce((total, file) => total + (Array.isArray(file?.assertionResults) ? file.assertionResults.length : 0), 0)
          if (report?.numTotalTests !== assertionCount) functionalFailures.push('Per-file counts differ from Vitest totals.')
          const ownerCaseTitles = [
              ['R01','uses the actual first-show proof, inherited pipe, signed launch, profile and guarded registry'],
              ['R02','refuses no bound window before hello, pipe use or profile preparation'],
              ['R03','refuses unshown bound window before hello, pipe use or profile preparation'],
              ['R04','refuses hidden bound window before hello, pipe use or profile preparation'],
              ['R05','refuses uncommitted main frame before hello, pipe use or profile preparation'],
              ['R06','keeps the first-show proof across hide and permanently retires it across A-to-B-to-A navigation'],
              ['R07','uses the shared terminal path for EOF before launch, mid-frame and after activation'],
              ['R08','retires the in-flight handshake on first-show document navigate events before active publication'],
              ['R09','retires the in-flight handshake on first-show document replace events before active publication'],
              ['R10','retires the in-flight handshake on first-show document close events before active publication'],
              ['R11','retires the in-flight handshake on first-show document render-process-loss events before active publication'],
              ['R12','retires an active run immediately for invalid heartbeat signature'],
              ['R13','retires an active run immediately for replayed/decreasing sequence'],
              ['R14','retires an active run immediately for oversized active frame'],
              ['R15','accepts only a higher-generation successor after full settlement and rejects the old run at RootRegistry'],
              ['R16','retires from its scheduled signed-expiry deadline without an intervening status call'],
              ['R17','refuses a malformed compiled stamp before issuing a challenge or opening the fixed transport'],
              ['R18','rechecks the actual run after a held gateway bind and publishes no root after userData changes'],
              ['R19','keeps a timed-out handshake reserved until held profile descriptors actually close'],
              ['R20','keeps a partial-frame transport failure reserved until held profile preparation actually settles'],
              ['R21','retires on the real scheduled heartbeat-age timer without an intervening owner assertion'],
              ['R22','retains run capacity and the same failed settlement after an actual profile descriptor close failure'],
              ['G01','binds a real guarded root and refuses missing, forged and overridden QA owners before callbacks'],
              ['G02','preserves a replaced writer path and retains root capacity after descriptor close failure'],
              ['G03','checks the run after a held profile physical await before creating registry paths'],
              ['G04','rechecks the run after a held gateway bind before publishing a root for a retired document']
          ]
          const ownerIds = new Set(ownerCaseTitles.map(([id]) => id))
          const caseResults = new Map()
          if (process.env.OWNER_TARGET === 'true') {
