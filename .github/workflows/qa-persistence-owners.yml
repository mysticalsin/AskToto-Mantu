                const fullName = typeof test.fullName === 'string' ? test.fullName : [...(Array.isArray(test.ancestorTitles) ? test.ancestorTitles : []), test.title].filter((part) => typeof part === 'string').join(' ')
                const pair = ownerCaseTitles.find(([, title]) => fullName.endsWith(title))
                if (!pair || caseResults.has(pair[0]) || !['passed','failed','pending'].includes(test.status)) failDiagnostic('missing-case')
