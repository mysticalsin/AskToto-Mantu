name: Ship unsigned 1.9.7

# A push to main that changes the ship arm dispatches qa-candidate for that exact commit.
# The cloud agent token cannot call workflow_dispatch; this workflow's token can.
on:
  push:
    branches:
      - main
    paths:
      - .github/ship-1.9.7

permissions:
  actions: write
  contents: read

concurrency:
  group: ship-unsigned-1.9.7
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch the QA candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch qa-candidate for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run qa-candidate.yml --repo "$GITHUB_REPOSITORY" --ref main -f "commit=$GITHUB_SHA"
          echo "Dispatched qa-candidate for $GITHUB_SHA"
