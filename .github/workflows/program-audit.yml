name: Program audit

# Reusable audit lane for a program ledger (M2-0509): the evidence back-fill (M2-0238), the
# re-execution draw (ADR-017, M2-0002), the velocity forecast (M2-0197) and the release gate check
# (M2-0511: check.mjs --release against the gate file, the candidate's provenance.json and the release
# file, with the version taken from the gate file), run in CI only (D-28).
# The ledger and its evidence records live in a private repository that never appears here (AGENTS.md
# #1), so this is a `workflow_call` workflow in the same shape as ledger.yml: the caller's own workflow
#   jobs:
#     audit:
#       uses: mysticalsin/AskToto-Mantu/.github/workflows/program-audit.yml@main
#       with:
#         mode: sample
#         ledger-path: ledger/tickets.json
#         population-of: M2-0046
#         seed: <40-hex gate commit>
# runs this job in the caller's context. The first checkout (no `repository:` input) is the caller's
# tree, so no cross-repository credential exists anywhere; the second fetches this repository's scripts
# at `checker-ref` into a separate path. `workflow_dispatch` (same inputs) smoke-runs a fixture ledger
# inside this repository. Each mode uploads a content-free artifact (ticket ids, hours, hashes) and
# writes its result to the job summary; the lead files any evidence from the artifact.
on:
  workflow_call:
    inputs:
      mode:
        description: backfill, sample, velocity or release-check
        required: true
        type: string
      ledger-path:
        description: Path to ledger/tickets.json in the caller's own checkout
        required: true
        type: string
      records-path:
        description: Evidence-record directory in the caller's checkout (velocity; default is next to the ledger)
        required: false
        type: string
        default: ''
      population-of:
        description: sample mode, ticket whose closed dependencies are the population (exclusive with since)
        required: false
        type: string
        default: ''
      since:
        description: sample mode, closed since this date or instant (exclusive with population-of)
        required: false
        type: string
        default: ''
      seed:
        description: sample mode, 40-hex gate commit SHA
        required: false
        type: string
        default: ''
      gate:
        description: velocity and release-check modes, gate label
        required: false
        type: string
        default: m3
      gates-path:
        description: release-check mode, the release gate file (schema in scripts/evidence/check.mjs)
        required: false
        type: string
        default: ''
      provenance-path:
        description: release-check mode, the candidate's provenance.json
        required: false
        type: string
        default: ''
      notes-path:
        description: release-check mode, the release file <version>.md
        required: false
        type: string
        default: ''
      checker-ref:
        description: Ref of this repository to fetch the audit scripts from
        required: false
        type: string
        default: main
  workflow_dispatch:
    inputs:
      mode:
        description: backfill, sample, velocity or release-check
        required: true
        type: string
      ledger-path:
        description: Path to a ledger/tickets.json for a manual smoke run (for example a fixture)
        required: true
        type: string
      records-path:
        description: Evidence-record directory (velocity; default is next to the ledger)
        required: false
        type: string
        default: ''
      population-of:
        description: sample mode, ticket whose closed dependencies are the population (exclusive with since)
        required: false
        type: string
        default: ''
      since:
        description: sample mode, closed since this date or instant (exclusive with population-of)
        required: false
        type: string
        default: ''
      seed:
        description: sample mode, 40-hex gate commit SHA
        required: false
        type: string
        default: ''
      gate:
        description: velocity and release-check modes, gate label
        required: false
        type: string
        default: m3
      gates-path:
        description: release-check mode, the release gate file (schema in scripts/evidence/check.mjs)
        required: false
        type: string
        default: ''
      provenance-path:
        description: release-check mode, the candidate's provenance.json
        required: false
        type: string
        default: ''
      notes-path:
        description: release-check mode, the release file <version>.md
        required: false
        type: string
        default: ''
      checker-ref:
        description: Ref of this repository to fetch the audit scripts from
        required: false
        type: string
        default: main

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    name: Program audit (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ inputs.mode }}
      LEDGER_PATH: ${{ inputs.ledger-path }}
      RECORDS_PATH: ${{ inputs.records-path }}
      POPULATION_OF: ${{ inputs.population-of }}
      SINCE: ${{ inputs.since }}
      SEED: ${{ inputs.seed }}
      GATE: ${{ inputs.gate }}
      GATES_PATH: ${{ inputs.gates-path }}
      PROVENANCE_PATH: ${{ inputs.provenance-path }}
      NOTES_PATH: ${{ inputs.notes-path }}
      OUT_DIR: out/program-audit
    steps:
      - name: Validate the inputs
        run: |
          set -euo pipefail
          case "$MODE" in
            backfill | sample | velocity | release-check) ;;
            *) echo "mode must be backfill, sample, velocity or release-check" >&2; exit 2 ;;
          esac
          if [ "$MODE" = "release-check" ] && { [ -z "$GATES_PATH" ] || [ -z "$PROVENANCE_PATH" ] || [ -z "$NOTES_PATH" ]; }; then
            echo "release-check mode requires gates-path, provenance-path and notes-path" >&2; exit 2
          fi
          if [ "$MODE" = "sample" ]; then
            if ! printf '%s' "$SEED" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "sample mode requires a 40-hex seed" >&2; exit 2
            fi
            if { [ -n "$POPULATION_OF" ] && [ -n "$SINCE" ]; } || { [ -z "$POPULATION_OF" ] && [ -z "$SINCE" ]; }; then
              echo "sample mode requires exactly one of population-of or since" >&2; exit 2
            fi
          fi
          if [ "$MODE" = "release-check" ]; then
            for name in GATES_PATH PROVENANCE_PATH NOTES_PATH; do
              if [ -z "${!name}" ]; then
                echo "release-check mode requires $name" >&2
                exit 2
              fi
            done
          fi
      - name: Checkout the caller's ledger and evidence records
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # release-check recomputes the re-execution sample from the ledger at the sample's ledger_commit.
          fetch-depth: ${{ inputs.mode == 'release-check' && '0' || '1' }}
      - name: Fetch the public audit scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: mysticalsin/AskToto-Mantu
          ref: ${{ inputs.checker-ref }}
          path: .program-audit-scripts
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Back-fill the evidence records
        if: inputs.mode == 'backfill'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .program-audit-scripts/scripts/evidence/backfill.mjs --repo mysticalsin/AskToto-Mantu --ledger "$LEDGER_PATH" --out "$OUT_DIR"
          cat "$OUT_DIR/README.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Draw the re-execution sample
        if: inputs.mode == 'sample'
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          args=(--ledger "$LEDGER_PATH" --seed "$SEED")
          if [ -n "$POPULATION_OF" ]; then
            args+=(--population-of "$POPULATION_OF")
          else
            args+=(--since "$SINCE")
          fi
          node .program-audit-scripts/scripts/evidence/sample.mjs "${args[@]}" | jq --arg sha "$GITHUB_SHA" '. + {ledger_commit: $sha}' > "$OUT_DIR/sample.json"
          { echo '```json'; cat "$OUT_DIR/sample.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Forecast the velocity
        if: inputs.mode == 'velocity'
        run: |
          set -euo pipefail
          args=(--ledger "$LEDGER_PATH" --gate "$GATE" --out-dir "$OUT_DIR")
          if [ -n "$RECORDS_PATH" ]; then
            args+=(--records "$RECORDS_PATH")
          fi
          node .program-audit-scripts/scripts/program/velocity.mjs "${args[@]}"
          cat "$OUT_DIR/FORECAST.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the release gates
        if: inputs.mode == 'release-check'
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          version="$(jq -er '.version' "$GATES_PATH")"
          status=0
          node .program-audit-scripts/scripts/evidence/check.mjs --release "$version" --gates "$GATES_PATH" --provenance "$PROVENANCE_PATH" --ledger "$LEDGER_PATH" --notes "$NOTES_PATH" > "$OUT_DIR/release-check.txt" 2>&1 || status=$?
          { echo '```text'; cat "$OUT_DIR/release-check.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles('out/program-audit/**') != ''
        with:
          name: program-audit-${{ inputs.mode }}
          path: out/program-audit/
          if-no-files-found: error
          retention-days: 30
