name: isolation-canary

# M2-0190 — hermetic-test canaries for the runners build.yml's `quality`/`operator` jobs never exercise:
# swift test (native-app/MetisKit has no vitest equivalent), license-server's `node --test` (a separate
# npm project, its own package-lock), the deny-non-loopback.cjs network preload, and the owner-account.sb
# OS sandbox profile. Kept in a separate workflow file rather than a new job in build.yml.
#
# operator/scripts/wrangler-local-sandbox.contract.test.ts, scripts/qa/lib/sandbox-guard.test.ts and
# scripts/hermetic/sandbox-env.test.ts need no job here: they are plain `*.test.ts` files already run by
# build.yml's `quality` job (root `npm test`) and `operator` job.
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
      - 'ffmpeg-sidecar-*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-server:
    name: license-server node --test (hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: license-server/package-lock.json
      # M2-0190 acceptance #4 — proves the isolation against the runner's REAL home, not a fresh
      # (and therefore trivially empty) sandbox dir. A sentinel file lets the later step tell "untouched"
      # apart from "touched before the suite even ran".
      - name: Seed a real-home honeypot the suite must never touch
        run: |
          mkdir -p "$HOME/Library/CloudStorage/OneDrive-Honeypot"
          echo sentinel > "$HOME/Library/CloudStorage/OneDrive-Honeypot/sentinel"
      - run: npm ci
        working-directory: license-server
      - run: npm test
        working-directory: license-server
      - name: Fail if the suite touched the real-home honeypot
        run: |
          touched="$(find "$HOME/Library/CloudStorage/OneDrive-Honeypot" -newer "$HOME/Library/CloudStorage/OneDrive-Honeypot/sentinel")"
          if [ -n "$touched" ]; then
            echo "the suite touched the real-home honeypot it must never reach:"
            echo "$touched"
            exit 1
          fi

  metiskit-swift-test:
    name: MetisKit swift test (hermetic)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Seed a real-home honeypot the suite must never touch
        run: |
          mkdir -p "$HOME/Library/CloudStorage/OneDrive-Honeypot"
          echo sentinel > "$HOME/Library/CloudStorage/OneDrive-Honeypot/sentinel"
      # Never bare `swift test` (M2-0190) — this wrapper is what provides HermeticHomeTests' sandbox
      # (HOME, CFFIXED_USER_HOME); running `swift test` directly here would leave both unset and the
      # canary would fail loudly.
      - run: bash scripts/hermetic/run-swift-tests.sh native-app/MetisKit
      - name: Fail if the suite touched the real-home honeypot
        run: |
          touched="$(find "$HOME/Library/CloudStorage/OneDrive-Honeypot" -newer "$HOME/Library/CloudStorage/OneDrive-Honeypot/sentinel")"
          if [ -n "$touched" ]; then
            echo "the suite touched the real-home honeypot it must never reach:"
            echo "$touched"
            exit 1
          fi

  deny-non-loopback:
    name: deny-non-loopback.cjs denies every connect() shape (hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      # No npm ci: this test only uses node:net/http/tls/child_process/test — no third-party dependency.
      - run: node --test scripts/hermetic/deny-non-loopback.test.mjs

  owner-sandbox-profile:
    name: owner-account.sb denies real user state (hermetic)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Seed honeypots the profile must deny
        run: |
          mkdir -p "$HOME/Library/CloudStorage/OneDrive-Honeypot"
          echo probe > "$HOME/Library/CloudStorage/OneDrive-Honeypot/probe"
          mkdir -p "$HOME/.wrangler"
          echo probe > "$HOME/.wrangler/probe"
      - name: Denies reading a honeypot under Library/CloudStorage
        run: |
          if bash scripts/hermetic/run-under-owner-sandbox.sh cat "$HOME/Library/CloudStorage/OneDrive-Honeypot/probe" 2>err.log; then
            echo "expected the read to be denied"; cat err.log; exit 1
          fi
          cat err.log
          grep -q "Operation not permitted" err.log
      - name: Denies writing into that same honeypot
        run: |
          if bash scripts/hermetic/run-under-owner-sandbox.sh sh -c 'echo x >> "$HOME/Library/CloudStorage/OneDrive-Honeypot/probe"' 2>err.log; then
            echo "expected the write to be denied"; cat err.log; exit 1
          fi
          cat err.log
          grep -q "Operation not permitted" err.log
      - name: Denies reading wrangler's real global config directory
        run: |
          if bash scripts/hermetic/run-under-owner-sandbox.sh cat "$HOME/.wrangler/probe" 2>err.log; then
            echo "expected the read to be denied"; cat err.log; exit 1
          fi
          cat err.log
          grep -q "Operation not permitted" err.log
      - name: Positive control — reading a repository file still works under the profile
        run: bash scripts/hermetic/run-under-owner-sandbox.sh cat AGENTS.md > /dev/null
