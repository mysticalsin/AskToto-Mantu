name: M2-0075 virtual-list measurement

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  measure:
    name: Measure virtualized lists in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the renderer
        run: npm run build
      - name: Measure 5,000-row virtual-list fixtures
        run: node scripts/qa/virtual-list-measure.mjs --out out/m2-0075-virtual-list
      - name: Upload measurement report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m2-0075-virtual-list
          path: out/m2-0075-virtual-list/
          if-no-files-found: error
          retention-days: 14
