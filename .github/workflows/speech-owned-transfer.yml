name: Speech owned transfer causal controls

on:
  push:
    paths:
      - .github/workflows/speech-owned-transfer.yml
      - package.json
      - package-lock.json
      - vitest.config.ts
      - src/main/infra/storage/runtime-owned-files.ts
      - src/main/infra/storage/runtime-exclusive-file-sink.ts
      - src/main/infra/storage/runtime-owned-transfer.test.ts
      - scripts/qa/speech-owned-transfer-unhandled-reporter.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: speech-owned-transfer-controls-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  controls:
    name: Speech owned transfer controls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Initialize fresh guarded report paths
        id: initialize
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, realpathSync, statSync } from 'node:fs'
          import { dirname, isAbsolute, parse, posix, resolve, win32 } from 'node:path'

          const configured = process.env.RUNNER_TEMP ?? ''
          const posixAbsolute = posix.isAbsolute(configured)
          const driveAbsolute = /^[A-Za-z]:[\\/]/.test(configured) && win32.isAbsolute(configured)
          if (!configured || (!posixAbsolute && !driveAbsolute)) throw new Error('RUNNER_TEMP must be absolute')
          const temporaryRoot = realpathSync(configured)
          const filesystemRoot = parse(temporaryRoot).root
          if (temporaryRoot.toLowerCase() === filesystemRoot.toLowerCase() || !statSync(temporaryRoot).isDirectory()) {
            throw new Error('RUNNER_TEMP must resolve to an existing non-root directory')
          }
          const runId = process.env.GITHUB_RUN_ID ?? ''
          const attempt = process.env.GITHUB_RUN_ATTEMPT ?? ''
          const matrixOs = process.env.MATRIX_OS ?? ''
          if (!/^\d+$/.test(runId) || !/^\d+$/.test(attempt) || !/^[A-Za-z0-9_-]+$/.test(matrixOs)) {
            throw new Error('SPEECH_TRANSFER_REPORT_IDENTITY_INVALID')
          }
          const stem = `speech-owned-transfer-${runId}-${attempt}-${matrixOs}`
          const report = resolve(temporaryRoot, `${stem}.json`)
          const unhandled = resolve(temporaryRoot, `${stem}-unhandled.json`)
          const evidence = resolve(temporaryRoot, `${stem}-evidence.json`)
          const output = process.env.GITHUB_OUTPUT ?? ''
          if (dirname(report) !== temporaryRoot || dirname(evidence) !== temporaryRoot ||
              dirname(unhandled) !== temporaryRoot || existsSync(report) || existsSync(unhandled) ||
              existsSync(evidence) || !output || !isAbsolute(output)) {
            throw new Error('SPEECH_TRANSFER_REPORT_PATHS_INVALID')
          }
          appendFileSync(output, `report=${report}\nunhandled=${unhandled}\nevidence=${evidence}\n`, { flag: 'a' })
          NODE
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the frozen four-case old API control inventory
        id: tests
        continue-on-error: true
        env:
          REPORT: ${{ steps.initialize.outputs.report }}
          SPEECH_TRANSFER_UNHANDLED_REPORT: ${{ steps.initialize.outputs.unhandled }}
        run: |
          set +e
          node node_modules/vitest/vitest.mjs run --config vitest.config.ts --maxWorkers=2 \
            --dangerouslyIgnoreUnhandledErrors=false --reporter=default --reporter=json \
            --reporter=./scripts/qa/speech-owned-transfer-unhandled-reporter.mjs --outputFile="$REPORT" \
            src/main/infra/storage/runtime-owned-transfer.test.ts
          test_exit_code=$?
          printf 'exit_code=%s\n' "$test_exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate exact causal outcomes and assertion roster
        if: always() && steps.initialize.outcome == 'success'
        env:
          REPORT: ${{ steps.initialize.outputs.report }}
          UNHANDLED: ${{ steps.initialize.outputs.unhandled }}
          EVIDENCE: ${{ steps.initialize.outputs.evidence }}
          ACTUAL_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
          SOURCE_SHA: ${{ github.sha }}
          RUNNER_OS: ${{ runner.os }}
          CONTROL_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          MATRIX_OS: ${{ matrix.os }}
          JOB_ID: ${{ github.job }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, statSync, writeFileSync } from 'node:fs'

          const expected = new Map([
            ['runtime owned transfer old API causal controls runtime owned transfer fences each actual short write when the original action retires', 'R1_CAUSAL_WRITE_FENCE'],
            ['runtime owned transfer old API causal controls runtime owned transfer accounts for delegated short writes while the action stays current', null],
            ['runtime owned transfer old API causal controls runtime owned transfer joins raw exclusive closes until the actual close settles', 'R2_CAUSAL_CLOSE_JOIN'],
            ['runtime owned transfer old API causal controls runtime owned transfer resolves raw close observers from the same actual close', null]
          ])
          const redRef = 'refs/heads/fix/speech-owned-transfer-red'
          const controlRed = process.env.CONTROL_REF === redRef
          const reportStat = statSync(process.env.REPORT)
          if (!reportStat.isFile() || reportStat.size <= 0 || reportStat.size > 16 * 1024 * 1024) {
            throw new Error('SPEECH_TRANSFER_RAW_REPORT_SIZE_INVALID')
          }
          const bytes = readFileSync(process.env.REPORT)
          if (bytes.byteLength > 16 * 1024 * 1024) throw new Error('SPEECH_TRANSFER_RAW_REPORT_OVERSIZED')
          const report = JSON.parse(bytes.toString('utf8'))
          const unhandledStat = statSync(process.env.UNHANDLED)
          if (!unhandledStat.isFile() || unhandledStat.size <= 0 || unhandledStat.size > 32 * 1024) {
            throw new Error('SPEECH_TRANSFER_UNHANDLED_REPORT_SIZE_INVALID')
          }
          const unhandledBytes = readFileSync(process.env.UNHANDLED)
          if (unhandledBytes.byteLength > 32 * 1024) throw new Error('SPEECH_TRANSFER_UNHANDLED_REPORT_OVERSIZED')
          const unhandled = JSON.parse(unhandledBytes.toString('utf8'))
          const workflowBytes = readFileSync('.github/workflows/speech-owned-transfer.yml')
          const results = Array.isArray(report.testResults) ? report.testResults : []
          const normalize = (value) => String(value).replaceAll('\\', '/')
          const paths = results.map((result) => normalize(result.name))
          const assertions = results.flatMap((result) => Array.isArray(result.assertionResults) ? result.assertionResults : [])
          const failures = assertions.filter((assertion) => assertion.status === 'failed')
          const fullNames = assertions.map((assertion) => assertion.fullName)
          const actualFailures = new Map(failures.map((failure) => [failure.fullName, JSON.stringify(failure.failureMessages ?? [])]))
          const expectedFailures = controlRed ? new Map([...expected].filter(([, cause]) => cause !== null)) : new Map()
          const expectedNames = [...expected.keys()].sort()
          const counters = ['numTotalTests', 'numPassedTests', 'numFailedTests', 'numPendingTests', 'numTodoTests',
            'numTotalTestSuites', 'numPassedTestSuites', 'numFailedTestSuites', 'numPendingTestSuites']
          const countValues = counters.map((key) => report[key])
          const numericCounts = countValues.every((count) => Number.isSafeInteger(count) && count >= 0)
          const suitesConsistent = report.numTotalTestSuites === 2 &&
            report.numTotalTestSuites === report.numPassedTestSuites + report.numFailedTestSuites + report.numPendingTestSuites
          const exactFile = results.length === 1 && paths[0]?.endsWith('/src/main/infra/storage/runtime-owned-transfer.test.ts')
          const emptyFileMessage = results.length === 1 && results[0].message === ''
          const exactRoster = fullNames.length === expected.size && [...fullNames].sort().every((name, index) => name === expectedNames[index])
          const exactFailures = failures.length === expectedFailures.size && [...expectedFailures].every(([name, marker]) => {
            const failure = failures.filter((entry) => entry.fullName === name)
            const messages = failure[0]?.failureMessages
            return failure.length === 1 && Array.isArray(messages) && messages.length === 1 &&
              messages[0].includes('AssertionError') && messages[0].includes(marker) && actualFailures.get(name)?.includes(marker)
          }) && failures.every((failure) => expectedFailures.has(failure.fullName))
          const accounted = assertions.length === report.numTotalTests &&
            assertions.every((assertion) => assertion.status === 'passed' || assertion.status === 'failed') &&
            assertions.filter((assertion) => assertion.status === 'passed').every((assertion) =>
              Array.isArray(assertion.failureMessages) && assertion.failureMessages.length === 0) &&
            results.every((result) => result.status === 'passed' || result.status === 'failed') &&
            results.every((result) => Array.isArray(result.assertionResults) && result.assertionResults.length > 0)
          const expectedExitCode = controlRed ? 1 : 0
          const expectedSuccess = !controlRed
          const errorMetadataBound = unhandled.schema === 1 &&
            unhandled.runId === process.env.RUN_ID && unhandled.runAttempt === process.env.RUN_ATTEMPT &&
            unhandled.job === process.env.JOB_ID && unhandled.runnerOs === process.env.RUNNER_OS &&
            unhandled.platform === process.platform && unhandled.architecture === process.arch &&
            unhandled.fileCount === 1 && unhandled.errorCount === 0 && Array.isArray(unhandled.errors) &&
            unhandled.errors.length === 0 && unhandled.omittedErrors === 0
          const complete = numericCounts && suitesConsistent && exactFile && exactRoster && exactFailures && accounted &&
            emptyFileMessage && errorMetadataBound && process.env.ACTUAL_EXIT_CODE === String(expectedExitCode) &&
            report.success === expectedSuccess &&
            report.numTotalTests === 4 && report.numPassedTests + report.numFailedTests === 4 &&
            report.numFailedTests === expectedFailures.size && report.numPendingTests === 0 && report.numTodoTests === 0 &&
            report.numPassedTestSuites === (controlRed ? 0 : 2) &&
            report.numFailedTestSuites === (controlRed ? 2 : 0) && report.numPendingTestSuites === 0
          const evidence = {
            sourceSha: process.env.SOURCE_SHA,
            workflowSha256: createHash('sha256').update(workflowBytes).digest('hex'),
            unhandledReporterSha256: createHash('sha256').update(readFileSync('scripts/qa/speech-owned-transfer-unhandled-reporter.mjs')).digest('hex'),
            runId: process.env.RUN_ID,
            runAttempt: process.env.RUN_ATTEMPT,
            controlRef: process.env.CONTROL_REF,
            matrixOs: process.env.MATRIX_OS,
            runnerOs: process.env.RUNNER_OS,
            platform: process.platform,
            architecture: process.arch,
            actualExitCode: process.env.ACTUAL_EXIT_CODE,
            reportSha256: createHash('sha256').update(bytes).digest('hex'),
            unhandledReportSha256: createHash('sha256').update(unhandledBytes).digest('hex'),
            errorCount: unhandled.errorCount,
            files: paths,
            assertionRoster: fullNames,
            expectedFailedAssertions: [...expectedFailures.keys()],
            actualFailedAssertions: failures.map((failure) => ({ fullName: failure.fullName, failureMessages: failure.failureMessages ?? [] })),
            counts: Object.fromEntries(counters.map((key) => [key, report[key] ?? null])),
            evidenceKind: controlRed ? 'EXPECTED_CAUSAL_RED_ONLY' : 'CONTROL_INVENTORY_ONLY',
            productionQualification: false,
            validation: complete ? 'accepted' : 'rejected'
          }
          writeFileSync(process.env.EVIDENCE, `${JSON.stringify(evidence, null, 2)}\n`, { flag: 'wx' })
          console.log(JSON.stringify(evidence))
          if (!complete) throw new Error('SPEECH_OWNED_TRANSFER_CONTROL_REPORT_REJECTED')
          NODE
      - name: Require report and preserve evidence artifacts
        if: always() && steps.initialize.outcome == 'success'
        env:
          REPORT: ${{ steps.initialize.outputs.report }}
          UNHANDLED: ${{ steps.initialize.outputs.unhandled }}
          EVIDENCE: ${{ steps.initialize.outputs.evidence }}
        run: |
          set -euo pipefail
          test -s "$REPORT"
          test -s "$UNHANDLED"
          if [[ -e "$EVIDENCE" ]]; then test -s "$EVIDENCE"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.initialize.outcome == 'success'
        with:
          name: speech-owned-transfer-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.initialize.outputs.report }}
            ${{ steps.initialize.outputs.unhandled }}
            ${{ steps.initialize.outputs.evidence }}
          if-no-files-found: warn
          retention-days: 14
