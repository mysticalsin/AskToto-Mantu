name: Windows unsigned QA mode protocol source fixture

on:
  push:
    branches: [fix/windows-unsigned-qa-mode]
    paths:
      - .github/workflows/windows-unsigned-qa-mode.yml
      - vitest.windows-unsigned-qa-mode.config.ts
      - scripts/qa/windows-unsigned-qa-mode.test.ts
      - src/main/persistence/qa-run-protocol.ts
      - src/main/qa-identity.ts
      - src/main/persistence/resource-policy-contract.ts
      - scripts/hermetic/sandbox-env.mjs
      - scripts/qa/fixtures/persistence-owner-diagnostic-reporter.mjs
      - package.json
      - package-lock.json
      - tsconfig.node.json
      - tsconfig.web.json
      - tsconfig.tests.json
      - scripts/check-architecture.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-unsigned-qa-mode-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  source-fixture:
    if: github.ref == 'refs/heads/fix/windows-unsigned-qa-mode'
    name: Windows unsigned QA source fixture (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-shipping, os: ubuntu-latest }
          - { target: windows-x64, os: windows-latest }
          - { target: macos-arm64, os: macos-14 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install lockfile dependencies without lifecycle scripts
        id: install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the bounded focused source fixture
        id: fixture
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          U0_DIR: ${{ runner.temp }}/windows-unsigned-qa-u0-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          QA_U0_RUN_DIR: ${{ runner.temp }}/windows-unsigned-qa-u0-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}/fixture
          QA_U0_CASE_REPORT: ${{ runner.temp }}/windows-unsigned-qa-u0-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}/cases.json
          QA_U0_VITEST_JSON: ${{ runner.temp }}/windows-unsigned-qa-u0-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}/vitest.json
          QA_OWNER_FRAMEWORK_REPORT_PATH: ${{ runner.temp }}/windows-unsigned-qa-u0-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}/framework.json
          QA_OWNER_TARGET: ${{ matrix.target }}
          QA_OWNER_SOURCE_SHA: ${{ github.sha }}
          QA_U0_TARGET: ${{ matrix.target }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_ACTIONS: 'true'
        run: |
          set -euo pipefail
          node -e "require('node:fs').mkdirSync(process.env.U0_DIR, { recursive: true, mode: 0o700 })"
          node --input-type=module <<'NODE'
          import { closeSync, lstatSync, openSync, writeSync } from 'node:fs'
          import { spawn } from 'node:child_process'
          import { createRequire } from 'node:module'
          import { resolve } from 'node:path'

          const cap = 4 * 1024 * 1024
          const log = resolve(process.env.U0_DIR, 'default.log')
          const fd = openSync(log, 'wx', 0o600)
          const nativePackage = `@esbuild/${process.platform}-${process.arch}`
          const nativeSubpath = process.platform === 'win32' ? 'esbuild.exe' : 'bin/esbuild'
          const ordinaryBinary = resolve('node_modules', nativePackage, nativeSubpath)
          const selectedBinary = createRequire(resolve('node_modules/esbuild/lib/main.js')).resolve(`${nativePackage}/${nativeSubpath}`)
          if (selectedBinary !== ordinaryBinary) throw new Error('pinned-esbuild-native-resolution-mismatch')
          const binaryStat = lstatSync(selectedBinary)
          if (!binaryStat.isFile() || binaryStat.isSymbolicLink() || binaryStat.size < 1 || binaryStat.size > 32 * 1024 * 1024) throw new Error('pinned-esbuild-binary-missing')
          let bytes = 0
          let overflow = false
          let streamError = false
          const childEnv = { ...process.env, NO_COLOR: '1', FORCE_COLOR: '0' }
          delete childEnv.ESBUILD_BINARY_PATH
          const child = spawn(process.execPath, [
            'node_modules/vitest/vitest.mjs', 'run', '--config', 'vitest.windows-unsigned-qa-mode.config.ts', '--retry=0'
          ], { cwd: process.cwd(), env: childEnv, stdio: ['ignore', 'pipe', 'pipe'] })
          const consume = (stream, label) => {
            stream.on('data', (chunk) => {
              if (!Buffer.isBuffer(chunk)) chunk = Buffer.from(chunk)
              if (bytes + chunk.length > cap) { overflow = true; return }
              const prefix = Buffer.from(`${label}:`)
              if (bytes + prefix.length + chunk.length > cap) { overflow = true; return }
              if (writeSync(fd, prefix) !== prefix.length || writeSync(fd, chunk) !== chunk.length) { streamError = true; return }
              bytes += prefix.length + chunk.length
            })
            stream.on('error', () => { streamError = true })
          }
          consume(child.stdout, 'stdout')
          consume(child.stderr, 'stderr')
          child.on('error', () => { streamError = true })
          const exitCode = await new Promise((resolveExit) => child.once('close', (code) => resolveExit(code)))
          closeSync(fd)
          const output = `exit_code=${Number.isInteger(exitCode) ? exitCode : 'null'}\nlog_overflow=${overflow}\nstream_error=${streamError}\n`
          writeSync(openSync(process.env.GITHUB_OUTPUT, 'a'), output)
          process.exitCode = 0
          NODE
      - name: Observe the unchanged fixture under the real root Vitest config
        id: root_fixture
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          ROOT_DIR: ${{ runner.temp }}/windows-unsigned-qa-root-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          ROOT_TARGET: ${{ matrix.target }}
          METIS_CI_ROOT_REPORT: ${{ runner.temp }}/windows-unsigned-qa-root-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}/vitest.json
        run: |
          node --input-type=module <<'NODE'
          import { spawn, execFileSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { closeSync, fstatSync, lstatSync, mkdirSync, openSync, readSync, realpathSync, writeSync } from 'node:fs'
          import { dirname, resolve } from 'node:path'

          const dir = resolve(process.env.ROOT_DIR)
          if (realpathSync(dirname(dir)) !== realpathSync(process.env.RUNNER_TEMP)) throw new Error('root-capture-parent')
          mkdirSync(dir, { recursive: false, mode: 0o700 })
          const owned = lstatSync(dir)
          if (!owned.isDirectory() || owned.isSymbolicLink()) throw new Error('root-capture-directory')
          const sha = (value) => createHash('sha256').update(value).digest('hex')
          const encodedBound = (value) => {
            if (value === null) return 4
            if (typeof value === 'string') return 2 + 6 * Buffer.byteLength(value)
            if (typeof value === 'boolean') return 5
            if (Number.isSafeInteger(value)) return 24
            if (Array.isArray(value)) return 2 + value.reduce((sum, entry) => sum + encodedBound(entry) + 1, 0)
            if (!value || typeof value !== 'object') throw new Error('encoded-scalar-bound')
            let cost = 2
            for (const key in value) if (Object.hasOwn(value, key)) cost += encodedBound(key) + encodedBound(value[key]) + 2
            return cost
          }
          const publish = (name, value, max) => {
            if (encodedBound(value) + 1 > max) throw new Error('root-capture-encoded-bound:' + name)
            const bytes = Buffer.from(JSON.stringify(value) + '\n')
            if (bytes.length < 2 || bytes.length > max) throw new Error('root-capture-bound:' + name)
            const path = resolve(dir, name)
            const fd = openSync(path, 'wx+', 0o600)
            let primary = null
            try {
              const held = fstatSync(fd)
              const named = lstatSync(path)
              if (!held.isFile() || !named.isFile() || named.isSymbolicLink() || held.dev !== named.dev || held.ino !== named.ino || held.size !== 0 || named.size !== 0) throw new Error('root-report-open-identity:' + name)
              if (writeSync(fd, bytes, 0, bytes.length, 0) !== bytes.length) throw new Error('root-report-short-write:' + name)
              const readback = Buffer.alloc(bytes.length)
              if (readSync(fd, readback, 0, bytes.length, 0) !== bytes.length || !readback.equals(bytes) || readSync(fd, Buffer.alloc(1), 0, 1, bytes.length) !== 0) throw new Error('root-report-readback:' + name)
              const after = fstatSync(fd)
              const namedAfter = lstatSync(path)
              if (after.dev !== held.dev || after.ino !== held.ino || after.size !== bytes.length || namedAfter.dev !== held.dev || namedAfter.ino !== held.ino || namedAfter.size !== bytes.length || namedAfter.isSymbolicLink()) throw new Error('root-report-final-identity:' + name)
            } catch (error) { primary = error }
            let closeError = null
            try { closeSync(fd) } catch (error) { closeError = error }
            if (primary && closeError) throw new AggregateError([primary, closeError], 'root-report-write-and-close:' + name)
            if (primary) throw primary
            if (closeError) throw closeError
          }
          // This literal is the only observer. It enters Vitest through its installed public API.
          const bootstrap = String.raw`
          import { closeSync, fstatSync, lstatSync, openSync, readSync, writeSync } from 'node:fs'
          import { resolve } from 'node:path'
          import { pathToFileURL } from 'node:url'
          const dir = process.env.ROOT_DIR
          const bootstrapSha256 = process.env.ROOT_BOOTSTRAP_SHA256
          const encodedBound = (value) => {
            if (value === null) return 4
            if (typeof value === 'string') return 2 + 6 * Buffer.byteLength(value)
            if (typeof value === 'boolean') return 5
            if (Number.isSafeInteger(value)) return 24
            if (Array.isArray(value)) return 2 + value.reduce((sum, entry) => sum + encodedBound(entry) + 1, 0)
            if (!value || typeof value !== 'object') throw new Error('encoded-scalar-bound')
            let cost = 2
            for (const key in value) if (Object.hasOwn(value, key)) cost += encodedBound(key) + encodedBound(value[key]) + 2
            return cost
          }
          const publish = (name, value, max) => {
            if (encodedBound(value) + 1 > max) throw new Error('observer-encoded-bound:' + name)
            const bytes = Buffer.from(JSON.stringify(value) + '\n')
            if (bytes.length < 2 || bytes.length > max) throw new Error('observer-bound:' + name)
            const path = resolve(dir, name)
            const fd = openSync(path, 'wx+', 0o600)
            let primary = null
            try {
              const held = fstatSync(fd)
              const named = lstatSync(path)
              if (!held.isFile() || !named.isFile() || named.isSymbolicLink() || held.dev !== named.dev || held.ino !== named.ino || held.size !== 0 || named.size !== 0) throw new Error('observer-open-identity:' + name)
              if (writeSync(fd, bytes, 0, bytes.length, 0) !== bytes.length) throw new Error('observer-short-write:' + name)
              const readback = Buffer.alloc(bytes.length)
              if (readSync(fd, readback, 0, bytes.length, 0) !== bytes.length || !readback.equals(bytes) || readSync(fd, Buffer.alloc(1), 0, 1, bytes.length) !== 0) throw new Error('observer-readback:' + name)
              const after = fstatSync(fd)
              const namedAfter = lstatSync(path)
              if (after.dev !== held.dev || after.ino !== held.ino || after.size !== bytes.length || namedAfter.dev !== held.dev || namedAfter.ino !== held.ino || namedAfter.size !== bytes.length || namedAfter.isSymbolicLink()) throw new Error('observer-final-identity:' + name)
            } catch (error) { primary = error }
            let closeError = null
            try { closeSync(fd) } catch (error) { closeError = error }
            if (primary && closeError) throw new AggregateError([primary, closeError], 'observer-write-and-close:' + name)
            if (primary) throw primary
            if (closeError) throw closeError
          }
          const scalar = (value, max, label) => {
            if (typeof value !== 'string' || Buffer.byteLength(value) > max) throw new Error('observer-scalar:' + label)
            return value
          }
          const observationBudget = { remaining: 256 * 1024 - 16384 }
          const frameworkBudget = { remaining: 16 * 1024 }
          const retain = (value, budget, max = budget.remaining) => {
            const cost = encodedBound(value) + 1
            if (cost > max || cost > budget.remaining) throw new Error('observer-encoded-overflow')
            budget.remaining -= cost
            return value
          }
          const err = (value) => ({ name: scalar(value?.name, 128, 'error-name'),
            message: scalar(value?.message, 4096, 'error-message'), stack: scalar(value?.stack, 8192, 'error-stack') })
          const projectErrors = (values, max, budget) => {
            if (!Array.isArray(values) || values.length > max) throw new Error('observer-errors-bound')
            const errors = []
            for (const value of values) errors.push(retain(err(value), budget))
            return errors
          }
          const meta = (value) => {
            if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('observer-meta-bound')
            for (const key in value) if (Object.hasOwn(value, key) && key !== 'qaU0FixtureOwner') throw new Error('observer-meta-key')
            return Object.hasOwn(value, 'qaU0FixtureOwner') ? { qaU0FixtureOwner: scalar(value.qaU0FixtureOwner, 128, 'meta-owner') } : {}
          }
          const record = {
            schema: 'metis-u0-root-framework/v1', bootstrapSha256, sourceHead: scalar(process.env.GITHUB_SHA, 40, 'GITHUB_SHA'),
            runId: scalar(process.env.GITHUB_RUN_ID, 32, 'GITHUB_RUN_ID'), runAttempt: scalar(process.env.GITHUB_RUN_ATTEMPT, 16, 'GITHUB_RUN_ATTEMPT'),
            target: scalar(process.env.ROOT_TARGET, 32, 'ROOT_TARGET'), node: process.version,
            initCount: 0, runEndCount: 0, closeCallbackCount: 0, cachedCloseObserved: false,
            closeOutcome: null, runEndReason: null, runEndUnhandledCount: null, runEndUnhandledErrors: null,
            finalUnhandledCount: null, finalUnhandledErrors: null, frameworkClosed: false,
            timedOut: false, observerError: null, incomplete: null,
            observed: { modules: null, suites: 0, tests: 0, hooks: 0, entityErrors: 0 }
          }
          frameworkBudget.remaining -= encodedBound(record) + 1024
          let ctx = null
          const hooks = []
          const entityErrors = (values, budget = observationBudget) => {
            if (Array.isArray(values)) record.observed.entityErrors += values.length
            return projectErrors(values, 2, budget)
          }
          const captureHook = (hook, event) => {
            record.observed.hooks++
            if (hooks.length >= 8) { record.incomplete = 'observer-hook-overflow'; throw new Error(record.incomplete) }
            try {
              hooks.push(retain({ name: scalar(hook.name, 32, 'hook-name'), entityType: scalar(hook.entity.type, 16, 'hook-type'),
                entityId: scalar(hook.entity.id, 512, 'hook-id'), event }, observationBudget))
            } catch (error) { record.incomplete = 'hook-projection-incomplete'; throw error }
          }
          const observer = {
            onInit(value) {
              record.initCount++
              ctx = value
              value.onClose(() => {
                record.closeCallbackCount++
                queueMicrotask(() => {
                  const closing = value.closingPromise
                  if (!closing || typeof closing.then !== 'function') return
                  record.cachedCloseObserved = true
                  closing.then(() => { record.closeOutcome = 'fulfilled'; record.frameworkClosed = true }, () => { record.closeOutcome = 'rejected' })
                })
              })
            },
            onHookStart(hook) { captureHook(hook, 'start') },
            onHookEnd(hook) { captureHook(hook, 'end') },
            onProcessTimeout() { record.timedOut = true },
            onTestRunEnd(modules, errors, reason) {
              record.runEndCount++
              record.runEndUnhandledCount = Array.isArray(errors) ? errors.length : null
              try {
                record.runEndReason = scalar(reason, 32, 'run-reason')
                record.runEndUnhandledErrors = Array.isArray(errors) ? projectErrors(errors, 4, frameworkBudget) : null
                if (record.runEndUnhandledErrors) retain(record.runEndUnhandledErrors, observationBudget)
                record.observed.modules = Array.isArray(modules) ? modules.length : null
                if (!Array.isArray(modules) || modules.length !== 1) throw new Error('observer-module-count')
                const rows = modules.map((module) => {
                  const row = retain({ id: scalar(module.id, 512, 'module-entity-id'), moduleId: scalar(module.moduleId, 1024, 'module-id').replaceAll('\\', '/'),
                    state: scalar(module.state(), 32, 'module-state'), meta: meta(module.meta()), errors: [], suites: [], tests: [] }, observationBudget)
                  const suites = []
                  for (const suite of module.children.allSuites()) {
                    record.observed.suites++
                    if (suites.length >= 1) throw new Error('observer-suite-overflow')
                    suites.push(retain({ id: scalar(suite.id, 512, 'suite-id'), fullName: scalar(suite.fullName, 512, 'suite-name'),
                      state: scalar(suite.state(), 32, 'suite-state'), errors: entityErrors(suite.errors()), meta: meta(suite.meta()) }, observationBudget))
                  }
                  const tests = []
                  for (const test of module.children.allTests()) {
                    record.observed.tests++
                    if (tests.length >= 50) throw new Error('observer-test-overflow')
                    const diagnostic = test.diagnostic()
                    const testMeta = test.meta()
                    meta(testMeta)
                    const testRow = { moduleId: scalar(test.module.moduleId, 1024, 'test-module').replaceAll('\\', '/'),
                      fullName: scalar(test.fullName, 1024, 'test-name'), state: scalar(test.result().state, 32, 'test-state'),
                      case: testMeta.qaU0Record ?? null, errors: [],
                      retryCount: diagnostic?.retryCount ?? null, repeatCount: diagnostic?.repeatCount ?? null }
                    const rowBudget = { remaining: 4096 - encodedBound(testRow) - 1 }
                    testRow.errors = entityErrors(test.result().errors ?? [], rowBudget)
                    tests.push(retain(testRow, observationBudget, 4096))
                  }
                  return { ...row, errors: entityErrors(module.errors()), suites, tests }
                })
                const config = ctx?.config
                if (!config || !Array.isArray(config.include) || config.include.length !== 4 ||
                    config.include.some((entry) => typeof entry !== 'string' || Buffer.byteLength(entry) > 128)) throw new Error('observer-config-include-bound')
                const rootConfig = { configFile: scalar(ctx.vite.config.configFile, 1024, 'config-file'), include: config.include.slice(),
                  identityLiteral: scalar(config.viteDefine?.__METIS_QA_IDENTITY__, 16, 'identity-literal'),
                  identityRuntime: config.defines?.__METIS_QA_IDENTITY__, testTimeout: config.testTimeout,
                  hookTimeout: config.hookTimeout, retry: config.retry === undefined ? null : config.retry,
                  repeats: config.repeats === undefined ? null : config.repeats,
                  effectiveRetryDefault: config.retry === undefined ? 0 : null, effectiveRepeatDefault: config.repeats === undefined ? 0 : null, pool: scalar(config.pool, 32, 'pool') }
                if (typeof rootConfig.identityRuntime !== 'boolean' ||
                    [rootConfig.testTimeout,rootConfig.hookTimeout].some((value) => !Number.isSafeInteger(value))) throw new Error('observer-config-scalar-bound')
                if (rootConfig.retry !== null || rootConfig.repeats !== null) throw new Error('observer-unexpected-supplied-retry-repeat')
                publish('observation.json', { schema: 'metis-u0-root-observation/v1', bootstrapSha256, sourceHead: scalar(process.env.GITHUB_SHA, 40, 'GITHUB_SHA'),
                  runId: scalar(process.env.GITHUB_RUN_ID, 32, 'GITHUB_RUN_ID'), runAttempt: scalar(process.env.GITHUB_RUN_ATTEMPT, 16, 'GITHUB_RUN_ATTEMPT'), target: scalar(process.env.ROOT_TARGET, 32, 'ROOT_TARGET'),
                  node: process.version, reason: record.runEndReason, unhandledCount: record.runEndUnhandledCount,
                  errors: Array.isArray(errors) ? record.runEndUnhandledErrors : null, config: rootConfig,
                  hooks, modules: rows }, 256 * 1024)
              } catch (error) { record.incomplete = 'run-end-projection-incomplete'; console.error(error); throw error }
            }
          }
          process.on('exit', () => {
            try {
              const errors = ctx?.state?.getUnhandledErrors?.()
              record.finalUnhandledCount = Array.isArray(errors) ? errors.length : null
              try { record.finalUnhandledErrors = Array.isArray(errors) ? projectErrors(errors, 4, frameworkBudget) : null }
              catch (error) { record.incomplete = 'final-error-projection-incomplete'; console.error(error) }
              record.exitCode = process.exitCode ?? 0
              publish('framework.json', record, 16 * 1024)
            } catch (error) { console.error('root-observer-exit-write', error); process.exitCode = 1 }
          })
          try {
            const { startVitest } = await import(pathToFileURL(resolve('node_modules/vitest/dist/node.js')).href)
            await startVitest('test', ['scripts/qa/windows-unsigned-qa-mode.test.ts'], {
              config: 'vitest.config.ts', run: true, reporters: ['default', 'json', 'github-actions', observer]
            })
          } catch (error) {
            try { record.observerError = retain(err(error), frameworkBudget) } catch { record.incomplete = 'observer-error-projection-incomplete' }
            process.exitCode = 1; console.error(error)
          }
          `
          const context = (value, max = 1024) => {
            if (typeof value !== 'string' || Buffer.byteLength(value) > max) throw new Error('root-context-scalar-bound')
            return value
          }
          const bootstrapSha256 = sha(bootstrap)
          const keys = ['U0_DIR', 'QA_U0_RUN_DIR', 'QA_U0_CASE_REPORT', 'QA_U0_VITEST_JSON', 'QA_U0_TARGET', 'QA_OWNER_FRAMEWORK_REPORT_PATH', 'QA_OWNER_TARGET', 'QA_OWNER_SOURCE_SHA']
          const childEnv = { ...process.env, NO_COLOR: '1', FORCE_COLOR: '0', ROOT_BOOTSTRAP_SHA256: bootstrapSha256 }
          const dedicatedPresence = Object.fromEntries(keys.map((key) => [key, Object.hasOwn(childEnv, key)]))
          const unexpectedQaU0Keys = []
          for (const key in childEnv) if (Object.hasOwn(childEnv, key) && key.startsWith('QA_U0_') && !keys.includes(key)) {
            if (unexpectedQaU0Keys.length >= 16) throw new Error('root-unexpected-key-bound')
            unexpectedQaU0Keys.push(context(key, 128))
          }
          unexpectedQaU0Keys.sort()
          for (const key of [...keys, ...unexpectedQaU0Keys]) delete childEnv[key]
          delete childEnv.ESBUILD_BINARY_PATH
          const argv = ['--input-type=module']
          const cwd = context(process.cwd())
          const logPath = resolve(dir, 'default.log')
          const logFd = openSync(logPath, 'wx+', 0o600)
          const abortLog = (primary) => {
            try { closeSync(logFd) } catch (closeError) { throw new AggregateError([primary, closeError], 'root-log-initial-and-close') }
            throw primary
          }
          let logHeld
          try {
            logHeld = fstatSync(logFd)
            const logNamed = lstatSync(logPath)
            if (!logHeld.isFile() || !logNamed.isFile() || logNamed.isSymbolicLink() || logHeld.dev !== logNamed.dev ||
                logHeld.ino !== logNamed.ino || logHeld.size !== 0 || logNamed.size !== 0) throw new Error('root-log-open-identity')
          } catch (primary) { abortLog(primary) }
          let logBytes = 0
          const logChunks = []
          let overflow = false
          let streamError = false
          let logPrimary = null, logCloseError = null
          const logFault = (error) => { streamError = true; if (logPrimary === null) logPrimary = error }
          let logClosed = false
          const streams = { stdout: { end: false, close: false }, stderr: { end: false, close: false } }
          let child
          try { child = spawn(process.execPath, argv, { cwd, env: childEnv, stdio: ['pipe', 'pipe', 'pipe'] }) }
          catch (error) { abortLog(error) }
          for (const label of ['stdout', 'stderr']) {
            const stream = child[label]
            stream.on('data', (chunk) => {
              const prefix = Buffer.from(label + ':')
              if (streamError || overflow) return
              if (prefix.length + chunk.length > 256 * 1024 - logBytes) { overflow = true; return }
              const bytes = Buffer.concat([prefix, chunk], prefix.length + chunk.length)
              try {
                const written = writeSync(logFd, bytes, 0, bytes.length)
                logBytes += written
                logChunks.push(bytes.subarray(0, written))
                if (written !== bytes.length) logFault(new Error('root-log-short-write'))
              } catch (error) { logFault(error) }
            })
            stream.on('end', () => { streams[label].end = true })
            stream.on('close', () => { streams[label].close = true })
            stream.on('error', logFault)
          }
          let stdinSend = null
          child.stdin.on('error', logFault)
          const sent = new Promise((done) => child.stdin.end(bootstrap, 'utf8', (error) => { stdinSend = error ? 'failed' : 'complete'; if (error) logFault(error); done() }))
          child.on('error', logFault)
          const terminal = await new Promise((done) => child.once('close', (code, signal) => done({ code, signal })))
          await sent
          try {
