name: Windows unsigned QA mode protocol source fixture

on:
  push:
    branches: [fix/windows-unsigned-qa-mode]
    paths:
      - .github/workflows/windows-unsigned-qa-mode.yml
      - vitest.windows-unsigned-qa-mode.config.ts
      - scripts/qa/windows-unsigned-qa-mode.test.ts
      - src/main/persistence/qa-run-protocol.ts
      - src/main/qa-identity.ts
      - src/main/persistence/resource-policy-contract.ts
      - scripts/hermetic/sandbox-env.mjs
      - scripts/qa/fixtures/persistence-owner-diagnostic-reporter.mjs
      - package.json
      - package-lock.json
      - tsconfig.node.json
      - tsconfig.web.json
      - tsconfig.tests.json
      - scripts/check-architecture.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-unsigned-qa-mode-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  source-fixture:
    if: github.ref == 'refs/heads/fix/windows-unsigned-qa-mode'
    name: Windows unsigned QA source fixture (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-shipping, os: ubuntu-latest }
          - { target: windows-x64, os: windows-latest }
          - { target: macos-arm64, os: macos-14 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install lockfile dependencies without lifecycle scripts
        id: install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the bounded focused source fixture
        id: fixture
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          U0_DIR: ${{ runner.temp }}/windows-unsigned-qa-u0-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          QA_U0_RUN_DIR: ${{ runner.temp }}/windows-unsigned-qa-u0-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}/fixture
          QA_U0_CASE_REPORT: ${{ runner.temp }}/windows-unsigned-qa-u0-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}/cases.json
          QA_U0_VITEST_JSON: ${{ runner.temp }}/windows-unsigned-qa-u0-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}/vitest.json
          QA_OWNER_FRAMEWORK_REPORT_PATH: ${{ runner.temp }}/windows-unsigned-qa-u0-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}/framework.json
          QA_OWNER_TARGET: ${{ matrix.target }}
          QA_OWNER_SOURCE_SHA: ${{ github.sha }}
          QA_U0_TARGET: ${{ matrix.target }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_ACTIONS: 'true'
        run: |
          set -euo pipefail
          node -e "require('node:fs').mkdirSync(process.env.U0_DIR, { recursive: true, mode: 0o700 })"
          node --input-type=module <<'NODE'
          import { closeSync, lstatSync, openSync, writeSync } from 'node:fs'
          import { spawn } from 'node:child_process'
          import { createRequire } from 'node:module'
          import { resolve } from 'node:path'

          const cap = 4 * 1024 * 1024
          const log = resolve(process.env.U0_DIR, 'default.log')
          const fd = openSync(log, 'wx', 0o600)
          const nativePackage = `@esbuild/${process.platform}-${process.arch}`
          const nativeSubpath = process.platform === 'win32' ? 'esbuild.exe' : 'bin/esbuild'
          const ordinaryBinary = resolve('node_modules', nativePackage, nativeSubpath)
          const selectedBinary = createRequire(resolve('node_modules/esbuild/lib/main.js')).resolve(`${nativePackage}/${nativeSubpath}`)
          if (selectedBinary !== ordinaryBinary) throw new Error('pinned-esbuild-native-resolution-mismatch')
          const binaryStat = lstatSync(selectedBinary)
          if (!binaryStat.isFile() || binaryStat.isSymbolicLink() || binaryStat.size < 1 || binaryStat.size > 32 * 1024 * 1024) throw new Error('pinned-esbuild-binary-missing')
          let bytes = 0
          let overflow = false
          let streamError = false
          const childEnv = { ...process.env, NO_COLOR: '1', FORCE_COLOR: '0' }
          delete childEnv.ESBUILD_BINARY_PATH
          const child = spawn(process.execPath, [
            'node_modules/vitest/vitest.mjs', 'run', '--config', 'vitest.windows-unsigned-qa-mode.config.ts', '--retry=0'
          ], { cwd: process.cwd(), env: childEnv, stdio: ['ignore', 'pipe', 'pipe'] })
          const consume = (stream, label) => {
            stream.on('data', (chunk) => {
              if (!Buffer.isBuffer(chunk)) chunk = Buffer.from(chunk)
              if (bytes + chunk.length > cap) { overflow = true; return }
              const prefix = Buffer.from(`${label}:`)
              if (bytes + prefix.length + chunk.length > cap) { overflow = true; return }
              if (writeSync(fd, prefix) !== prefix.length || writeSync(fd, chunk) !== chunk.length) { streamError = true; return }
              bytes += prefix.length + chunk.length
            })
            stream.on('error', () => { streamError = true })
          }
          consume(child.stdout, 'stdout')
          consume(child.stderr, 'stderr')
          child.on('error', () => { streamError = true })
          const exitCode = await new Promise((resolveExit) => child.once('close', (code) => resolveExit(code)))
          closeSync(fd)
          const output = `exit_code=${Number.isInteger(exitCode) ? exitCode : 'null'}\nlog_overflow=${overflow}\nstream_error=${streamError}\n`
          writeSync(openSync(process.env.GITHUB_OUTPUT, 'a'), output)
          process.exitCode = 0
          NODE
      - name: Check architecture independently
        id: architecture
        if: always() && steps.install.outcome == 'success'
        run: node scripts/check-architecture.mjs
      - name: TypeScript node configuration
        id: tsc_node
        if: always() && steps.install.outcome == 'success'
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.node.json
      - name: TypeScript web configuration
        id: tsc_web
        if: always() && steps.install.outcome == 'success'
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.web.json
      - name: TypeScript tests configuration
        id: tsc_tests
        if: always() && steps.install.outcome == 'success'
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.tests.json
      - name: Replay exact source, framework and test evidence
        id: replay
        if: always()
        env:
          U0_DIR: ${{ runner.temp }}/windows-unsigned-qa-u0-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          TARGET: ${{ matrix.target }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_NODE: 22.22.3
          VITEST_EXIT: ${{ steps.fixture.outputs.exit_code }}
          LOG_OVERFLOW: ${{ steps.fixture.outputs.log_overflow }}
          STREAM_ERROR: ${{ steps.fixture.outputs.stream_error }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          ARCH_OUTCOME: ${{ steps.architecture.outcome }}
          TSC_NODE_OUTCOME: ${{ steps.tsc_node.outcome }}
          TSC_WEB_OUTCOME: ${{ steps.tsc_web.outcome }}
          TSC_TESTS_OUTCOME: ${{ steps.tsc_tests.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { closeSync, fstatSync, lstatSync, openSync, readSync, readdirSync, writeSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          import { execFileSync } from 'node:child_process'
          import { createRequire } from 'node:module'
          import { basename, isAbsolute, relative, resolve } from 'node:path'

          const fail = (message) => { throw new Error(message) }
          const sha = (bytes) => createHash('sha256').update(bytes).digest('hex')
          const canonical = (value) => Array.isArray(value) ? `[${value.map(canonical).join(',')}]` : value && typeof value === 'object' ? `{${Object.keys(value).sort().map((key)=>`${JSON.stringify(key)}:${canonical(value[key])}`).join(',')}}` : JSON.stringify(value) ?? 'null'
          const bounded = (path, max) => {
            const stat = lstatSync(path)
            if (!stat.isFile() || stat.isSymbolicLink() || stat.size < 1 || stat.size > max) fail(`invalid-bounded-file:${path}`)
            const fd = openSync(path, 'r')
            try {
              const held = fstatSync(fd)
              if (!held.isFile() || held.dev !== stat.dev || held.ino !== stat.ino || held.size !== stat.size) fail(`file-identity-mismatch:${path}`)
              const bytes = Buffer.alloc(stat.size)
              if (readSync(fd, bytes, 0, stat.size, 0) !== stat.size) fail(`short-file-read:${path}`)
              const after = fstatSync(fd)
              const namedAfter = lstatSync(path)
              if (after.dev !== held.dev || after.ino !== held.ino || after.size !== held.size || namedAfter.dev !== held.dev || namedAfter.ino !== held.ino || namedAfter.size !== held.size || !namedAfter.isFile() || namedAfter.isSymbolicLink()) fail(`file-changed-during-read:${path}`)
              return bytes
            } finally { closeSync(fd) }
          }
          const fileBindings = [
            '.github/workflows/windows-unsigned-qa-mode.yml', 'vitest.windows-unsigned-qa-mode.config.ts',
            'scripts/qa/windows-unsigned-qa-mode.test.ts', 'src/main/persistence/qa-run-protocol.ts',
            'src/main/qa-identity.ts', 'src/main/persistence/resource-policy-contract.ts',
            'scripts/hermetic/sandbox-env.mjs', 'scripts/qa/fixtures/persistence-owner-diagnostic-reporter.mjs',
            'package.json', 'package-lock.json', 'tsconfig.node.json', 'tsconfig.web.json', 'tsconfig.tests.json',
            'scripts/check-architecture.mjs'
          ]
          const sourceHashes = {}
          for (const path of fileBindings) {
            const checkout = bounded(path, 2 * 1024 * 1024)
            const blob = execFileSync('git', ['show', `HEAD:${path}`], { maxBuffer: 2 * 1024 * 1024 })
            const gitBlob = execFileSync('git', ['rev-parse', `HEAD:${path}`], { encoding: 'utf8' }).trim()
            let transform = 'identical'
            if (!checkout.equals(blob)) {
              const crlf = Buffer.from(blob.toString('utf8').replaceAll('\r\n', '\n').replaceAll('\n', '\r\n'))
              if (!checkout.equals(crlf)) fail(`source-checkout-mismatch:${path}`)
              transform = 'git-lf-to-checkout-crlf'
            }
            sourceHashes[path] = { gitBlob, gitSha256: sha(blob), checkoutSha256: sha(checkout), transform }
          }
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          if (head !== process.env.SOURCE_SHA || head !== process.env.GITHUB_SHA || !/^[a-f0-9]{40}$/.test(head)) fail('checkout-head-binding')
          if (process.version !== `v${process.env.EXPECTED_NODE}`) fail('node-version-binding')
          if (process.env.INSTALL_OUTCOME !== 'success') fail('install-failed')
          const staticOutcomes = {architecture:process.env.ARCH_OUTCOME,node:process.env.TSC_NODE_OUTCOME,web:process.env.TSC_WEB_OUTCOME,tests:process.env.TSC_TESTS_OUTCOME}
          if (Object.values(staticOutcomes).some((value) => !['success','failure','cancelled','skipped'].includes(value))) fail('independent-static-outcome-missing-or-invalid')
          if (process.env.LOG_OVERFLOW !== 'false' || process.env.STREAM_ERROR !== 'false') fail('default-log-capture-incomplete')
          const dir = process.env.U0_DIR
          const rawBytes = bounded(resolve(dir, 'vitest.json'), 8 * 1024 * 1024)
          const caseBytes = bounded(resolve(dir, 'cases.json'), 256 * 1024)
          const frameworkBytes = bounded(resolve(dir, 'framework.json'), 16 * 1024)
          const logBytes = bounded(resolve(dir, 'default.log'), 4 * 1024 * 1024)
          const fixtureBytes = bounded(resolve(dir, 'fixture/source-fixture.json'), 256 * 1024)
          const report = JSON.parse(rawBytes.toString('utf8'))
          const cases = JSON.parse(caseBytes.toString('utf8'))
          const framework = JSON.parse(frameworkBytes.toString('utf8'))
          const fixture = JSON.parse(fixtureBytes.toString('utf8'))
          if (cases.schema !== 'metis-windows-unsigned-qa-vitest-cases/v1' || cases.sourceHead !== head || cases.runId !== process.env.RUN_ID || cases.runAttempt !== process.env.RUN_ATTEMPT || cases.target !== process.env.TARGET || cases.node !== process.version || cases.suiteCount !== 2 || cases.moduleId.replaceAll('\\','/').split('/').at(-1) !== 'windows-unsigned-qa-mode.test.ts' || cases.tests.length !== 50 || cases.unhandledCount !== 0 || !['passed','failed'].includes(cases.runReason)) fail('case-reporter-binding-or-count')
          if (fixture.schema !== 'metis-windows-unsigned-qa-source-fixture/v1' || fixture.subject !== 'synthetic-parser-fixture' || fixture.sourceHead !== head || fixture.runId !== process.env.RUN_ID || fixture.runAttempt !== process.env.RUN_ATTEMPT || fixture.job !== process.env.GITHUB_JOB || fixture.workflowRef !== process.env.GITHUB_WORKFLOW_REF || fixture.node !== process.version || fixture.platform !== process.platform || fixture.arch !== process.arch || fixture.compiledModules !== 32 || fixture.modules.length !== 20 || fixture.cases.length !== 50 || fixture.totalOutputBytes > 8 * 1024 * 1024) fail('source-fixture-binding')
          const dependencies = ['src/main/persistence/qa-run-protocol.ts','src/main/qa-identity.ts','src/main/persistence/resource-policy-contract.ts']
          for (const path of dependencies) {
            const record = fixture.sourceHashes[path]
            const current = sourceHashes[path]
            if (!record || record.gitBlob !== current.gitBlob || record.gitSha256 !== current.gitSha256 || record.checkoutSha256 !== current.checkoutSha256 || record.lineEnding !== current.transform) fail(`fixture-source-binding:${path}`)
          }
          const suffix = Buffer.from('\nexport { validPayload as unsignedQaFixtureValidPayload }\n')
          const protocolCheckout = bounded('src/main/persistence/qa-run-protocol.ts', 64 * 1024)
          const expectedAugmentedProtocol = Buffer.concat([protocolCheckout, suffix])
          let recordedOutputBytes = 0
          const moduleIds = new Set()
          const artifactIds = new Set()
          const artifactFiles = new Set()
          const graphById = new Map()
          const usedArtifactIds = new Set()
          let readbackArtifacts = 0
          if (!Array.isArray(fixture.artifacts) || fixture.artifacts.length !== 32) fail('fixture-artifact-count')
          for (const artifact of fixture.artifacts) {
            const artifactKeys = ['id','file','metaFile','privateInput','emitted','emittedBytes','readback','metafileSha256','metafileBytes','protocolInput'].sort()
            const readbackKeys = ['bytes','sha256','namedIdentityMatched','originalFdClosed'].sort()
            if (!artifact || JSON.stringify(Object.keys(artifact).sort()) !== JSON.stringify(artifactKeys) || !artifact.readback || JSON.stringify(Object.keys(artifact.readback).sort()) !== JSON.stringify(readbackKeys)) fail('artifact-fields')
            if (typeof artifact.id !== 'string' || artifact.id.length > 160 || artifactIds.has(artifact.id)) fail('duplicate-or-unsafe-artifact-id')
            artifactIds.add(artifact.id)
            const file = `u0-${sha(Buffer.from(artifact.id))}.cjs`
            const metaFile = `${file}.meta.json`
            if (artifact.file !== file || artifact.metaFile !== metaFile || artifactFiles.has(file) || artifactFiles.has(metaFile)) fail('artifact-filename-binding')
            artifactFiles.add(file); artifactFiles.add(metaFile)
            const output = bounded(resolve(dir,'fixture/compiled',file), 256 * 1024)
            const metaBytes = bounded(resolve(dir,'fixture/compiled',metaFile), 64 * 1024)
            const meta = JSON.parse(metaBytes.toString('utf8'))
            const expectedProtocol = artifact.privateInput ? expectedAugmentedProtocol : protocolCheckout
            if (typeof artifact.privateInput !== 'boolean' || artifact.protocolInput !== sha(expectedProtocol) || artifact.emitted !== sha(output) || artifact.emittedBytes !== output.length || artifact.metafileSha256 !== sha(metaBytes) || artifact.metafileBytes !== metaBytes.length) fail(`artifact-byte-binding:${artifact.id}`)
            if (!Number.isSafeInteger(artifact.readback.bytes) || artifact.readback.bytes !== artifact.emittedBytes || artifact.readback.sha256 !== artifact.emitted || artifact.readback.namedIdentityMatched !== true || artifact.readback.originalFdClosed !== true) fail(`artifact-readback-binding:${artifact.id}`)
            readbackArtifacts += 1
            if (!meta.inputs || !meta.outputs || Object.keys(meta.inputs).length !== 3 || Object.keys(meta.outputs).length !== 1) fail(`artifact-graph-count:${artifact.id}`)
            const normalizeInput = (path) => (isAbsolute(path) ? relative(process.cwd(),path) : path).replaceAll('\\','/').replace(/^\.\//,'')
            const normalizedInputs = Object.keys(meta.inputs).map(normalizeInput).sort()
            if (JSON.stringify(normalizedInputs) !== JSON.stringify([...dependencies].sort())) fail(`artifact-input-graph:${artifact.id}`)
            for (const [path, info] of Object.entries(meta.inputs)) {
              const normalized = normalizeInput(path)
              const expectedBytes = normalized === dependencies[0] ? expectedProtocol : bounded(normalized, 64 * 1024)
              if (info.bytes !== expectedBytes.length) fail(`artifact-input-bytes:${artifact.id}:${normalized}`)
            }
            const [[outputName, outputInfo]] = Object.entries(meta.outputs)
            const contributingInputs = Object.keys(outputInfo.inputs ?? {})
            if (basename(outputName.replaceAll('\\','/')) !== file || outputInfo.bytes !== output.length || contributingInputs.length < 1 || contributingInputs.some((path)=>!Object.hasOwn(meta.inputs,path))) fail(`artifact-output-graph:${artifact.id}`)
            graphById.set(artifact.id, { emitted:sha(output), emittedBytes:output.length, outputGraph:sha(Buffer.from(canonical(meta.outputs))), protocolInput:sha(expectedProtocol), privateInput:artifact.privateInput })
          }
          const actualCompiled = readdirSync(resolve(dir,'fixture/compiled')).sort()
          if (JSON.stringify(actualCompiled) !== JSON.stringify([...artifactFiles].sort())) fail('compiled-artifact-roster')
          const matrix = [
            ['win32-x64','windows-authenticode'],['win32-x64','windows-unsigned-candidate'],['win32-x64','mac-adhoc'],['win32-x64','mac-developer-id'],
            ['darwin-x64','windows-authenticode'],['darwin-x64','mac-adhoc'],['darwin-x64','mac-developer-id'],['darwin-x64','windows-unsigned-candidate'],
            ['darwin-arm64','windows-authenticode'],['darwin-arm64','mac-adhoc'],['darwin-arm64','mac-developer-id'],['darwin-arm64','windows-unsigned-candidate']
          ]
          const digestRecord = (label) => sha(Buffer.from(`windows-unsigned-qa-source-fixture:${label}`))
          const expectedModules = new Map()
          const addExpected = (id,target,mode,stamp,publicArtifact,privateArtifact,commit=head) => {
            const platform = target === 'win32-x64' ? 'win32' : 'darwin'
            const arch = target === 'darwin-arm64' ? 'arm64' : 'x64'
            const context = stamp ? {repository:process.env.GITHUB_REPOSITORY,workflowRef:process.env.GITHUB_WORKFLOW_REF,commit,runId:process.env.RUN_ID,runAttempt:Number(process.env.RUN_ATTEMPT),job:process.env.GITHUB_JOB,target} : {}
            const runtime = stamp ? {platform,arch,node:process.versions.node,electron:'0.0.0-source-fixture',v8:process.versions.v8,modules:process.versions.modules} : {}
            const identity = stamp ? {runtimeName:'asktoto-qa',bundleId:'com.mantu.asktoto.qa',executableSha256:digestRecord('fixture-executable'),signingMode:mode} : {}
            expectedModules.set(id,{id,target,mode,stampLiteralIncluded:stamp,context,runtime,identity,publicArtifact,privateArtifact})
          }
          for (const [target,mode] of matrix) {
            const id = `matrix:${target}:${mode}`
            addExpected(id,target,mode,true,`${id}-public`,`${id}-payload`)
          }
          for (const [id,target,mode,stamp] of [
            ['S01','win32-x64','windows-authenticode',true],['S02','win32-x64','windows-unsigned-candidate',true],
            ['S03','win32-x64','windows-authenticode',false],['S04','win32-x64','windows-authenticode',false]
          ]) addExpected(id,target,mode,stamp,`${id}:${target}:${mode}-public`,null)
          addExpected('J02-windows-unknown','win32-x64','future-unknown-mode',true,'J02-windows-unknown:win32-x64:future-unknown-mode-public',null)
          addExpected('J02-darwin-unknown','darwin-x64','future-unknown-mode',true,'J02-darwin-unknown:darwin-x64:future-unknown-mode-public',null)
          for (const mode of ['windows-authenticode','windows-unsigned-candidate']) addExpected(`B04-alt-${mode}`,'win32-x64',mode,true,`B04-alt-${mode}`,null,'b'.repeat(40))
          if (expectedModules.size !== 20 || !process.env.GITHUB_REPOSITORY) fail('expected-fixture-roster-incomplete')
          for (const module of fixture.modules) {
            const expected = expectedModules.get(module.id)
            if (!expected || moduleIds.has(module.id)) fail('unknown-or-duplicate-fixture-module')
            moduleIds.add(module.id)
            for (const field of ['id','target','mode','stampLiteralIncluded','context','runtime','identity']) if (canonical(module[field]) !== canonical(expected[field])) fail(`fixture-tuple-mismatch:${module.id}:${field}`)
            const expectedHashKeys = [...dependencies,'artifactId','emitted','emittedBytes','protocolInput','augmentationSuffix','outputGraph',...(expected.privateArtifact ? ['payloadArtifactId','payloadProtocolInput','payloadAugmentationSuffix','payloadOutput','payloadEmittedBytes','payloadOutputGraph'] : [])].sort()
            if (JSON.stringify(Object.keys(module.hashes).sort()) !== JSON.stringify(expectedHashKeys)) fail(`fixture-hash-fields:${module.id}`)
            const graphSources = Object.keys(module.hashes).filter((path)=>dependencies.includes(path)).sort()
            if (JSON.stringify(graphSources) !== JSON.stringify([...dependencies].sort()) || graphSources.some((path)=>module.hashes[path] !== sourceHashes[path].checkoutSha256)) fail(`fixture-input-graph-binding:${module.id}`)
            if (!/^[1-9][0-9]*$/.test(module.hashes.emittedBytes ?? '')) fail(`fixture-public-decimal-bytes:${module.id}`)
            const publicId = module.hashes.artifactId
            const publicGraph = graphById.get(publicId)
            if (publicId !== expected.publicArtifact || !publicGraph || publicGraph.privateInput || publicGraph.emitted !== module.hashes.emitted || publicGraph.emittedBytes !== Number(module.hashes.emittedBytes) || publicGraph.outputGraph !== module.hashes.outputGraph || publicGraph.protocolInput !== sha(protocolCheckout) || module.hashes.protocolInput !== publicGraph.protocolInput || module.hashes.augmentationSuffix !== '') fail(`public-artifact-binding:${module.id}`)
            recordedOutputBytes += publicGraph.emittedBytes
            if (usedArtifactIds.has(publicId)) fail('reused-public-artifact')
            usedArtifactIds.add(publicId)
            if (expected.privateArtifact) {
              if (module.hashes.payloadArtifactId !== expected.privateArtifact || module.hashes.payloadProtocolInput !== sha(expectedAugmentedProtocol) || module.hashes.payloadAugmentationSuffix !== sha(suffix) || !/^[1-9][0-9]*$/.test(module.hashes.payloadEmittedBytes ?? '')) fail(`fixture-augmented-input-binding:${module.id}`)
              const privateGraph = graphById.get(module.hashes.payloadArtifactId)
              if (!privateGraph || !privateGraph.privateInput || privateGraph.emitted !== module.hashes.payloadOutput || privateGraph.emittedBytes !== Number(module.hashes.payloadEmittedBytes) || privateGraph.outputGraph !== module.hashes.payloadOutputGraph || privateGraph.protocolInput !== sha(expectedAugmentedProtocol)) fail(`private-artifact-binding:${module.id}`)
              recordedOutputBytes += privateGraph.emittedBytes
              if (usedArtifactIds.has(module.hashes.payloadArtifactId)) fail('reused-private-artifact')
              usedArtifactIds.add(module.hashes.payloadArtifactId)
            }
          }
          if (recordedOutputBytes !== fixture.totalOutputBytes || moduleIds.size !== 20 || artifactIds.size !== 32 || usedArtifactIds.size !== 32 || [...artifactIds].some((id)=>!usedArtifactIds.has(id))) fail('fixture-output-total-mismatch')
          const sourceReadSetSha256 = sha(Buffer.from(canonical(fixture.sourceHashes)))
          const fixtureGraphSha256 = sha(Buffer.from(canonical(fixture.modules.map((module)=>({id:module.id,hashes:module.hashes})))))
          if (report.testResults?.length !== 1 || report.testResults[0].assertionResults?.length !== 50 || report.numTotalTests !== 50) fail('raw-vitest-roster-count')
          const rawTests = report.testResults[0].assertionResults
          if (report.numTotalTests !== 50 || report.numPendingTests !== 0 || report.numTodoTests !== 0 || report.numFailedTests !== cases.tests.filter((test)=>test.state === 'failed').length || report.numPassedTests !== cases.tests.filter((test)=>test.state === 'passed').length) fail('raw-vitest-count-mismatch')
          const expectedTitles = new Map(matrix.map(([target,mode],i)=>[`U${String(i+1).padStart(2,'0')}`,`U${String(i+1).padStart(2,'0')} ${target} ${mode}`]))
          const expectedIds = [
            ...Array.from({length:12},(_,i)=>`U${String(i+1).padStart(2,'0')}`),
            ...Array.from({length:13},(_,i)=>[`B${String(i+1).padStart(2,'0')}-authenticode-source-fixture`,`B${String(i+1).padStart(2,'0')}-unsigned-source-fixture`]).flat(),
            'S01','S02','S03','S04', ...['H01','H02','H03'].flatMap((id)=>[`${id}-authenticode-source-fixture`,`${id}-unsigned-source-fixture`]),'J01','J02'
          ]
