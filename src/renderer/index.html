<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Keep in sync with src/shared/providers.ts. Custom providers need a custom build (arbitrary HTTPS is
      intentionally not allowed).

      This list covers what the RENDERER may reach. Provider chat/completions traffic is not renderer
      traffic: every ask is streamed from the main process (src/main/llm/*, Node's fetch), which no page
      CSP applies to — which is why providers already shipping here (Grok's api.x.ai, Gemini's
      generativelanguage.googleapis.com) have no entry and still work.

      Cloudflare is therefore deliberately absent too, and could not be pinned even if it were needed: its
      endpoint is the OPERATOR's own Worker URL, different per install (settings.cloudflareBaseUrl), so the
      only connect-src that would cover it is a blanket https: — exactly the arbitrary-HTTPS grant this
      policy exists to refuse. Widening it for one main-process provider would weaken the renderer for
      every other one. If a renderer-side Cloudflare call is ever genuinely needed, pin that single
      operator URL in a custom build rather than opening the wildcard.

      media-src pins one CloudFront host for Act 1's welcome atmosphere video (not a blanket https:).
      If that clip is missing, the renderer keeps the hero-matching hold. Do not widen this to * or https:.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; frame-src 'none'; img-src 'self' data: blob:; media-src 'self' blob: data: https://d8j0ntlcm91z4.cloudfront.net; connect-src 'self' blob: asr-model: https://api.anthropic.com https://api.openai.com/v1 https://api.moonshot.ai/v1 https://integrate.api.nvidia.com/v1 https://api.deepseek.com/v1 https://dashscope-intl.aliyuncs.com/compatible-mode/v1 https://api.minimax.io/v1 https://openrouter.ai/api/v1 https://api.groq.com/openai/v1 https://api.together.xyz/v1 https://api.fireworks.ai/inference/v1 https://api.mistral.ai/v1 https://dust.tt https://*.dust.tt https://huggingface.co https://cdn.jsdelivr.net https://*.hf.co; script-src 'self' 'wasm-unsafe-eval' blob: asr-model:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:;"
    />
    <title>Métis</title>
    <!--
      FITO-185-I: no-JS exclusive bed. createWindow may force-show before React/IPC hydrate;
      never leave Tony on pure black. styles.css sets html/body transparent for the overlay —
      this inline bed wins until App removes #boot-bed after onboardingDone.
    -->
    <link rel="preload" as="image" href="onboarding-hero-poster.jpg" fetchpriority="high" />
    <style>
      /* FITO-185-Z: first compositor frame is Act1 (poster + wordmark + Next), never a black void.
         Window shows immediately — shell is in HTML; never hide-for-seconds. */
      #boot-bed {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-color: #05010A;
        background-image: url("onboarding-hero-poster.jpg");
        background-size: cover;
        background-position: center;
        overflow: hidden;
      }
      /* Real <img> so a failed CSS background cannot leave a solid #05010A slab. */
      #boot-bed-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        opacity: 1;
        z-index: 1;
      }
      #act1-boot-chrome {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        transform: translateY(-16vh);
      }
      #act1-boot-wordmark {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        font-weight: 650;
        font-size: 30px;
        letter-spacing: 0.01em;
        color: #f4f4f5;
        line-height: 1.2em;
      }
      #act1-boot-next {
        pointer-events: auto;
        margin-top: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        min-width: 220px;
        padding: 0 28px;
        border: none;
        border-radius: 999px;
        background: #f4f4f5;
        color: #09090b;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      #root {
        position: relative;
        z-index: 1;
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="boot-bed" aria-hidden="true">
      <img id="boot-bed-img" src="onboarding-hero-poster.jpg" alt="" decoding="sync" fetchpriority="high" />
    </div>
    <div id="act1-boot-chrome">
      <h1 id="act1-boot-wordmark">Métis</h1>
      <button type="button" id="act1-boot-next" class="onboard-cta">Next</button>
    </div>
    <div id="root"></div>
    <script src="./act1-boot.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
