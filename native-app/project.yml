# xcodegen spec for the Métis native app — roadmap step 1 (native-app/README.md).
#
# Generate + open the Xcode project:
#     brew install xcodegen
#     cd native-app && xcodegen generate
#     open Metis.xcodeproj         # run on a Mac, or an iOS/iPad simulator/device
#
# Release artifact (pure Mac native, NOT the Electron DMG):
#     node scripts/build-native-mac.mjs
#     → release/Metis-Native-<version>.zip  (contains Metis.app)
#
# One multiplatform app target depends on the local MetisKit package; only App/ (audio + windowing) is
# platform-conditional. The app's LOGIC (MeetingController, Intelligence, App Intents) lives in MetisKit
# and is covered by `swift test` — this target adds the SwiftUI shell + audio. If the installed xcodegen
# predates `supportedDestinations`, split into per-platform targets or add the target in Xcode directly.
name: Metis
options:
  bundleIdPrefix: com.mantu.metis
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  MetisKit:
    path: MetisKit
targets:
  Metis:
    type: application
    # Release packaging (scripts/build-native-mac.mjs) builds the macOS destination only and zips
    # Metis.app as Metis-Native-<version>.zip — that is the pure Apple-native download, distinct from
    # the Electron Metis-<version>.dmg. iOS remains a supported destination for local Xcode runs.
    supportedDestinations: [macOS, iOS]
    sources:
      - App
    dependencies:
      - package: MetisKit
    settings:
      base:
        PRODUCT_NAME: Metis
        PRODUCT_BUNDLE_IDENTIFIER: com.mantu.metis.native
        # Synced from package.json by scripts/build-native-mac.mjs before every release build.
        MARKETING_VERSION: "1.7.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Métis"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Métis transcribes meeting audio on-device to give you live suggestions and summaries."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Métis transcribes meeting audio on-device so it can caption who said what."
