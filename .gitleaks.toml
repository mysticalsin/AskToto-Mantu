title = "Métis gitleaks config"

# Repo-wide secret scan (CI audit finding, 2026-08-21). The Security job in .github/workflows/build.yml
# already runs a narrow "Secret scan" step — a hand-anchored grep over the provider key-prefix shapes
# this app itself recognizes (src/shared/providers.ts). That step is deliberately kept (it is pinned by
# scripts/ci-secret-scan.contract.test.ts and is the ONLY gate that specifically knows this product's own
# sk-kimi- format). Gitleaks runs ALONGSIDE it as the repo-wide net: it scans full git history (not just
# the current tree) against a large, community-maintained rule set covering hundreds of provider key
# shapes the narrow regex was never meant to enumerate — Build Law rule 5 (mature maintained tooling
# over hand-rolling detection rules) and rule 8 (this is how mature products actually do secret scanning:
# a broad community ruleset PLUS a narrow product-specific check, not one replacing the other).
[extend]
useDefault = true

# Verified 2026-08-21 by running gitleaks (docker run zricethezav/gitleaks:latest detect --source=.)
# against this exact repo history. Before this allowlist, it reported 5 leaks — all deliberately-fake
# credentials that exist ONLY to exercise this app's OWN redaction/detection code paths, never real
# secrets. Three remain in the tree; the other two were sk-kimi- fixtures in test files since deleted:
#   - src/shared/redact.test.ts:34,59         ABCDEF123456                    (redactSecrets() unit fixtures)
#   - license-server/ops.test.mjs:286         ATK-HY2JVMZ3P3JF8CGAQWPR        (license-server test fixture)
# scripts/qa/e2e-workflows.mjs's own 'qa-proxy-key' (the physical QA harness's deliberately-invalid
# Cloudflare key — see MISTAKES/QA harness notes) did not trip gitleaks's default ruleset directly, but is
# allowlisted below on the same basis: it must never be treated as a real credential either.
#
# The allowlist below is VALUE-scoped, never path-scoped (M2-0259). Test files, the QA harness, docs,
# fixtures and generated assets are all scanned like product source: a real secret pasted into any of
# them fails this gate. Each entry matches ONE exact fake value (gitleaks matches `regexes` against the
# secret itself), so a real secret pasted beside a fixture still fails. The Security job plants one
# synthetic canary per file class and requires this config to flag each of them (build.yml).
[allowlist]
description = "Known deliberately-fake credentials, matched by exact value."
regexes = [
  # The fixture the redaction unit tests use (src/shared/redact.test.ts), and when a doc quotes it.
  '''^['"]?ABCDEF123456['"]?$''',
  # The license-server test fixture key (license-server/ops.test.mjs), and when a doc quotes it.
  '''^ATK-HY2JVMZ3P3JF8CGAQWPR$''',
  # Operator seat-token fixtures: the fixed "METIS-OP-1.<word>" placeholders and the one long sample token
  # the HMAC/transport tests share. Anchored to the whole value; a real seat token has a different shape.
  '''^METIS-OP-1\.(fixture|test|old|new|replacement|licensed-seat)$''',
  '''^METIS-OP-1\.abcdef0123456789\.100\.200\.abcdefghijklmnopqrstuv$''',
  # Test-only placeholders that name themselves as synthetic (whole value, no random characters), so a
  # real high-entropy secret never matches; the canary token contains none of these words.
  '''^[a-z0-9_.-]*(fixture|synthetic|dummy|not-a-real|qa-only|for-tests|test-[a-z]+-key|test-admin|-example-)[a-z0-9_.-]*$''',
  '''^(ingest-secret|shared-secret|old-shared-secret|secret-token|fresh-token|test-token|tok-rotated|plane-tok-1|tok_(eu|us)_123|clickup-(at|rt)-1|plane-(at|rt)-[A-Za-z0-9]+|plane-secret-[A-Za-z0-9]+|fresh-ported-secret)$'''
]
