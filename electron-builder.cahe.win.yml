# PRODUCT: Métis for Windows — Cahê pilot edition. Separate appId, NO shared update feed. See docs/PLATFORM-MAP.md.
# Cahê is a Windows-only pilot edition. It inherits the reviewed Windows payload, but has its own
# application identity and installer name so it cannot reuse standard Métis state or releases.
extends: ./electron-builder.win.yml
appId: com.mantu.metis.windows-cahe
productName: Metis Windows Cahe
win:
  executableName: Metis-Windows-Cahe
  target:
    - nsis
  artifactName: Metis-Windows-Cahe-Setup-${version}.${ext}
nsis:
  shortcutName: Métis
# Intentional, disclosed pilot convenience — NOT part of the standard electron-builder.win.yml, so a
# normal Métis build never bundles this. The operator provides gitignored build/cahe-kimi.local.json
# ({"kimiApiKey":"sk-kimi-…"}); scripts/embed-cahe-kimi-key.mjs AES-256-GCM-encrypts it into
# build/cahe-embed/kimi.json (same encryptProxyKey material as Cloudflare). electron-builder copies that
# directory to resources/cahe/ — empty on a keyless build (build/cahe-embed/.gitkeep only), so packaging
# never fails when there is nothing to embed. The key IS still extractable with effort (obfuscation, not
# secrecy); scripts/check-cahe-package.mjs only allows the embed with METIS_CAHE_EMBED_KEY=1 and refuses
# a plaintext kimiApiKey field.
extraResources:
  - from: build/cahe-embed
    to: cahe
