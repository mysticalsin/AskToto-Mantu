# Cahê is a Windows-only pilot edition. It inherits the reviewed Windows payload, but has its own
# application identity and installer name so it cannot reuse standard Métis state or releases.
extends: ./electron-builder.win.yml
appId: com.mantu.metis.windows-cahe
productName: Metis Windows Cahe
win:
  executableName: Metis-Windows-Cahe
  target:
    - nsis
  artifactName: Metis-Windows-Cahe-Setup-${version}.${ext}
nsis:
  shortcutName: Métis
# Intentional, disclosed pilot convenience — NOT part of the standard electron-builder.win.yml, so a
# normal Métis build never bundles this. build/cahe-kimi.local.json is a local, gitignored file the
# operator provides (see .gitignore + src/main/cahe-embedded-key.ts, which seeds this into the app's
# normal encrypted keystore once per profile and never fights a later user change/removal). The key IS
# extractable from the installer by anyone who has it; scripts/check-cahe-package.mjs's packaging-time
# scan only allows it through with METIS_CAHE_EMBED_KEY=1 set, printing a loud warning when it does.
extraResources:
  - from: build/cahe-kimi.local.json
    to: cahe/kimi.json
